# Local verification stack for services/import-api's live test suites.
# Not used by production or by CI (CI provisions its own service containers).
#
# Usage: see scripts/dev-up.sh, scripts/dev-test.sh, scripts/dev-down.sh.
name: memory-os-dev

networks:
  default:
    name: memory-os-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_os_security
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memory_os_security"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
