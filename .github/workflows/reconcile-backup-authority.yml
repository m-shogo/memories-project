name: Reconcile Backup Authority

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-backup-authority.yml"
      - "contracts/operations/backup-local-foundation-evidence.v1.json"
      - "contracts/operations/backup-restore-contract.v1.json"
      - "contracts/operations/local-apple-replay-restore-contract.v1.json"
      - "contracts/operations/local-coherent-recovery-set-contract.v1.json"
      - "contracts/operations/local-logical-restore-contract.v1.json"
      - "contracts/operations/local-object-version-restore-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/local-apple-replay-restore-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/local-object-version-restore-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/local-coherent-recovery-set-results.sample.v1.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-local-foundations.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-backup-restore-blockers-negative.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-logical-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-backup-authority.py"
      - "scripts/reconcile-memory-os-backup-coherent-authority.py"
      - "scripts/reconcile-memory-os-backup-semantic-overlay.py"
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-backup-authority-so
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate local foundation source inputs
        run: |
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/validate-memory-os-local-apple-replay-restore.py \
            scripts/validate-memory-os-local-logical-restore.py \
            scripts/validate-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-local-coherent-recovery-set.py \
            scripts/validate-memory-os-backup-local-foundations.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-backup-restore-blockers-negative.py \
            scripts/reconcile-memory-os-backup-authority.py \
            scripts/reconcile-memory-os-backup-coherent-authority.py \
            scripts/reconcile-memory-os-backup-semantic-overlay.py
          python scripts/validate-memory-os-local-apple-replay-restore.py
          python scripts/validate-memory-os-local-logical-restore.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-local-coherent-recovery-set.py
          python scripts/validate-memory-os-backup-local-foundations.py

      - name: Reconcile backup policy authority
        run: |
          python scripts/reconcile-memory-os-backup-authority.py
          python scripts/reconcile-memory-os-backup-authority.py --check

      - name: Reconcile backup semantic overlay
        run: |
          python scripts/reconcile-memory-os-backup-semantic-overlay.py
          python scripts/reconcile-memory-os-backup-semantic-overlay.py --check

      - name: Reconcile coherent restore authority
        run: |
          python scripts/reconcile-memory-os-backup-coherent-authority.py
          python scripts/reconcile-memory-os-backup-coherent-authority.py --check

      - name: Validate backup restore policy
        run: python scripts/validate-memory-os-backup-restore.py

      - name: Validate backup blocker negatives
        run: python scripts/validate-memory-os-backup-restore-blockers-negative.py

      - name: Revalidate local Apple replay restore
        run: python scripts/validate-memory-os-local-apple-replay-restore.py

      - name: Revalidate coherent local restore
        run: python scripts/validate-memory-os-local-coherent-recovery-set.py

      - name: Revalidate local foundation inventory
        run: python scripts/validate-memory-os-backup-local-foundations.py

      - name: Validate operability authority
        run: python scripts/validate-memory-os-operability.py

      - name: Commit normalized backup authority
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after validation; refusing stale local backup authority."
            exit 75
          fi
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Backup authority is already normalized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(backup): normalize local restore foundations"
          for attempt in 1 2 3 4; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after authority capture; refusing stale local backup authority."
              exit 75
            fi
            if git push origin HEAD:so; then exit 0; fi
            sleep 2
          done
          exit 1
