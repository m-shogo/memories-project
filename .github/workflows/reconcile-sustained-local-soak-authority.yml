name: Reconcile Sustained Local Soak Authority

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-sustained-local-soak-authority.yml"
      - "contracts/operations/sustained-local-soak-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-registry.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/sustained-soak/**"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-results.run-*.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json"
      - "scripts/validate-memory-os-sustained-local-soak.py"
      - "scripts/register-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review-negative.py"
      - "scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py"
      - "scripts/validate-memory-os-sustained-local-soak-result.py"
      - "scripts/update-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/review-memory-os-sustained-local-soak-trends.py"
      - "scripts/validate-memory-os-sustained-local-soak-trend-review.py"
      - "scripts/validate-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/reconcile-memory-os-sustained-local-soak-status.py"
      - "scripts/validate-memory-os-sustained-local-soak-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-long-soak-load-projection.py"
      - "scripts/validate-memory-os-local-long-soak-load-projection-negative.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-sustained-local-soak-authority.yml"
      - "contracts/operations/sustained-local-soak-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-registry.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/sustained-soak/**"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-results.run-*.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json"
      - "scripts/validate-memory-os-sustained-local-soak.py"
      - "scripts/register-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review-negative.py"
      - "scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py"
      - "scripts/validate-memory-os-sustained-local-soak-result.py"
      - "scripts/update-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/review-memory-os-sustained-local-soak-trends.py"
      - "scripts/validate-memory-os-sustained-local-soak-trend-review.py"
      - "scripts/validate-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/reconcile-memory-os-sustained-local-soak-status.py"
      - "scripts/validate-memory-os-sustained-local-soak-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-long-soak-load-projection.py"
      - "scripts/validate-memory-os-local-long-soak-load-projection-negative.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-sustained-local-soak-authority-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'docs(soak): register repeated local soak authority') &&
       !contains(github.event.head_commit.message, 'test(soak): record repeated local soak authority diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild and validate repeated-run authority
        id: authority
        run: |
          set +e
          log=/tmp/memory-os-sustained-local-soak-authority.log
          : > "$log"
          code=0
          stage=compile
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/register-memory-os-sustained-soak-independent-review.py \
            scripts/validate-memory-os-sustained-soak-independent-review.py \
            scripts/validate-memory-os-sustained-soak-independent-review-negative.py \
            scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/review-memory-os-sustained-local-soak-trends.py \
            scripts/validate-memory-os-sustained-local-soak-trend-review.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py \
            scripts/validate-memory-os-sustained-local-soak-reconcile-negative.py \
            scripts/reconcile-memory-os-local-long-soak-load-projection.py \
            scripts/validate-memory-os-local-long-soak-load-projection-negative.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?

          if [[ "$code" == "0" ]]; then
            stage=contract-validation
            echo "STAGE: contract-validation" >> "$log"
            python scripts/validate-memory-os-sustained-local-soak.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-independent-review.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-independent-review-negative.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=pending-aggregate
            echo "STAGE: pending-aggregate" >> "$log"
            rm -f docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json
            python scripts/update-memory-os-sustained-local-soak-aggregate.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak-aggregate.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=descriptive-cross-run-review
            echo "STAGE: descriptive-cross-run-review" >> "$log"
            python scripts/review-memory-os-sustained-local-soak-trends.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak-trend-review.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=reviewed-aggregate
            echo "STAGE: reviewed-aggregate" >> "$log"
            python scripts/update-memory-os-sustained-local-soak-aggregate.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak-aggregate.py --require-local-evidence >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=post-aggregate-negative
            echo "STAGE: post-aggregate-negative" >> "$log"
            python scripts/validate-memory-os-sustained-local-soak-reconcile-negative.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-local-long-soak-load-projection-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=status-reconcile
            echo "STAGE: status-reconcile" >> "$log"
            python scripts/reconcile-memory-os-sustained-local-soak-status.py >> "$log" 2>&1 || code=$?
            python scripts/reconcile-memory-os-local-long-soak-load-projection.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-local-long-soak-load-projection-negative.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-independent-review.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-independent-review-negative.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak-aggregate.py --require-local-evidence >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-load-evidence-index.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-load.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request' && steps.authority.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json \
            docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit repeated local soak authority
        if: github.event_name != 'pull_request' && steps.authority.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced during repeated-soak reconciliation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/sustained-local-soak-authority-diagnostic.last.json 2>/dev/null || true
          git add \
            docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json \
            docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/sustained-local-soak-authority-diagnostic.last.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Repeated local soak authority already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(soak): register repeated local soak authority"
          for attempt in 1 2 3 4; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after authority derivation; refusing stale repeated-soak authority."
              exit 75
            fi
            if git push origin HEAD:so; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Record privacy-safe diagnostic
        if: github.event_name != 'pull_request' && steps.authority.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.authority.outputs.exit_code }}
          FAILURE_STAGE: ${{ steps.authority.outputs.failure_stage }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after failed validation; refusing stale repeated-soak diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('/tmp/memory-os-sustained-local-soak-authority.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-url>', text)
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'reconcile-sustained-local-soak-authority',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'failureStage': os.environ.get('FAILURE_STAGE', 'unknown'),
              'result': 'FAIL',
              'exitCode': int(os.environ['EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'leakProof': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/sustained-local-soak-authority-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/sustained-local-soak-authority-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record repeated local soak authority diagnostic"
            for attempt in 1 2 3 4; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Branch advanced after diagnostic derivation; refusing stale repeated-soak diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Enforce authority success
        run: test "${{ steps.authority.outputs.exit_code }}" = "0"
