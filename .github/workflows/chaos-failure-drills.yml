name: Chaos and Failure Drills

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/chaos-failure-drills.yml"
      - "contracts/operations/chaos-failure-drill-contract.v1.json"
      - "services/import-api/internal/httpserver/server.go"
      - "services/import-api/internal/httpserver/interruption_drill_test.go"
      - "services/import-api/internal/parsersup/**"
      - "scripts/validate-memory-os-chaos-failure-drills.py"
      - "scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills.py"
      - "scripts/reconcile-memory-os-chaos-authority.py"
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaos-failure-drills-so
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/so)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Compile validators and tests
        run: |
          python -m py_compile \
            scripts/validate-memory-os-chaos-failure-drills.py \
            scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py \
            scripts/reconcile-memory-os-chaos-failure-drills.py \
            scripts/reconcile-memory-os-chaos-authority.py
          python scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/interruption_drill_test.go \
            services/import-api/internal/parsersup/restart_drill_linux_test.go)"
          python scripts/validate-memory-os-chaos-failure-drills.py

      - name: Execute exact-source drills
        id: drills
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import stat
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          root = Path.cwd()
          workdir = root / "services/import-api"

          def atomic_write_text(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o644
              fd, temp_name = tempfile.mkstemp(
                  dir=path.parent,
                  prefix=f".{path.name}.",
                  suffix=".tmp",
              )
              temp_path = Path(temp_name)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(temp_path, mode)
                  os.replace(temp_path, path)
              finally:
                  if temp_path.exists():
                      temp_path.unlink()

          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=root, text=True
          ).strip()
          definitions = [
              (
                  "api-graceful-interruption-drain",
                  ["go", "test", "./internal/httpserver", "-run", "^TestHTTPServerGracefulInterruptionDrainsInFlightRequest$", "-count=1"],
              ),
              (
                  "parser-restart-after-protocol-failure",
                  ["go", "test", "./internal/parsersup", "-run", "^TestSupervisorRestartsSameSpoolAfterFailedAttempt$", "-count=1"],
              ),
          ]
          executed = []
          diagnostics = []
          success = True
          for scenario_id, command in definitions:
              started = time.monotonic()
              completed = subprocess.run(
                  command,
                  cwd=workdir,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              duration = round(time.monotonic() - started, 6)
              passed = completed.returncode == 0
              success = success and passed
              executed.append({
                  "scenarioId": scenario_id,
                  "result": "PASS" if passed else "FAIL",
                  "integrityResult": "PASS" if passed else "FAIL",
                  "exitCode": completed.returncode,
                  "durationSeconds": duration,
              })
              diagnostics.append({
                  "scenarioId": scenario_id,
                  "exitCode": completed.returncode,
                  "output": completed.stdout[-4000:],
              })

          for scenario_id in (
              "database-loss-or-failover",
              "object-store-outage-and-recovery",
              "mixed-version-failure-and-rollback",
          ):
              executed.append({
                  "scenarioId": scenario_id,
                  "result": "NOT_RUN",
                  "integrityResult": "NOT_RUN",
                  "exitCode": None,
                  "durationSeconds": 0,
              })

          generated_at = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          diagnostic = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "chaos-and-failure-drills",
              "sourceCommitSha": source_sha,
              "result": "PASS" if success else "FAIL",
              "generatedAt": generated_at,
              "scenarios": diagnostics,
              "containsSecrets": False,
              "productionEvidence": False,
          }
          diagnostic_path = root / "docs/fixtures/memory-os-operability/chaos-failure-drill-diagnostic.last.json"
          atomic_write_text(
              diagnostic_path,
              json.dumps(diagnostic, indent=2, ensure_ascii=False) + "\n",
          )

          if success:
              result = {
                  "schemaVersion": "memory-os-chaos-failure-drill-results.v1",
                  "commitSha": source_sha,
                  "generatedAt": generated_at,
                  "environment": {
                      "mode": "GITHUB_ACTIONS_UBUNTU_LINUX",
                      "productionEvidence": False,
                      "containsSecrets": False,
                      "syntheticDataOnly": True,
                  },
                  "scenarios": executed,
                  "overallResult": "PARTIAL_PASS",
                  "limitations": [
                      "not production chaos",
                      "database failover not executed",
                      "object-store outage not executed",
                      "mixed-version failure not executed",
                      "parser restart matrix incomplete",
                      "single-process and Linux CI boundaries only",
                  ],
              }
              result_path = root / "docs/fixtures/memory-os-operability/chaos-failure-drill-results.sample.v1.json"
              atomic_write_text(
                  result_path,
                  json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha={source_sha}\n")
              output.write(f"success={'true' if success else 'false'}\n")
          PY

      - name: Validate generated exact-source evidence
        if: steps.drills.outputs.success == 'true'
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.drills.outputs.source_sha }}
        run: python scripts/validate-memory-os-chaos-failure-drills.py

      - name: Commit result or bounded failure diagnostic
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "${{ steps.drills.outputs.source_sha }}"
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced while the failure drills ran; refusing stale evidence or diagnostic."
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/chaos-failure-drill-diagnostic.last.json
          if [ "${{ steps.drills.outputs.success }}" = "true" ]; then
            git add docs/fixtures/memory-os-operability/chaos-failure-drill-results.sample.v1.json
          fi
          if git diff --cached --quiet; then
            echo "Failure-drill evidence is already current."
            echo "EVIDENCE_COMMIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ steps.drills.outputs.success }}" = "true" ]; then
              git commit -m "test(chaos): record exact-source API and parser drills"
            else
              git commit -m "test(chaos): record failure-drill diagnostic"
            fi
            EVIDENCE_COMMIT_SHA="$(git rev-parse HEAD)"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "so advanced before failure-drill evidence push; refusing stale evidence."
              exit 75
            fi
            git push origin HEAD:so
            echo "EVIDENCE_COMMIT_SHA=$EVIDENCE_COMMIT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Reconcile operability authority
        if: steps.drills.outputs.success == 'true'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$EVIDENCE_COMMIT_SHA"
          if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
            echo "so advanced before failure-drill authority reconciliation; refusing stale authority."
            exit 75
          fi
          python scripts/reconcile-memory-os-chaos-failure-drills.py
          EXPECTED_COMMIT_SHA="$SOURCE_SHA" python scripts/validate-memory-os-chaos-failure-drills.py
          python scripts/validate-memory-os-operability.py
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Chaos/failure-drill authority is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(chaos): reconcile API and parser drill evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
              echo "so advanced before failure-drill authority push; refusing stale authority."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Fail when a drill failed
        if: steps.drills.outputs.success != 'true'
        run: exit 1
