name: Production Equivalent Environment Review Independence

on:
  pull_request:
    paths:
      - ".github/workflows/production-equivalent-environment-review-independence.yml"
      - "contracts/operations/production-equivalent-environment-review-independence-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence-reconcile-negative.py"
      - "scripts/reconcile-memory-os-production-equivalent-environment-review-independence.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-review-independence.yml"
      - "contracts/operations/production-equivalent-environment-review-independence-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-review-independence-reconcile-negative.py"
      - "scripts/reconcile-memory-os-production-equivalent-environment-review-independence.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-equivalent-environment-review-independence-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact review-independence authority source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile and validate independent review separation
        id: validation
        run: |
          set +e
          log=/tmp/production-equivalent-environment-review-independence.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-production-equivalent-environment-review-independence.py \
            scripts/validate-memory-os-production-equivalent-environment-review-independence-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-review-independence-reconcile-negative.py \
            scripts/reconcile-memory-os-production-equivalent-environment-review-independence.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-review-independence-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-review-independence-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-production-equivalent-environment-review-independence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-review-independence.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Reject stale review-independence authority on pull requests
        if: steps.validation.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/operations/production-equivalent-environment-review-independence-contract.v1.json
      - name: Commit bounded review-independence authority
        if: steps.validation.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/production-equivalent-environment-review-independence.log

          revalidate_latest_review_independence() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-production-equivalent-environment-review-independence-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-production-equivalent-environment-review-independence-reconcile-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-production-equivalent-environment-review-independence.py >> "$log" 2>&1
            python scripts/validate-memory-os-production-equivalent-environment-review-independence.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Review-independence authority HEAD changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Review-independence authority advanced; regenerating and revalidating once from latest so."
              revalidate_latest_review_independence
            fi

            git rm -f docs/fixtures/memory-os-operability/production-equivalent-environment-review-independence-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/production-equivalent-environment-review-independence-contract.v1.json
            git add -u docs/fixtures/memory-os-operability/production-equivalent-environment-review-independence-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): reconcile environment review independence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Review-independence authority HEAD changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Review-independence authority advanced after validation; discarding stale review-independence commit and retrying from latest so."
              revalidate_latest_review_independence
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Review-independence push raced with another writer; retrying once from latest so."
            revalidate_latest_review_independence
          done
          exit 75
      - name: Record privacy-safe review-independence diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Review-independence authority HEAD changed after validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/production-equivalent-environment-review-independence.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'production-equivalent-environment-review-independence',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'generationCreated': False,
              'reviewEvidenceCreated': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-equivalent-environment-review-independence-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/production-equivalent-environment-review-independence-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record environment review independence diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Review-independence authority HEAD changed before diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce environment review independence
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
