name: Rate Limit Distributed Runtime Admission

on:
  pull_request:
    paths:
      - ".github/workflows/rate-limit-distributed-runtime-admission.yml"
      - "contracts/operations/requests/rate-limit-distributed-runtime-foundation.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-contract.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "docs/evidence/rate-limit-distributed-runtime/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-rate-limit-distributed-runtime.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-distributed-runtime-admission.yml"
      - "contracts/operations/requests/rate-limit-distributed-runtime-foundation.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-contract.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "docs/evidence/rate-limit-distributed-runtime/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-rate-limit-distributed-runtime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-limit-distributed-runtime-admission-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean pull request validation source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate distributed runtime admission read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-rate-limit-distributed-runtime.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py
          python scripts/reconcile-memory-os-rate-limit-distributed-runtime.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean validation source
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate distributed runtime admission
        id: runtime
        run: |
          set +e
          log=/tmp/rate-limit-distributed-runtime.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-rate-limit-distributed-runtime.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit-distributed-runtime-writer-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit-distributed-runtime-generation-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit-distributed-runtime-registry-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit-distributed-runtime-evidence-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-rate-limit-distributed-runtime.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit-operations.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-rate-limit.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded runtime admission authority
        if: steps.runtime.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/rate-limit-distributed-runtime-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/rate-limit-distributed-runtime-admission-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/rate-limit-distributed-runtime-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(rate-limit): register distributed runtime admission"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "so advanced after validation; refusing stale distributed-runtime authority write" >&2
              exit 75
            }
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.runtime.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          RUNTIME_EXIT_CODE: ${{ steps.runtime.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
            echo "so advanced after validation; refusing stale distributed-runtime diagnostic write" >&2
            exit 75
          }
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/rate-limit-distributed-runtime.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'rate-limit-distributed-runtime-admission',
              'result': 'FAIL',
              'exitCode': int(os.environ['RUNTIME_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'admittedRuntimeCount': 0,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/rate-limit-distributed-runtime-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/rate-limit-distributed-runtime-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(rate-limit): record distributed runtime diagnostic"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "so advanced before diagnostic publication; refusing stale distributed-runtime diagnostic write" >&2
              exit 75
            }
            git push origin HEAD:so
          fi
      - name: Enforce validation
        run: test "${{ steps.runtime.outputs.exit_code }}" = "0"
