name: Backup Restore Drill Request Admission

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-drill-request.yml"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "docs/runbooks/memory-os-production-equivalent-backup-restore-drill.md"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-drill-request.yml"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "docs/runbooks/memory-os-production-equivalent-backup-restore-drill.md"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-request-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate drill planning authority read-only
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py \
            scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-load-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-production-equivalent-environment-generation.py
          python scripts/validate-memory-os-recovery-objectives.py
          python scripts/validate-memory-os-recovery-objectives-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py
          python scripts/validate-memory-os-backup-restore-drill-request-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py
          python scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-load-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py
          python scripts/reconcile-memory-os-backup-restore-drill-request.py
          python scripts/validate-memory-os-backup-restore-drill-request.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
          python scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact drill planning authority source
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "SOURCE_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate and reconcile planning authority
        id: admission
        run: |
          set +e
          log=/tmp/backup-restore-drill-request.log
          : > "$log"
          code=0
          test -z "$(git status --porcelain)" >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python -m py_compile \
              scripts/memory_os_backup_restore_blockers.py \
              scripts/memory_os_environment_generation_eligibility.py \
              scripts/validate-memory-os-production-equivalent-environment-generation.py \
              scripts/register-memory-os-recovery-objectives.py \
              scripts/validate-memory-os-recovery-objectives.py \
              scripts/validate-memory-os-recovery-objectives-negative.py \
              scripts/request-memory-os-backup-restore-drill.py \
              scripts/validate-memory-os-backup-restore-drill-request.py \
              scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py \
              scripts/validate-memory-os-backup-restore-drill-request-negative.py \
              scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py \
              scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py \
              scripts/validate-memory-os-backup-restore-drill-request-load-negative.py \
              scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
              scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py \
              scripts/reconcile-memory-os-backup-restore-drill-request.py \
              scripts/register-memory-os-backup-restore-generation-evidence.py \
              scripts/validate-memory-os-backup-restore-generation-evidence.py \
              scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
              scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
              scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
              scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
              scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
              scripts/validate-memory-os-backup-restore-generation-binding.py \
              scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
              scripts/validate-memory-os-operability.py \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-load-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Reject stale drill planning authority on pull requests
        if: steps.admission.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            contracts/operations/backup-restore-drill-request-contract.v1.json \
            contracts/operations/backup-restore-drill-request-registry.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit bounded drill planning authority
        if: steps.admission.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Drill planning source HEAD changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/backup-restore-drill-request-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/backup-restore-drill-request-contract.v1.json \
            contracts/operations/backup-restore-drill-request-registry.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/backup-restore-drill-request-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile drill request admission authority"
            for attempt in 1 2 3 4; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Drill planning source HEAD changed after validation; refusing stale derived authority."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Record privacy-safe drill request diagnostic
        if: steps.admission.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Drill planning source HEAD changed after validation; refusing stale drill request diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/backup-restore-drill-request.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-drill-request',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['ADMISSION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'requestCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-drill-request-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          existing_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if existing_mode is not None:
                  os.fchmod(fd, existing_mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-drill-request-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record drill request admission diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Drill planning source HEAD changed before diagnostic push; refusing stale drill request diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Enforce drill request admission validation
        run: test "${{ steps.admission.outputs.exit_code }}" = "0"

      - name: Re-read canonical authority after reconciliation
        if: steps.admission.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-backup-restore-drill-request-writer-authority.py
          python scripts/validate-memory-os-backup-restore-drill-request.py
          python scripts/validate-memory-os-recovery-objectives-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-digest-negative.py
          python scripts/validate-memory-os-backup-restore-drill-objective-authority-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-load-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-append-rollback-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
          python scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          python scripts/validate-memory-os-operability.py
