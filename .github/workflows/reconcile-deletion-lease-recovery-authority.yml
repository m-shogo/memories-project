name: Reconcile Deletion Lease Recovery Authority

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-lease-recovery-authority.yml"
      - "scripts/reconcile-memory-os-deletion-lease-recovery-authority.py"
      - "scripts/validate-memory-os-deletion-lease-recovery-authority-reconcile-negative.py"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/reconcile-memory-os-load-missing-evidence.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-lease-recovery-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-lease-recovery-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-deletion-lease-recovery-authority-so
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile local lease recovery evidence
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-deletion-lease-recovery.py \
            scripts/reconcile-memory-os-deletion-lease-recovery-authority.py \
            scripts/validate-memory-os-deletion-lease-recovery-authority-reconcile-negative.py \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/reconcile-memory-os-load-missing-evidence.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/reconcile-memory-os-deletion-lease-recovery-authority.py
          python scripts/validate-memory-os-deletion-lease-recovery-authority-reconcile-negative.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
      - name: Commit canonical authority update
        run: |
          set -euo pipefail
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): register lease recovery in canonical authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during lease recovery authority reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi