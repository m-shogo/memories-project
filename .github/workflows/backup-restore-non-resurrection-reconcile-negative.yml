name: Backup Restore Non-Resurrection Reconcile Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
      - "scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-reconcile-workflow-negative.py"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
      - "scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-reconcile-workflow-negative.py"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove transactional typed non-resurrection reconciliation
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed typed non-resurrection reconcile negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-backup-restore-non-resurrection-reconcile-workflow-negative.py
          authorities=(
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
            contracts/operations/backup-restore-generation-evidence-contract.v1.json
            contracts/operations/backup-restore-generation-evidence-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          modes="$RUNNER_TEMP/non-resurrection-authority-modes.txt"
          : > "$modes"
          for authority in "${authorities[@]}"; do
            test -f "$authority"
            printf '%s %s\n' "$(stat -c '%a' "$authority")" "$authority" >> "$modes"
          done
          python -m py_compile \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py \
            scripts/validate-memory-os-local-apple-replay-restore.py \
            scripts/validate-memory-os-local-coherent-recovery-set.py \
            scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-review-source-order.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          python scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          while read -r expected_mode authority; do
            test "$(stat -c '%a' "$authority")" = "$expected_mode"
          done < "$modes"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"