name: Recovery Objectives Admission

on:
  pull_request:
    paths:
      - ".github/workflows/recovery-objectives-admission.yml"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-digest-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-negative.py"
      - "scripts/reconcile-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/recovery-objectives-admission.yml"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-digest-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-negative.py"
      - "scripts/reconcile-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-objectives-admission-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean recovery objective PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate explicit recovery objectives authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/validate-memory-os-recovery-objectives-digest-negative.py \
            scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py \
            scripts/validate-memory-os-recovery-objectives-reconcile-negative.py \
            scripts/reconcile-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-recovery-objectives-negative.py
          python scripts/validate-memory-os-recovery-objectives-digest-negative.py
          python scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py
          python scripts/validate-memory-os-recovery-objectives-reconcile-negative.py
          python scripts/reconcile-memory-os-recovery-objectives.py
          python scripts/validate-memory-os-recovery-objectives.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact recovery objective authority source
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
      - name: Validate explicit recovery objectives authority
        id: validation
        run: |
          set +e
          log=/tmp/recovery-objectives-admission.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/validate-memory-os-recovery-objectives-digest-negative.py \
            scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py \
            scripts/validate-memory-os-recovery-objectives-reconcile-negative.py \
            scripts/reconcile-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives-digest-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives-append-rollback-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded objective authority
        if: steps.validation.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Recovery objective authority source HEAD changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/recovery-objectives-admission-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/recovery-objectives-admission-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/recovery-objectives-admission-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(backup): reconcile recovery objectives authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Recovery objective authority source HEAD changed after validation; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe recovery objective diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Recovery objective authority source HEAD changed after validation; refusing stale recovery objective diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/recovery-objectives-admission.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'recovery-objectives-admission',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'objectiveCreated': False,
              'objectiveValueChosenOrDefaulted': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/recovery-objectives-admission-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/recovery-objectives-admission-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record recovery objective admission diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Recovery objective authority source HEAD changed after diagnostic capture; refusing stale recovery objective diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce recovery objective admission
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
