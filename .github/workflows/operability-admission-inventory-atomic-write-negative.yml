name: Operability Admission Inventory Atomic Write Negative

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/operability-admission-inventory-atomic-write-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-write-source-negative.yml"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-negative.py"
      - "contracts/operations/operability-admission-inventory.v1.json"
  pull_request:
    branches: [so]
    paths:
      - ".github/workflows/operability-admission-inventory-atomic-write-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-write-source-negative.yml"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-negative.py"
      - "contracts/operations/operability-admission-inventory.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-write-negative:
    if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require exact atomic-write CI source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${PR_HEAD_SHA:-}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py
      - name: Capture canonical inventory authority
        run: |
          set -euo pipefail
          sha256sum contracts/operations/operability-admission-inventory.v1.json > /tmp/inventory.sha256
          stat -c '%a' contracts/operations/operability-admission-inventory.v1.json > /tmp/inventory.mode
      - name: Prove failed atomic replacement rolls back cleanly
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/generate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory-atomic-write-negative.py
          python scripts/validate-memory-os-operability-admission-inventory-atomic-write-negative.py
      - name: Prove canonical authority remained exact
        run: |
          set -euo pipefail
          sha256sum -c /tmp/inventory.sha256
          test "$(stat -c '%a' contracts/operations/operability-admission-inventory.v1.json)" = "$(cat /tmp/inventory.mode)"
          test -z "$(find contracts/operations -maxdepth 1 -name '.operability-admission-inventory.v1.json.*.tmp' -print -quit)"
          test -z "$(git status --porcelain)"
