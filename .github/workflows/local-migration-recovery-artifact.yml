name: Local Migration Recovery Artifact Rehearsal

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/local-migration-recovery-artifact.yml"
      - ".github/workflows/local-migration-recovery-source-negative.yml"
      - "scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py"
      - "contracts/operations/local-migration-recovery-artifact-contract.v1.json"
      - "contracts/operations/migration-evidence-registry-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "infra/postgresql/security/**"
      - "scripts/run-memory-os-local-migration-recovery-artifact.sh"
      - "scripts/validate-memory-os-local-migration-recovery-artifact.py"
      - "scripts/reconcile-memory-os-local-migration-recovery-artifact.py"
      - "scripts/memory_os_migration_recovery_point.py"
      - "scripts/register-memory-os-migration-rehearsal-evidence.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/reconcile-memory-os-migration-evidence-registry.py"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/local-migration-recovery-artifact.yml"
      - ".github/workflows/local-migration-recovery-source-negative.yml"
      - "scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py"
      - "contracts/operations/local-migration-recovery-artifact-contract.v1.json"
      - "contracts/operations/migration-evidence-registry-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "infra/postgresql/security/**"
      - "scripts/run-memory-os-local-migration-recovery-artifact.sh"
      - "scripts/validate-memory-os-local-migration-recovery-artifact.py"
      - "scripts/reconcile-memory-os-local-migration-recovery-artifact.py"
      - "scripts/memory_os_migration_recovery_point.py"
      - "scripts/register-memory-os-migration-rehearsal-evidence.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/reconcile-memory-os-migration-evidence-registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-migration-recovery-artifact-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify reviewed exact PR source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="$PR_HEAD_SHA"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py

      - name: Validate migration recovery authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_migration_recovery_point.py \
            scripts/validate-memory-os-local-migration-recovery-artifact.py \
            scripts/reconcile-memory-os-local-migration-recovery-artifact.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py \
            scripts/validate-memory-os-migration-evidence-registry.py \
            scripts/reconcile-memory-os-migration-evidence-registry.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            scripts/validate-memory-os-operability.py
          bash -n scripts/run-memory-os-local-migration-recovery-artifact.sh
          python scripts/validate-memory-os-local-migration-recovery-artifact.py
          python scripts/validate-memory-os-migration-evidence-registry.py
          python scripts/validate-memory-os-migration-lifecycle.py
          python scripts/validate-memory-os-operability.py
          test -z "$(git status --porcelain)"

  rehearse:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/so' &&
      (github.event_name != 'push' ||
       (!contains(github.event.head_commit.message, 'test(migration): record local recovery artifact rehearsal') &&
        !contains(github.event.head_commit.message, 'docs(migration): register local recovery artifact rehearsal')))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      MEMORY_OS_ALLOW_EPHEMERAL_DATABASE_DROP: "1"

    steps:
      - name: Checkout latest so
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: so
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify reviewed so-only rehearsal source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py

      - name: Install PostgreSQL 16 client and verify server major
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          for binary in psql pg_dump pg_restore; do
            "$binary" --version | grep -Eq 'PostgreSQL\\) 16\\.'
          done
          server_version="$(psql -Atqc 'SHOW server_version_num')"
          [[ "$server_version" =~ ^[0-9]+$ ]]
          test "$((server_version / 10000))" -eq 16

      - name: Reconcile registry foundation before source capture
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_migration_recovery_point.py \
            scripts/validate-memory-os-local-migration-recovery-artifact.py \
            scripts/reconcile-memory-os-local-migration-recovery-artifact.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py \
            scripts/validate-memory-os-migration-evidence-registry.py \
            scripts/reconcile-memory-os-migration-evidence-registry.py
          bash -n scripts/run-memory-os-local-migration-recovery-artifact.sh
          python scripts/validate-memory-os-local-migration-recovery-artifact.py
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$BASE_SHA"
          python scripts/reconcile-memory-os-migration-evidence-registry.py
          git add \
            contracts/operations/migration-evidence-registry-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(migration): reconcile recovery evidence foundation"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$BASE_SHA" ]]; then
              echo "so advanced during migration foundation reconcile; refusing stale authority write."
              exit 75
            fi
            git push origin HEAD:so
          fi
          git fetch origin so
          git reset --hard origin/so
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUN_ID=mig_$(date -u +%Y%m%d)_$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Execute exact-source recovery artifact rehearsal
        id: drill
        run: |
          set +e
          log=/tmp/memory-os-local-migration-recovery-artifact.log
          result=/tmp/${RUN_ID}.json
          : > "$log"
          rm -f "$result"
          code=0
          stage=static-validation
          echo "STAGE: static-validation" >> "$log"
          python scripts/validate-memory-os-local-migration-recovery-artifact.py >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            stage=actual-recovery-artifact
            echo "STAGE: actual-recovery-artifact" >> "$log"
            MEMORY_OS_COMMIT_SHA="$SOURCE_SHA" \
            MEMORY_OS_MIGRATION_RUN_ID="$RUN_ID" \
            MEMORY_OS_MIGRATION_RECOVERY_RESULT_PATH="$result" \
            bash scripts/run-memory-os-local-migration-recovery-artifact.sh >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=result-validation
            echo "STAGE: result-validation" >> "$log"
            python scripts/validate-memory-os-local-migration-recovery-artifact.py \
              --path "$result" --expected-commit-sha "$SOURCE_SHA" --require-result \
              >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "result_path=$result" >> "$GITHUB_OUTPUT"
          printf "Local migration recovery rehearsal exit code: %s (raw log suppressed)\n" "$code"
          exit 0

      - name: Publish exact recovery artifact result
        if: steps.drill.outputs.exit_code == '0'
        env:
          RESULT_PATH: ${{ steps.drill.outputs.result_path }}
        run: |
          set -euo pipefail
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- \
            contracts/operations/local-migration-recovery-artifact-contract.v1.json \
            contracts/operations/migration-evidence-registry-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            infra/postgresql/security \
            scripts/run-memory-os-local-migration-recovery-artifact.sh \
            scripts/validate-memory-os-local-migration-recovery-artifact.py \
            scripts/memory_os_migration_recovery_point.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py; then
            echo "Newer migration-critical source exists; refusing stale recovery artifact evidence."
            exit 75
          fi
          git reset --hard origin/so
          BASE_SHA="$(git rev-parse HEAD)"
          target="docs/evidence/migrations/recovery/${RUN_ID}.json"
          if [[ -f "$target" ]]; then
            python scripts/validate-memory-os-local-migration-recovery-artifact.py \
              --path "$target" --expected-commit-sha "$SOURCE_SHA" --require-result
            echo "Exact recovery artifact result already exists for $RUN_ID."
          else
            cp "$RESULT_PATH" "$target"
            python scripts/validate-memory-os-local-migration-recovery-artifact.py \
              --path "$target" --expected-commit-sha "$SOURCE_SHA" --require-result
            git add "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(migration): record local recovery artifact rehearsal"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$BASE_SHA" ]]; then
              echo "so advanced before recovery artifact result push; refusing stale append."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Register append-only migration rehearsal and reconcile authority
        if: steps.drill.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          BASE_SHA="$(git rev-parse HEAD)"
          result="docs/evidence/migrations/recovery/${RUN_ID}.json"
          python scripts/validate-memory-os-local-migration-recovery-artifact.py \
            --path "$result" --expected-commit-sha "$SOURCE_SHA" --require-result

          already_registered="$(RUN_ID="$RUN_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('contracts/operations/migration-evidence-registry.v1.json').read_text())
          print('1' if any(row.get('migrationRunId') == os.environ['RUN_ID'] for row in value.get('records', []) if isinstance(row, dict)) else '0')
          PY
          )"

          if [[ "$already_registered" != "1" ]]; then
            RUN_ID="$RUN_ID" SOURCE_SHA="$SOURCE_SHA" RESULT_PATH="$result" RECORD_PATH="/tmp/${RUN_ID}-record.json" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          root = Path('.')
          result = json.loads(Path(os.environ['RESULT_PATH']).read_text())
          lifecycle = json.loads((root / 'contracts/operations/migration-lifecycle-contract.v1.json').read_text())
          contract = json.loads((root / 'contracts/operations/local-migration-recovery-artifact-contract.v1.json').read_text())
          canonical = lifecycle['migrationSequence']
          budgets = contract['operatorBudgets']
          today = dt.datetime.now(dt.timezone.utc).date()
          deadline = today + dt.timedelta(days=30)
          artifact = result['recoveryArtifact']
          record = {
              'schemaVersion': 'memory-os-migration-rehearsal-evidence.v1',
              'migrationRunId': os.environ['RUN_ID'],
              'environmentClass': 'LOCAL_POSTGRES_REHEARSAL',
              'environmentGenerationId': None,
              'databaseIdentityDigest': result['databaseIdentityDigest'],
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'migrationSequenceBefore': canonical[:-1],
              'migrationSequenceAfter': canonical,
              'startedAt': result['startedAt'],
              'completedAt': result['completedAt'],
              'operatorRef': 'opr_ci_recovery_operator',
              'reviewerRef': 'rev_ci_recovery_reviewer',
              'recoveryPointReference': artifact['reference'],
              'recoveryPointArtifactDigest': artifact['sha256'],
              'recoveryPointVerified': True,
              'restoreCapabilityEvidenceRef': 'docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json',
              'restoreCapabilityVerified': True,
              'recoveryPointRestoreEvidenceRef': os.environ['RESULT_PATH'],
              'lockBudgetMs': int(budgets['lockBudgetMs']),
              'statementBudgetMs': int(budgets['statementBudgetMs']),
              'observedLockWaitMs': int(budgets['isolatedCleanDatabaseExpectedLockWaitMs']),
              'observedRuntimeMs': int(result['migrationApplyDurationMs']),
              'preflightResult': 'PASS',
              'applyResult': 'PASS',
              'verificationResult': 'PASS',
              'recoveryDecision': 'NO_RECOVERY_REQUIRED',
              'openRisks': [
                  {
                      'riskId': 'risk_local_same_cluster_only',
                      'ownerRef': 'opr_ci_recovery_owner',
                      'deadline': deadline.isoformat(),
                      'status': 'OPEN',
                  }
              ],
              'containsSecrets': False,
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
          }
          Path(os.environ['RECORD_PATH']).write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY
            python scripts/register-memory-os-migration-rehearsal-evidence.py \
              --record "/tmp/${RUN_ID}-record.json" \
              --confirm "REGISTER NON-PRODUCTION MIGRATION REHEARSAL"
          fi

          python scripts/reconcile-memory-os-migration-evidence-registry.py
          python scripts/reconcile-memory-os-local-migration-recovery-artifact.py --run-id "$RUN_ID"
          python scripts/validate-memory-os-migration-evidence-registry.py
          python scripts/validate-memory-os-local-migration-recovery-artifact.py \
            --path "$result" --expected-commit-sha "$SOURCE_SHA" --require-result
          python scripts/validate-memory-os-migration-lifecycle.py
          python scripts/validate-memory-os-operability.py

          git rm -f docs/fixtures/memory-os-operability/local-migration-recovery-artifact-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/migration-evidence-registry.v1.json \
            contracts/operations/migration-evidence-registry-contract.v1.json \
            contracts/operations/local-migration-recovery-artifact-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/local-migration-recovery-artifact-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(migration): register local recovery artifact rehearsal"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$BASE_SHA" ]]; then
              echo "so advanced before migration rehearsal authority push; checking for canonical rescue convergence."
              git reset --hard origin/so
              python scripts/validate-memory-os-migration-evidence-registry.py
              python scripts/validate-memory-os-local-migration-recovery-artifact.py \
                --path "$result" --expected-commit-sha "$SOURCE_SHA" --require-result
              python scripts/validate-memory-os-migration-lifecycle.py
              python scripts/validate-memory-os-operability.py
              RUN_ID="$RUN_ID" SOURCE_SHA="$SOURCE_SHA" RESULT_PATH="$result" python - <<'PY'
          import json
          import os
          from pathlib import Path

          registry = json.loads(Path('contracts/operations/migration-evidence-registry.v1.json').read_text())
          matches = [
              row for row in registry.get('records', [])
              if isinstance(row, dict) and row.get('migrationRunId') == os.environ['RUN_ID']
          ]
          if len(matches) != 1:
              raise SystemExit('latest migration registry does not contain exactly one rescued RUN_ID')
          row = matches[0]
          expected = {
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'environmentClass': 'LOCAL_POSTGRES_REHEARSAL',
              'environmentGenerationId': None,
              'recoveryPointRestoreEvidenceRef': os.environ['RESULT_PATH'],
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
          }
          for key, value in expected.items():
              if row.get(key) != value:
                  raise SystemExit(f'rescued migration registry row {key} mismatch')
          PY
              echo "Latest so already contains the canonical registration for $RUN_ID; accepting converged rescue."
              exit 0
            fi
            git push origin HEAD:so
          fi

      - name: Record privacy-safe diagnostic
        if: steps.drill.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.drill.outputs.exit_code }}
          FAILURE_STAGE: ${{ steps.drill.outputs.failure_stage }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced after the failed migration rehearsal; refusing stale diagnostic write."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'local-migration-recovery-artifact',
              'sourceCommitSha': os.environ.get('SOURCE_SHA', ''),
              'failureStage': os.environ.get('FAILURE_STAGE', 'unknown'),
              'result': 'FAIL',
              'exitCode': int(os.environ['EXIT_CODE']),
              'output': 'REDACTED: local migration recovery failed; raw output withheld',
              'containsSecrets': False,
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/local-migration-recovery-artifact-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          if path.is_symlink():
              raise SystemExit('local recovery diagnostic target must not be a symlink')
          existing_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          descriptor, temp_name = tempfile.mkstemp(
              prefix='.local-migration-recovery-diagnostic.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(descriptor, 'w', encoding='utf-8') as handle:
                  if existing_mode is not None:
                      os.fchmod(handle.fileno(), existing_mode)
                  json.dump(value, handle, indent=2)
                  handle.write('\n')
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_name, path)
          finally:
              try:
                  os.unlink(temp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/local-migration-recovery-artifact-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(migration): record local recovery artifact diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "so advanced before migration diagnostic push; refusing stale diagnostic write."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Enforce rehearsal success
        run: test "${{ steps.drill.outputs.exit_code }}" = "0"
