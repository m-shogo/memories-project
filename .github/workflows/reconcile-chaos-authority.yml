name: Reconcile Chaos Authority

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-chaos-authority.yml"
      - "scripts/reconcile-memory-os-chaos-authority.py"
      - "scripts/reconcile-memory-os-chaos-inflight-overlay.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills-v2.py"
      - "scripts/reconcile-memory-os-parser-restart-matrix.py"
      - "scripts/reconcile-memory-os-parser-inflight-cancellation.py"
      - "scripts/reconcile-memory-os-parser-process-group-reaping.py"
      - "scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py"
      - "scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py"
      - "scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-parser-restart-matrix.py"
      - "scripts/validate-memory-os-database-commit-outage.py"
      - "scripts/validate-memory-os-parser-inflight-cancellation.py"
      - "scripts/validate-memory-os-parser-process-group-reaping.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/chaos-failure-drill-contract.v1.json"
      - "contracts/operations/chaos-failure-drill-contract.v2.json"
      - "contracts/operations/parser-restart-matrix-contract.v1.json"
      - "contracts/operations/database-commit-outage-contract.v1.json"
      - "contracts/operations/parser-inflight-cancellation-contract.v1.json"
      - "contracts/operations/parser-process-group-reaping-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/chaos-failure-drill-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/chaos-failure-drill-results.v2.sample.json"
      - "docs/fixtures/memory-os-operability/parser-restart-matrix-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/parser-inflight-cancellation-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/parser-process-group-reaping-results.sample.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-chaos-authority.yml"
      - "scripts/reconcile-memory-os-chaos-authority.py"
      - "scripts/reconcile-memory-os-chaos-inflight-overlay.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills-v2.py"
      - "scripts/reconcile-memory-os-parser-restart-matrix.py"
      - "scripts/reconcile-memory-os-parser-inflight-cancellation.py"
      - "scripts/reconcile-memory-os-parser-process-group-reaping.py"
      - "scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py"
      - "scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py"
      - "scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-parser-restart-matrix.py"
      - "scripts/validate-memory-os-database-commit-outage.py"
      - "scripts/validate-memory-os-parser-inflight-cancellation.py"
      - "scripts/validate-memory-os-parser-process-group-reaping.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/chaos-failure-drill-contract.v1.json"
      - "contracts/operations/chaos-failure-drill-contract.v2.json"
      - "contracts/operations/parser-restart-matrix-contract.v1.json"
      - "contracts/operations/database-commit-outage-contract.v1.json"
      - "contracts/operations/parser-inflight-cancellation-contract.v1.json"
      - "contracts/operations/parser-process-group-reaping-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/chaos-failure-drill-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/chaos-failure-drill-results.v2.sample.json"
      - "docs/fixtures/memory-os-operability/parser-restart-matrix-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/parser-inflight-cancellation-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/parser-process-group-reaping-results.sample.v1.json"
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-chaos-authority-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean PR authority source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Validate normalized chaos authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-chaos-authority.py \
            scripts/reconcile-memory-os-chaos-inflight-overlay.py \
            scripts/reconcile-memory-os-chaos-failure-drills.py \
            scripts/reconcile-memory-os-chaos-failure-drills-v2.py \
            scripts/reconcile-memory-os-parser-restart-matrix.py \
            scripts/reconcile-memory-os-parser-inflight-cancellation.py \
            scripts/reconcile-memory-os-parser-process-group-reaping.py \
            scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py \
            scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py \
            scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py \
            scripts/validate-memory-os-chaos-failure-drills.py \
            scripts/validate-memory-os-chaos-failure-drills-v2.py \
            scripts/validate-memory-os-parser-restart-matrix.py \
            scripts/validate-memory-os-database-commit-outage.py \
            scripts/validate-memory-os-parser-inflight-cancellation.py \
            scripts/validate-memory-os-parser-process-group-reaping.py \
            scripts/validate-memory-os-operability.py

          validate_committed_sources() {
            python scripts/validate-memory-os-chaos-failure-drills.py
            python scripts/validate-memory-os-chaos-failure-drills-v2.py
            python scripts/validate-memory-os-parser-restart-matrix.py
            if python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json').read_text())
          assertions = value.get('assertions', {})
          raise SystemExit(0 if assertions.get('sameSpoolIdReused') is True else 1)
          PY
            then
              python scripts/validate-memory-os-database-commit-outage.py
            else
              echo "Legacy new-spool database result retained until same-spool exact-source evidence arrives."
            fi
            if test -f docs/fixtures/memory-os-operability/parser-inflight-cancellation-results.sample.v1.json; then
              python scripts/validate-memory-os-parser-inflight-cancellation.py
            else
              echo "In-flight cancellation result not committed yet; gap remains open."
            fi
            if test -f docs/fixtures/memory-os-operability/parser-process-group-reaping-results.sample.v1.json; then
              python scripts/validate-memory-os-parser-process-group-reaping.py
            else
              echo "Process-group reaping result not committed yet; orphan/reaping gap remains open."
            fi
            python scripts/validate-memory-os-operability.py
          }

          validate_committed_sources
          python scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py
          python scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py
          python scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py
          python scripts/reconcile-memory-os-chaos-authority.py
          python scripts/reconcile-memory-os-chaos-authority.py --check
          python scripts/reconcile-memory-os-chaos-inflight-overlay.py
          python scripts/reconcile-memory-os-chaos-inflight-overlay.py --check
          python scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py
          python scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py
          python scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py
          validate_committed_sources
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"

      - name: Normalize all committed drill generations
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-chaos-authority.py \
            scripts/reconcile-memory-os-chaos-inflight-overlay.py \
            scripts/reconcile-memory-os-chaos-failure-drills.py \
            scripts/reconcile-memory-os-chaos-failure-drills-v2.py \
            scripts/reconcile-memory-os-parser-restart-matrix.py \
            scripts/reconcile-memory-os-parser-inflight-cancellation.py \
            scripts/reconcile-memory-os-parser-process-group-reaping.py \
            scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py \
            scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py \
            scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py \
            scripts/validate-memory-os-chaos-failure-drills.py \
            scripts/validate-memory-os-chaos-failure-drills-v2.py \
            scripts/validate-memory-os-parser-restart-matrix.py \
            scripts/validate-memory-os-database-commit-outage.py \
            scripts/validate-memory-os-parser-inflight-cancellation.py \
            scripts/validate-memory-os-parser-process-group-reaping.py \
            scripts/validate-memory-os-operability.py

          validate_committed_sources() {
            python scripts/validate-memory-os-chaos-failure-drills.py
            python scripts/validate-memory-os-chaos-failure-drills-v2.py
            python scripts/validate-memory-os-parser-restart-matrix.py
            if python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json').read_text())
          assertions = value.get('assertions', {})
          raise SystemExit(0 if assertions.get('sameSpoolIdReused') is True else 1)
          PY
            then
              python scripts/validate-memory-os-database-commit-outage.py
            else
              echo "Legacy new-spool database result retained until same-spool exact-source evidence arrives."
            fi
            if test -f docs/fixtures/memory-os-operability/parser-inflight-cancellation-results.sample.v1.json; then
              python scripts/validate-memory-os-parser-inflight-cancellation.py
            else
              echo "In-flight cancellation result not committed yet; gap remains open."
            fi
            if test -f docs/fixtures/memory-os-operability/parser-process-group-reaping-results.sample.v1.json; then
              python scripts/validate-memory-os-parser-process-group-reaping.py
            else
              echo "Process-group reaping result not committed yet; orphan/reaping gap remains open."
            fi
            python scripts/validate-memory-os-operability.py
          }

          validate_committed_sources
          python scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py
          python scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py
          python scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py
          python scripts/reconcile-memory-os-chaos-authority.py
          python scripts/reconcile-memory-os-chaos-authority.py --check
          python scripts/reconcile-memory-os-chaos-inflight-overlay.py
          python scripts/reconcile-memory-os-chaos-inflight-overlay.py --check
          python scripts/validate-memory-os-chaos-v1-reconcile-authority-negative.py
          python scripts/validate-memory-os-parser-process-group-reaping-reconcile-negative.py
          python scripts/validate-memory-os-chaos-scenario-reconcile-monotonicity-negative.py
          validate_committed_sources

      - name: Commit normalized authority
        if: github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Chaos authority is already normalized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(chaos): normalize failure-drill authority"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Chaos authority source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
