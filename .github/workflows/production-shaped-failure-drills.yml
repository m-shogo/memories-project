name: Production Shaped Failure Drill Admission

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-shaped-failure-drills.yml"
      - "contracts/operations/requests/production-shaped-failure-drill-foundation.v1.json"
      - "contracts/operations/production-shaped-failure-drill-contract.v1.json"
      - "contracts/operations/production-shaped-failure-drill-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "docs/evidence/production-shaped-failure-drills/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-production-shaped-failure-drill.py"
      - "scripts/validate-memory-os-production-shaped-failure-drills.py"
      - "scripts/validate-memory-os-production-shaped-failure-drill-registry-negative.py"
      - "scripts/validate-memory-os-production-shaped-failure-drill-reconcile-rollback-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-production-shaped-failure-drills.py"
  pull_request:
    paths:
      - ".github/workflows/production-shaped-failure-drills.yml"
      - "contracts/operations/requests/production-shaped-failure-drill-foundation.v1.json"
      - "contracts/operations/production-shaped-failure-drill-contract.v1.json"
      - "contracts/operations/production-shaped-failure-drill-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "docs/evidence/production-shaped-failure-drills/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-production-shaped-failure-drill.py"
      - "scripts/validate-memory-os-production-shaped-failure-drills.py"
      - "scripts/validate-memory-os-production-shaped-failure-drill-registry-negative.py"
      - "scripts/validate-memory-os-production-shaped-failure-drill-reconcile-rollback-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-production-shaped-failure-drills.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-shaped-failure-drills-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - name: Capture validation source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile and validate drill admission
        id: drills
        run: |
          set +e
          log=/tmp/production-shaped-failure-drills.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-production-shaped-failure-drill.py \
            scripts/validate-memory-os-production-shaped-failure-drills.py \
            scripts/validate-memory-os-production-shaped-failure-drill-registry-negative.py \
            scripts/validate-memory-os-production-shaped-failure-drill-reconcile-rollback-negative.py \
            scripts/validate-memory-os-chaos-failure-drills-v2.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-production-shaped-failure-drills.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-production-shaped-failure-drill-registry-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-production-shaped-failure-drill-reconcile-rollback-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-production-shaped-failure-drills.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-chaos-failure-drills-v2.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Enforce deterministic PR authority
        if: github.event_name == 'pull_request' && steps.drills.outputs.exit_code == '0'
        run: |
          git diff --check
          git diff --exit-code -- \
            contracts/operations/production-shaped-failure-drill-contract.v1.json \
            contracts/operations/production-operability-status.json
      - name: Commit bounded drill admission authority
        if: github.event_name != 'pull_request' && steps.drills.outputs.exit_code == '0'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/production-shaped-failure-drill-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/production-shaped-failure-drill-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/production-shaped-failure-drill-diagnostic.last.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Production-shaped failure-drill authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(chaos): register production-shaped drill admission"
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
            echo "so advanced after validation; refusing stale failure-drill authority write" >&2
            exit 75
          }
          git push origin HEAD:so
      - name: Record privacy-safe diagnostic
        if: github.event_name != 'pull_request' && steps.drills.outputs.exit_code != '0'
        env:
          DRILL_EXIT_CODE: ${{ steps.drills.outputs.exit_code }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/production-shaped-failure-drills.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'production-shaped-failure-drills',
              'result': 'FAIL',
              'exitCode': int(os.environ['DRILL_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'registeredDrillCount': 0,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-shaped-failure-drill-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/production-shaped-failure-drill-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(chaos): record production-shaped drill diagnostic"
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
            echo "so advanced after validation; refusing stale failure-drill diagnostic write" >&2
            exit 75
          }
          git push origin HEAD:so
      - name: Enforce drill admission validation
        run: test "${{ steps.drills.outputs.exit_code }}" = "0"
