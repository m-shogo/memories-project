name: Reconcile Live Load Formatting

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-live-load-gofmt.yml"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-load-gofmt.yml"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-live-load-gofmt-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'style(load): format live checkpoint tests')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Capture exact source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA"
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Apply canonical gofmt
        run: |
          set -euo pipefail
          gofmt -w \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --exit-code -- \
              services/import-api/internal/httpserver/live_load_test.go \
              services/import-api/internal/httpserver/live_object_load_test.go
          fi

      - name: Commit formatting authority
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced during live load formatting; refusing stale source rewrite."
            exit 75
          fi
          git add \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          if git diff --cached --quiet; then
            echo "Live checkpoint tests are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(load): format live checkpoint tests"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced before live load formatting push; refusing stale source rewrite."
            exit 75
          fi
          git push origin HEAD:so
