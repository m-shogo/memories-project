name: Reconcile Live Load Formatting

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-load-gofmt.yml"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-live-load-gofmt-so
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'style(load): format live checkpoint tests')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Apply canonical gofmt
        run: |
          set -euo pipefail
          gofmt -w \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go)"

      - name: Commit formatting authority
        run: |
          git add \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          if git diff --cached --quiet; then
            echo "Live checkpoint tests are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(load): format live checkpoint tests"
          git pull --rebase origin so
          git push origin HEAD:so
