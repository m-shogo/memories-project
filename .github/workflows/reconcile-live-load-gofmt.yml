name: Reconcile Live Load Formatting

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-load-gofmt.yml"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-load-gofmt.yml"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-live-load-gofmt-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Verify exact clean PR source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "${PR_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Validate canonical formatting read-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          gofmt -w \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go)"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  format:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/so' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, 'style(load): format live checkpoint tests'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Capture exact source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA:-}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply canonical gofmt
        run: |
          set -euo pipefail
          gofmt -w \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go)"

      - name: Commit formatting authority
        if: github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced during live load formatting; refusing stale source rewrite."
            exit 75
          fi
          git add \
            services/import-api/internal/httpserver/live_load_test.go \
            services/import-api/internal/httpserver/live_object_load_test.go
          if git diff --cached --quiet; then
            echo "Live checkpoint tests are already formatted."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(load): format live checkpoint tests"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced before live load formatting push; refusing stale source rewrite."
            exit 75
          fi
          git push origin HEAD:so
