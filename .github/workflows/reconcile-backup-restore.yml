name: Reconcile Backup Restore Policy

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-backup-restore.yml"
      - "contracts/operations/backup-restore-contract.v1.json"
      - "contracts/operations/local-logical-restore-contract.v1.json"
      - "contracts/operations/local-object-version-restore-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-backup-restore.md"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-backup-restore-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-local-logical-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-backup-restore.yml"
      - "contracts/operations/backup-restore-contract.v1.json"
      - "contracts/operations/local-logical-restore-contract.v1.json"
      - "contracts/operations/local-object-version-restore-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-backup-restore.md"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-backup-restore-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-local-logical-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-backup-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact pull request source state
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Compile backup authority tools
        run: |
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-backup-restore-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore.py \
            scripts/validate-memory-os-local-logical-restore.py \
            scripts/validate-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-entry-docs.py

      - name: Validate reconciled status authority read-only
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-reconcile-negative.py
          python scripts/reconcile-memory-os-backup-restore.py
          python scripts/validate-memory-os-backup-restore.py
          python scripts/validate-memory-os-local-logical-restore.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py
          git diff --exit-code -- contracts/operations/production-operability-status.json

  reconcile:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact source state
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          SOURCE_SHA="$expected"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Compile backup authority tools
        run: |
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-backup-restore-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore.py \
            scripts/validate-memory-os-local-logical-restore.py \
            scripts/validate-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-entry-docs.py

      - name: Reconcile then validate status authority
        run: |
          python scripts/validate-memory-os-backup-restore-reconcile-negative.py
          python scripts/reconcile-memory-os-backup-restore.py
          python scripts/validate-memory-os-backup-restore.py
          python scripts/validate-memory-os-local-logical-restore.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py

      - name: Commit reconciled status
        run: |
          set -euo pipefail

          revalidate_latest_restore_policy() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            python scripts/validate-memory-os-backup-restore-reconcile-negative.py
            python scripts/reconcile-memory-os-backup-restore.py
            python scripts/validate-memory-os-backup-restore.py
            python scripts/validate-memory-os-local-logical-restore.py
            python scripts/validate-memory-os-local-object-version-restore.py
            python scripts/validate-memory-os-operability.py
            python scripts/validate-memory-os-entry-docs.py
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" || "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Backup/restore source changed again during bounded retry; refusing stale authority write." >&2
                exit 75
              fi
              echo "Backup/restore source advanced; recomputing and revalidating once from latest so."
              revalidate_latest_restore_policy
            fi

            git add contracts/operations/production-operability-status.json
            if git diff --cached --quiet; then
              echo "Backup/restore authority is already current."
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(backup): reconcile restore policy authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Backup/restore source changed again after bounded retry validation; refusing stale authority write." >&2
                exit 75
              fi
              echo "Backup/restore source advanced after validation; discarding stale commit and retrying from latest so."
              revalidate_latest_restore_policy
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Backup/restore authority push raced with another writer; retrying once from latest so."
            revalidate_latest_restore_policy
          done
          exit 75
