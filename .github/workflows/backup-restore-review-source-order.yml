name: Backup Restore Review Source Order

on:
  push:
    branches: [so]
    paths:
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'scripts/validate-memory-os-backup-restore-generation-independent-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'docs/evidence/backup-restore/**'
      - '.github/workflows/backup-restore-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-review-source-order-workflow-negative.py'
  pull_request:
    branches: [so]
    paths:
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'scripts/validate-memory-os-backup-restore-generation-independent-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'docs/evidence/backup-restore/**'
      - '.github/workflows/backup-restore-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-review-source-order-workflow-negative.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert exact review authority source
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${PR_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            echo "Unreviewed review source-order CI event" >&2
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove source-order CI source admission
        run: python scripts/validate-memory-os-backup-restore-review-source-order-workflow-negative.py
      - name: Compile review and downstream validators
        run: |
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
      - name: Prove stale review/source ordering is fail-closed
        run: python scripts/validate-memory-os-backup-restore-review-source-order.py --self-test
      - name: Validate canonical recovery review source ordering
        run: python scripts/validate-memory-os-backup-restore-review-source-order.py
      - name: Validate typed cross-generation material-delta authority
        run: |
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
      - name: Validate downstream generation evidence authority
        run: python scripts/validate-memory-os-backup-restore-generation-evidence.py
      - name: Validate downstream generation binding authority
        run: python scripts/validate-memory-os-backup-restore-generation-binding.py
      - name: Prove validators are read-only
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
