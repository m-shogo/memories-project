name: Backup Restore Review Source Order

on:
  push:
    branches: [so]
    paths:
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'docs/evidence/backup-restore/**'
      - '.github/workflows/backup-restore-review-source-order.yml'
  pull_request:
    paths:
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'docs/evidence/backup-restore/**'
      - '.github/workflows/backup-restore-review-source-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact review authority source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Compile review and downstream validators
        run: |
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py
      - name: Prove stale review/source ordering is fail-closed
        run: python scripts/validate-memory-os-backup-restore-review-source-order.py --self-test
      - name: Validate canonical recovery review source ordering
        run: python scripts/validate-memory-os-backup-restore-review-source-order.py
      - name: Validate downstream generation evidence authority
        run: python scripts/validate-memory-os-backup-restore-generation-evidence.py
      - name: Validate downstream generation binding authority
        run: python scripts/validate-memory-os-backup-restore-generation-binding.py
      - name: Prove validators are read-only
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
