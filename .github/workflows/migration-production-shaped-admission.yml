name: Migration Production Shaped Admission

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/migration-production-shaped-admission.yml"
      - ".github/workflows/migration-production-shaped-admission-source-negative.yml"
      - "scripts/validate-memory-os-migration-production-shaped-admission-workflow-source-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-permission-negative.py"
      - "contracts/operations/requests/migration-production-shaped-admission-foundation.v1.json"
      - "contracts/operations/migration-production-shaped-admission-contract.v1.json"
      - "contracts/operations/migration-production-shaped-admission-registry.v1.json"
      - "docs/evidence/migration-production-shaped-admission/independent-reviews/**"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/migration-evidence-registry.v1.json"
      - "contracts/operations/migration-evidence-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "scripts/memory_os_migration_production_admission_ledger.py"
      - "scripts/register-memory-os-migration-production-shaped-admission.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py"
      - "scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py"
      - "scripts/reconcile-memory-os-migration-production-shaped-admission.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-migration-rehearsal-evidence.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/migration-production-shaped-admission.yml"
      - ".github/workflows/migration-production-shaped-admission-source-negative.yml"
      - "scripts/validate-memory-os-migration-production-shaped-admission-workflow-source-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-permission-negative.py"
      - "contracts/operations/requests/migration-production-shaped-admission-foundation.v1.json"
      - "contracts/operations/migration-production-shaped-admission-contract.v1.json"
      - "contracts/operations/migration-production-shaped-admission-registry.v1.json"
      - "docs/evidence/migration-production-shaped-admission/independent-reviews/**"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/migration-evidence-registry.v1.json"
      - "contracts/operations/migration-evidence-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "scripts/memory_os_migration_production_admission_ledger.py"
      - "scripts/register-memory-os-migration-production-shaped-admission.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py"
      - "scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py"
      - "scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py"
      - "scripts/reconcile-memory-os-migration-production-shaped-admission.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-migration-rehearsal-evidence.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-production-shaped-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact clean pull request authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-migration-production-shaped-admission-workflow-source-negative.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reconcile and validate production-shaped migration admission read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_migration_production_admission_ledger.py \
            scripts/register-memory-os-migration-production-shaped-admission.py \
            scripts/validate-memory-os-migration-production-shaped-admission.py \
            scripts/validate-memory-os-migration-production-shaped-admission-negative.py \
            scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py \
            scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py \
            scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py \
            scripts/reconcile-memory-os-migration-production-shaped-admission.py \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py \
            scripts/validate-memory-os-migration-evidence-registry.py \
            scripts/validate-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py
          python scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py
          python scripts/validate-memory-os-migration-production-shaped-admission-negative.py
          python scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py
          python scripts/reconcile-memory-os-migration-production-shaped-admission.py
          python scripts/validate-memory-os-migration-lifecycle.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- \
            contracts/operations/migration-production-shaped-admission-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json

  reconcile:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-migration-production-shaped-admission-workflow-source-negative.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reconcile and validate production-shaped migration admission
        id: admission
        run: |
          set +e
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          log=/tmp/migration-production-shaped-admission.log
          : > "$log"
          code=0
          stage=compile
          python -m py_compile \
            scripts/memory_os_migration_production_admission_ledger.py \
            scripts/register-memory-os-migration-production-shaped-admission.py \
            scripts/validate-memory-os-migration-production-shaped-admission.py \
            scripts/validate-memory-os-migration-production-shaped-admission-negative.py \
            scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py \
            scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py \
            scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py \
            scripts/reconcile-memory-os-migration-production-shaped-admission.py \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py \
            scripts/validate-memory-os-migration-evidence-registry.py \
            scripts/validate-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            stage=generation-authority
            python scripts/validate-memory-os-migration-production-shaped-admission-generation-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=ledger-authority
            python scripts/validate-memory-os-migration-production-admission-ledger-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=admission-negative
            python scripts/validate-memory-os-migration-production-shaped-admission-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=rollback
            python scripts/validate-memory-os-migration-production-shaped-admission-reconcile-rollback.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=reconcile
            python scripts/reconcile-memory-os-migration-production-shaped-admission.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=lifecycle
            python scripts/validate-memory-os-migration-lifecycle.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=operability
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" != "0" ]]; then printf "Migration admission failed stage: %s\n" "$stage"; fi
          printf "Migration production-shaped admission exit code: %s (raw validator log suppressed)\n" "$code"
          exit 0
      - name: Commit bounded migration admission authority
        if: steps.admission.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        env:
          SOURCE_COMMIT_SHA: ${{ steps.admission.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_COMMIT_SHA" ]]; then
            echo "source HEAD advanced during validation; refusing stale migration authority write" >&2
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/migration-production-shaped-admission-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/migration-production-shaped-admission-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/migration-production-shaped-admission-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(migration): register production-shaped rehearsal admission"
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.admission.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
          SOURCE_COMMIT_SHA: ${{ steps.admission.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_COMMIT_SHA" ]]; then
            echo "source HEAD advanced during validation; refusing stale migration diagnostic write" >&2
            exit 75
          fi
          python - <<'PY'
          import json, os, stat, tempfile
          from pathlib import Path
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'migration-production-shaped-admission',
              'result': 'FAIL',
              'exitCode': int(os.environ['ADMISSION_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_COMMIT_SHA'],
              'output': 'REDACTED: migration production-shaped admission failed; raw output withheld',
              'containsSecrets': False,
              'admittedRehearsalCount': 0,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/migration-production-shaped-admission-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          if path.is_symlink():
              raise SystemExit('migration production admission diagnostic target must not be a symlink')
          existing_mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else None
          fd, temp_name = tempfile.mkstemp(prefix='.migration-production-shaped-admission-diagnostic.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                  if existing_mode is not None:
                      os.fchmod(handle.fileno(), existing_mode)
                  json.dump(value, handle, indent=2)
                  handle.write('\n')
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_name, path)
          finally:
              try:
                  os.unlink(temp_name)
              except FileNotFoundError:
                  pass
          PY
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_COMMIT_SHA" ]]; then
            echo "source HEAD advanced before diagnostic publication; refusing stale migration diagnostic write" >&2
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/migration-production-shaped-admission-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(migration): record production-shaped admission diagnostic"
            git push origin HEAD:so
          fi
      - name: Enforce validation
        run: test "${{ steps.admission.outputs.exit_code }}" = "0"
