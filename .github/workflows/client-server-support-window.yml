name: Client Server Support Window

on:
  pull_request:
    paths:
      - ".github/workflows/client-server-support-window.yml"
      - "contracts/operations/client-server-support-window-contract.v1.json"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/client-server-skew-registry.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/register-memory-os-client-baseline.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/reconcile-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-server-support-window.py"
      - "scripts/validate-memory-os-client-server-support-window-negative.py"
      - "scripts/reconcile-memory-os-client-server-support-window-status.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/client-server-support-window.yml"
      - "contracts/operations/client-server-support-window-contract.v1.json"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/client-server-skew-registry.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/register-memory-os-client-baseline.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/reconcile-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-server-support-window.py"
      - "scripts/validate-memory-os-client-server-support-window-negative.py"
      - "scripts/reconcile-memory-os-client-server-support-window-status.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-server-support-window-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact client skew authority source
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate fail-closed skew admission
        id: validate
        run: |
          set +e
          log=/tmp/client-server-support-window.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-client-baseline.py \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/reconcile-memory-os-client-baseline-registry.py \
            scripts/validate-memory-os-client-server-support-window.py \
            scripts/validate-memory-os-client-server-support-window-negative.py \
            scripts/reconcile-memory-os-client-server-support-window-status.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-client-server-support-window-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-client-server-support-window.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-client-server-support-window-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Reject auto-healed support-window authority on pull requests
        if: steps.validate.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            contracts/operations/client-server-support-window-contract.v1.json \
            contracts/operations/production-operability-status.json
      - name: Commit bounded foundation authority
        if: steps.validate.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Client skew authority source changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/client-server-support-window-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): register client skew admission foundation"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after client skew validation; refusing to rebase stale authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe failure diagnostic
        if: steps.validate.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Client skew authority source changed after validation; refusing stale failure diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          text = Path('/tmp/client-server-support-window.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'client-server-support-window',
              'result': 'FAIL',
              'sourceCommitSha': os.environ.get('SOURCE_SHA'),
              'exitCode': int(os.environ['VALIDATE_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'clientServerSkewEvidence': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json')
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(compat): record client skew admission diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Branch advanced before client skew diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce validation
        run: test "${{ steps.validate.outputs.exit_code }}" = "0"
