name: Client Server Support Window

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/client-server-support-window.yml"
      - "contracts/operations/client-server-support-window-contract.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/client-server-skew-registry.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "scripts/validate-memory-os-client-server-support-window.py"
      - "scripts/reconcile-memory-os-client-server-support-window-status.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-server-support-window-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fail-closed skew admission
        id: validate
        run: |
          set +e
          log=/tmp/client-server-support-window.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-client-server-support-window.py \
            scripts/reconcile-memory-os-client-server-support-window-status.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-client-server-support-window.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-client-server-support-window-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit bounded foundation authority
        if: steps.validate.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json 2>/dev/null || true
          git add contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): register client skew admission foundation"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Record privacy-safe failure diagnostic
        if: steps.validate.outputs.exit_code != '0'
        env:
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          text = Path('/tmp/client-server-support-window.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'client-server-support-window',
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATE_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'approvedBackendReleaseCount': 0,
              'approvedClientBaselineCount': 0,
              'admissibleSkewPairCount': 0,
              'clientServerSkewEvidence': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json')
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/client-server-support-window-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(compat): record client skew admission diagnostic"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Enforce validation
        run: test "${{ steps.validate.outputs.exit_code }}" = "0"
