name: Deletion Under Load

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/deletion-under-load.yml"
      - "services/import-api/internal/**"
      - "infra/postgresql/security/**"
      - "contracts/operations/deletion-under-load-contract.v1.json"
      - "scripts/validate-memory-os-deletion-under-load.py"
      - "scripts/reconcile-memory-os-deletion-under-load-status.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
  schedule:
    - cron: "17 19 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deletion-under-load-so
  cancel-in-progress: true

jobs:
  deletion-load:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'test(load): record deletion-under-load result') &&
       !contains(github.event.head_commit.message, 'docs(ops): register deletion-under-load evidence') &&
       !contains(github.event.head_commit.message, 'test(load): record deletion-under-load diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture exact source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/so"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Start local MinIO
        run: |
          set -euo pipefail
          image=quay.io/minio/minio:latest
          pulled=false
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              pulled=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$pulled" = true
          docker run -d --name memory-os-deletion-load-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$image" server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' memory-os-deletion-load-minio | grep -qx true; then
              echo "Local MinIO health failed; raw container logs withheld."
              exit 1
            fi
            sleep 1
          done
          echo "Local MinIO health failed; raw container logs withheld."
          exit 1

      - name: Execute and validate deletion load
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_DELETION_UNDER_LOAD: "1"
          MEMORY_OS_DELETION_UNDER_LOAD_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/deletion-under-load-results.sample.v1.json
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set +e
          log=/tmp/memory-os-deletion-under-load.log
          : > "$log"
          trap 'rm -f "$log"' EXIT
          code=0
          echo "STAGE: format-and-compile" >> "$log"
          test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_under_load_test.go)" \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: execute-post-fence-load" >> "$log"
            (
              cd services/import-api
              go test ./internal/httpserver \
                -run '^TestAccountDeletionPostFenceLoadLocalDependencies$' \
                -count=1 -timeout=12m
            ) >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: validate-result" >> "$log"
            python scripts/validate-memory-os-deletion-under-load.py \
              --expected-commit-sha "$SOURCE_SHA" >> "$log" 2>&1 || code=$?
          fi
          echo "DELETION_LOAD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          if [[ "$code" == "0" ]]; then
            mkdir -p /tmp/memory-os-deletion-under-load
            cp docs/fixtures/memory-os-operability/deletion-under-load-results.sample.v1.json \
              /tmp/memory-os-deletion-under-load/result.json
          fi
          exit 0

      - name: Publish exact-source result
        if: env.DELETION_LOAD_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              .github/workflows/deletion-under-load.yml \
              services/import-api/internal \
              infra/postgresql/security \
              contracts/operations/deletion-under-load-contract.v1.json \
              scripts/validate-memory-os-deletion-under-load.py \
              scripts/reconcile-memory-os-deletion-under-load-status.py \
              scripts/validate-memory-os-load.py \
              scripts/validate-memory-os-operability.py; then
              echo "Newer deletion-load-critical source exists; its own run must publish evidence."
              exit 75
            fi
            git reset --hard origin/so
            cp /tmp/memory-os-deletion-under-load/result.json \
              docs/fixtures/memory-os-operability/deletion-under-load-results.sample.v1.json
            rm -f docs/fixtures/memory-os-operability/deletion-under-load-diagnostic.last.json
            git add docs/fixtures/memory-os-operability/deletion-under-load-results.sample.v1.json
            git add -u
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "test(load): record deletion-under-load result"
            if git push origin HEAD:so; then
              published=true
              break
            fi
          done
          test "$published" = true

      - name: Reconcile deletion-load authority
        if: env.DELETION_LOAD_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reconciled=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              .github/workflows/deletion-under-load.yml \
              services/import-api/internal \
              infra/postgresql/security \
              contracts/operations/deletion-under-load-contract.v1.json \
              scripts/validate-memory-os-deletion-under-load.py \
              scripts/reconcile-memory-os-deletion-under-load-status.py \
              scripts/validate-memory-os-load.py \
              scripts/validate-memory-os-operability.py; then
              echo "Newer deletion-load-critical source exists; refusing to reinterpret stale result authority."
              exit 75
            fi
            git reset --hard origin/so
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/validate-memory-os-deletion-under-load.py
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/reconcile-memory-os-deletion-under-load-status.py
            python scripts/validate-memory-os-deletion-under-load.py --require-reconciled
            python scripts/validate-memory-os-load.py
            python scripts/validate-memory-os-operability.py
            git add \
              contracts/operations/deletion-under-load-contract.v1.json \
              contracts/operations/load-test-scenario-contract.v1.json \
              contracts/operations/production-operability-status.json
            if git diff --cached --quiet; then
              reconciled=true
              break
            fi
            git commit -m "docs(ops): register deletion-under-load evidence"
            if git push origin HEAD:so; then
              reconciled=true
              break
            fi
          done
          test "$reconciled" = true

      - name: Record privacy-safe diagnostic
        if: env.DELETION_LOAD_EXIT_CODE != '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced; refusing to replay stale deletion-load diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import re
          import stat
          import tempfile
          from pathlib import Path

          source_sha = os.environ.get("SOURCE_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("invalid deletion-load diagnostic source identity")
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "deletion-under-load",
              "sourceCommitSha": source_sha,
              "result": "FAIL",
              "exitCode": int(os.environ["DELETION_LOAD_EXIT_CODE"]),
              "output": "Deletion-under-load local proof failed; raw validator output withheld.",
              "containsSecrets": False,
              "productionEvidence": False,
              "requestsStartedBeforeFenceCovered": False,
          }
          path = Path("docs/fixtures/memory-os-operability/deletion-under-load-diagnostic.last.json")
          repo = Path.cwd().resolve(strict=True)
          if any(candidate.is_symlink() for candidate in (path, *path.parents)):
              raise SystemExit("unsafe deletion-load diagnostic path")
          if not path.parent.is_dir() or not path.parent.resolve(strict=True).is_relative_to(repo):
              raise SystemExit("unsafe deletion-load diagnostic parent")
          if path.exists() and not path.is_file():
              raise SystemExit("unsafe deletion-load diagnostic target")
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o644
          payload = (json.dumps(value, indent=2) + "\n").encode("utf-8")
          fd, tmp_name = tempfile.mkstemp(dir=path.parent, prefix=f".{path.name}.", suffix=".tmp")
          tmp_path = Path(tmp_name)
          try:
              with os.fdopen(fd, "wb") as handle:
                  os.fchmod(handle.fileno(), mode)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              if path.is_symlink() or (path.exists() and not path.is_file()):
                  raise SystemExit("unsafe deletion-load diagnostic target before replace")
              os.replace(tmp_path, path)
              tmp_path = None
          finally:
              if tmp_path is not None:
                  tmp_path.unlink(missing_ok=True)
          PY
          git add docs/fixtures/memory-os-operability/deletion-under-load-diagnostic.last.json
          if git diff --cached --quiet; then
            echo "Deletion-load diagnostic already recorded; no new evidence."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(load): record deletion-under-load diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced after diagnostic creation; refusing stale push."
            exit 75
          fi
          git push origin HEAD:so

      - name: Enforce checkpoint success
        run: test "${DELETION_LOAD_EXIT_CODE}" = "0"
