name: Rate-Limit Operation Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/rate-limit-operation-evidence.yml"
      - "contracts/operations/rate-limit-operation-evidence-contract.v1.json"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/rate-limit-operations/**"
      - "docs/fixtures/memory-os-operability/rate-limit-operation-record.template.v1.json"
      - "scripts/create-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-writer-negative.py"
      - "scripts/validate-memory-os-rate-limit-operation-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-operation-evidence.yml"
      - "contracts/operations/rate-limit-operation-evidence-contract.v1.json"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/rate-limit-operations/**"
      - "docs/fixtures/memory-os-operability/rate-limit-operation-record.template.v1.json"
      - "scripts/create-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-writer-negative.py"
      - "scripts/validate-memory-os-rate-limit-operation-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-limit-operation-evidence-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  validate-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean source state
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git branch --show-current)" = "so"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile and validate ledger
        run: |
          python -m py_compile \
            scripts/create-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operation-writer-negative.py \
            scripts/validate-memory-os-rate-limit-operation-reconcile-authority-negative.py \
            scripts/reconcile-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operation-writer-negative.py
          python scripts/validate-memory-os-rate-limit-operation-reconcile-authority-negative.py

      - name: Self-prove exclusive writer and duplicate rejection
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          SOURCE_SHA="$SOURCE_SHA" TMP_RECORD="$tmpdir/record.json" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          started = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          expires = started + dt.timedelta(minutes=30)
          checks = [
              "shared_store_atomicity",
              "policy_generation_exact_source",
              "trusted_proxy_boundary",
              "rejected_requests_no_account_session_replay_mutation",
              "rejected_requests_no_upload_apply_memory_mutation",
              "metrics_and_events_present",
              "bounded_canary",
              "temporary_mode_expired",
          ]
          record = {
              "schemaVersion": "memory-os-rate-limit-operation-record.v2",
              "operationId": started.strftime("RLOP-%Y%m%dT%H%M%SZ-ciwriter"),
              "incidentReference": "DRILL-CI_WRITER",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "environment": "CI",
              "operator": "ci_operator",
              "reviewer": "ci_reviewer",
              "previousMode": "NORMAL_CONFIGURED",
              "newMode": "ROUTE_FAIL_CLOSED",
              "proxyMode": "TRUSTED_PROXY_DISABLED",
              "affectedPolicyIds": ["apple-exchange"],
              "startedAt": started.isoformat().replace("+00:00", "Z"),
              "expiresAt": expires.isoformat().replace("+00:00", "Z"),
              "activationReason": "DRILL",
              "lifecycle": "PLANNED",
              "productionConfirmation": None,
              "verificationResults": [
                  {"checkId": check, "result": "NOT_RUN", "evidenceRefs": []}
                  for check in checks
              ],
              "restoredAt": None,
              "openRisks": ["drill_not_executed"],
              "evidenceRefs": [],
              "evidenceDigestsByRef": {},
          }
          Path(os.environ["TMP_RECORD"]).write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python scripts/create-memory-os-rate-limit-operation-evidence.py \
            --input "$tmpdir/record.json" --ledger-dir "$tmpdir/ledger"
          if python scripts/create-memory-os-rate-limit-operation-evidence.py \
            --input "$tmpdir/record.json" --ledger-dir "$tmpdir/ledger"; then
            echo "duplicate operationId was incorrectly accepted" >&2
            exit 1
          fi
          test "$(find "$tmpdir/ledger" -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')" = "1"

      - name: Reconcile ledger foundation
        run: |
          python scripts/reconcile-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git diff --check
          git diff --exit-code -- \
            contracts/operations/rate-limit-operations-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit reconciled authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$source_sha"
          git add \
            contracts/operations/rate-limit-operations-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Rate-limit operation evidence authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(rate-limit): register operation evidence ledger"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Rate-limit operation evidence authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
