name: Backup Restore Generation Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-generation-evidence.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-supersession-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-evidence.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-supersession-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-generation-evidence-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact recovery authority source
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin so
            test "$(git branch --show-current)" = "so"
            test -z "$(git status --porcelain)"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write generation recovery authority manifest
        run: |
          cat > "$RUNNER_TEMP/backup-restore-generation-evidence-authority-paths" <<'EOF'
          .github/workflows/backup-restore-generation-evidence.yml
          contracts/operations/backup-restore-generation-evidence-contract.v1.json
          contracts/operations/backup-restore-generation-evidence-registry.v1.json
          contracts/operations/backup-restore-generation-binding-contract.v1.json
          contracts/operations/backup-restore-drill-request-contract.v1.json
          contracts/operations/backup-restore-drill-request-registry.v1.json
          contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
          contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
          contracts/operations/production-equivalent-environment-generation-contract.v1.json
          contracts/operations/production-equivalent-environment-generation-registry.v1.json
          contracts/operations/recovery-objectives-admission-contract.v1.json
          contracts/operations/recovery-objectives-registry.v1.json
          contracts/operations/production-operability-status.json
          docs/evidence/backup-restore
          docs/evidence/recovery-objectives/approvals
          docs/fixtures/memory-os-operability/backup-restore-generation-evidence
          docs/fixtures/memory-os-operability/recovery-objectives-approval
          scripts/memory_os_backup_restore_blockers.py
          scripts/memory_os_environment_generation_eligibility.py
          scripts/register-memory-os-production-equivalent-environment-generation.py
          scripts/validate-memory-os-production-equivalent-environment-generation.py
          scripts/register-memory-os-recovery-objectives.py
          scripts/validate-memory-os-recovery-objectives.py
          scripts/validate-memory-os-recovery-objectives-negative.py
          scripts/request-memory-os-backup-restore-drill.py
          scripts/validate-memory-os-backup-restore-drill-request.py
          scripts/validate-memory-os-backup-restore-drill-request-negative.py
          scripts/reconcile-memory-os-backup-restore-drill-request.py
          scripts/register-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py
          scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py
          scripts/validate-memory-os-backup-restore-generation-independent-review.py
          scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py
          scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          scripts/validate-memory-os-backup-restore-generation-evidence-negative.py
          scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py
          scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py
          scripts/validate-memory-os-backup-restore-semantic-generation-negative.py
          scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py
          scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py
          scripts/validate-memory-os-backup-restore-generation-supersession-negative.py
          scripts/reconcile-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-binding.py
          scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          scripts/register-memory-os-backup-restore-non-resurrection-evidence.py
          scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          scripts/validate-memory-os-backup-restore-non-resurrection-negative.py
          scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          scripts/reconcile-memory-os-backup-non-resurrection-authority.py
          scripts/validate-memory-os-operability.py
          EOF

      - name: Validate drill-bound generation recovery admission
        id: validation
        run: |
          set +e
          log=/tmp/backup-restore-generation-evidence.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-supersession-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-non-resurrection-authority.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-supersession-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Reject stale generation recovery authority on pull requests
        if: steps.validation.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            contracts/operations/backup-restore-generation-evidence-contract.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            contracts/operations/backup-restore-generation-binding-contract.v1.json \
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json \
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit bounded recovery authority
        if: steps.validation.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-generation-evidence.log

          revalidate_latest_authority() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence-writer-authority-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-non-resurrection-authority.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-supersession-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again during bounded generation recovery retry; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced; regenerating and revalidating generation recovery authority once from latest so."
              revalidate_latest_authority
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-generation-evidence-diagnostic.last.json 2>/dev/null || true
            git add \
              contracts/operations/backup-restore-generation-evidence-contract.v1.json \
              contracts/operations/backup-restore-generation-evidence-registry.v1.json \
              contracts/operations/backup-restore-generation-binding-contract.v1.json \
              contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json \
              contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json \
              contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-generation-evidence-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile drill-bound generation recovery authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again after bounded generation recovery validation; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced after validation; discarding stale commit and retrying from latest so."
              revalidate_latest_authority
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Generation recovery push raced with another writer; retrying once from latest so."
            revalidate_latest_authority
          done
          exit 75

      - name: Record privacy-safe generation recovery diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Repository HEAD changed after generation recovery validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/backup-restore-generation-evidence.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-generation-evidence',
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'drillRequestCreated': False,
              'generationEvidenceCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-generation-evidence-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-generation-evidence-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record generation recovery admission diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Repository HEAD changed before generation recovery diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi

      - name: Enforce generation recovery admission
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
