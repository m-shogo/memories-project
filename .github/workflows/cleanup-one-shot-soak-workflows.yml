name: Cleanup One-Shot Soak Workflows

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/cleanup-one-shot-soak-workflows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-one-shot-soak-workflows-so
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - name: Remove one-shot workflows
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          rm -f \
            .github/workflows/normalize-sustained-soak-gofmt.yml \
            .github/workflows/cleanup-one-shot-soak-workflows.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): remove one-shot soak workflows"
          git pull --rebase origin so
          git push origin HEAD:so
