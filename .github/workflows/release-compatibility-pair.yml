name: Release Compatibility Pair

on:
  pull_request:
    paths:
      - ".github/workflows/release-compatibility-pair.yml"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "contracts/operations/compatibility-admission-gaps.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/release-compatibility-pairs/reviews/**"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-negative.py"
      - "scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py"
      - "scripts/reconcile-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-version-compatibility-execution-evidence.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/release-compatibility-pair.yml"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "contracts/operations/compatibility-admission-gaps.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/release-compatibility-pairs/reviews/**"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-negative.py"
      - "scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py"
      - "scripts/reconcile-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-version-compatibility-execution-evidence.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-compatibility-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact clean PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Validate approved release pair authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-negative.py \
            scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py \
            scripts/reconcile-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-version-compatibility-execution-evidence.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-release-compatibility-pair-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/reconcile-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic pair authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact pair authority source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Validate approved release pair authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-negative.py \
            scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py \
            scripts/reconcile-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-version-compatibility-execution-evidence.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-release-compatibility-pair-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/reconcile-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
          python scripts/validate-memory-os-operability.py

      - name: Commit bounded release-pair authority
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Release pair authority source changed during validation; refusing stale derived authority."
            exit 75
          fi
          git add \
            contracts/operations/release-compatibility-pair-contract.v1.json \
            contracts/operations/version-compatibility-execution-evidence.v1.json \
            contracts/operations/compatibility-admission-gaps.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Release compatibility pair authority is already current."
          else
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): reconcile approved release pair authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after release pair validation; refusing stale authority replay."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Re-read committed pair authority
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-release-compatibility-pair-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-reconcile-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
          python scripts/validate-memory-os-operability.py
