name: Release Compatibility Pair

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/release-compatibility-pair.yml"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "contracts/operations/compatibility-admission-gaps.v1.json"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair.py"
      - "scripts/reconcile-memory-os-release-compatibility-pair.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-compatibility-pair-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate approved release pair authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair.py \
            scripts/reconcile-memory-os-release-compatibility-pair.py
          python scripts/reconcile-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-release-compatibility-pair.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
          python scripts/validate-memory-os-operability.py
      - name: Commit bounded release-pair authority
        run: |
          set -euo pipefail
          git add \
            contracts/operations/release-compatibility-pair-contract.v1.json \
            contracts/operations/version-compatibility-execution-evidence.v1.json \
            contracts/operations/compatibility-admission-gaps.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): reconcile approved release pair authority"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
