      - ".github/workflows/local-logical-restore.yml"
      - ".github/workflows/local-migration-recovery-artifact.yml"
      - ".github/workflows/production-equivalent-environment-generation.yml"
      - ".github/workflows/backup-restore-generation-binding.yml"
      - ".github/workflows/backup-restore-generation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operability-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-operability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validators
        run: |
          python -m py_compile scripts/validate-memory-os-operability.py
          python -m py_compile scripts/validate-memory-os-observability.py
          python -m py_compile scripts/validate-memory-os-observability-access.py
          python -m py_compile scripts/validate-memory-os-rate-limit.py
          python -m py_compile scripts/validate-memory-os-rate-limit-operations.py
          python -m py_compile scripts/validate-memory-os-metrics.py
          python -m py_compile scripts/validate-memory-os-metrics-scrape.py
          python -m py_compile scripts/validate-memory-os-metrics-operations.py
          python -m py_compile scripts/validate-memory-os-metrics-alerting.py
          python -m py_compile scripts/validate-memory-os-local-logical-restore.py
          python -m py_compile scripts/validate-memory-os-local-object-version-restore.py
          python -m py_compile scripts/validate-memory-os-backup-restore.py
          python -m py_compile scripts/validate-memory-os-backup-local-foundations.py
          python -m py_compile scripts/register-memory-os-production-equivalent-environment-generation.py
          python -m py_compile scripts/validate-memory-os-production-equivalent-environment-generation.py
          python -m py_compile scripts/reconcile-memory-os-production-equivalent-generation-status.py
          python -m py_compile scripts/register-memory-os-backup-restore-generation-evidence.py
          python -m py_compile scripts/validate-memory-os-backup-restore-generation-evidence.py
          python -m py_compile scripts/reconcile-memory-os-backup-restore-generation-evidence.py
          python -m py_compile scripts/validate-memory-os-backup-restore-generation-binding.py
          python -m py_compile scripts/validate-memory-os-load.py
          python -m py_compile scripts/validate-memory-os-load-evidence-index.py
          python -m py_compile scripts/validate-memory-os-live-load.py
          python -m py_compile scripts/validate-memory-os-live-object-load.py
          python -m py_compile scripts/reconcile-memory-os-live-load-status.py
          python -m py_compile scripts/validate-memory-os-migration-lifecycle.py
          python -m py_compile scripts/memory_os_migration_recovery_point.py
          python -m py_compile scripts/validate-memory-os-migration-evidence-registry.py
          python -m py_compile scripts/validate-memory-os-local-migration-recovery-artifact.py
          python -m py_compile scripts/validate-memory-os-incident-response.py
          python -m py_compile scripts/validate-memory-os-incident-tabletop.py
          python -m py_compile scripts/validate-memory-os-version-compatibility.py
          python -m py_compile scripts/validate-memory-os-entry-docs.py
          bash -n scripts/regenerate-memory-os-load-results.sh
          bash -n scripts/run-memory-os-local-logical-restore.sh
          bash -n scripts/run-memory-os-local-migration-recovery-artifact.sh

      - name: Validate production operability authority
        run: python scripts/validate-memory-os-operability.py

      - name: Validate migration lifecycle contract and runbook
        run: python scripts/validate-memory-os-migration-lifecycle.py

      - name: Validate migration rehearsal evidence registry
        run: python scripts/validate-memory-os-migration-evidence-registry.py

      - name: Validate local actual migration recovery-artifact contract
        run: python scripts/validate-memory-os-local-migration-recovery-artifact.py

      - name: Validate incident response contract and runbook
        run: python scripts/validate-memory-os-incident-response.py

      - name: Validate incident tabletop plan and evidence
        run: python scripts/validate-memory-os-incident-tabletop.py

      - name: Validate version compatibility policy and matrix
        run: python scripts/validate-memory-os-version-compatibility.py

      - name: Validate observability event contract
        run: python scripts/validate-memory-os-observability.py

      - name: Validate observability retention and access policy
        run: python scripts/validate-memory-os-observability-access.py

      - name: Validate rate-limit policy contract
        run: python scripts/validate-memory-os-rate-limit.py

      - name: Validate rate-limit emergency operations policy
        run: python scripts/validate-memory-os-rate-limit-operations.py

      - name: Validate metrics contract
        run: python scripts/validate-memory-os-metrics.py

      - name: Validate authenticated Prometheus scrape foundation
        run: python scripts/validate-memory-os-metrics-scrape.py

      - name: Validate metrics dashboards retention and error budget
        run: python scripts/validate-memory-os-metrics-operations.py

      - name: Validate metrics alert rules and runbooks
        run: python scripts/validate-memory-os-metrics-alerting.py

      - name: Validate local PostgreSQL logical restore foundation
        run: python scripts/validate-memory-os-local-logical-restore.py

      - name: Validate local exact object-version restore foundation
        run: python scripts/validate-memory-os-local-object-version-restore.py

      - name: Validate canonical backup and restore policy
        run: python scripts/validate-memory-os-backup-restore.py

      - name: Validate completed local backup/restore foundations
        run: python scripts/validate-memory-os-backup-local-foundations.py

      - name: Validate immutable production-equivalent environment generations
        run: python scripts/validate-memory-os-production-equivalent-environment-generation.py

      - name: Validate generation-bound backup/restore binding
        run: python scripts/validate-memory-os-backup-restore-generation-binding.py

      - name: Validate generation-bound backup/restore evidence registry
        run: python scripts/validate-memory-os-backup-restore-generation-evidence.py

      - name: Validate load-test scenario contract and results
        run: python scripts/validate-memory-os-load.py

      - name: Validate mock/live/deferred load evidence partition
        run: python scripts/validate-memory-os-load-evidence-index.py

      - name: Validate current entrypoint documents
        run: python scripts/validate-memory-os-entry-docs.py
