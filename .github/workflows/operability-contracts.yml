      - "scripts/validate-memory-os-backup-local-foundations.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/reconcile-memory-os-production-equivalent-generation-status.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/run-memory-os-local-logical-restore.sh"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-live-load.py"
      - "scripts/validate-memory-os-live-object-load.py"
      - "scripts/reconcile-memory-os-live-load-status.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
      - "scripts/memory_os_migration_recovery_point.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/validate-memory-os-local-migration-recovery-artifact.py"
      - "scripts/run-memory-os-local-migration-recovery-artifact.sh"
      - "scripts/validate-memory-os-incident-response.py"
      - "scripts/validate-memory-os-incident-tabletop.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-entry-docs.py"
      - "scripts/regenerate-memory-os-load-results.sh"
