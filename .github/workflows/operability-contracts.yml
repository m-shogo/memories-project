      - ".github/workflows/production-equivalent-environment-generation.yml"
      - ".github/workflows/backup-restore-generation-binding.yml"
      - ".github/workflows/backup-restore-generation-evidence.yml"
  push:
    branches:
      - so
    paths:
      - "README.md"
      - "SECURITY.md"
      - "services/import-api/README.md"
      - "contracts/operations/**"
      - "infra/observability/**"
      - "docs/evidence/migrations/recovery/**"
      - "docs/runbooks/memory-os-migration-recovery.md"
      - "docs/runbooks/memory-os-incident-response.md"
      - "docs/runbooks/memory-os-version-compatibility.md"
