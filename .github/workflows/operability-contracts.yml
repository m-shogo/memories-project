      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-metrics.py"
      - "scripts/validate-memory-os-metrics-scrape.py"
      - "scripts/validate-memory-os-metrics-operations.py"
      - "scripts/validate-memory-os-metrics-alerting.py"
      - "scripts/validate-memory-os-local-logical-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
