      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/register-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-promotion-review.py"
      - ".github/workflows/backup-restore-generation-binding.yml"
      - ".github/workflows/backup-restore-drill-request.yml"
      - ".github/workflows/backup-restore-drill-preflight.yml"
      - ".github/workflows/backup-restore-preflight-generation-eligibility-consistency.yml"
      - ".github/workflows/backup-restore-promotion-review.yml"
      - ".github/workflows/operability-admission-request-authority.yml"
  pull_request:
    paths:
      - "contracts/operations/requests/operability-admission-inventory.v1.json"
      - "contracts/operations/operability-admission-inventory.v1.json"
      - "contracts/operations/migration-production-shaped-admission-registry.v1.json"
      - "scripts/register-memory-os-migration-production-shaped-admission.py"
      - "docs/evidence/incident-tabletops/*.json"
      - "scripts/validate-memory-os-incident-human-tabletops.py"
      - "contracts/operations/incident-contact-routing-admission-registry.v1.json"
      - "scripts/register-memory-os-incident-contact-routing.py"
      - "contracts/operations/observability-stack-deployment-registry.v1.json"
      - "scripts/register-memory-os-observability-stack-deployment.py"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime.py"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "scripts/validate-memory-os-load.py"
      - "contracts/operations/sustained-soak-independent-review-registry.v1.json"
      - "scripts/register-memory-os-sustained-soak-independent-review.py"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-admission-chain-contract.v1.json"
      - "contracts/operations/backup-restore-promotion-review-contract.v1.json"
      - "contracts/operations/backup-restore-promotion-review-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "scripts/register-memory-os-release-baseline.py"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "scripts/register-memory-os-client-baseline.py"
      - "contracts/operations/parser-artifact-registry.v1.json"
      - "scripts/register-memory-os-parser-artifact.py"
      - "contracts/operations/production-shaped-failure-drill-registry.v1.json"
      - "scripts/register-memory-os-production-shaped-failure-drill.py"
      - "contracts/operations/production-operability-status.json"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory-source-authorities.py"
      - "scripts/validate-memory-os-operability-admission-inventory-registry-negative.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/register-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-promotion-review.py"
      - ".github/workflows/backup-restore-generation-binding.yml"
      - ".github/workflows/backup-restore-drill-request.yml"
      - ".github/workflows/backup-restore-drill-preflight.yml"
      - ".github/workflows/backup-restore-preflight-generation-eligibility-consistency.yml"
      - ".github/workflows/backup-restore-promotion-review.yml"
      - ".github/workflows/operability-admission-request-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate deterministic inventory
        run: |
          python scripts/validate-memory-os-operability-admission-inventory-registry-negative.py
          python scripts/generate-memory-os-operability-admission-inventory.py
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --exit-code -- contracts/operations/operability-admission-inventory.v1.json
          fi
          python scripts/validate-memory-os-operability-admission-inventory.py
      - name: Validate restore planning and preflight authorities
        run: |
          python scripts/validate-memory-os-backup-restore-drill-request.py
          python scripts/validate-memory-os-backup-restore-drill-preflight.py
          python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py
          python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py
      - name: Validate backup/restore admission chain negatives
        run: |
          python scripts/validate-memory-os-backup-restore-admission-chain-negative.py
          python scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py
      - name: Validate human promotion review separation
        run: |
          python scripts/validate-memory-os-backup-restore-promotion-review.py
          python scripts/validate-memory-os-backup-restore-promotion-review-negative.py
      - name: Validate request and promotion separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              value = json.loads(Path(path).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"root must be object: {path}")
              return value

          request = load("contracts/operations/requests/operability-admission-inventory.v1.json")
          inventory = load("contracts/operations/operability-admission-inventory.v1.json")
          binding = load("contracts/operations/backup-restore-generation-binding-contract.v1.json")
          recovery = load("contracts/operations/backup-restore-generation-evidence-registry.v1.json")
          preflight = load("contracts/operations/backup-restore-drill-preflight-contract.v1.json")
          generations = load("contracts/operations/production-equivalent-environment-generation-registry.v1.json")
          status = load("contracts/operations/production-operability-status.json")

          constraints = request.get("constraints")
          if not isinstance(constraints, dict):
              raise SystemExit("operability inventory request constraints missing")
          required_true = (
              "deterministicOutputRequired",
              "canonicalRegistryCountsOnly",
              "foundationImplementationMustNotEqualProductionEvidence",
              "productionDecisionMustRemainNoGo",
              "registeredGenerationCountMustRemainDistinctFromSemanticPreflightEligibility",
              "recoveryCandidateRequiresIndependentEvidenceReview",
              "recoveryCandidateMustNotImplyHumanProductionPromotionReview",
              "recoveryCandidateMustNotAuthorizeProductionPromotion",
              "humanProductionPromotionAuthorityMustRemainSeparate",
          )
          for field in required_true:
              if constraints.get(field) is not True:
                  raise SystemExit(f"request constraint must remain true: {field}")

          required_binding_foundation = (
              "contracts/operations/backup-restore-generation-binding-contract.v1.json",
              "scripts/validate-memory-os-backup-restore-generation-binding.py",
              "scripts/validate-memory-os-backup-restore-generation-binding-negative.py",
              ".github/workflows/backup-restore-generation-binding.yml",
          )
          for path in required_binding_foundation:
              if not Path(path).is_file():
                  raise SystemExit(f"OPS-P0-007 generation-binding foundation missing: {path}")

          preflight_state = preflight.get("currentState")
          if not isinstance(preflight_state, dict):
              raise SystemExit("restore preflight currentState missing")
          registered_count = generations.get("registeredGenerationCount")
          state_registered_count = preflight_state.get("registeredGenerationCount")
          semantic_eligible_count = preflight_state.get("preflightEligibleGenerationCount")
          unsuperseded_count = preflight_state.get("unsupersededGenerationCount")
          unsuperseded_semantic_count = preflight_state.get("unsupersededPreflightEligibleGenerationCount")
          eligible_pair_count = preflight_state.get("eligibleDirectedSourceTargetPairCount")
          for value, field in (
              (registered_count, "registered generation"),
              (state_registered_count, "preflight registered generation"),
              (semantic_eligible_count, "semantic preflight-eligible generation"),
              (unsuperseded_count, "unsuperseded generation"),
              (unsuperseded_semantic_count, "unsuperseded semantic preflight-eligible generation"),
              (eligible_pair_count, "eligible directed restore pair"),
          ):
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit(f"{field} count invalid")
          if state_registered_count != registered_count:
              raise SystemExit("preflight registered generation count drift")
          if semantic_eligible_count > registered_count:
              raise SystemExit("semantic preflight eligibility cannot exceed registered generations")
          if unsuperseded_count > registered_count:
              raise SystemExit("unsuperseded generation count cannot exceed registered generations")
          if unsuperseded_semantic_count > semantic_eligible_count or unsuperseded_semantic_count > unsuperseded_count:
              raise SystemExit("unsuperseded semantic eligibility count drift")
          if unsuperseded_semantic_count < 2 and eligible_pair_count != 0:
              raise SystemExit("eligible restore pair requires at least two unsuperseded semantically eligible generations")
          if registered_count == 0 and any((semantic_eligible_count, unsuperseded_count, unsuperseded_semantic_count, eligible_pair_count)):
              raise SystemExit("empty generation registry cannot create semantic eligibility")
          if inventory.get("productionEquivalentEnvironmentGenerationCount") != registered_count:
              raise SystemExit("inventory registered generation count drift")
          if inventory.get("backupRestoreUnsupersededEnvironmentGenerationCount") != unsuperseded_count:
              raise SystemExit("inventory unsuperseded generation count drift")
          if inventory.get("backupRestoreEligibleDirectedPairCount") != eligible_pair_count:
              raise SystemExit("inventory eligible restore pair count drift")

          rules = binding.get("promotionRules")
          boundary = binding.get("currentBoundary")
          if not isinstance(rules, dict) or not isinstance(boundary, dict):
              raise SystemExit("generation binding promotion authority missing")
          if rules.get("independentReviewRequired") is not True:
              raise SystemExit("recovery candidate must require independent evidence review")
          if rules.get("recoveryCandidateAutomaticallyCompletesHumanProductionPromotionReview") is not False:
              raise SystemExit("recovery candidate cannot complete human promotion review")
          if rules.get("recoveryCandidateAutomaticallyAuthorizesProductionPromotion") is not False:
              raise SystemExit("recovery candidate cannot authorize production promotion")
          if rules.get("humanProductionPromotionReviewRemainsSeparate") is not True:
              raise SystemExit("human production promotion review must remain separate")
          if boundary.get("humanProductionPromotionReviewCompleted") is not False:
              raise SystemExit("human production promotion review must remain unclaimed")
          if boundary.get("humanProductionPromotionAuthorized") is not False:
              raise SystemExit("human production promotion authorization must remain unclaimed")
          if boundary.get("productionDecision") != "NO_GO":
              raise SystemExit("generation binding production decision must remain NO_GO")

          candidate_count = recovery.get("productionEquivalentRecoveryCandidateCount")
          if not isinstance(candidate_count, int) or isinstance(candidate_count, bool) or candidate_count < 0:
              raise SystemExit("recovery candidate count invalid")
          if boundary.get("productionEquivalentRecoveryCandidateCount") != candidate_count:
              raise SystemExit("candidate count drift between recovery registry and binding authority")
          expected_independent_review = candidate_count > 0
          if boundary.get("independentReviewCompleted") is not expected_independent_review:
              raise SystemExit("candidate-level independent evidence review state drift")

          areas = inventory.get("areas")
          if not isinstance(areas, list):
              raise SystemExit("operability inventory areas missing")
          backup_inventory_rows = [row for row in areas if isinstance(row, dict) and row.get("id") == "OPS-P0-007"]
          if len(backup_inventory_rows) != 1:
              raise SystemExit("OPS-P0-007 inventory row missing or duplicated")
          backup_inventory = backup_inventory_rows[0]
          if backup_inventory.get("secondaryAuthority") != "contracts/operations/backup-restore-generation-binding-contract.v1.json":
              raise SystemExit("OPS-P0-007 generation-binding secondary authority drift")
          if backup_inventory.get("foundationImplemented") is not True:
              raise SystemExit("OPS-P0-007 inventory foundation must remain implemented")
          dependencies = backup_inventory.get("dependencyCounts")
          if not isinstance(dependencies, dict):
              raise SystemExit("OPS-P0-007 inventory dependencyCounts missing")
          if dependencies.get("environmentGenerations") != registered_count:
              raise SystemExit("OPS-P0-007 inventory registered generation count drift")
          if dependencies.get("unsupersededEnvironmentGenerations") != unsuperseded_count:
              raise SystemExit("OPS-P0-007 inventory unsuperseded generation count drift")
          if dependencies.get("eligibleDirectedRestorePairs") != eligible_pair_count:
              raise SystemExit("OPS-P0-007 inventory eligible restore pair count drift")
          if dependencies.get("productionEquivalentRecoveryCandidates") != candidate_count:
              raise SystemExit("OPS-P0-007 inventory recovery candidate count drift")
          if backup_inventory.get("productionEvidence") is not False or backup_inventory.get("productionReady") is not False:
              raise SystemExit("OPS-P0-007 inventory cannot claim production evidence/readiness")

          if inventory.get("productionEvidence") is not False or inventory.get("productionReady") is not False:
              raise SystemExit("operability inventory cannot claim production evidence/readiness")
          if inventory.get("productionDecision") != "NO_GO":
              raise SystemExit("operability inventory production decision must remain NO_GO")
          if status.get("productionDecision") != "NO_GO":
              raise SystemExit("production operability status must remain NO_GO")
          rows = status.get("areas")
          if not isinstance(rows, list):
              raise SystemExit("production operability status areas missing")
          backup_rows = [row for row in rows if isinstance(row, dict) and row.get("id") == "OPS-P0-007"]
          if len(backup_rows) != 1 or backup_rows[0].get("blocking") is not True:
              raise SystemExit("OPS-P0-007 must remain a canonical blocker")

          print("Memory OS operability admission request authority PASS")
          print(f"registered/semantic-preflight-eligible generations: {registered_count}/{semantic_eligible_count}")
          print(f"unsuperseded/semantic-unsuperseded generations: {unsuperseded_count}/{unsuperseded_semantic_count}")
          print(f"production-equivalent recovery candidates: {candidate_count}")
          print(f"candidate-level independent evidence review completed: {str(expected_independent_review).lower()}")
          print("generation-binding foundation complete: true")
          print("candidate implies human promotion review: false")
          print("candidate authorizes production promotion: false")
          print("human promotion authority remains separate: true")
          print("production decision: NO_GO")
          PY
