name: Production Equivalent Environment Generation

on:
  pull_request:
    paths:
      - ".github/workflows/production-equivalent-environment-generation.yml"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-authority-path-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-append-rollback-negative.py"
      - "scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py"
      - "scripts/reconcile-memory-os-production-equivalent-generation-status.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-generation.yml"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-authority-path-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-append-rollback-negative.py"
      - "scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py"
      - "scripts/reconcile-memory-os-production-equivalent-generation-status.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-equivalent-environment-generation-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact generation authority source
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin so
            test "$(git branch --show-current)" = "so"
            test -z "$(git status --porcelain)"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate immutable semantic generation binding
        id: validation
        run: |
          set +e
          log=/tmp/production-equivalent-environment-generation.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-environment-generation-eligibility-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-authority-path-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-append-rollback-negative.py \
            scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py \
            scripts/reconcile-memory-os-production-equivalent-generation-status.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-production-equivalent-generation-status.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-environment-generation-eligibility-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation-authority-path-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation-append-rollback-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded generation authority
        if: steps.validation.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          # Generation rows bind repository-contained environment records whose
          # paths are data, not a closed workflow allowlist. Require the entire
          # branch to remain the exact validated source before any derived write.
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced after generation validation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/production-equivalent-environment-generation-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/production-equivalent-environment-generation-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/production-equivalent-environment-generation-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(load): reconcile environment generation authority"
            for attempt in 1 2 3 4; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "so advanced after generation validation; refusing stale derived authority."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Record privacy-safe generation diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced after failed generation validation; refusing stale environment generation diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/production-equivalent-environment-generation.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'production-equivalent-environment-generation',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'generationCreated': False,
              'preflightEligibilityFabricated': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-equivalent-environment-generation-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/production-equivalent-environment-generation-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record environment generation admission diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "so advanced after generation diagnostic capture; refusing stale environment generation diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce environment generation admission
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
