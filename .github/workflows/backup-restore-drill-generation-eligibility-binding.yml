name: Backup Restore Drill Generation Eligibility Binding

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-drill-generation-eligibility-binding.yml"
      - "contracts/operations/backup-restore-drill-generation-eligibility-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py"
      - "scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-drill-generation-eligibility-binding.yml"
      - "contracts/operations/backup-restore-drill-generation-eligibility-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py"
      - "scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-drill-generation-eligibility-binding-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate semantic generation binding read-only
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py \
            scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py
          python scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py
          python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py
          python scripts/validate-memory-os-operability.py
          git diff --exit-code -- contracts/operations/backup-restore-drill-generation-eligibility-binding-contract.v1.json

  validate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact semantic binding authority source
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "SOURCE_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate semantic generation binding
        id: validation
        run: |
          set +e
          log=/tmp/backup-restore-drill-generation-eligibility-binding.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py \
            scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Reject stale semantic binding on pull requests
        if: steps.validation.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/operations/backup-restore-drill-generation-eligibility-binding-contract.v1.json
      - name: Commit bounded semantic binding authority
        if: steps.validation.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-drill-generation-eligibility-binding.log

          revalidate_latest_semantic_binding() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding-reconcile-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-drill-generation-eligibility-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-generation-eligibility-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Semantic binding authority HEAD changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Semantic binding authority advanced; regenerating and revalidating once from latest so."
              revalidate_latest_semantic_binding
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-drill-generation-eligibility-binding-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/backup-restore-drill-generation-eligibility-binding-contract.v1.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-drill-generation-eligibility-binding-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile drill generation eligibility binding"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Semantic binding authority HEAD changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Semantic binding authority advanced after validation; discarding stale semantic binding commit and retrying from latest so."
              revalidate_latest_semantic_binding
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Semantic binding push raced with another writer; retrying once from latest so."
            revalidate_latest_semantic_binding
          done
          exit 75
      - name: Record privacy-safe semantic binding diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Semantic binding authority HEAD changed after validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/backup-restore-drill-generation-eligibility-binding.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-drill-generation-eligibility-binding',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'requestCreated': False,
              'generationCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-drill-generation-eligibility-binding-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          temp_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  mode='w',
                  encoding='utf-8',
                  dir=path.parent,
                  prefix=f'.{path.name}.',
                  suffix='.tmp',
                  delete=False,
              ) as handle:
                  temp_path = Path(handle.name)
                  json.dump(value, handle, indent=2)
                  handle.write('\n')
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_path, path)
              temp_path = None
          finally:
              if temp_path is not None and temp_path.exists():
                  temp_path.unlink()
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-drill-generation-eligibility-binding-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record drill generation eligibility binding diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Semantic binding authority HEAD changed before diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce semantic generation binding
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
