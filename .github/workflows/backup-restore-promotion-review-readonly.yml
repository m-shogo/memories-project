name: Backup Restore Promotion Review Readonly

on:
  push:
    branches: [so]
    paths:
      - '.github/workflows/backup-restore-promotion-review-readonly.yml'
      - '.github/workflows/backup-restore-promotion-review.yml'
      - '.github/workflows/backup-restore-promotion-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-negative.py'
      - 'scripts/register-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py'
      - 'scripts/reconcile-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-readonly-workflow-negative.py'
      - 'contracts/operations/backup-restore-promotion-review-contract.v1.json'
      - 'contracts/operations/backup-restore-promotion-review-registry.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'contracts/operations/backup-restore-drill-request-contract.v1.json'
      - 'contracts/operations/backup-restore-drill-request-registry.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json'
      - 'contracts/operations/production-equivalent-environment-generation-registry.v1.json'
      - 'contracts/operations/recovery-objectives-registry.v1.json'
      - 'contracts/operations/operability-admission-inventory.v1.json'
      - 'contracts/operations/production-operability-status.json'
  pull_request:
    branches: [so]
    paths:
      - '.github/workflows/backup-restore-promotion-review-readonly.yml'
      - '.github/workflows/backup-restore-promotion-review.yml'
      - '.github/workflows/backup-restore-promotion-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-negative.py'
      - 'scripts/register-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py'
      - 'scripts/reconcile-memory-os-backup-restore-promotion-review.py'
      - 'scripts/validate-memory-os-backup-restore-promotion-review-readonly-workflow-negative.py'
      - 'contracts/operations/backup-restore-promotion-review-contract.v1.json'
      - 'contracts/operations/backup-restore-promotion-review-registry.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'contracts/operations/backup-restore-drill-request-contract.v1.json'
      - 'contracts/operations/backup-restore-drill-request-registry.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json'
      - 'contracts/operations/production-equivalent-environment-generation-registry.v1.json'
      - 'contracts/operations/recovery-objectives-registry.v1.json'
      - 'contracts/operations/operability-admission-inventory.v1.json'
      - 'contracts/operations/production-operability-status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert exact clean promotion-review source
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${PR_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed promotion-review readonly event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Snapshot canonical promotion-review authorities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [
              'contracts/operations/backup-restore-promotion-review-contract.v1.json',
              'contracts/operations/backup-restore-promotion-review-registry.v1.json',
              'contracts/operations/backup-restore-generation-evidence-contract.v1.json',
              'contracts/operations/backup-restore-generation-evidence-registry.v1.json',
              'contracts/operations/backup-restore-drill-request-contract.v1.json',
              'contracts/operations/backup-restore-drill-request-registry.v1.json',
              'contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json',
              'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json',
              'contracts/operations/production-equivalent-environment-generation-registry.v1.json',
              'contracts/operations/recovery-objectives-registry.v1.json',
              'contracts/operations/operability-admission-inventory.v1.json',
              'contracts/operations/production-operability-status.json',
          ]
          snapshot = {}
          for raw in paths:
              path = Path(raw)
              data = path.read_bytes()
              snapshot[raw] = {
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'mode': path.stat().st_mode & 0o777,
              }
          Path('/tmp/backup-restore-promotion-review-authorities.json').write_text(
              json.dumps(snapshot, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Exercise promotion-review validators read-only
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-promotion-review-readonly-workflow-negative.py
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-promotion-review-source-order.py \
            scripts/validate-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review-negative.py \
            scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore-promotion-review.py
          python scripts/validate-memory-os-backup-restore-promotion-review-source-order.py --self-test
          python scripts/validate-memory-os-backup-restore-promotion-review-source-order.py
          python scripts/validate-memory-os-backup-restore-promotion-review.py
          python scripts/validate-memory-os-backup-restore-promotion-review-negative.py
          python scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py
      - name: Prove canonical bytes and permission modes are immutable
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path('/tmp/backup-restore-promotion-review-authorities.json').read_text(encoding='utf-8'))
          failures = []
          for raw, expected in before.items():
              path = Path(raw)
              if not path.is_file():
                  failures.append(f'{raw}: missing after validation')
                  continue
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              actual_mode = path.stat().st_mode & 0o777
              if actual_hash != expected['sha256']:
                  failures.append(f'{raw}: bytes changed')
              if actual_mode != expected['mode']:
                  failures.append(f'{raw}: mode changed {expected["mode"]:04o}->{actual_mode:04o}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
