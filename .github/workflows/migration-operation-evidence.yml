name: Migration Operation Evidence

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/migration-operation-evidence.yml"
      - ".github/workflows/migration-operation-evidence-source-negative.yml"
      - "scripts/validate-memory-os-migration-operation-evidence-workflow-source-negative.py"
      - "contracts/operations/migration-operation-evidence-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/migration_operation_evidence_lib.py"
      - "scripts/create-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-operation-library-authority-negative.py"
      - "scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/evidence/migration-operations/**"
      - "docs/fixtures/memory-os-operability/migration-operation-record.template.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/migration-operation-evidence.yml"
      - ".github/workflows/migration-operation-evidence-source-negative.yml"
      - "scripts/validate-memory-os-migration-operation-evidence-workflow-source-negative.py"
      - "contracts/operations/migration-operation-evidence-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/migration_operation_evidence_lib.py"
      - "scripts/create-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-operation-library-authority-negative.py"
      - "scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-migration-operation-evidence.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/evidence/migration-operations/**"
      - "docs/fixtures/memory-os-operability/migration-operation-record.template.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-operation-evidence-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact clean PR source
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="${{ github.event.pull_request.head.sha }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-migration-operation-evidence-workflow-source-negative.py

      - name: Compile evidence tooling
        run: |
          python -m py_compile \
            scripts/migration_operation_evidence_lib.py \
            scripts/create-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-operation-library-authority-negative.py \
            scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py \
            scripts/reconcile-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            scripts/validate-memory-os-operability.py

      - name: Reconcile authority read-only
        run: |
          python scripts/validate-memory-os-migration-operation-library-authority-negative.py
          python scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py
          python scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py
          python scripts/reconcile-memory-os-migration-operation-evidence.py
          python scripts/reconcile-memory-os-migration-operation-evidence.py --check

      - name: Prove exclusive-create append-only behavior
        run: |
          ledger="$(mktemp -d)"
          record="docs/fixtures/memory-os-operability/migration-operation-record.template.v1.json"
          python scripts/create-memory-os-migration-operation-evidence.py \
            "$record" --ledger-dir "$ledger"
          test "$(find "$ledger" -type f -name 'mgr_*.json' | wc -l | tr -d ' ')" = "1"
          if python scripts/create-memory-os-migration-operation-evidence.py \
            "$record" --ledger-dir "$ledger"; then
            echo "duplicate migrationRunId unexpectedly overwrote evidence" >&2
            exit 1
          fi
          test "$(find "$ledger" -type f -name 'mgr_*.json' | wc -l | tr -d ' ')" = "1"

      - name: Validate ledger and authority
        run: |
          python scripts/validate-memory-os-migration-operation-evidence.py
          python scripts/validate-memory-os-migration-lifecycle.py
          python scripts/validate-memory-os-operability.py

      - name: Require whole-worktree deterministic authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture exact migration operation source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          expected="${{ github.sha }}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
          python scripts/validate-memory-os-migration-operation-evidence-workflow-source-negative.py

      - name: Compile evidence tooling
        run: |
          python -m py_compile \
            scripts/migration_operation_evidence_lib.py \
            scripts/create-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-operation-library-authority-negative.py \
            scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py \
            scripts/reconcile-memory-os-migration-operation-evidence.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            scripts/validate-memory-os-operability.py

      - name: Reconcile authority in working tree
        run: |
          python scripts/validate-memory-os-migration-operation-library-authority-negative.py
          python scripts/validate-memory-os-migration-operation-evidence-reconcile-negative.py
          python scripts/validate-memory-os-migration-operation-reconcile-authority-negative.py
          python scripts/reconcile-memory-os-migration-operation-evidence.py
          python scripts/reconcile-memory-os-migration-operation-evidence.py --check

      - name: Prove exclusive-create append-only behavior
        run: |
          ledger="$(mktemp -d)"
          record="docs/fixtures/memory-os-operability/migration-operation-record.template.v1.json"
          python scripts/create-memory-os-migration-operation-evidence.py \
            "$record" --ledger-dir "$ledger"
          test "$(find "$ledger" -type f -name 'mgr_*.json' | wc -l | tr -d ' ')" = "1"
          if python scripts/create-memory-os-migration-operation-evidence.py \
            "$record" --ledger-dir "$ledger"; then
            echo "duplicate migrationRunId unexpectedly overwrote evidence" >&2
            exit 1
          fi
          test "$(find "$ledger" -type f -name 'mgr_*.json' | wc -l | tr -d ' ')" = "1"

      - name: Validate ledger and authority
        run: |
          python scripts/validate-memory-os-migration-operation-evidence.py
          python scripts/validate-memory-os-migration-lifecycle.py
          python scripts/validate-memory-os-operability.py

      - name: Commit reconciled authority on so
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Migration operation authority source changed after validation; refusing stale derived authority."
            exit 75
          fi
          git add \
            contracts/operations/migration-operation-evidence-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Migration operation evidence authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(migration): register append-only operation evidence"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after migration operation validation; refusing stale authority."
            exit 75
          fi
          git push origin HEAD:so
