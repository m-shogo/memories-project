name: Reconcile Controlled Saturation Repeatability Authority

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-controlled-saturation-repeatability-authority.yml"
      - "contracts/operations/controlled-saturation-ramp-contract.v1.json"
      - "contracts/operations/controlled-saturation-repeatability-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-repeatability-results.v1.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.repeat-*.v1.json"
      - "scripts/validate-memory-os-controlled-saturation-ramp.py"
      - "scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py"
      - "scripts/reconcile-memory-os-controlled-saturation-ramp-status.py"
      - "scripts/validate-memory-os-controlled-saturation-repeatability.py"
      - "scripts/validate-memory-os-controlled-saturation-repeatability-reconcile-negative.py"
      - "scripts/run-memory-os-controlled-saturation-repeatability-disposable.py"
      - "scripts/reconcile-memory-os-controlled-saturation-repeatability.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-operability.py"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-controlled-saturation-repeatability-authority.yml"
      - "contracts/operations/controlled-saturation-ramp-contract.v1.json"
      - "contracts/operations/controlled-saturation-repeatability-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-repeatability-results.v1.json"
      - "docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.repeat-*.v1.json"
      - "scripts/validate-memory-os-controlled-saturation-ramp.py"
      - "scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py"
      - "scripts/reconcile-memory-os-controlled-saturation-ramp-status.py"
      - "scripts/validate-memory-os-controlled-saturation-repeatability.py"
      - "scripts/validate-memory-os-controlled-saturation-repeatability-reconcile-negative.py"
      - "scripts/run-memory-os-controlled-saturation-repeatability-disposable.py"
      - "scripts/reconcile-memory-os-controlled-saturation-repeatability.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-controlled-saturation-repeatability-authority-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Revalidate repeatability authority read-only
        id: authority
        run: |
          set +e
          log=/tmp/memory-os-controlled-saturation-repeatability-authority.log
          trap 'rm -f "$log"' EXIT
          : > "$log"
          code=0
          stage=compile
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-controlled-saturation-ramp.py \
            scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py \
            scripts/reconcile-memory-os-controlled-saturation-ramp-status.py \
            scripts/validate-memory-os-controlled-saturation-repeatability.py \
            scripts/validate-memory-os-controlled-saturation-repeatability-reconcile-negative.py \
            scripts/run-memory-os-controlled-saturation-repeatability-disposable.py \
            scripts/reconcile-memory-os-controlled-saturation-repeatability.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            stage=controlled-ramp-authority-negative
            echo "STAGE: controlled-ramp-authority-negative" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=repeatability-validation
            echo "STAGE: repeatability-validation" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-repeatability.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=reconcile-negative
            echo "STAGE: reconcile-negative" >> "$log"
            python scripts/run-memory-os-controlled-saturation-repeatability-disposable.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=authority-reconcile
            echo "STAGE: authority-reconcile" >> "$log"
            python scripts/run-memory-os-controlled-saturation-repeatability-disposable.py --reconcile-only >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=combined-validation
            echo "STAGE: combined-validation" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-repeatability.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-load.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Repeatability authority stage=$stage exit=$code; raw validator output withheld."
          exit 0
      - name: Reject any PR worktree drift
        if: steps.authority.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Enforce repeatability authority
        run: test "${{ steps.authority.outputs.exit_code }}" = "0"

  reconcile:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' ||
       (!contains(github.event.head_commit.message, 'docs(load): reconcile saturation repeatability authority') &&
        !contains(github.event.head_commit.message, 'test(load): record saturation repeatability authority diagnostic')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$(git rev-parse HEAD)"
          fi
      - name: Revalidate existing repeatability authority
        id: authority
        run: |
          set +e
          log=/tmp/memory-os-controlled-saturation-repeatability-authority.log
          trap 'rm -f "$log"' EXIT
          : > "$log"
          code=0
          stage=compile
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-controlled-saturation-ramp.py \
            scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py \
            scripts/reconcile-memory-os-controlled-saturation-ramp-status.py \
            scripts/validate-memory-os-controlled-saturation-repeatability.py \
            scripts/validate-memory-os-controlled-saturation-repeatability-reconcile-negative.py \
            scripts/run-memory-os-controlled-saturation-repeatability-disposable.py \
            scripts/reconcile-memory-os-controlled-saturation-repeatability.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            stage=controlled-ramp-authority-negative
            echo "STAGE: controlled-ramp-authority-negative" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-ramp-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=repeatability-validation
            echo "STAGE: repeatability-validation" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-repeatability.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=reconcile-negative
            echo "STAGE: reconcile-negative" >> "$log"
            python scripts/run-memory-os-controlled-saturation-repeatability-disposable.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=authority-reconcile
            echo "STAGE: authority-reconcile" >> "$log"
            python scripts/reconcile-memory-os-controlled-saturation-repeatability.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=combined-validation
            echo "STAGE: combined-validation" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-repeatability.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-load.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Repeatability authority stage=$stage exit=$code; raw validator output withheld."
          exit 0
      - name: Commit reconciled repeatability authority
        if: github.event_name == 'push' && steps.authority.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/controlled-saturation-repeatability-authority-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/controlled-saturation-repeatability-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/controlled-saturation-repeatability-authority-diagnostic.last.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Controlled saturation repeatability authority already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(load): reconcile saturation repeatability authority"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced during repeatability reconciliation; refusing stale derived authority."
            exit 75
          fi
          git push origin HEAD:so
      - name: Record privacy-safe repeatability diagnostic
        if: github.event_name == 'push' && steps.authority.outputs.exit_code != '0'
        env:
          AUTHORITY_EXIT_CODE: ${{ steps.authority.outputs.exit_code }}
          FAILURE_STAGE: ${{ steps.authority.outputs.failure_stage }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after repeatability validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, re, stat, tempfile
          from pathlib import Path
          source_sha = os.environ['SOURCE_SHA']
          if re.fullmatch(r'[0-9a-f]{40}', source_sha) is None:
              raise SystemExit('invalid repeatability source SHA')
          stage = os.environ.get('FAILURE_STAGE', 'unknown')
          if stage not in {'compile', 'controlled-ramp-authority-negative', 'repeatability-validation', 'reconcile-negative', 'authority-reconcile', 'combined-validation'}:
              stage = 'unknown'
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'reconcile-controlled-saturation-repeatability-authority',
              'sourceCommitSha': source_sha,
              'failureStage': stage,
              'result': 'FAIL',
              'exitCode': int(os.environ['AUTHORITY_EXIT_CODE']),
              'output': 'Repeatability authority validation failed; raw validator output withheld.',
              'containsSecrets': False,
              'capacityBoundaryEstablished': False,
              'operationalThresholdApproved': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/controlled-saturation-repeatability-authority-diagnostic.last.json')
          repo = Path.cwd().resolve(strict=True)
          if not path.parent.is_dir() or path.is_dir():
              raise SystemExit('unsafe repeatability diagnostic target')
          for candidate in (path, *path.parents):
              if candidate.is_symlink():
                  raise SystemExit('repeatability diagnostic symlink rejected')
          try:
              path.parent.resolve(strict=True).relative_to(repo)
          except ValueError:
              raise SystemExit('repeatability diagnostic path escaped repository') from None
          if path.exists() and not path.is_file():
              raise SystemExit('repeatability diagnostic target is not a file')
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o600
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          tmp_path = None
          try:
              with tempfile.NamedTemporaryFile(mode='wb', dir=path.parent, prefix=f'.{path.name}.', suffix='.tmp', delete=False) as handle:
                  tmp_path = Path(handle.name)
                  handle.write(payload)
                  handle.flush()
                  os.fchmod(handle.fileno(), mode)
                  os.fsync(handle.fileno())
              os.replace(tmp_path, path)
              tmp_path = None
          finally:
              if tmp_path is not None:
                  try: tmp_path.unlink()
                  except FileNotFoundError: pass
          PY
          git add docs/fixtures/memory-os-operability/controlled-saturation-repeatability-authority-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(load): record saturation repeatability authority diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during repeatability diagnostic write; refusing stale diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce repeatability authority
        run: test "${{ steps.authority.outputs.exit_code }}" = "0"
