name: Sustained Local Soak

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/sustained-local-soak.yml"
      - "contracts/operations/sustained-local-soak-contract.v1.json"
      - "scripts/validate-memory-os-sustained-local-soak.py"
      - "scripts/validate-memory-os-sustained-local-soak-result.py"
      - "scripts/validate-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/update-memory-os-sustained-local-soak-aggregate.py"
      - "scripts/reconcile-memory-os-sustained-local-soak-status.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "services/import-api/internal/httpserver/sustained_local_soak_test.go"
      - "services/import-api/internal/httpserver/server_live_test.go"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
      - "services/import-api/internal/httpserver/deletion_under_load_test.go"
      - "services/import-api/internal/parsersup/**"
      - "services/import-api/internal/fenced/**"
      - "services/import-api/internal/epochguard/**"
      - "services/import-api/internal/pgrepo/**"
      - "services/import-api/internal/dbscope/**"
      - "services/import-api/internal/pgscope/**"
      - "services/import-api/internal/authstore/**"
      - "services/import-api/internal/upload/**"
      - "services/import-api/internal/objectstore/**"
      - "services/import-api/internal/accountdelete/**"
      - "services/import-api/go.mod"
      - "services/import-api/go.sum"
      - "infra/postgresql/security/**"
  schedule:
    - cron: "37 18 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-local-soak-${{ github.event_name }}-so
  cancel-in-progress: true

jobs:
  foundation-smoke:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'docs(ops): register sustained local soak foundation') &&
       !contains(github.event.head_commit.message, 'test(soak): record sustained local soak result') &&
       !contains(github.event.head_commit.message, 'docs(ops): reconcile sustained local soak runs') &&
       !contains(github.event.head_commit.message, 'test(soak): record sustained local soak diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      authority_sha: ${{ steps.reconcile.outputs.authority_sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact foundation source
        id: source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha="$GITHUB_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Start local MinIO
        run: |
          set -euo pipefail
          docker run -d --name memory-os-sustained-soak-smoke-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-sustained-soak-smoke-minio
          exit 1

      - name: Validate foundation and compressed multi-surface smoke
        id: smoke
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_SUSTAINED_LOCAL_SOAK: "1"
          MEMORY_OS_SOAK_DURATION_SECONDS: "12"
        run: |
          set +e
          log=/tmp/memory-os-sustained-local-soak-smoke.log
          : > "$log"
          code=0
          echo "STAGE: contract-and-python" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py \
            scripts/validate-memory-os-load-evidence-index.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-local-soak.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-local-soak-aggregate.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: gofmt" >> "$log"
            test -z "$(gofmt -l services/import-api/internal/httpserver/sustained_local_soak_test.go)" \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: compressed-multi-surface-smoke-no-evidence" >> "$log"
            (
              cd services/import-api
              go test ./internal/httpserver \
                -run '^TestMixedImportLifecycleLocalLongSoak$' \
                -count=1 -timeout=8m
            ) >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile foundation implementation
        id: reconcile
        if: steps.smoke.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git rm -f docs/fixtures/memory-os-operability/sustained-local-soak-smoke-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/sustained-local-soak-smoke-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "docs(ops): register sustained local soak foundation"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "so advanced after foundation validation; refusing stale deterministic authority publication."
              exit 75
            }
            git push origin HEAD:so
          fi
          echo "authority_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record privacy-safe smoke diagnostic
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import json
          import os
          import re
          import stat
          import tempfile
          from pathlib import Path
          text = Path('/tmp/memory-os-sustained-local-soak-smoke.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          text = text.replace('minioadmin', '<redacted-local-credential>')
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          text = re.sub(r'acct_[A-Za-z0-9_-]+', '<redacted-synthetic-account>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'sustained-local-soak-foundation-smoke',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int('${{ steps.smoke.outputs.exit_code }}'),
              'output': text[-12000:],
              'containsSecrets': False,
              'evidenceRun': False,
              'configuredDurationSeconds': 12,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'localSustainedSoakEvidence': False,
              'leakProof': False,
          }
          path = Path('docs/fixtures/memory-os-operability/sustained-local-soak-smoke-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          existing_mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if existing_mode is not None:
                  os.fchmod(fd, existing_mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/sustained-local-soak-smoke-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record sustained local soak diagnostic"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "so advanced after failed smoke; refusing stale diagnostic publication."
              exit 75
            }
            git push origin HEAD:so
          fi

      - name: Enforce foundation smoke
        run: test "${{ steps.smoke.outputs.exit_code }}" = "0"

  long-run:
    if: github.event_name != 'push'
    needs: foundation-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout exact validated foundation authority
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.foundation-smoke.outputs.authority_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact long-run source
        run: |
          set -euo pipefail
          expected="${{ needs.foundation-smoke.outputs.authority_sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
          echo "SOAK_RUN_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SOAK_RESULT_PATH=/tmp/sustained-local-soak-result.json" >> "$GITHUB_ENV"

      - name: Start local MinIO
        run: |
          set -euo pipefail
          docker run -d --name memory-os-sustained-soak-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-sustained-soak-minio
          exit 1

      - name: Execute one 60-minute LOCAL_LONG_SOAK run
        id: long_soak
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_SUSTAINED_LOCAL_SOAK: "1"
          MEMORY_OS_SOAK_DURATION_SECONDS: "3600"
        run: |
          set +e
          export MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH="$SOAK_RESULT_PATH"
          export MEMORY_OS_COMMIT_SHA="$SOURCE_SHA"
          export MEMORY_OS_SOAK_RUN_ID="$SOAK_RUN_ID"
          log=/tmp/memory-os-sustained-local-soak.log
          : > "$log"
          rm -f "$SOAK_RESULT_PATH"
          code=0
          echo "STAGE: exact-60-minute-local-long-soak" >> "$log"
          (
            cd services/import-api
            go test ./internal/httpserver \
              -run '^TestMixedImportLifecycleLocalLongSoak$' \
              -count=1 -timeout=75m
          ) >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: exact-result-validation" >> "$log"
            python scripts/validate-memory-os-sustained-local-soak-result.py \
              "$SOAK_RESULT_PATH" \
              --expected-commit-sha "$SOURCE_SHA" \
              >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish append-only exact-source run result
        if: steps.long_soak.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- \
            .github/workflows/sustained-local-soak.yml \
            contracts/operations/sustained-local-soak-contract.v1.json \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py \
            services/import-api/internal/httpserver \
            services/import-api/internal/parsersup \
            services/import-api/internal/fenced \
            services/import-api/internal/epochguard \
            services/import-api/internal/pgrepo \
            services/import-api/internal/dbscope \
            services/import-api/internal/pgscope \
            services/import-api/internal/authstore \
            services/import-api/internal/upload \
            services/import-api/internal/objectstore \
            services/import-api/internal/accountdelete \
            services/import-api/go.mod \
            services/import-api/go.sum \
            infra/postgresql/security; then
            echo "Long-soak-critical source changed during the run; refusing stale evidence publication."
            exit 75
          fi
          git reset --hard origin/so
          target="docs/fixtures/memory-os-operability/sustained-local-soak-results.run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.v1.json"
          test ! -e "$target"
          cp "$SOAK_RESULT_PATH" "$target"
          python scripts/validate-memory-os-sustained-local-soak-result.py \
            "$target" --expected-commit-sha "$SOURCE_SHA"
          git add "$target"
          git commit -m "test(soak): record sustained local soak result"
          git pull --rebase origin so
          git push origin HEAD:so

      - name: Aggregate and reconcile run authority
        if: steps.long_soak.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          authority_source_sha="$(git rev-parse HEAD)"
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$authority_source_sha" || {
            echo "so advanced before sustained-soak aggregate reconciliation; refusing stale deterministic authority computation."
            exit 75
          }
          python scripts/update-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git rm -f docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json \
            docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json
          git add -u docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "docs(ops): reconcile sustained local soak runs"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$authority_source_sha" || {
              echo "so advanced after sustained-soak aggregate validation; refusing stale deterministic authority publication."
              exit 75
            }
            git push origin HEAD:so
          fi

      - name: Record privacy-safe long-run diagnostic
        if: steps.long_soak.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import json
          import os
          import re
          import stat
          import tempfile
          from pathlib import Path
          text = Path('/tmp/memory-os-sustained-local-soak.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          text = text.replace('minioadmin', '<redacted-local-credential>')
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          text = re.sub(r'acct_[A-Za-z0-9_-]+', '<redacted-synthetic-account>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'sustained-local-soak',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'runId': os.environ['SOAK_RUN_ID'],
              'result': 'FAIL',
              'exitCode': int('${{ steps.long_soak.outputs.exit_code }}'),
              'output': text[-12000:],
              'containsSecrets': False,
              'configuredDurationSeconds': 3600,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'localSustainedSoakEvidence': False,
              'productionSustainedSoakEvidence': False,
              'leakProof': False,
          }
          path = Path('docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          existing_mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if existing_mode is not None:
                  os.fchmod(fd, existing_mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record sustained local soak diagnostic"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "so advanced after failed sustained soak; refusing stale diagnostic publication."
              exit 75
            }
            git push origin HEAD:so
          fi

      - name: Enforce long-run success
        run: test "${{ steps.long_soak.outputs.exit_code }}" = "0"
