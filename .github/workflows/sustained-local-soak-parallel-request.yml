name: Sustained Local Soak Parallel Request

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/sustained-local-soak-parallel-request.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-local-soak-parallel-request-so
  cancel-in-progress: false

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        ordinal: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact source and foundation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m py_compile \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          test -z "$(gofmt -l services/import-api/internal/httpserver/sustained_local_soak_test.go)"
          echo "SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SOAK_RUN_ID=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.ordinal }}" >> "$GITHUB_ENV"
          echo "SOAK_RESULT_PATH=/tmp/sustained-local-soak-${{ matrix.ordinal }}.json" >> "$GITHUB_ENV"

      - name: Start isolated local MinIO
        run: |
          set -euo pipefail
          docker run -d --name memory-os-parallel-soak-minio-${{ matrix.ordinal }} \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-parallel-soak-minio-${{ matrix.ordinal }}
          exit 1

      - name: Execute exact 60-minute LOCAL_LONG_SOAK
        id: long_soak
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_SUSTAINED_LOCAL_SOAK: "1"
          MEMORY_OS_SOAK_DURATION_SECONDS: "3600"
        run: |
          set +e
          export MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH="$SOAK_RESULT_PATH"
          export MEMORY_OS_COMMIT_SHA="$SOURCE_SHA"
          export MEMORY_OS_SOAK_RUN_ID="$SOAK_RUN_ID"
          log=/tmp/memory-os-sustained-local-soak-${{ matrix.ordinal }}.log
          : > "$log"
          rm -f "$SOAK_RESULT_PATH"
          code=0
          echo "STAGE: exact-60-minute-local-long-soak-${{ matrix.ordinal }}" >> "$log"
          (
            cd services/import-api
            go test ./internal/httpserver \
              -run '^TestMixedImportLifecycleLocalLongSoak$' \
              -count=1 -timeout=75m
          ) >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-local-soak-result.py \
              "$SOAK_RESULT_PATH" --expected-commit-sha "$SOURCE_SHA" \
              >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish unique append-only run result
        if: steps.long_soak.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- \
            .github/workflows/sustained-local-soak-parallel-request.yml \
            contracts/operations/sustained-local-soak-contract.v1.json \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py \
            services/import-api/internal/httpserver \
            services/import-api/internal/parsersup \
            services/import-api/internal/fenced \
            services/import-api/internal/epochguard \
            services/import-api/internal/pgrepo \
            services/import-api/internal/dbscope \
            services/import-api/internal/pgscope \
            services/import-api/internal/authstore \
            services/import-api/internal/upload \
            services/import-api/internal/objectstore \
            services/import-api/internal/accountdelete \
            services/import-api/go.mod \
            services/import-api/go.sum \
            infra/postgresql/security; then
            echo "Long-soak-critical source changed during run; refusing stale evidence."
            exit 75
          fi
          git reset --hard origin/so
          target="docs/fixtures/memory-os-operability/sustained-local-soak-results.run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.ordinal }}.v1.json"
          diagnostic="docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.${{ matrix.ordinal }}.last.json"
          test ! -e "$target"
          cp "$SOAK_RESULT_PATH" "$target"
          python scripts/validate-memory-os-sustained-local-soak-result.py "$target" --expected-commit-sha "$SOURCE_SHA"
          rm -f "$diagnostic"
          git add "$target"
          if git ls-files --error-unmatch -- "$diagnostic" >/dev/null 2>&1; then
            git add -u -- "$diagnostic"
          fi
          git commit -m "test(soak): record sustained local soak result ${{ matrix.ordinal }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin so
            if git push origin HEAD:so; then
              exit 0
            fi
            sleep 2
          done
          echo "failed to publish append-only soak result after bounded retries"
          exit 1

      - name: Record privacy-safe run diagnostic
        if: steps.long_soak.outputs.exit_code != '0'
        env:
          LONG_SOAK_EXIT_CODE: ${{ steps.long_soak.outputs.exit_code }}
          MATRIX_ORDINAL: ${{ matrix.ordinal }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced after soak validation; refusing stale diagnostic"
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          ordinal = os.environ['MATRIX_ORDINAL']
          text = Path(f'/tmp/memory-os-sustained-local-soak-{ordinal}.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          text = text.replace('minioadmin', '<redacted-local-credential>')
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          text = re.sub(r'acct_[A-Za-z0-9_-]+', '<redacted-synthetic-account>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'sustained-local-soak-parallel-request',
              'ordinal': ordinal,
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'runId': os.environ['SOAK_RUN_ID'],
              'result': 'FAIL',
              'exitCode': int(os.environ['LONG_SOAK_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'configuredDurationSeconds': 3600,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'localSustainedSoakEvidence': False,
              'leakProof': False,
          }
          path = Path(f'docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.{ordinal}.last.json')
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add "docs/fixtures/memory-os-operability/sustained-local-soak-diagnostic.${{ matrix.ordinal }}.last.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record parallel sustained soak diagnostic ${{ matrix.ordinal }}"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "so advanced before soak diagnostic push; refusing stale diagnostic"
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Enforce long-run success
        run: test "${{ steps.long_soak.outputs.exit_code }}" = "0"

  aggregate:
    needs: soak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate both independent run documents
        run: |
          set -euo pipefail
          python scripts/update-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
      - name: Commit aggregate authority without leak or production promotion
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$source_sha" ]]; then
            echo "so advanced after soak aggregate validation; refusing stale authority"
            exit 75
          fi
          git add \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json \
            docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): aggregate parallel sustained local soak runs"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$source_sha" ]]; then
              echo "so advanced before soak aggregate push; refusing stale authority"
              exit 75
            fi
            git push origin HEAD:so
          fi
