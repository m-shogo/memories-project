name: Backup Restore Drill Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-drill-preflight.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-admission-chain-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-authority.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-drill-preflight.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-admission-chain-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-authority.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-preflight-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean preflight PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Validate restore drill preflight read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-authority.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-backup-restore-drill-preflight-authority.py
          python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py
          python scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py
          python scripts/reconcile-memory-os-backup-restore-drill-preflight.py
          python scripts/validate-memory-os-backup-restore-drill-preflight.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- \
            contracts/operations/backup-restore-drill-preflight-contract.v1.json \
            contracts/operations/production-operability-status.json

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact preflight authority source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile and validate restore drill preflight
        id: preflight
        run: |
          set +e
          log=/tmp/backup-restore-drill-preflight.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-source-binding-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-lineage-negative.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-authority.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight-authority.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded preflight authority
        if: steps.preflight.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-drill-preflight.log

          revalidate_latest_preflight() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-backup-restore-drill-preflight-authority.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight-load-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Preflight authority source HEAD changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Preflight authority source advanced; regenerating and revalidating once from latest so."
              revalidate_latest_preflight
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-drill-preflight-diagnostic.last.json 2>/dev/null || true
            git add \
              contracts/operations/backup-restore-drill-preflight-contract.v1.json \
              contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-drill-preflight-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile restore drill preflight authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Preflight authority source HEAD changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Preflight authority source advanced after validation; discarding stale preflight commit and retrying from latest so."
              revalidate_latest_preflight
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Preflight authority push raced with another writer; retrying once from latest so."
            revalidate_latest_preflight
          done
          exit 75
      - name: Record privacy-safe preflight diagnostic
        if: steps.preflight.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Preflight authority source HEAD changed after validation; refusing stale preflight diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/backup-restore-drill-preflight.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-drill-preflight',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['PREFLIGHT_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'requestCreated': False,
              'generationCreated': False,
              'recoveryObjectiveCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-drill-preflight-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-drill-preflight-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record restore drill preflight diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Preflight authority source HEAD changed before diagnostic push; refusing stale preflight diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce restore drill preflight
        run: test "${{ steps.preflight.outputs.exit_code }}" = "0"
