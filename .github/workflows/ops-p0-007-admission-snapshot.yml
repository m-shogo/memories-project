name: OPS P0 007 Admission Snapshot

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/ops-p0-007-admission-snapshot.yml"
      - ".github/workflows/ops-p0-007-admission-snapshot-pr.yml"
      - "contracts/operations/ops-p0-007-admission-snapshot.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/generate-memory-os-ops-p0-007-admission-snapshot.py"
      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot.py"
      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py"
      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot-validator-authority-negative.py"
      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot-generator-execution-authority-negative.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-p0-007-admission-snapshot-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact OPS-P0-007 snapshot source
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.sha }}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate and validate strict snapshot
        id: snapshot
        run: |
          set +e
          log=/tmp/ops-p0-007-admission-snapshot.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/generate-memory-os-ops-p0-007-admission-snapshot.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot-validator-authority-negative.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot-generator-execution-authority-negative.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/generate-memory-os-ops-p0-007-admission-snapshot.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-ops-p0-007-admission-snapshot.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-ops-p0-007-admission-snapshot-validator-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-ops-p0-007-admission-snapshot-generator-execution-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit deterministic strict snapshot
        if: steps.snapshot.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/ops-p0-007-admission-snapshot.log

          revalidate_latest_snapshot() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1
            python scripts/generate-memory-os-ops-p0-007-admission-snapshot.py >> "$log" 2>&1
            python scripts/validate-memory-os-ops-p0-007-admission-snapshot.py >> "$log" 2>&1
            python scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-ops-p0-007-admission-snapshot-validator-authority-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-ops-p0-007-admission-snapshot-generator-execution-authority-negative.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "OPS-P0-007 source HEAD changed again during bounded retry; refusing stale strict snapshot."
                exit 75
              fi
              echo "OPS-P0-007 source advanced; regenerating and revalidating strict snapshot once from latest so."
              revalidate_latest_snapshot
            fi

            git rm -f docs/fixtures/memory-os-operability/ops-p0-007-admission-snapshot-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/ops-p0-007-admission-snapshot.v1.json
            git add -u docs/fixtures/memory-os-operability/ops-p0-007-admission-snapshot-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): refresh OPS-P0-007 strict admission snapshot"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "OPS-P0-007 source HEAD changed again before bounded retry snapshot push; refusing stale strict snapshot."
                exit 75
              fi
              echo "OPS-P0-007 source advanced after validation; discarding stale snapshot commit and retrying from latest so."
              revalidate_latest_snapshot
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "OPS-P0-007 snapshot push raced with another writer; retrying once from latest so."
            revalidate_latest_snapshot
          done
          exit 75
      - name: Record privacy-safe snapshot diagnostic
        if: steps.snapshot.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          SNAPSHOT_EXIT_CODE: ${{ steps.snapshot.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "OPS-P0-007 source HEAD changed after failed validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/ops-p0-007-admission-snapshot.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'ops-p0-007-admission-snapshot',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['SNAPSHOT_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'generationCreated': False,
              'objectiveCreated': False,
              'requestCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/ops-p0-007-admission-snapshot-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          existing_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if existing_mode is not None:
                  os.fchmod(fd, existing_mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/ops-p0-007-admission-snapshot-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record OPS-P0-007 strict snapshot diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "OPS-P0-007 source HEAD changed before diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce strict snapshot
        run: test "${{ steps.snapshot.outputs.exit_code }}" = "0"
