      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot.py"
      - "scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory-source-authorities.py"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-replacement-negative.py"
      - "scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py"
      - "scripts/validate-memory-os-operability-admission-inventory-registry-negative.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/reconcile-memory-os-production-equivalent-generation-status.py"
      - "scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/reconcile-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-ordering-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-ordering-negative.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-ordering-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-non-resurrection-ordering-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-status.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-ordering-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-admission-chain-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  negative-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Compile chain mutation suite
        run: |
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/generate-memory-os-ops-p0-007-admission-snapshot.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot.py \
            scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py \
            scripts/generate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory-source-authorities.py \
            scripts/validate-memory-os-operability-admission-inventory-atomic-replacement-negative.py \
            scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py \
            scripts/validate-memory-os-operability-admission-inventory-registry-negative.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/reconcile-memory-os-production-equivalent-generation-status.py \
            scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/reconcile-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-ordering-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight.py \
            scripts/reconcile-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-ordering-negative.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-ordering-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py \
            scripts/validate-memory-os-backup-non-resurrection-ordering-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-status.py \
            scripts/validate-memory-os-backup-restore-generation-status-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-generation-status-ordering-negative.py \
            scripts/reconcile-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-admission-chain.py \
            scripts/reconcile-memory-os-backup-restore-admission-chain.py \
            scripts/validate-memory-os-backup-restore-admission-chain-negative.py \
            scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py \
            scripts/validate-memory-os-operability.py
      - name: Generate strict OPS-P0-007 admission snapshot
        run: python scripts/generate-memory-os-ops-p0-007-admission-snapshot.py
      - name: Validate strict OPS-P0-007 admission snapshot
        run: python scripts/validate-memory-os-ops-p0-007-admission-snapshot.py
      - name: Prove strict OPS-P0-007 snapshot authority and rollback
        run: python scripts/validate-memory-os-ops-p0-007-admission-snapshot-negative.py
      - name: Generate operability admission inventory
        run: python scripts/generate-memory-os-operability-admission-inventory.py
      - name: Validate operability admission inventory
        run: python scripts/validate-memory-os-operability-admission-inventory.py
      - name: Prove inventory source authorities
        run: python scripts/validate-memory-os-operability-admission-inventory-source-authorities.py
      - name: Prove inventory atomic replacement is fail-closed
        run: python scripts/validate-memory-os-operability-admission-inventory-atomic-replacement-negative.py
      - name: Prove inventory promotion remains fail-closed
        run: python scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py
      - name: Prove inventory registries remain fail-closed
        run: python scripts/validate-memory-os-operability-admission-inventory-registry-negative.py
      - name: Prove environment generation reconcile authority and rollback
        run: python scripts/validate-memory-os-production-equivalent-generation-reconcile-negative.py
      - name: Prove recovery objective reconcile authority and rollback
        run: python scripts/validate-memory-os-recovery-objectives-reconcile-negative.py
      - name: Revalidate semantic preflight authority
        run: python scripts/validate-memory-os-backup-restore-drill-preflight.py
      - name: Prove preflight evidence ordering is deterministic
        run: python scripts/validate-memory-os-backup-restore-drill-preflight-ordering-negative.py
      - name: Prove drill request reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py
      - name: Prove drill request ordering is deterministic
        run: python scripts/validate-memory-os-backup-restore-drill-request-ordering-negative.py
      - name: Prove generation evidence reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py
      - name: Prove generation evidence ordering is deterministic
        run: python scripts/validate-memory-os-backup-restore-generation-evidence-ordering-negative.py
      - name: Prove typed non-resurrection reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-non-resurrection-reconcile-negative.py
      - name: Prove typed non-resurrection evidence ordering is deterministic
        run: python scripts/validate-memory-os-backup-non-resurrection-ordering-negative.py
      - name: Prove generation binding status reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-restore-generation-status-reconcile-negative.py
      - name: Prove generation binding status ordering is deterministic
        run: python scripts/validate-memory-os-backup-restore-generation-status-ordering-negative.py
      - name: Validate human promotion review authority
        run: python scripts/validate-memory-os-backup-restore-promotion-review.py
      - name: Prove human promotion review reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-restore-promotion-review-reconcile-negative.py
      - name: Validate canonical chain
        run: python scripts/validate-memory-os-backup-restore-admission-chain.py
      - name: Prove fail-closed chain mutations
        run: python scripts/validate-memory-os-backup-restore-admission-chain-negative.py
      - name: Prove fail-closed chain reconcile authority and rollback
        run: python scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py
      - name: Validate aggregate operability remains fail-closed
        run: python scripts/validate-memory-os-operability.py
      - name: Verify read-only negative suite
        run: test -z "$(git status --porcelain)"
