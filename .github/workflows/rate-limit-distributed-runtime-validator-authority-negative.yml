name: Rate Limit Distributed Runtime Validator Authority Negative

on:
  pull_request:
    paths:
      - ".github/workflows/rate-limit-distributed-runtime-validator-authority-negative.yml"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-validator-authority-negative.py"
      - "scripts/register-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/reconcile-memory-os-rate-limit-distributed-runtime.py"
      - "contracts/operations/rate-limit-distributed-runtime-admission-contract.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-distributed-runtime-validator-authority-negative.yml"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/validate-memory-os-rate-limit-distributed-runtime-validator-authority-negative.py"
      - "scripts/register-memory-os-rate-limit-distributed-runtime.py"
      - "scripts/reconcile-memory-os-rate-limit-distributed-runtime.py"
      - "contracts/operations/rate-limit-distributed-runtime-admission-contract.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean validation source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate distributed runtime validator authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime-validator-authority-negative.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime-validator-authority-negative.py
          python scripts/validate-memory-os-rate-limit-distributed-runtime.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
