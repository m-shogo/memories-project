name: Reconcile Chaos Mixed-Version Overlay

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-chaos-mixed-version-overlay.yml"
      - "scripts/reconcile-memory-os-chaos-mixed-version-overlay.py"
      - "scripts/validate-memory-os-chaos-mixed-version-overlay-negative.py"
      - "scripts/validate-memory-os-mixed-version-apply.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-version-compatibility-execution-evidence.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/mixed-version-apply-contract.v1.json"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-chaos-mixed-version-overlay.yml"
      - "scripts/reconcile-memory-os-chaos-mixed-version-overlay.py"
      - "scripts/validate-memory-os-chaos-mixed-version-overlay-negative.py"
      - "scripts/validate-memory-os-mixed-version-apply.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-version-compatibility-execution-evidence.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/mixed-version-apply-contract.v1.json"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-chaos-mixed-version-overlay-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git branch --show-current)" = "so"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
      - name: Reconcile candidate/local failure evidence
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-chaos-mixed-version-overlay.py \
            scripts/validate-memory-os-chaos-mixed-version-overlay-negative.py \
            scripts/validate-memory-os-mixed-version-apply.py \
            scripts/validate-memory-os-chaos-failure-drills-v2.py \
            scripts/validate-memory-os-version-compatibility-execution-evidence.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-mixed-version-apply.py
          python scripts/validate-memory-os-chaos-mixed-version-overlay-negative.py
          python scripts/reconcile-memory-os-chaos-mixed-version-overlay.py
          python scripts/validate-memory-os-mixed-version-apply.py
          python scripts/validate-memory-os-chaos-failure-drills-v2.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
          python scripts/validate-memory-os-operability.py
      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- contracts/operations/production-operability-status.json
      - name: Commit bounded chaos authority update
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Mixed-version chaos authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(chaos): classify candidate mixed-version failure recovery"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Mixed-version chaos authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
