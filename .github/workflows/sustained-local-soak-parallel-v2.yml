name: Sustained Local Soak Parallel v2

on:
  push:
    branches:
      - so
    paths:
      - "contracts/operations/requests/sustained-local-soak-parallel-v2.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-local-soak-parallel-v2-so
  cancel-in-progress: false

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        ordinal: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight, dependency startup, exact 60-minute run, and validation
        id: execute
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_SUSTAINED_LOCAL_SOAK: "1"
          MEMORY_OS_SOAK_DURATION_SECONDS: "3600"
          MATRIX_ORDINAL: ${{ matrix.ordinal }}
        run: |
          set +e
          log="/tmp/memory-os-sustained-local-soak-${MATRIX_ORDINAL}.log"
          result="/tmp/sustained-local-soak-${MATRIX_ORDINAL}.json"
          : > "$log"
          rm -f "$result"
          code=0
          stage=preflight
          echo "STAGE: preflight" >> "$log"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python -m py_compile \
              scripts/validate-memory-os-sustained-local-soak.py \
              scripts/validate-memory-os-sustained-local-soak-result.py \
              scripts/validate-memory-os-sustained-local-soak-aggregate.py \
              scripts/update-memory-os-sustained-local-soak-aggregate.py \
              scripts/reconcile-memory-os-sustained-local-soak-status.py \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-local-soak.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-sustained-local-soak-aggregate.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            test -z "$(gofmt -l services/import-api/internal/httpserver/sustained_local_soak_test.go services/import-api/internal/httpserver/sustained_local_soak_session_test.go)" >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=minio-startup
            echo "STAGE: minio-startup" >> "$log"
            docker run -d --name "memory-os-parallel-soak-v2-minio-${MATRIX_ORDINAL}" \
              -p 9000:9000 \
              -e MINIO_ROOT_USER=minioadmin \
              -e MINIO_ROOT_PASSWORD=minioadmin \
              minio/minio server /data >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            ready=0
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              echo "MinIO did not become ready" >> "$log"
              code=70
            fi
          fi
          if [[ "$code" == "0" ]]; then
            stage=exact-60-minute-local-long-soak
            echo "STAGE: exact-60-minute-local-long-soak" >> "$log"
            export MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH="$result"
            export MEMORY_OS_COMMIT_SHA="${GITHUB_SHA}"
            export MEMORY_OS_SOAK_RUN_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MATRIX_ORDINAL}"
            (cd services/import-api && go test ./internal/httpserver -run '^TestMixedImportLifecycleLocalLongSoak$' -count=1 -timeout=75m) >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=result-validation
            echo "STAGE: result-validation" >> "$log"
            python scripts/validate-memory-os-sustained-local-soak-result.py "$result" --expected-commit-sha "${GITHUB_SHA}" >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "result_path=$result" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "soak_run_id=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${MATRIX_ORDINAL}" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Publish unique append-only run result
        if: steps.execute.outputs.exit_code == '0'
        env:
          SOURCE_SHA: ${{ steps.execute.outputs.source_sha }}
          SOAK_RESULT_PATH: ${{ steps.execute.outputs.result_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- \
            .github/workflows/sustained-local-soak-parallel-v2.yml \
            contracts/operations/sustained-local-soak-contract.v1.json \
            scripts/validate-memory-os-sustained-local-soak.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/validate-memory-os-sustained-local-soak-aggregate.py \
            scripts/update-memory-os-sustained-local-soak-aggregate.py \
            scripts/reconcile-memory-os-sustained-local-soak-status.py \
            services/import-api/internal/httpserver \
            services/import-api/internal/parsersup \
            services/import-api/internal/fenced \
            services/import-api/internal/epochguard \
            services/import-api/internal/pgrepo \
            services/import-api/internal/dbscope \
            services/import-api/internal/pgscope \
            services/import-api/internal/authstore \
            services/import-api/internal/upload \
            services/import-api/internal/objectstore \
            services/import-api/internal/accountdelete \
            services/import-api/go.mod services/import-api/go.sum \
            infra/postgresql/security; then
            echo "Long-soak-critical source changed during run; refusing stale evidence."
            exit 75
          fi
          git reset --hard origin/so
          target="docs/fixtures/memory-os-operability/sustained-local-soak-results.run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.ordinal }}.v1.json"
          test ! -e "$target"
          cp "$SOAK_RESULT_PATH" "$target"
          python scripts/validate-memory-os-sustained-local-soak-result.py "$target" --expected-commit-sha "$SOURCE_SHA"
          git add "$target"
          git commit -m "test(soak): record sustained local soak v2 result ${{ matrix.ordinal }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin so
            if git push origin HEAD:so; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Record privacy-safe failure diagnostic from any execution stage
        if: steps.execute.outputs.exit_code != '0'
        env:
          EXECUTION_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
          FAILURE_STAGE: ${{ steps.execute.outputs.failure_stage }}
          MATRIX_ORDINAL: ${{ matrix.ordinal }}
          SOURCE_SHA: ${{ steps.execute.outputs.source_sha }}
          SOAK_RUN_ID: ${{ steps.execute.outputs.soak_run_id }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          ordinal = os.environ['MATRIX_ORDINAL']
          path = Path(f'/tmp/memory-os-sustained-local-soak-{ordinal}.log')
          text = path.read_text(encoding='utf-8', errors='replace') if path.exists() else '<log unavailable>'
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          text = text.replace('minioadmin', '<redacted-local-credential>')
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          text = re.sub(r'acct_[A-Za-z0-9_-]+', '<redacted-synthetic-account>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'sustained-local-soak-parallel-v2',
              'ordinal': ordinal,
              'sourceCommitSha': os.environ.get('SOURCE_SHA', ''),
              'runId': os.environ.get('SOAK_RUN_ID', ''),
              'failureStage': os.environ.get('FAILURE_STAGE', 'unknown'),
              'result': 'FAIL',
              'exitCode': int(os.environ['EXECUTION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'configuredDurationSeconds': 3600,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'localSustainedSoakEvidence': False,
              'leakProof': False,
          }
          out = Path(f'docs/fixtures/memory-os-operability/sustained-local-soak-v2-diagnostic.{ordinal}.last.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add "docs/fixtures/memory-os-operability/sustained-local-soak-v2-diagnostic.${{ matrix.ordinal }}.last.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record sustained local soak v2 diagnostic ${{ matrix.ordinal }}"
            for attempt in 1 2 3; do
              git pull --rebase origin so
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce long-run success
        run: test "${{ steps.execute.outputs.exit_code }}" = "0"

  aggregate:
    needs: soak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate committed independent run documents
        run: |
          set -euo pipefail
          python scripts/update-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
      - name: Commit aggregate authority without leak or production promotion
        run: |
          set -euo pipefail
          git add \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json \
            docs/fixtures/memory-os-operability/sustained-local-soak-results.aggregate.v1.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): aggregate sustained local soak v2 runs"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
