name: Operability Evidence Ownership

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/operability-evidence-ownership.yml"
      - "contracts/operations/requests/operability-evidence-ownership.v1.json"
      - "contracts/operations/operability-evidence-ownership-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-operability-evidence-ownership.py"
      - "scripts/reconcile-memory-os-operability-evidence-ownership.py"
      - "scripts/validate-memory-os-operability-evidence-ownership-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operability-evidence-ownership-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact ownership authority source
        run: |
          set -euo pipefail
          test -n "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate ownership and reconcile readiness
        id: ownership
        run: |
          set +e
          log=/tmp/operability-evidence-ownership.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-operability-evidence-ownership.py \
            scripts/reconcile-memory-os-operability-evidence-ownership.py \
            scripts/validate-memory-os-operability-evidence-ownership-reconcile-negative.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-evidence-ownership-reconcile-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-operability-evidence-ownership.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Ownership validation completed; raw validator output withheld."
          exit 0
      - name: Commit ownership authority
        if: steps.ownership.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Ownership authority source advanced after validation; refusing stale derived authority." >&2
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/operability-evidence-ownership-diagnostic.last.json 2>/dev/null || true
          git add contracts/operations/operability-evidence-ownership-contract.v1.json
          git add -u docs/fixtures/memory-os-operability/operability-evidence-ownership-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): register evidence ownership validator"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Ownership authority source advanced after derived authority capture; refusing stale write." >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record ownership diagnostic
        if: steps.ownership.outputs.exit_code != '0'
        env:
          OWNERSHIP_EXIT_CODE: ${{ steps.ownership.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Ownership authority source advanced after failed validation; refusing stale diagnostic." >&2
            exit 75
          fi
          python - <<'PY'
          import json, os, stat, tempfile
          from pathlib import Path
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'operability-evidence-ownership',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['OWNERSHIP_EXIT_CODE']),
              'output': 'Ownership validation failed; raw validator output withheld.',
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          repo = Path.cwd().resolve(strict=True)
          path = repo / 'docs/fixtures/memory-os-operability/operability-evidence-ownership-diagnostic.last.json'
          if not path.parent.is_dir():
              raise RuntimeError('ownership diagnostic parent missing')
          candidate = repo
          for component in path.relative_to(repo).parts:
              candidate = candidate / component
              if candidate.is_symlink():
                  raise RuntimeError('ownership diagnostic path must not be a symlink')
          try:
              path.parent.resolve(strict=True).relative_to(repo)
          except ValueError as exc:
              raise RuntimeError('ownership diagnostic parent escaped repository') from exc
          if path.exists() and not path.is_file():
              raise RuntimeError('ownership diagnostic target must be regular')
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else None
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if mode is not None:
                  os.fchmod(fd, mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/operability-evidence-ownership-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "test(ops): record evidence ownership diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Ownership authority source advanced after diagnostic capture; refusing stale diagnostic." >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce ownership validation
        run: test "${{ steps.ownership.outputs.exit_code }}" = "0"
