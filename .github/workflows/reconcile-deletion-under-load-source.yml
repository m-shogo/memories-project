name: Reconcile Deletion Under Load Source

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-under-load-source.yml"
      - "scripts/reconcile-memory-os-deletion-under-load-source.py"
      - "services/import-api/internal/httpserver/deletion_under_load_test.go"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-under-load-source.yml"
      - "scripts/reconcile-memory-os-deletion-under-load-source.py"
      - "services/import-api/internal/httpserver/deletion_under_load_test.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-deletion-under-load-source-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Reconcile source read-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          python -m py_compile scripts/reconcile-memory-os-deletion-under-load-source.py
          python scripts/reconcile-memory-os-deletion-under-load-source.py
          gofmt -w services/import-api/internal/httpserver/deletion_under_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_under_load_test.go)"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, 'fix(load): reconcile deletion under load source'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Capture exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reconcile and format source
        run: |
          set -euo pipefail
          python -m py_compile scripts/reconcile-memory-os-deletion-under-load-source.py
          python scripts/reconcile-memory-os-deletion-under-load-source.py
          gofmt -w services/import-api/internal/httpserver/deletion_under_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_under_load_test.go)"

      - name: Commit source authority
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/deletion_under_load_test.go
          if git diff --cached --quiet; then
            echo "Deletion-under-load source already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(load): reconcile deletion under load source"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced during deletion-under-load source reconcile; refusing stale source rewrite."
            exit 75
          fi
          git push origin HEAD:so
