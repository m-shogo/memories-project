name: Local Migration Recovery Source Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/local-migration-recovery-artifact.yml"
      - ".github/workflows/local-migration-recovery-source-negative.yml"
      - "scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py"
      - "scripts/validate-memory-os-local-migration-recovery-artifact-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-migration-recovery-artifact.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/local-migration-recovery-artifact.yml"
      - ".github/workflows/local-migration-recovery-source-negative.yml"
      - "scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py"
      - "scripts/validate-memory-os-local-migration-recovery-artifact-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-migration-recovery-artifact.py"

permissions:
  contents: read

jobs:
  source-negative:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/so')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact read-only source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="$PR_HEAD_SHA"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            echo "Unreviewed local-migration source event" >&2
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove publisher and independent source boundary
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-local-migration-recovery-workflow-source-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Prove local recovery readiness in disposable exact-source clone
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          git clone --no-hardlinks --no-checkout . "$temp/repo"
          git -C "$temp/repo" checkout --detach "$(git rev-parse HEAD)"
          test -z "$(git -C "$temp/repo" status --porcelain)"
          (cd "$temp/repo" && python scripts/validate-memory-os-local-migration-recovery-artifact-reconcile-negative.py)
          test -z "$(git -C "$temp/repo" status --porcelain)"
          test -z "$(git status --porcelain)"
