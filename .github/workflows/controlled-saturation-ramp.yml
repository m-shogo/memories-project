name: Controlled Saturation Ramp

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/controlled-saturation-ramp.yml"
      - "contracts/operations/controlled-saturation-ramp-contract.v1.json"
      - "scripts/validate-memory-os-controlled-saturation-ramp.py"
      - "scripts/reconcile-memory-os-controlled-saturation-ramp-status.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "services/import-api/internal/httpserver/controlled_saturation_ramp_test.go"
      - "services/import-api/internal/httpserver/server_live_test.go"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
      - "services/import-api/internal/fenced/**"
      - "services/import-api/internal/epochguard/**"
      - "services/import-api/internal/pgrepo/**"
      - "services/import-api/internal/dbscope/**"
      - "services/import-api/internal/pgscope/**"
      - "services/import-api/internal/authstore/**"
      - "services/import-api/internal/upload/**"
      - "services/import-api/internal/objectstore/**"
      - "services/import-api/go.mod"
      - "services/import-api/go.sum"
      - "infra/postgresql/security/**"
  schedule:
    - cron: "23 20 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controlled-saturation-ramp-so
  cancel-in-progress: true

jobs:
  controlled-ramp:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'test(load): record controlled saturation ramp result') &&
       !contains(github.event.head_commit.message, 'docs(ops): register controlled saturation evidence') &&
       !contains(github.event.head_commit.message, 'test(load): record controlled saturation ramp diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Start local MinIO
        run: |
          set -euo pipefail
          docker run -d --name memory-os-controlled-saturation-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-controlled-saturation-minio
          exit 1

      - name: Execute bounded ramp and validate result
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_CONTROLLED_SATURATION_RAMP: "1"
          MEMORY_OS_CONTROLLED_SATURATION_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set +e
          log=/tmp/memory-os-controlled-saturation.log
          : > "$log"
          code=0
          echo "STAGE: format-and-compile" >> "$log"
          test -z "$(gofmt -l services/import-api/internal/httpserver/controlled_saturation_ramp_test.go)" \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python -m py_compile \
              scripts/validate-memory-os-controlled-saturation-ramp.py \
              scripts/reconcile-memory-os-controlled-saturation-ramp-status.py \
              scripts/validate-memory-os-load-evidence-index.py \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: controlled-local-ramp" >> "$log"
            (
              cd services/import-api
              go test ./internal/httpserver \
                -run '^TestControlledSignedUploadSaturationRampLocalDependencies$' \
                -count=1 -timeout=15m
            ) >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: validate-result" >> "$log"
            python scripts/validate-memory-os-controlled-saturation-ramp.py \
              --expected-commit-sha "$SOURCE_SHA" >> "$log" 2>&1 || code=$?
          fi
          echo "CONTROLLED_RAMP_EXIT_CODE=$code" >> "$GITHUB_ENV"
          if [[ "$code" == "0" ]]; then
            mkdir -p /tmp/memory-os-controlled-saturation
            cp docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json \
              /tmp/memory-os-controlled-saturation/result.json
          fi
          exit 0

      - name: Publish exact-source result
        if: env.CONTROLLED_RAMP_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              .github/workflows/controlled-saturation-ramp.yml \
              services/import-api/internal/httpserver \
              services/import-api/internal/fenced \
              services/import-api/internal/epochguard \
              services/import-api/internal/pgrepo \
              services/import-api/internal/dbscope \
              services/import-api/internal/pgscope \
              services/import-api/internal/authstore \
              services/import-api/internal/upload \
              services/import-api/internal/objectstore \
              services/import-api/go.mod \
              services/import-api/go.sum \
              infra/postgresql/security \
              contracts/operations/controlled-saturation-ramp-contract.v1.json \
              scripts/validate-memory-os-controlled-saturation-ramp.py \
              scripts/reconcile-memory-os-controlled-saturation-ramp-status.py \
              scripts/validate-memory-os-load-evidence-index.py; then
              echo "Newer controlled-ramp-critical source exists; its own run must publish evidence."
              exit 75
            fi
            git reset --hard origin/so
            cp /tmp/memory-os-controlled-saturation/result.json \
              docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json
            git add docs/fixtures/memory-os-operability/controlled-saturation-ramp-results.sample.v1.json
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "test(load): record controlled saturation ramp result"
            if git push origin HEAD:so; then
              published=true
              break
            fi
          done
          test "$published" = true

      - name: Reconcile controlled saturation authority
        if: env.CONTROLLED_RAMP_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reconciled=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              .github/workflows/controlled-saturation-ramp.yml \
              services/import-api/internal/httpserver \
              services/import-api/internal/fenced \
              services/import-api/internal/epochguard \
              services/import-api/internal/pgrepo \
              services/import-api/internal/dbscope \
              services/import-api/internal/pgscope \
              services/import-api/internal/authstore \
              services/import-api/internal/upload \
              services/import-api/internal/objectstore \
              services/import-api/go.mod \
              services/import-api/go.sum \
              infra/postgresql/security \
              contracts/operations/controlled-saturation-ramp-contract.v1.json \
              scripts/validate-memory-os-controlled-saturation-ramp.py \
              scripts/reconcile-memory-os-controlled-saturation-ramp-status.py \
              scripts/validate-memory-os-load.py \
              scripts/validate-memory-os-load-evidence-index.py \
              scripts/validate-memory-os-operability.py; then
              echo "Newer controlled-ramp authority source exists; refusing stale reconcile."
              exit 75
            fi
            git reset --hard origin/so
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/validate-memory-os-controlled-saturation-ramp.py
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/reconcile-memory-os-controlled-saturation-ramp-status.py
            python scripts/validate-memory-os-controlled-saturation-ramp.py \
              --expected-commit-sha "${SOURCE_SHA}" --require-reconciled
            python scripts/validate-memory-os-load.py
            python scripts/validate-memory-os-load-evidence-index.py
            python scripts/validate-memory-os-operability.py
            git rm -f docs/fixtures/memory-os-operability/controlled-saturation-ramp-diagnostic.last.json 2>/dev/null || true
            git add \
              contracts/operations/controlled-saturation-ramp-contract.v1.json \
              contracts/operations/load-test-scenario-contract.v1.json \
              contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/controlled-saturation-ramp-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              reconciled=true
              break
            fi
            git commit -m "docs(ops): register controlled saturation evidence"
            if git push origin HEAD:so; then
              reconciled=true
              break
            fi
          done
          test "$reconciled" = true

      - name: Record privacy-safe diagnostic
        if: env.CONTROLLED_RAMP_EXIT_CODE != '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced; refusing to replay stale controlled-ramp diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          text = Path("/tmp/memory-os-controlled-saturation.log").read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"postgres(?:ql)?://[^\s]+", "<redacted-database-url>", text)
          text = re.sub(r"https?://[^\s]+", "<redacted-endpoint>", text)
          text = text.replace("minioadmin", "<redacted-local-credential>")
          text = re.sub(r"Bearer\s+\S+", "Bearer <redacted>", text, flags=re.I)
          text = re.sub(r"acct_[A-Za-z0-9_-]+", "<redacted-synthetic-account>", text)
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "controlled-saturation-ramp",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["CONTROLLED_RAMP_EXIT_CODE"]),
              "output": text[-12000:],
              "containsSecrets": False,
              "productionEvidence": False,
              "productionEquivalentDependencies": False,
              "capacityBoundaryEstablished": False,
              "operationalThresholdApproved": False,
          }
          path = Path("docs/fixtures/memory-os-operability/controlled-saturation-ramp-diagnostic.last.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          git add docs/fixtures/memory-os-operability/controlled-saturation-ramp-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(load): record controlled saturation ramp diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced after diagnostic creation; refusing stale push."
            exit 75
          fi
          git push origin HEAD:so

      - name: Enforce checkpoint success
        run: test "${CONTROLLED_RAMP_EXIT_CODE}" = "0"
