name: Import API Security Slice

on:
  pull_request:
    paths:
      - "services/import-api/**"
      - ".github/workflows/import-api-security-slice.yml"
  push:
    branches:
      - so
    paths:
      - "services/import-api/**"
      - ".github/workflows/import-api-security-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    env:
      MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security
      MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    defaults:
      run:
        working-directory: services/import-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: Fuzz Generic CSV parser smoke
        env:
          GOMAXPROCS: "4"
        run: go test -run='^$' -fuzz=FuzzParserNeverPanicsOrExpandsLimits -fuzztime=5s -timeout=30s ./internal/adapters/genericcsv

      - name: Fuzz Apple JWT parser smoke
        env:
          GOMAXPROCS: "4"
        run: go test -run='^$' -fuzz=FuzzParseCompactTokenNeverPanics -fuzztime=5s -timeout=30s ./internal/appleauth
