name: Mixed-Version Candidate Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/mixed-version-candidate.yml"
      - "scripts/run-memory-os-mixed-version-candidate.sh"
      - "scripts/validate-memory-os-mixed-version-candidate.py"
      - "scripts/reconcile-memory-os-mixed-version-candidate.py"
      - "contracts/operations/mixed-version-candidate-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-rejections.v1.json"
      - "infra/postgresql/security/**"
      - "services/import-api/**"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/mixed-version-candidate.yml"
      - "scripts/run-memory-os-mixed-version-candidate.sh"
      - "scripts/validate-memory-os-mixed-version-candidate.py"
      - "scripts/reconcile-memory-os-mixed-version-candidate.py"
      - "contracts/operations/mixed-version-candidate-contract.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-rejections.v1.json"
      - "infra/postgresql/security/**"
      - "services/import-api/**"
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixed-version-candidate-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  candidate-compatibility:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(version): reconcile candidate baseline evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGOPTIONS: "-c client_min_messages=warning"
      GOFLAGS: "-p=1"
      MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEMORY_OS_ALLOW_EPHEMERAL_DATABASE_DROP: "1"

    steps:
      - name: Checkout exact source with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Normalize pg_dump volatile restrict tokens
        run: |
          real_pg_dump="$(command -v pg_dump)"
          mkdir -p "$RUNNER_TEMP/normalized-pg-tools"
          cat > "$RUNNER_TEMP/normalized-pg-tools/pg_dump" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$real_pg_dump" "\$@" | sed -E '/^\\\\(un)?restrict[[:space:]]/d'
          EOF
          chmod 0755 "$RUNNER_TEMP/normalized-pg-tools/pg_dump"
          echo "$RUNNER_TEMP/normalized-pg-tools" >> "$GITHUB_PATH"

      - name: Start local MinIO
        run: |
          docker run -d --name memory-os-mixed-version-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-mixed-version-minio
          exit 1

      - name: Verify exact source state
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -n "$EXPECTED_SHA"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          git cat-file -e 2af6e8e10755cc707c6bdd958a049a0f4afb3d70^{commit}
          bash -n scripts/run-memory-os-mixed-version-candidate.sh
          python -m py_compile \
            scripts/validate-memory-os-mixed-version-candidate.py \
            scripts/reconcile-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-mixed-version-candidate.py

      - name: Run candidate baseline compatibility drill
        id: drill
        env:
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          MEMORY_OS_MIXED_VERSION_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json
        run: |
          set +e
          bash scripts/run-memory-os-mixed-version-candidate.sh \
            >"$RUNNER_TEMP/mixed-version-candidate.log" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record bounded failure diagnostic
        if: steps.drill.outputs.exit_code != '0'
        env:
          DRILL_EXIT_CODE: ${{ steps.drill.outputs.exit_code }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          raw_path = Path(os.environ["RUNNER_TEMP"]) / "mixed-version-candidate.log"
          raw = raw_path.read_text(encoding="utf-8", errors="replace") if raw_path.exists() else "runner log unavailable"
          redacted = re.sub(r"(?:postgres|postgresql)://\S+", "[REDACTED_DATABASE_URL]", raw, flags=re.I)
          redacted = re.sub(r"(?i)(password|secret|access[_-]?key)\s*[=:]\s*\S+", r"\1=[REDACTED]", redacted)
          redacted = redacted.replace("minioadmin", "[REDACTED_CREDENTIAL]")
          redacted = re.sub(r"/tmp/memory-os-mixed-version\.[^\s/]+", "[REDACTED_WORKTREE]", redacted)
          redacted = redacted[-4000:]
          path = Path("docs/fixtures/memory-os-operability/mixed-version-candidate-diagnostic.last.json")
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "mixed-version-candidate",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["DRILL_EXIT_CODE"]),
              "generatedAt": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "output": redacted,
              "outputBytesBeforeTruncation": len(raw.encode("utf-8", errors="replace")),
              "containsSecrets": False,
              "productionEvidence": False,
          }
          payload = (json.dumps(value, indent=2) + "\n").encode("utf-8")
          temp_path = path.with_name(f".{path.name}.{os.getpid()}.tmp")
          try:
              with temp_path.open("wb") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_path, path)
          finally:
              temp_path.unlink(missing_ok=True)
          PY

      - name: Commit failure diagnostic
        if: steps.drill.outputs.exit_code != '0' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced while candidate compatibility ran; refusing stale diagnostic."
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/mixed-version-candidate-diagnostic.last.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(version): record candidate compatibility failure diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced before candidate diagnostic push; refusing stale diagnostic."
            exit 75
          fi
          git push origin HEAD:so

      - name: Fail after diagnostic
        if: steps.drill.outputs.exit_code != '0'
        run: exit 1

      - name: Validate exact-source result
        env:
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: python scripts/validate-memory-os-mixed-version-candidate.py

      - name: Commit exact-source result and clear stale diagnostic
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced while candidate compatibility ran; refusing stale evidence."
            exit 75
          fi
          diagnostic_path="docs/fixtures/memory-os-operability/mixed-version-candidate-diagnostic.last.json"
          rm -f "$diagnostic_path"
          git add docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json
          if git ls-files --error-unmatch "$diagnostic_path" >/dev/null 2>&1; then
            git add -u -- "$diagnostic_path"
          fi
          if git diff --cached --quiet; then
            echo "Candidate compatibility evidence is already current."
            echo "EVIDENCE_COMMIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(version): record candidate baseline compatibility evidence"
            EVIDENCE_COMMIT_SHA="$(git rev-parse HEAD)"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "so advanced before candidate evidence push; refusing stale evidence."
              exit 75
            fi
            git push origin HEAD:so
            echo "EVIDENCE_COMMIT_SHA=$EVIDENCE_COMMIT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Reconcile candidate authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$EVIDENCE_COMMIT_SHA"
          if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
            echo "so advanced before candidate authority reconciliation; refusing stale authority."
            exit 75
          fi
          python scripts/reconcile-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-version-compatibility.py

      - name: Commit reconciled authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add \
            contracts/operations/mixed-version-candidate-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Candidate compatibility authority is already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): reconcile candidate baseline evidence"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
            echo "so advanced before candidate authority push; refusing stale authority."
            exit 75
          fi
          git push origin HEAD:so
