name: Rate Limit Emergency Ledger

on:
  push:
    branches:
      - so
    paths:
      - "contracts/operations/requests/rate-limit-emergency-ledger-foundation.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-limit-emergency-ledger-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile and validate ledger foundation
        id: ledger
        run: |
          set +e
          log=/tmp/rate-limit-emergency-ledger.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-rate-limit-emergency-operation.py \
            scripts/evaluate-memory-os-rate-limit-emergency-state.py \
            scripts/validate-memory-os-rate-limit-emergency-ledger.py \
            scripts/reconcile-memory-os-rate-limit-emergency-ledger.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-rate-limit-emergency-ledger.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-rate-limit-operations.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-rate-limit.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded ledger authority
        if: steps.ledger.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/rate-limit-emergency-ledger-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/rate-limit-emergency-ledger-contract.v1.json \
            contracts/operations/rate-limit-emergency-ledger.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/rate-limit-emergency-ledger-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(rate-limit): register emergency ledger foundation"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.ledger.outputs.exit_code != '0'
        env:
          LEDGER_EXIT_CODE: ${{ steps.ledger.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('/tmp/rate-limit-emergency-ledger.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'rate-limit-emergency-ledger',
              'result': 'FAIL',
              'exitCode': int(os.environ['LEDGER_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'runtimeControlPlaneIntegrated': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/rate-limit-emergency-ledger-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/rate-limit-emergency-ledger-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(rate-limit): record emergency ledger diagnostic"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Enforce ledger validation
        run: test "${{ steps.ledger.outputs.exit_code }}" = "0"
