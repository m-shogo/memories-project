name: Deletion Pre-Fence Upload Completion

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/deletion-prefence-upload-completion.yml"
      - "contracts/operations/deletion-prefence-upload-completion-contract.v1.json"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/reconcile-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py"
      - "services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go"
      - "services/import-api/internal/httpserver/server_live_test.go"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
      - "services/import-api/internal/httpserver/server.go"
      - "services/import-api/internal/fenced/**"
      - "services/import-api/internal/epochguard/**"
      - "services/import-api/internal/authstore/**"
      - "services/import-api/internal/accountdelete/**"
      - "services/import-api/internal/pgrepo/**"
      - "services/import-api/internal/dbscope/**"
      - "services/import-api/internal/pgscope/**"
      - "services/import-api/internal/upload/**"
      - "services/import-api/internal/objectstore/**"
      - "infra/postgresql/security/**"
      - "services/import-api/go.mod"
      - "services/import-api/go.sum"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deletion-prefence-upload-completion-so
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture exact source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Start local MinIO
        run: |
          set -euo pipefail
          docker run -d --name memory-os-prefence-upload-completion-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Local MinIO health failed; raw container logs withheld."
          exit 1

      - name: Execute exact-source proof with bounded log
        id: proof
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_PREFENCE_UPLOAD_COMPLETION: "1"
          MEMORY_OS_PREFENCE_UPLOAD_COMPLETION_RESULTS_PATH: ../../../../docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-results.sample.v1.json
        run: |
          set +e
          export MEMORY_OS_COMMIT_SHA="$SOURCE_SHA"
          log=/tmp/memory-os-prefence-upload-completion.log
          : > "$log"
          trap 'rm -f "$log"' EXIT
          result=docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-results.sample.v1.json
          code=0
          echo "STAGE: python-and-contract" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-deletion-prefence-upload-completion.py \
            scripts/reconcile-memory-os-deletion-prefence-upload-completion.py \
            scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-deletion-prefence-upload-completion.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: gofmt" >> "$log"
            test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go)" \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            rm -f "$result"
            echo "STAGE: live-proof" >> "$log"
            (
              cd services/import-api
              go test ./internal/httpserver \
                -run '^TestAccountDeletionPrefenceUploadCompletionLocalDependencies$' \
                -count=1 -timeout=15m
            ) >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: exact-result-validation" >> "$log"
            python scripts/validate-memory-os-deletion-prefence-upload-completion.py \
              --require-result \
              --expected-commit-sha "$SOURCE_SHA" \
              >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact-source result
        if: steps.proof.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced while upload-completion proof ran; refusing stale evidence."
            exit 75
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-results.sample.v1.json
          if git diff --cached --quiet; then
            echo "Pre-fence upload result unchanged; skipping no-op commit."
            echo "RESULT_COMMIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          else
            git commit -m "test(deletion): record in-flight upload completion result"
            echo "RESULT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced before pre-fence upload result push; refusing stale evidence."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Reconcile local-only authority
        if: steps.proof.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$RESULT_COMMIT_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$RESULT_COMMIT_SHA" ]]; then
            echo "Branch advanced after upload-completion result commit; refusing stale derived authority."
            exit 75
          fi
          export EXPECTED_COMMIT_SHA="$SOURCE_SHA"
          python scripts/reconcile-memory-os-deletion-prefence-upload-completion.py
          python scripts/validate-memory-os-deletion-prefence-upload-completion.py \
            --require-result --expected-commit-sha "$SOURCE_SHA"
          git rm -f docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-diagnostic.last.json 2>/dev/null || true
          git add contracts/operations/deletion-prefence-upload-completion-contract.v1.json
          git add -u docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): register in-flight upload completion evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$RESULT_COMMIT_SHA" ]]; then
              echo "Branch advanced during upload-completion authority reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Record privacy-safe failure diagnostic
        if: steps.proof.outputs.exit_code != '0'
        env:
          PROOF_EXIT_CODE: ${{ steps.proof.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after failed upload-completion proof; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          repo = Path.cwd().resolve(strict=True)
          path = repo / "docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-diagnostic.last.json"
          payload = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "deletion-prefence-upload-completion",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["PROOF_EXIT_CODE"]),
              "output": "Pre-fence upload proof failed; raw validator output withheld.",
              "containsSecrets": False,
              "productionEvidence": False,
              "productionEquivalentDependencies": False,
              "hostFailureCovered": False,
          }
          data = (json.dumps(payload, indent=2) + "\n").encode("utf-8")
          if not path.parent.is_dir():
              raise RuntimeError("Pre-fence upload diagnostic parent missing")
          candidate = repo
          for component in path.relative_to(repo).parts:
              candidate = candidate / component
              if candidate.is_symlink():
                  raise RuntimeError("Pre-fence upload diagnostic path must not be a symlink")
          try:
              path.parent.resolve(strict=True).relative_to(repo)
          except ValueError as exc:
              raise RuntimeError("Pre-fence upload diagnostic parent escaped repository") from exc
          if path.exists() and not path.is_file():
              raise RuntimeError("Pre-fence upload diagnostic target must be regular")
          mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=path.parent)
          tmp = Path(name)
          try:
              if mode is not None:
                  os.fchmod(fd, mode)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp, path)
          finally:
              if tmp.exists():
                  tmp.unlink()
          PY
          git add docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(deletion): record in-flight upload completion diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during upload-completion diagnostic write; refusing stale diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Enforce proof result
        run: test "${{ steps.proof.outputs.exit_code }}" = "0"
