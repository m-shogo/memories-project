name: Release Baseline Registry

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/release-baseline-registry.yml"
      - ".github/workflows/release-baseline-registry-source-negative.yml"
      - "scripts/validate-memory-os-release-baseline-registry-workflow-source-negative.py"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "docs/evidence/releases/README.md"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/validate-memory-os-release-baseline-writer-authority-negative.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-release-baseline-registry-negative.py"
      - "scripts/validate-memory-os-release-baseline-evidence-binding.py"
      - "scripts/validate-memory-os-release-baseline-evidence-binding-negative.py"
      - "scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/release-baseline-registry.yml"
      - ".github/workflows/release-baseline-registry-source-negative.yml"
      - "scripts/validate-memory-os-release-baseline-registry-workflow-source-negative.py"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "docs/evidence/releases/README.md"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/validate-memory-os-release-baseline-writer-authority-negative.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-release-baseline-registry-negative.py"
      - "scripts/validate-memory-os-release-baseline-evidence-binding.py"
      - "scripts/validate-memory-os-release-baseline-evidence-binding-negative.py"
      - "scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py"
      - "scripts/reconcile-memory-os-release-baseline-registry.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-operability.py"
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-baseline-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact clean PR source and compile tools
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="${{ github.event.pull_request.head.sha }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-release-baseline-registry-workflow-source-negative.py
          python -m py_compile \
            scripts/register-memory-os-release-baseline.py \
            scripts/validate-memory-os-release-baseline-writer-authority-negative.py \
            scripts/validate-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-release-baseline-registry-negative.py \
            scripts/validate-memory-os-release-baseline-evidence-binding.py \
            scripts/validate-memory-os-release-baseline-evidence-binding-negative.py \
            scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py \
            scripts/reconcile-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-operability.py

      - name: Validate release writer authority boundary
        run: python scripts/validate-memory-os-release-baseline-writer-authority-negative.py

      - name: Prove invalid registration cannot mutate authority
        run: |
          registry="contracts/operations/release-baseline-registry.v1.json"
          lock="contracts/operations/.release-baseline-registry.lock"
          before="$(sha256sum "$registry" | awk '{print $1}')"
          incomplete="$RUNNER_TEMP/incomplete-release-record.json"
          unbound="$RUNNER_TEMP/unbound-release-record.json"
          printf '{}\n' > "$incomplete"

          if python scripts/register-memory-os-release-baseline.py \
              --record "$incomplete" --confirm "WRONG CONFIRMATION"; then
            echo "writer accepted an incorrect confirmation" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"

          if python scripts/register-memory-os-release-baseline.py \
              --record "$incomplete" --confirm "REGISTER APPROVED RELEASE BASELINE"; then
            echo "writer accepted an incomplete record" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"

          HEAD_SHA="$(git rev-parse HEAD)" OUT="$unbound" python - <<'PY'
          import json
          import os
          from pathlib import Path

          digest = "0" * 64
          record = {
              "schemaVersion": "memory-os-release-baseline-record.v1",
              "releaseId": "rel_20991231_unbound-ci-tag",
              "releaseTag": "v9999.0.0-unregistered-ci",
              "commitSha": os.environ["HEAD_SHA"],
              "approvedAt": "2099-12-31T00:00:00Z",
              "approvalClass": "PRODUCTION_RELEASE_BASELINE",
              "approvers": [
                  {"role": "SECURITY_REVIEWER", "approverRef": "apr_security_ci1"},
                  {"role": "OPERABILITY_REVIEWER", "approverRef": "apr_operability_ci2"},
                  {"role": "RELEASE_OWNER", "approverRef": "apr_release_ci3"},
              ],
              "apiContractSha256": digest,
              "migrationSequenceSha256": digest,
              "parserArtifactSetSha256": digest,
              "runtimeConfigurationSchemaSha256": digest,
              "compatibilityEvidenceRefs": [
                  "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
              ],
              "restoreEvidenceRefs": [
                  "docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json"
              ],
              "securityEvidenceRefs": [
                  "contracts/operations/production-operability-status.json"
              ],
              "rollbackEligibility": {
                  "status": "NOT_ELIGIBLE",
                  "verified": False,
                  "conditions": [],
              },
              "openRisks": [],
              "evidenceComplete": True,
              "productionReady": True,
          }
          Path(os.environ["OUT"]).write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY

          if python scripts/register-memory-os-release-baseline.py \
              --record "$unbound" --confirm "REGISTER APPROVED RELEASE BASELINE"; then
            echo "writer accepted a release tag that is not bound to HEAD" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"
          test -z "$(git status --porcelain)"

      - name: Validate append-only registry corruption negatives
        run: python scripts/validate-memory-os-release-baseline-registry-negative.py

      - name: Validate release reconcile authority negatives
        run: python scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py

      - name: Validate immutable release evidence source binding
        run: |
          python scripts/validate-memory-os-release-baseline-evidence-binding.py
          python scripts/validate-memory-os-release-baseline-evidence-binding-negative.py

      - name: Reconcile then validate release registry authority
        run: |
          python scripts/reconcile-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-release-baseline-evidence-binding.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py

      - name: Require reconciled authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture exact release authority source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME:-}" == "schedule" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          python scripts/validate-memory-os-release-baseline-registry-workflow-source-negative.py

      - name: Confirm clean source and compile tools
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/register-memory-os-release-baseline.py \
            scripts/validate-memory-os-release-baseline-writer-authority-negative.py \
            scripts/validate-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-release-baseline-registry-negative.py \
            scripts/validate-memory-os-release-baseline-evidence-binding.py \
            scripts/validate-memory-os-release-baseline-evidence-binding-negative.py \
            scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py \
            scripts/reconcile-memory-os-release-baseline-registry.py \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-operability.py

      - name: Validate release writer authority boundary
        run: python scripts/validate-memory-os-release-baseline-writer-authority-negative.py

      - name: Prove invalid registration cannot mutate authority
        run: |
          registry="contracts/operations/release-baseline-registry.v1.json"
          lock="contracts/operations/.release-baseline-registry.lock"
          before="$(sha256sum "$registry" | awk '{print $1}')"
          incomplete="$RUNNER_TEMP/incomplete-release-record.json"
          unbound="$RUNNER_TEMP/unbound-release-record.json"
          printf '{}\n' > "$incomplete"

          if python scripts/register-memory-os-release-baseline.py \
              --record "$incomplete" --confirm "WRONG CONFIRMATION"; then
            echo "writer accepted an incorrect confirmation" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"

          if python scripts/register-memory-os-release-baseline.py \
              --record "$incomplete" --confirm "REGISTER APPROVED RELEASE BASELINE"; then
            echo "writer accepted an incomplete record" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"

          HEAD_SHA="$(git rev-parse HEAD)" OUT="$unbound" python - <<'PY'
          import json
          import os
          from pathlib import Path

          digest = "0" * 64
          record = {
              "schemaVersion": "memory-os-release-baseline-record.v1",
              "releaseId": "rel_20991231_unbound-ci-tag",
              "releaseTag": "v9999.0.0-unregistered-ci",
              "commitSha": os.environ["HEAD_SHA"],
              "approvedAt": "2099-12-31T00:00:00Z",
              "approvalClass": "PRODUCTION_RELEASE_BASELINE",
              "approvers": [
                  {"role": "SECURITY_REVIEWER", "approverRef": "apr_security_ci1"},
                  {"role": "OPERABILITY_REVIEWER", "approverRef": "apr_operability_ci2"},
                  {"role": "RELEASE_OWNER", "approverRef": "apr_release_ci3"},
              ],
              "apiContractSha256": digest,
              "migrationSequenceSha256": digest,
              "parserArtifactSetSha256": digest,
              "runtimeConfigurationSchemaSha256": digest,
              "compatibilityEvidenceRefs": [
                  "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
              ],
              "restoreEvidenceRefs": [
                  "docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json"
              ],
              "securityEvidenceRefs": [
                  "contracts/operations/production-operability-status.json"
              ],
              "rollbackEligibility": {
                  "status": "NOT_ELIGIBLE",
                  "verified": False,
                  "conditions": [],
              },
              "openRisks": [],
              "evidenceComplete": True,
              "productionReady": True,
          }
          Path(os.environ["OUT"]).write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY

          if python scripts/register-memory-os-release-baseline.py \
              --record "$unbound" --confirm "REGISTER APPROVED RELEASE BASELINE"; then
            echo "writer accepted a release tag that is not bound to HEAD" >&2
            exit 1
          fi
          test "$(sha256sum "$registry" | awk '{print $1}')" = "$before"
          test ! -e "$lock"
          test -z "$(git status --porcelain)"

      - name: Validate append-only registry corruption negatives
        run: python scripts/validate-memory-os-release-baseline-registry-negative.py

      - name: Validate release reconcile authority negatives
        run: python scripts/validate-memory-os-release-baseline-reconcile-authority-negative.py

      - name: Validate immutable release evidence source binding
        run: |
          python scripts/validate-memory-os-release-baseline-evidence-binding.py
          python scripts/validate-memory-os-release-baseline-evidence-binding-negative.py

      - name: Reconcile then validate release registry authority
        run: |
          python scripts/reconcile-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-release-baseline-evidence-binding.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py

      - name: Commit release-specific authority
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Release baseline authority source changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git add \
            contracts/operations/release-baseline-registry-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Release baseline registry authority is already current."
          else
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(version): register release baseline authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after release validation; refusing to rebase stale release authority."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Re-read committed authority and run aggregate checks
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-release-baseline-evidence-binding.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py
