name: Operability Admission Inventory Atomic Write Source Negative

on:
  pull_request:
    branches: [so]
    paths:
      - ".github/workflows/operability-admission-inventory-atomic-write-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-replacement-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-write-source-negative.yml"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py"
  push:
    branches: [so]
    paths:
      - ".github/workflows/operability-admission-inventory-atomic-write-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-replacement-negative.yml"
      - ".github/workflows/operability-admission-inventory-atomic-write-source-negative.yml"
      - "scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py"

permissions:
  contents: read

jobs:
  source-admission:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/so')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require exact atomic-write source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${PR_HEAD_SHA:-}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove atomic-write CI source admission
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-operability-admission-inventory-atomic-write-workflow-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
