name: Capacity Ramp Authority Negative

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/capacity-ramp-authority-negative.yml"
      - ".github/workflows/capacity-ramp.yml"
      - "scripts/reconcile-memory-os-capacity-ramp-status.py"
      - "scripts/validate-memory-os-capacity-ramp-authority-negative.py"
      - "scripts/validate-memory-os-capacity-ramp.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/capacity-ramp-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/capacity-ramp-results.sample.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/capacity-ramp-authority-negative.yml"
      - ".github/workflows/capacity-ramp.yml"
      - "scripts/reconcile-memory-os-capacity-ramp-status.py"
      - "scripts/validate-memory-os-capacity-ramp-authority-negative.py"
      - "scripts/validate-memory-os-capacity-ramp.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/capacity-ramp-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/capacity-ramp-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacity-ramp-authority-negative-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm exact clean source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${PR_BASE:-}" = "so"
          else
            [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
            test "${GITHUB_REF:-}" = "refs/heads/so"
          fi
          [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Execute canonical capacity authority negative read-only
        run: |
          set -euo pipefail
          python -B scripts/validate-memory-os-capacity-ramp-authority-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
