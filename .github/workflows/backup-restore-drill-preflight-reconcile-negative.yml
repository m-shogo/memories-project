name: Backup Restore Drill Preflight Reconcile Negative

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-drill-preflight-reconcile-negative.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-workflow-negative.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-drill-preflight-reconcile-negative.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-workflow-negative.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-preflight-reconcile-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate exact clean authority source
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed semantic preflight reconcile negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          authorities=(
            contracts/operations/backup-restore-drill-preflight-contract.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          for authority in "${authorities[@]}"; do
            printf '%s %s\n' "$authority" "$(stat -c '%a' "$authority")"
          done > "$RUNNER_TEMP/preflight-authority-modes.before"
      - name: Compile preflight rollback proof
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-workflow-negative.py
          python -m py_compile \
            scripts/reconcile-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py
      - name: Prove preflight partial-publication rollback
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py
      - name: Verify rollback proof is read-only
        run: |
          set -euo pipefail
          authorities=(
            contracts/operations/backup-restore-drill-preflight-contract.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          for authority in "${authorities[@]}"; do
            printf '%s %s\n' "$authority" "$(stat -c '%a' "$authority")"
          done > "$RUNNER_TEMP/preflight-authority-modes.after"
          cmp "$RUNNER_TEMP/preflight-authority-modes.before" "$RUNNER_TEMP/preflight-authority-modes.after"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"