name: Rate Limit Emergency Authority Cleanup

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-emergency-authority-cleanup.yml"
      - "contracts/operations/requests/rate-limit-emergency-authority-cleanup.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-limit-emergency-authority-cleanup-so
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact cleanup source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Emergency authority cleanup source is stale before validation: $source_sha != $remote_sha" >&2
            exit 75
          fi
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Remove duplicate authority and validate canonical authority
        id: cleanup
        run: |
          set +e
          log=/tmp/rate-limit-emergency-authority-cleanup.log
          : > "$log"
          code=0
          python - <<'PY' >> "$log" 2>&1 || code=$?
          import json
          from pathlib import Path
          path = Path('contracts/operations/production-operability-status.json')
          status = json.loads(path.read_text(encoding='utf-8'))
          gate = next(row for row in status['areas'] if row.get('id') == 'OPS-P0-005')
          prefix = 'append-only rate-limit emergency-operation ledger foundation is implemented'
          gate['existingEvidence'] = [item for item in gate.get('existingEvidence', []) if not str(item).startswith(prefix)]
          duplicate_refs = {
              'contracts/operations/rate-limit-emergency-ledger-contract.v1.json',
              'contracts/operations/rate-limit-emergency-ledger.v1.json',
              'scripts/register-memory-os-rate-limit-emergency-operation.py',
              'scripts/validate-memory-os-rate-limit-emergency-ledger.py',
              'scripts/reconcile-memory-os-rate-limit-emergency-ledger.py',
              '.github/workflows/rate-limit-emergency-ledger.yml',
          }
          gate['evidenceRefs'] = [ref for ref in gate.get('evidenceRefs', []) if ref not in duplicate_refs]
          evidence = (
              'canonical per-operation rate-limit evidence ledger provides exclusive append-only records, privacy validation, distinct operator/reviewer handles, bounded 60-minute expiry and recovery verification; a supplemental read-only evaluator classifies expired records fail-closed without mutating runtime or claiming automatic production expiry'
          )
          if evidence not in gate['existingEvidence']:
              gate['existingEvidence'].append(evidence)
          for ref in (
              'contracts/operations/rate-limit-operation-evidence-contract.v1.json',
              'docs/evidence/rate-limit-operations/README.md',
              'scripts/create-memory-os-rate-limit-operation-evidence.py',
              'scripts/validate-memory-os-rate-limit-operation-evidence.py',
              'scripts/evaluate-memory-os-rate-limit-emergency-state.py',
          ):
              if ref not in gate['evidenceRefs']:
                  gate['evidenceRefs'].append(ref)
          path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          if [[ "$code" == "0" ]]; then
            git rm -f --ignore-unmatch \
              contracts/operations/rate-limit-emergency-ledger-contract.v1.json \
              contracts/operations/rate-limit-emergency-ledger.v1.json \
              scripts/register-memory-os-rate-limit-emergency-operation.py \
              scripts/validate-memory-os-rate-limit-emergency-ledger.py \
              scripts/reconcile-memory-os-rate-limit-emergency-ledger.py \
              .github/workflows/rate-limit-emergency-ledger.yml \
              contracts/operations/requests/rate-limit-emergency-ledger-foundation.v1.json \
              >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python -m py_compile scripts/evaluate-memory-os-rate-limit-emergency-state.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-rate-limit-operation-evidence.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-rate-limit-operations.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-rate-limit.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit consolidated authority
        if: steps.cleanup.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Emergency authority cleanup source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          rm -f docs/fixtures/memory-os-operability/rate-limit-emergency-authority-cleanup-diagnostic.last.json
          git add \
            contracts/operations/production-operability-status.json \
            scripts/evaluate-memory-os-rate-limit-emergency-state.py
          git add -u
          if git diff --cached --quiet; then
            echo "Emergency authority cleanup already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(rate-limit): consolidate emergency evidence authority"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Emergency authority cleanup source became stale before push: $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
      - name: Record cleanup diagnostic
        if: steps.cleanup.outputs.exit_code != '0'
        env:
          CLEANUP_EXIT_CODE: ${{ steps.cleanup.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Emergency authority cleanup diagnostic source is stale: failed $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/rate-limit-emergency-authority-cleanup.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'rate-limit-emergency-authority-cleanup',
              'sourceCommitSha': os.environ.get('SOURCE_SHA', ''),
              'result': 'FAIL',
              'exitCode': int(os.environ['CLEANUP_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/rate-limit-emergency-authority-cleanup-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/rate-limit-emergency-authority-cleanup-diagnostic.last.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(rate-limit): record emergency authority cleanup diagnostic"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
              echo "Emergency authority cleanup diagnostic source became stale before push: $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce cleanup
        run: test "${{ steps.cleanup.outputs.exit_code }}" = "0"
