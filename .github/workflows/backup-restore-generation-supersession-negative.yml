name: Backup Restore Generation Supersession Negative

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-supersession-negative.yml"
      - "scripts/validate-memory-os-backup-restore-generation-supersession-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-generation-supersession-negative-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact so authority
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          test -z "$(git status --porcelain)"
      - name: Prove superseded generations invalidate candidates
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate-memory-os-backup-restore-generation-supersession-negative.py
          python scripts/validate-memory-os-backup-restore-generation-supersession-negative.py
