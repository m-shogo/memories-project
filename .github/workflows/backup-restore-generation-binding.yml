name: Backup Restore Generation Binding

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-generation-binding.yml"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-contract.v1.json"
      - "contracts/operations/backup-restore-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/requests/backup-restore-generation-reconcile.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-status.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-binding.yml"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-contract.v1.json"
      - "contracts/operations/backup-restore-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/requests/backup-restore-generation-reconcile.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-status.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-generation-binding-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generation binding authority read-only
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-status.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-recovery-objectives.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py
          python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
          python scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          python scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py
          python scripts/reconcile-memory-os-backup-restore-generation-status.py
          python scripts/validate-memory-os-backup-restore.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact generation binding authority source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
      - name: Validate and reconcile restore generation admission
        id: restore
        run: |
          set +e
          log=/tmp/backup-restore-generation-binding.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-status.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-backup-restore-generation-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Reject stale generation binding authority on pull requests
        if: steps.restore.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/operations/production-operability-status.json
      - name: Commit bounded restore-generation authority
        if: steps.restore.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-generation-binding.log

          revalidate_latest_generation_binding() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-generation-status.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again during bounded generation-binding retry; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced; regenerating and revalidating generation binding once from latest so."
              revalidate_latest_generation_binding
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-generation-reconcile-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-generation-reconcile-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile generation evidence authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again after bounded generation-binding validation; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced after validation; discarding stale generation-binding commit and retrying from latest so."
              revalidate_latest_generation_binding
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Generation-binding push raced with another writer; retrying once from latest so."
            revalidate_latest_generation_binding
          done
          exit 75
      - name: Record privacy-safe reconcile diagnostic
        if: steps.restore.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          RESTORE_EXIT_CODE: ${{ steps.restore.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Repository HEAD changed after generation binding validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/backup-restore-generation-binding.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-generation-binding',
              'result': 'FAIL',
              'exitCode': int(os.environ['RESTORE_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEquivalentRestoreEvidence': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-generation-reconcile-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-generation-reconcile-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record generation reconcile diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Repository HEAD changed before generation binding diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce restore generation reconciliation
        run: test "${{ steps.restore.outputs.exit_code }}" = "0"
