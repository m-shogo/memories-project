name: Reconcile Upload Completion Load Authority

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-upload-completion-load-authority.yml"
      - "scripts/reconcile-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/reconcile-memory-os-upload-completion-load-authority.py"
      - "scripts/validate-memory-os-upload-completion-load-reconcile-negative.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-upload-completion-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-results.sample.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-upload-completion-load-authority.yml"
      - "scripts/reconcile-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-upload-completion.py"
      - "scripts/reconcile-memory-os-upload-completion-load-authority.py"
      - "scripts/validate-memory-os-upload-completion-load-reconcile-negative.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-upload-completion-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-upload-completion-load-authority-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact PR-head upload completion authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-prefence-upload-completion.py \
            scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py \
            scripts/validate-memory-os-deletion-prefence-upload-completion.py \
            scripts/reconcile-memory-os-upload-completion-load-authority.py \
            scripts/validate-memory-os-upload-completion-load-reconcile-negative.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py
          python scripts/validate-memory-os-upload-completion-load-reconcile-negative.py
          python scripts/reconcile-memory-os-upload-completion-load-authority.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile exact-source local proof into canonical load authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-prefence-upload-completion.py \
            scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py \
            scripts/validate-memory-os-deletion-prefence-upload-completion.py \
            scripts/reconcile-memory-os-upload-completion-load-authority.py \
            scripts/validate-memory-os-upload-completion-load-reconcile-negative.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-prefence-upload-completion-reconcile-negative.py
          python scripts/validate-memory-os-upload-completion-load-reconcile-negative.py
          python scripts/reconcile-memory-os-upload-completion-load-authority.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
      - name: Commit canonical authority update
        run: |
          set -euo pipefail
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(load): register upload completion fence evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during upload-completion load reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
