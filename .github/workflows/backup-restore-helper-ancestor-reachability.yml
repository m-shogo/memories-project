name: Backup Restore Helper Ancestor Reachability

on:
  push:
    branches: [so]
    paths:
      - ".github/workflows/backup-restore-helper-ancestor-reachability.yml"
      - "scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py"
  pull_request:
    paths:
      - ".github/workflows/backup-restore-helper-ancestor-reachability.yml"
      - "scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove seven canonical ancestor negatives remain reachable
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py
          python scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py
          python scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py --negative
      - name: Prove six other helper ancestor races without downstream admission dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          for filename in (
              "validate-memory-os-backup-restore-non-resurrection-load-negative.py",
              "validate-memory-os-backup-restore-generation-evidence-load-negative.py",
              "validate-memory-os-backup-restore-non-resurrection-transport-negative.py",
              "validate-memory-os-backup-restore-generation-binding-negative.py",
              "validate-memory-os-backup-restore-drill-request-reconcile-negative.py",
              "validate-memory-os-backup-restore-admission-chain-reconcile-negative.py",
          ):
              proof = runpy.run_path(f"scripts/{filename}")
              proof["prove_helper_ancestor_swap_during_fd_walk_rejected"]()
          PY
      - name: Prove preflight reconcile helper races without downstream source-binding dependency
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          proof = runpy.run_path("scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py")
          for name in (
              "prove_helper_source_symlink_rejected",
              "prove_helper_source_swap_during_import_is_pinned",
              "prove_helper_parent_swap_after_pin_uses_original_source",
              "prove_helper_ancestor_swap_during_fd_walk_rejected",
          ):
              proof[name]()
          PY
      - name: Verify read-only postcondition
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
