name: Reconcile Compatibility Authority Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-compatibility-authority-diagnostic.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-compatibility-authority-diagnostic.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-compatibility-authority-diagnostic-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'docs(version): register bounded compatibility authority diagnostic') &&
       !contains(github.event.head_commit.message, 'test(version): record compatibility authority diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi

      - name: Validate and reconcile with stage capture
        run: |
          set +e
          log=/tmp/memory-os-compatibility-authority.log
          : > "$log"
          code=0
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: canonical-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: status-reconcile" >> "$log"
            python scripts/reconcile-memory-os-version-compatibility-foundation-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: foundation-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility-foundations.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: aggregate-validator" >> "$log"
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "COMPATIBILITY_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request' && env.COMPATIBILITY_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- contracts/operations/production-operability-status.json

      - name: Commit bounded compatibility status
        if: github.event_name != 'pull_request' && env.COMPATIBILITY_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add contracts/operations/production-operability-status.json
          if git ls-files --error-unmatch docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json >/dev/null 2>&1; then
            rm -f docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
            git add -A docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
          fi
          if git diff --cached --quiet; then
            echo "Bounded compatibility status already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): register bounded compatibility authority diagnostic"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Compatibility authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Record privacy-safe diagnostic
        if: github.event_name != 'pull_request' && env.COMPATIBILITY_EXIT_CODE != '0'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          text = Path("/tmp/memory-os-compatibility-authority.log").read_text(encoding="utf-8", errors="replace")
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "reconcile-compatibility-authority-diagnostic",
              "sourceCommitSha": os.environ["GITHUB_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["COMPATIBILITY_EXIT_CODE"]),
              "output": text[-12000:],
              "containsSecrets": False,
              "productionEvidence": False,
              "releaseCompatibilityEvidence": False,
          }
          path = Path("docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + "\n").encode("utf-8")
          fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=path.parent)
          try:
              with os.fdopen(fd, "wb") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(version): record compatibility authority diagnostic"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Compatibility diagnostic source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Enforce success
        run: test "${COMPATIBILITY_EXIT_CODE}" = "0"
