name: Reconcile Compatibility Authority Diagnostic

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-compatibility-authority-diagnostic.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-compatibility-authority-diagnostic.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-compatibility-authority-diagnostic-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact clean PR authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="$PR_HEAD_SHA"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Validate and reconcile compatibility authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/reconcile-memory-os-version-compatibility-foundation-status.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- contracts/operations/production-operability-status.json

  reconcile:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/so' &&
      (github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'docs(version): register bounded compatibility authority diagnostic') &&
       !contains(github.event.head_commit.message, 'test(version): record compatibility authority diagnostic')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          expected="${GITHUB_SHA:-}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"

      - name: Validate and reconcile with stage capture
        id: compatibility
        run: |
          set +e
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          code=0
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: permission-negative" >> "$log"
            python scripts/validate-memory-os-compatibility-authority-diagnostic-permission-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: canonical-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: status-reconcile" >> "$log"
            python scripts/reconcile-memory-os-version-compatibility-foundation-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: foundation-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility-foundations.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: aggregate-validator" >> "$log"
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Compatibility validation completed; raw validator output withheld."
          exit 0

      - name: Commit bounded compatibility status
        if: steps.compatibility.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Compatibility authority source advanced after validation; refusing stale derived authority." >&2
            exit 75
          fi
          git add contracts/operations/production-operability-status.json
          if git ls-files --error-unmatch docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json >/dev/null 2>&1; then
            rm -f docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
            git add -A docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
          fi
          if git diff --cached --quiet; then
            echo "Bounded compatibility status already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): register bounded compatibility authority diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Compatibility authority source advanced after derived authority capture; refusing stale write." >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Record privacy-safe diagnostic
        if: steps.compatibility.outputs.exit_code != '0'
        env:
          COMPATIBILITY_EXIT_CODE: ${{ steps.compatibility.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Compatibility authority source advanced after failed validation; refusing stale diagnostic." >&2
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          # Failure diagnostic is deliberately independent of untrusted raw validator output.
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "reconcile-compatibility-authority-diagnostic",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["COMPATIBILITY_EXIT_CODE"]),
              "output": "Compatibility authority validation failed; raw validator output withheld.",
              "containsSecrets": False,
              "productionEvidence": False,
              "releaseCompatibilityEvidence": False,
          }
          repo = Path.cwd().resolve(strict=True)
          path = repo / "docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json"
          if not path.parent.is_dir():
              raise RuntimeError("compatibility diagnostic parent missing")
          candidate = repo
          for component in path.relative_to(repo).parts:
              candidate = candidate / component
              if candidate.is_symlink():
                  raise RuntimeError("compatibility diagnostic path must not be a symlink")
          try:
              path.parent.resolve(strict=True).relative_to(repo)
          except ValueError as exc:
              raise RuntimeError("compatibility diagnostic parent escaped repository") from exc
          if path.exists() and not path.is_file():
              raise RuntimeError("compatibility diagnostic target must be regular")
          mode = path.stat().st_mode & 0o7777 if path.exists() else None
          payload = (json.dumps(value, indent=2) + "\n").encode("utf-8")
          fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=path.parent)
          try:
              if mode is not None:
                  os.fchmod(fd, mode)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(version): record compatibility authority diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Compatibility diagnostic source advanced after capture; refusing stale diagnostic." >&2
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Enforce success
        run: test "${{ steps.compatibility.outputs.exit_code }}" = "0"
