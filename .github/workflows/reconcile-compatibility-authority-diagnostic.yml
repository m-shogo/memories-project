name: Reconcile Compatibility Authority Diagnostic

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-compatibility-authority-diagnostic.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-compatibility-authority-diagnostic-so
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'docs(version): register bounded compatibility authority diagnostic') &&
       !contains(github.event.head_commit.message, 'test(version): record compatibility authority diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and reconcile with stage capture
        run: |
          set +e
          log=/tmp/memory-os-compatibility-authority.log
          : > "$log"
          code=0
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: canonical-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: status-reconcile" >> "$log"
            python scripts/reconcile-memory-os-version-compatibility-foundation-status.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: foundation-validator" >> "$log"
            python scripts/validate-memory-os-version-compatibility-foundations.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: aggregate-validator" >> "$log"
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "COMPATIBILITY_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Commit bounded compatibility status
        if: env.COMPATIBILITY_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Bounded compatibility status already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): register bounded compatibility authority diagnostic"
          git pull --rebase origin so
          git push origin HEAD:so

      - name: Record privacy-safe diagnostic
        if: env.COMPATIBILITY_EXIT_CODE != '0'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          text = Path("/tmp/memory-os-compatibility-authority.log").read_text(encoding="utf-8", errors="replace")
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "reconcile-compatibility-authority-diagnostic",
              "sourceCommitSha": os.environ["GITHUB_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["COMPATIBILITY_EXIT_CODE"]),
              "output": text[-12000:],
              "containsSecrets": False,
              "productionEvidence": False,
              "releaseCompatibilityEvidence": False,
          }
          path = Path("docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          git add docs/fixtures/memory-os-operability/compatibility-authority-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(version): record compatibility authority diagnostic"
          git pull --rebase origin so
          git push origin HEAD:so

      - name: Enforce success
        run: test "${COMPATIBILITY_EXIT_CODE}" = "0"
