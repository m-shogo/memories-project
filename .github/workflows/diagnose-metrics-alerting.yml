name: Diagnose Metrics Alerting

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/diagnose-metrics-alerting.yml"
      - "contracts/operations/metrics-alerting-contract.v1.json"
      - "infra/observability/prometheus/memory-os-alerts.yml"
      - "docs/runbooks/memory-os-metrics-alerts.md"
      - "scripts/validate-memory-os-metrics.py"
      - "scripts/validate-memory-os-metrics-scrape.py"
      - "scripts/validate-memory-os-metrics-operations.py"
      - "scripts/validate-memory-os-metrics-alerting.py"
      - "scripts/validate-memory-os-metrics-reconcile-rollback-negative.py"
      - "scripts/reconcile-memory-os-metrics-contract.py"
      - "scripts/reconcile-memory-os-metrics-scrape-status.py"
      - "scripts/reconcile-memory-os-metrics-operations.py"
      - "scripts/reconcile-memory-os-metrics-alerting.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
      - "contracts/operations/metrics-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-metrics-alerting-so
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact diagnostic source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run full reconcile sequence and write bounded diagnostic
        id: diagnose
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          commands = [
              ["python", "scripts/validate-memory-os-metrics-alerting.py"],
              ["python", "scripts/validate-memory-os-metrics-reconcile-rollback-negative.py"],
              ["python", "scripts/reconcile-memory-os-metrics-contract.py"],
              ["python", "scripts/reconcile-memory-os-metrics-scrape-status.py"],
              ["python", "scripts/reconcile-memory-os-metrics-operations.py"],
              ["python", "scripts/reconcile-memory-os-metrics-alerting.py"],
              ["python", "scripts/validate-memory-os-metrics.py"],
              ["python", "scripts/validate-memory-os-metrics-scrape.py"],
              ["python", "scripts/validate-memory-os-metrics-operations.py"],
              ["python", "scripts/validate-memory-os-metrics-alerting.py"],
              ["python", "scripts/validate-memory-os-operability.py"],
              ["python", "scripts/validate-memory-os-entry-docs.py"],
          ]
          steps = []
          overall = 0
          for command in commands:
              completed = subprocess.run(
                  command,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              output = completed.stdout[:3000]
              steps.append({
                  "command": " ".join(command),
                  "exitCode": completed.returncode,
                  "output": output,
              })
              if completed.returncode != 0:
                  overall = completed.returncode
                  break

          result = {
              "schemaVersion": "memory-os-validator-diagnostic.v2",
              "workflow": "reconcile-metrics-authority",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "PASS" if overall == 0 else "FAIL",
              "exitCode": overall,
              "steps": steps,
              "containsSecrets": False,
              "productionEvidence": False,
          }
          path = Path("docs/fixtures/memory-os-operability/metrics-alerting-validation.last.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          Path("/tmp/metrics-alerting-exit-code").write_text(str(overall), encoding="utf-8")
          PY
          git checkout -- \
            contracts/operations/metrics-contract.v1.json \
            contracts/operations/production-operability-status.json
          echo "exit_code=$(cat /tmp/metrics-alerting-exit-code)" >> "$GITHUB_OUTPUT"

      - name: Commit source-bound diagnostic
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Metrics diagnostic source is stale: validated $SOURCE_SHA but so is $(git rev-parse origin/so)" >&2
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/metrics-alerting-validation.last.json
          if git diff --cached --quiet; then
            echo "Alerting diagnostic is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(metrics): record full alerting reconcile diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced before metrics diagnostic push; refusing stale diagnostic." >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Fail when reconcile sequence failed
        if: steps.diagnose.outputs.exit_code != '0'
        run: exit 1
