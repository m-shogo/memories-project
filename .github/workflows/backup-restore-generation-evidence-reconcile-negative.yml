name: Backup Restore Generation Evidence Reconcile Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-evidence-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-registry-transaction-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-workflow-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-evidence-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-registry-transaction-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-workflow-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove transactional generation recovery reconciliation
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed generation evidence reconcile negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-workflow-negative.py
          authorities=(
            contracts/operations/backup-restore-generation-evidence-contract.v1.json
            contracts/operations/backup-restore-generation-evidence-registry.v1.json
            contracts/operations/backup-restore-generation-binding-contract.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          declare -A authority_modes
          for authority in "${authorities[@]}"; do
            authority_modes["$authority"]="$(stat -c '%a' "$authority")"
          done
          python -m py_compile \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-transport-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-registry-transaction-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-transport-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-backup-restore-review-source-order.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence-transport-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence-registry-transaction-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence-negative.py
          python scripts/validate-memory-os-backup-restore-semantic-generation-negative.py
          python scripts/validate-memory-os-backup-restore-generation-binding-transport-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
          python scripts/validate-memory-os-operability.py
          for authority in "${authorities[@]}"; do
            test "$(stat -c '%a' "$authority")" = "${authority_modes[$authority]}"
          done
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"