name: Recover Operability Validator

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/recover-operability-validator.yml"
      - "scripts/recover-memory-os-operability-validator.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-operability-validator-so
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover complete validator and validate authority
        run: |
          set -euo pipefail
          python scripts/recover-memory-os-operability-validator.py
          python -m py_compile scripts/validate-memory-os-operability.py
          python scripts/reconcile-memory-os-sustained-local-soak-status.py
          python scripts/validate-memory-os-sustained-local-soak.py
          python scripts/validate-memory-os-sustained-local-soak-aggregate.py --require-local-evidence
          python scripts/validate-memory-os-operability.py

      - name: Commit recovered validator and reconciled soak authority
        run: |
          set -euo pipefail
          git add \
            scripts/validate-memory-os-operability.py \
            contracts/operations/sustained-local-soak-contract.v1.json \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Operability validator already recovered."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ops): restore full operability validator"
          git pull --rebase origin so
          git push origin HEAD:so
