name: Backup Restore Non-Resurrection Path Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-path-negative.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-path-workflow-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-path-negative.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-path-workflow-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-non-resurrection-path-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact typed path-negative source
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed typed non-resurrection path negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-backup-restore-non-resurrection-path-workflow-negative.py
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate typed admission path negatives
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Refuse stale path-negative success
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" origin/so -- \
            .github/workflows/backup-restore-non-resurrection-path-negative.yml \
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json \
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          test -z "$(git status --porcelain)"
