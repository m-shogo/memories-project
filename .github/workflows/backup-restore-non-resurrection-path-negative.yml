name: Backup Restore Non-Resurrection Path Negative

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-non-resurrection-path-negative.yml"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-path-negative.yml"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-non-resurrection-path-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact typed path-negative source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate typed admission path negatives
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          test -z "$(git status --porcelain)"
      - name: Refuse stale path-negative success
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" origin/so -- \
            .github/workflows/backup-restore-non-resurrection-path-negative.yml \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          test -z "$(git status --porcelain)"
