name: Version Compatibility Execution Evidence

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/version-compatibility-execution-evidence.yml"
      - "contracts/operations/version-compatibility-execution-evidence.v1.json"
      - "scripts/validate-memory-os-version-compatibility-execution-evidence.py"
      - "scripts/reconcile-memory-os-version-compatibility-execution-status.py"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-session-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/postgresql-major-upgrade-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-compatibility-execution-evidence-so
  cancel-in-progress: false

jobs:
  validate-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate executed candidate/local evidence
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-version-compatibility-execution-evidence.py \
            scripts/reconcile-memory-os-version-compatibility-execution-status.py
          python scripts/validate-memory-os-version-compatibility-execution-evidence.py
      - name: Reconcile bounded evidence into OPS-P0-008
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-version-compatibility-execution-status.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py
      - name: Commit normalized compatibility authority
        run: |
          set -euo pipefail
          git add contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): classify executed candidate compatibility evidence"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
