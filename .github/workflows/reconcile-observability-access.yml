name: Reconcile Observability Access Policy

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-observability-access.yml"
      - "contracts/operations/observability-retention-access-contract.v1.json"
      - "docs/runbooks/memory-os-observability-access.md"
      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/reconcile-memory-os-observability-access.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-observability-access-so
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact source state
        run: |
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"

      - name: Compile and validate policy
        run: |
          python -m py_compile \
            scripts/validate-memory-os-observability-access.py \
            scripts/reconcile-memory-os-observability-access.py
          python scripts/validate-memory-os-observability-access.py

      - name: Reconcile event contract and status
        run: |
          python scripts/reconcile-memory-os-observability-access.py
          python scripts/validate-memory-os-observability.py
          python scripts/validate-memory-os-observability-access.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py

      - name: Commit reconciled authority files
        run: |
          git add \
            contracts/operations/observability-event-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Observability access authority is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(obs): reconcile retention and access authority"
          git pull --rebase origin so
          git push origin HEAD:so
