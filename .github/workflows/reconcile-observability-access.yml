name: Reconcile Observability Access Policy

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-observability-access.yml"
      - "contracts/operations/observability-retention-access-contract.v1.json"
      - "contracts/operations/observability-event-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-observability-access.md"
      - "scripts/validate-memory-os-observability.py"
      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/validate-memory-os-observability-access-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
      - "scripts/reconcile-memory-os-observability-access.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-observability-access.yml"
      - "contracts/operations/observability-retention-access-contract.v1.json"
      - "contracts/operations/observability-event-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-observability-access.md"
      - "scripts/validate-memory-os-observability.py"
      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/validate-memory-os-observability-access-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
      - "scripts/reconcile-memory-os-observability-access.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-observability-access-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          fi

      - name: Compile and validate policy
        run: |
          python -m py_compile \
            scripts/validate-memory-os-observability.py \
            scripts/validate-memory-os-observability-access.py \
            scripts/validate-memory-os-observability-access-reconcile-negative.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-entry-docs.py \
            scripts/reconcile-memory-os-observability-access.py
          python scripts/validate-memory-os-observability-access.py
          python scripts/validate-memory-os-observability-access-reconcile-negative.py

      - name: Reconcile event contract and status
        run: |
          python scripts/reconcile-memory-os-observability-access.py
          python scripts/validate-memory-os-observability.py
          python scripts/validate-memory-os-observability-access.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git diff --check
          git diff --exit-code -- \
            contracts/operations/observability-event-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit reconciled authority files
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add \
            contracts/operations/observability-event-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Observability access authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(obs): reconcile retention and access authority"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Observability access authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
