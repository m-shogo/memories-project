name: Deletion Worker Saturation Validator Negative

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/deletion-worker-saturation-validator-negative.yml"
      - "scripts/validate-memory-os-deletion-worker-saturation.py"
      - "scripts/validate-memory-os-deletion-worker-saturation-result-negative.py"
      - "contracts/operations/deletion-worker-saturation-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-saturation-results.sample.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/deletion-worker-saturation-validator-negative.yml"
      - "scripts/validate-memory-os-deletion-worker-saturation.py"
      - "scripts/validate-memory-os-deletion-worker-saturation-result-negative.py"
      - "contracts/operations/deletion-worker-saturation-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-saturation-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require exact clean source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
          else
            [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
            test "${GITHUB_REF:-}" = "refs/heads/so"
          fi
          [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Execute worker saturation validator negatives read-only
        run: |
          set -euo pipefail
          python -B scripts/validate-memory-os-deletion-worker-saturation-result-negative.py
          python -B scripts/validate-memory-os-deletion-worker-saturation.py --require-result
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
