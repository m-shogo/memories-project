name: Sustained Local Soak Session Boundary Repair v2

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/sustained-local-soak-session-boundary-repair-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-local-soak-session-boundary-repair-v2-so
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Patch, format, and compile
        id: repair
        run: |
          set +e
          log=/tmp/soak-session-boundary-repair.log
          : > "$log"
          code=0
          python - <<'PY' >> "$log" 2>&1 || code=$?
          from pathlib import Path
          path = Path('services/import-api/internal/httpserver/sustained_local_soak_test.go')
          text = path.read_text(encoding='utf-8')
          marker = 'long-soak original session did not expire cleanly'
          if marker in text:
              print('source already repaired')
              raise SystemExit(0)
          old = '''\t// Recovery proves the same long-lived server and parser boundary still
\t// accept new work after the final observation window.
\trecoveryPreview := runLiveHTTPBatch(1, 1, func(int) (*http.Request, error) {
\t\treturn liveRequest(http.MethodGet, previewPath, token, nil)
\t})
\trecoveryJob := server.createJob(t, owner)
\trecoveryUpload := runLiveObjectBatch(1, 1, server.server.URL, token, []string{recoveryJob})
\t_, recoveryParserErr := sustainedSoakParserRecovery(context.Background())
\trecoveryPassed := recoveryPreview.Successes == 1 && recoveryPreview.Failures == 0 &&
\t\trecoveryUpload.Successes == 1 && recoveryUpload.Failures == 0 && recoveryParserErr == nil
\tif !recoveryPassed {
\t\tt.Fatalf("long-soak recovery probe failed: preview=%+v upload=%+v parser=%v", recoveryPreview, recoveryUpload, recoveryParserErr)
\t}
'''
          new = '''\t// The production session TTL is one hour, exactly the minimum evidence
\t// duration. Prove the original session expires normally, then re-authenticate
\t// the same still-active account and verify the long-lived server/parser can
\t// accept fresh work. Extending the original token would hide a real boundary.
\texpiredSession := runDeletionExactHTTPBatch(1, 1, func(int) (*http.Request, error) {
\t\treturn liveRequest(http.MethodGet, previewPath, token, nil)
\t})
\tif expiredSession.StatusCodeCounts["401"] != 1 ||
\t\texpiredSession.Summary.StatusClassCounts["5xx"] != 0 ||
\t\texpiredSession.Summary.StatusClassCounts["transport_error"] != 0 {
\t\tt.Fatalf("long-soak original session did not expire cleanly: %+v", expiredSession)
\t}
\trecoveryToken := sustainedSoakRenewSession(t, server, owner)
\trecoveryPreview := runLiveHTTPBatch(1, 1, func(int) (*http.Request, error) {
\t\treturn liveRequest(http.MethodGet, previewPath, recoveryToken, nil)
\t})
\trecoveryJob := server.createJob(t, owner)
\trecoveryUpload := runLiveObjectBatch(1, 1, server.server.URL, recoveryToken, []string{recoveryJob})
\t_, recoveryParserErr := sustainedSoakParserRecovery(context.Background())
\trecoveryPassed := recoveryPreview.Successes == 1 && recoveryPreview.Failures == 0 &&
\t\trecoveryUpload.Successes == 1 && recoveryUpload.Failures == 0 && recoveryParserErr == nil
\tif !recoveryPassed {
\t\tt.Fatalf("long-soak post-reauth recovery probe failed: preview=%+v upload=%+v parser=%v", recoveryPreview, recoveryUpload, recoveryParserErr)
\t}
'''
          print('old-block-count', text.count(old))
          if text.count(old) != 1:
              raise SystemExit('expected exactly one old recovery block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('source patched')
          PY
          if [[ "$code" == "0" ]]; then
            gofmt -w services/import-api/internal/httpserver/sustained_local_soak_test.go services/import-api/internal/httpserver/sustained_local_soak_session_test.go >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            (cd services/import-api && go test ./internal/httpserver -run '^$' -count=1) >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit repaired source
        if: steps.repair.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/sustained-local-soak-session-boundary-repair-diagnostic.last.json 2>/dev/null || true
          git add services/import-api/internal/httpserver/sustained_local_soak_test.go services/import-api/internal/httpserver/sustained_local_soak_session_test.go
          git add -u docs/fixtures/memory-os-operability/sustained-local-soak-session-boundary-repair-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(soak): reauthenticate after one-hour session expiry"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Record repair diagnostic
        if: steps.repair.outputs.exit_code != '0'
        env:
          REPAIR_EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('/tmp/soak-session-boundary-repair.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'sustained-local-soak-session-boundary-repair-v2',
              'result': 'FAIL',
              'exitCode': int(os.environ['REPAIR_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'localSustainedSoakEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/sustained-local-soak-session-boundary-repair-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/sustained-local-soak-session-boundary-repair-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(soak): record session-boundary repair diagnostic"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Enforce repair
        run: test "${{ steps.repair.outputs.exit_code }}" = "0"
