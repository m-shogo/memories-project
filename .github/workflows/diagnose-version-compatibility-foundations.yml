name: Diagnose Version Compatibility Foundations

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/diagnose-version-compatibility-foundations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-version-compatibility-foundations-so
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reconciliation preflight
        id: preflight
        run: |
          set +e
          {
            echo 'STAGE: compile-foundation-tools'
            python -m py_compile \
              scripts/reconcile-memory-os-version-compatibility-foundations.py \
              scripts/validate-memory-os-version-compatibility-foundations.py
            echo 'STAGE: patch-canonical-validator'
            python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate-memory-os-version-compatibility.py")
          text = path.read_text(encoding="utf-8")
          old_import = "import json\nimport sys\n"
          new_import = "import json\nimport subprocess\nimport sys\n"
          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit("canonical validator import authority drift")
              text = text.replace(old_import, new_import)
          marker = '    print("Memory OS version compatibility validation PASS")\n'
          if "integrated compatibility foundation validation failed" not in text:
              if text.count(marker) != 1:
                  raise SystemExit(
                      f"canonical validator success marker drift: count={text.count(marker)}"
                  )
          print("canonical validator patch preflight PASS")
          PY
            echo 'STAGE: reconcile-contract-and-runbook'
            python scripts/reconcile-memory-os-version-compatibility-foundations.py
            echo 'STAGE: compile-resulting-files'
            python -m py_compile scripts/validate-memory-os-version-compatibility.py
          } > /tmp/version-foundation-preflight.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          PREFLIGHT_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          output = Path('/tmp/version-foundation-preflight.log').read_text(
              encoding='utf-8', errors='replace'
          )[-10000:]
          for pattern, replacement in (
              (r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>'),
              (r'Bearer\s+[^\s]+', 'Bearer <redacted>'),
              (r'password=[^\s]+', 'password=<redacted>'),
              (r'minioadmin', '<redacted-local-credential>'),
          ):
              output = re.sub(pattern, replacement, output, flags=re.IGNORECASE)
          diagnostic = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'diagnose-version-compatibility-foundations',
              'sourceCommitSha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'result': 'PASS' if os.environ['PREFLIGHT_EXIT_CODE'] == '0' else 'FAIL',
              'exitCode': int(os.environ['PREFLIGHT_EXIT_CODE']),
              'output': output,
              'containsSecrets': False,
              'productionEvidence': False,
              'releaseCompatibilityEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/version-compatibility-foundations-preflight.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(diagnostic, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Discard preflight mutations and commit diagnostic
        run: |
          git restore \
            contracts/operations/version-compatibility-contract.v1.json \
            docs/runbooks/memory-os-version-compatibility.md \
            scripts/validate-memory-os-version-compatibility.py
          git add docs/fixtures/memory-os-operability/version-compatibility-foundations-preflight.last.json
          if git diff --cached --quiet; then
            echo "Preflight diagnostic is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(version): record compatibility foundation preflight"
            git pull --rebase origin so
            git push origin HEAD:so
          fi

      - name: Fail after preserving diagnostic
        if: steps.preflight.outputs.exit_code != '0'
        run: exit 1
