name: Backend Go

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-go.yml"
  push:
    branches:
      - so
    paths:
      - "backend/**"
      - ".github/workflows/backend-go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
