name: Local Object-Version Restore Drill

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/local-object-version-restore.yml"
      - "contracts/operations/local-object-version-restore-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/run-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore-authority-negative.py"
      - "scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
  pull_request:
    paths:
      - ".github/workflows/local-object-version-restore.yml"
      - "contracts/operations/local-object-version-restore-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/run-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-local-object-version-restore-authority-negative.py"
      - "scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py"
      - "scripts/reconcile-memory-os-local-object-version-restore.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
  schedule:
    - cron: "53 18 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-object-version-restore-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-authority:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate object restore authority read-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/run-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-local-object-version-restore-authority-negative.py \
            scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py \
            scripts/reconcile-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-local-object-version-restore-authority-negative.py
          python scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py
          git diff --exit-code

  restore-drill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
      MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
      MEMORY_OS_ALLOW_EPHEMERAL_OBJECT_DELETE: "1"
      MEMORY_OS_LOCAL_OBJECT_RESTORE_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/local-object-version-restore-results.sample.v1.json
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local drill dependency
        run: python -m pip install --disable-pip-version-check 'boto3>=1.34,<2'

      - name: Capture exact source state
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Start local MinIO harness
        run: |
          docker run -d --name memory-os-object-restore-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-object-restore-minio
          exit 1

      - name: Validate static object restore contract
        run: |
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/run-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-local-object-version-restore-authority-negative.py \
            scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py \
            scripts/reconcile-memory-os-local-object-version-restore.py \
            scripts/validate-memory-os-backup-restore.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-local-object-version-restore-authority-negative.py
          python scripts/validate-memory-os-local-object-version-restore-reconcile-negative.py

      - name: Execute object restore drill and write bounded diagnostic
        id: drill
        env:
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set +e
          python scripts/run-memory-os-local-object-version-restore.py > /tmp/local-object-version-restore.log 2>&1
          code=$?
          set -e
          DRILL_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path('/tmp/local-object-version-restore.log').read_text(
              encoding='utf-8', errors='replace'
          )[-4000:]
          diagnostic = {
              'schemaVersion': 'memory-os-validator-diagnostic.v2',
              'workflow': 'local-object-version-restore-drill',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'drillResult': 'PASS' if os.environ['DRILL_EXIT_CODE'] == '0' else 'FAIL',
              'drillExitCode': int(os.environ['DRILL_EXIT_CODE']),
              'validationResult': 'NOT_RUN',
              'validationExitCode': None,
              'output': output,
              'containsSecrets': False,
              'productionEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/local-object-version-restore-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(diagnostic, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Validate exact-source result without losing diagnostic
        id: validation
        if: steps.drill.outputs.exit_code == '0'
        env:
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set +e
          python scripts/validate-memory-os-local-object-version-restore.py > /tmp/local-object-version-validation.log 2>&1
          code=$?
          set -e
          VALIDATION_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('docs/fixtures/memory-os-operability/local-object-version-restore-diagnostic.last.json')
          diagnostic = json.loads(path.read_text(encoding='utf-8'))
          validation_output = Path('/tmp/local-object-version-validation.log').read_text(
              encoding='utf-8', errors='replace'
          )[-4000:]
          diagnostic['validationResult'] = (
              'PASS' if os.environ['VALIDATION_EXIT_CODE'] == '0' else 'FAIL'
          )
          diagnostic['validationExitCode'] = int(os.environ['VALIDATION_EXIT_CODE'])
          diagnostic['output'] = (
              str(diagnostic.get('output', '')) + '\n--- validator ---\n' + validation_output
          )[-4000:]
          path.write_text(json.dumps(diagnostic, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit result or bounded failure diagnostic
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after restore execution; refusing stale object-version restore evidence."
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/local-object-version-restore-diagnostic.last.json
          if [ "${{ steps.drill.outputs.exit_code }}" = "0" ] && \
             [ "${{ steps.validation.outputs.exit_code }}" = "0" ]; then
            git add docs/fixtures/memory-os-operability/local-object-version-restore-results.sample.v1.json
          fi
          if git diff --cached --quiet; then
            echo "Object restore evidence is already current."
          else
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ steps.drill.outputs.exit_code }}" = "0" ] && \
               [ "${{ steps.validation.outputs.exit_code }}" = "0" ]; then
              git commit -m "test(backup): record local object-version restore evidence"
            else
              git commit -m "test(backup): record object restore failure diagnostic"
            fi
            for attempt in 1 2 3 4; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Branch advanced after evidence capture; refusing stale object-version restore evidence."
                exit 75
              fi
              if git push origin HEAD:so; then break; fi
              if [[ "$attempt" == "4" ]]; then exit 1; fi
              sleep 2
            done
          fi
          echo "EVIDENCE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reconcile exact-source PASS into status
        if: steps.drill.outputs.exit_code == '0' && steps.validation.outputs.exit_code == '0'
        env:
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
            echo "Branch advanced after evidence publication; refusing stale object-version restore status."
            exit 75
          fi
          python scripts/reconcile-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-local-object-version-restore.py
          python scripts/validate-memory-os-backup-restore.py
          python scripts/validate-memory-os-operability.py
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Object restore status is already current."
          else
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(backup): register local object-version restore evidence"
            for attempt in 1 2 3 4; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
                echo "Branch advanced after status derivation; refusing stale object-version restore status."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Fail workflow after preserving diagnostic
        if: steps.drill.outputs.exit_code != '0' || steps.validation.outputs.exit_code != '0'
        run: exit 1
