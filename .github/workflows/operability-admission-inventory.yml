      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/register-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-operability-status-hygiene.py"
      - ".github/workflows/operability-admission-inventory.yml"
      - ".github/workflows/backup-restore-drill-preflight.yml"
      - ".github/workflows/backup-restore-preflight-generation-eligibility-consistency.yml"
      - ".github/workflows/backup-restore-drill-request.yml"
      - ".github/workflows/backup-restore-drill-request-reconcile-rollback.yml"
      - ".github/workflows/backup-restore-generation-evidence.yml"
      - ".github/workflows/backup-restore-generation-binding.yml"
      - ".github/workflows/backup-restore-non-resurrection-admission.yml"
      - ".github/workflows/backup-restore-admission-chain.yml"
      - ".github/workflows/backup-restore-promotion-review.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operability-admission-inventory-so
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact inventory source
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate and validate inventory
        id: inventory
        run: |
          set +e
          log=/tmp/operability-admission-inventory.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/generate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py \
            scripts/validate-memory-os-operability-admission-inventory-registry-negative.py \
            scripts/register-memory-os-migration-production-shaped-admission.py \
            scripts/register-memory-os-incident-contact-routing.py \
            scripts/register-memory-os-observability-stack-deployment.py \
            scripts/register-memory-os-rate-limit-distributed-runtime.py \
            scripts/validate-memory-os-rate-limit-distributed-runtime.py \
            scripts/register-memory-os-release-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/register-memory-os-client-baseline.py \
            scripts/register-memory-os-parser-artifact.py \
            scripts/register-memory-os-production-shaped-failure-drill.py \
            scripts/validate-memory-os-sustained-soak-independent-review.py \
            scripts/validate-memory-os-sustained-soak-independent-review-negative.py \
            scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py \
            scripts/validate-memory-os-sustained-local-soak-result.py \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-negative.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/validate-memory-os-backup-restore-admission-chain.py \
            scripts/register-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review-negative.py \
            scripts/reconcile-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-operability-status-hygiene.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-soak-independent-review.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-soak-independent-review-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-promotion-review.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-promotion-review-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/generate-memory-os-operability-admission-inventory.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-admission-inventory.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-admission-inventory-registry-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-status-hygiene.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit deterministic inventory
        if: steps.inventory.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          log=/tmp/operability-admission-inventory.log

          rerun_latest_inventory() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-sustained-soak-independent-review.py >> "$log" 2>&1
            python scripts/validate-memory-os-sustained-soak-independent-review-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-sustained-soak-human-evidence-path-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-drill-request.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-promotion-review.py >> "$log" 2>&1
            python scripts/generate-memory-os-operability-admission-inventory.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability-admission-inventory.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability-admission-inventory-registry-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability-status-hygiene.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Inventory source changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Inventory source advanced; regenerating and revalidating once from latest so."
              rerun_latest_inventory
            fi

            git rm -f docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json 2>/dev/null || true
            git add \
              contracts/operations/operability-admission-inventory.v1.json \
              contracts/operations/backup-restore-drill-request-contract.v1.json \
              contracts/operations/backup-restore-drill-request-registry.v1.json \
              contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): refresh operability admission inventory"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Inventory source changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Inventory source advanced after validation; discarding stale commit and retrying from latest so."
              rerun_latest_inventory
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Inventory push raced with another writer; retrying once from latest so."
            rerun_latest_inventory
          done
          exit 75
      - name: Record privacy-safe inventory diagnostic
        if: steps.inventory.outputs.exit_code != '0'
        env:
          INVENTORY_EXIT_CODE: ${{ steps.inventory.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Inventory source changed after validation; refusing stale failure diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/operability-admission-inventory.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'operability-admission-inventory',
              'result': 'FAIL',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'exitCode': int(os.environ['INVENTORY_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'preflightCreatedPrerequisite': False,
              'drillRequestCreated': False,
              'generationEvidenceCreated': False,
              'typedEvidenceCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record admission inventory diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Inventory source changed after diagnostic capture; refusing stale failure diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce inventory generation
        run: test "${{ steps.inventory.outputs.exit_code }}" = "0"
