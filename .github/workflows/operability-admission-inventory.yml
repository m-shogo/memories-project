name: Operability Admission Inventory

on:
  push:
    branches:
      - so
    paths:
      - "contracts/operations/requests/operability-admission-inventory.v1.json"
      - "contracts/operations/migration-production-shaped-admission-registry.v1.json"
      - "docs/evidence/incident-tabletops/*.json"
      - "contracts/operations/incident-contact-routing-admission-registry.v1.json"
      - "contracts/operations/observability-stack-deployment-registry.v1.json"
      - "contracts/operations/rate-limit-distributed-runtime-admission-registry.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/parser-artifact-registry.v1.json"
      - "contracts/operations/production-shaped-failure-drill-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-status-hygiene.py"
      - ".github/workflows/operability-admission-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operability-admission-inventory-so
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate inventory
        id: inventory
        run: |
          set +e
          log=/tmp/operability-admission-inventory.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/generate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-status-hygiene.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/generate-memory-os-operability-admission-inventory.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-admission-inventory.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability-status-hygiene.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit deterministic inventory
        if: steps.inventory.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json 2>/dev/null || true
          git add contracts/operations/operability-admission-inventory.v1.json
          git add -u docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): refresh operability admission inventory"
            for attempt in 1 2 3 4; do
              git pull --rebase origin so
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Record privacy-safe inventory diagnostic
        if: steps.inventory.outputs.exit_code != '0'
        env:
          INVENTORY_EXIT_CODE: ${{ steps.inventory.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/operability-admission-inventory.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'operability-admission-inventory',
              'result': 'FAIL',
              'exitCode': int(os.environ['INVENTORY_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/operability-admission-inventory-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record admission inventory diagnostic"
            for attempt in 1 2 3; do
              git pull --rebase origin so
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce inventory generation
        run: test "${{ steps.inventory.outputs.exit_code }}" = "0"
