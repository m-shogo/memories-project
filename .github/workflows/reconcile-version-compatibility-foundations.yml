name: Reconcile Version Compatibility Foundations

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-version-compatibility-foundations.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "docs/runbooks/memory-os-version-compatibility.md"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundations.py"
      - "contracts/operations/mixed-version-session-contract.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-session-results.sample.v1.json"
      - "contracts/operations/mixed-version-candidate-contract.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "contracts/operations/mixed-version-apply-contract.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
      - "contracts/operations/release-baseline-registry*.json"
      - "contracts/operations/rollback-rehearsal-*.json"
      - "contracts/operations/parser-artifact-registry*.json"
      - "contracts/operations/postgresql-major-upgrade-contract.v1.json"
      - "docs/fixtures/memory-os-operability/postgresql-major-upgrade-results.sample.v1.json"
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-version-compatibility-foundations-so
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(version): integrate compatibility foundations')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest so
        uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean source
        run: |
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          python -m py_compile \
            scripts/reconcile-memory-os-version-compatibility-foundations.py \
            scripts/validate-memory-os-version-compatibility-foundations.py

      - name: Connect canonical validator to foundation validator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate-memory-os-version-compatibility.py")
          text = path.read_text(encoding="utf-8")
          old_import = "import json\nimport sys\n"
          new_import = "import json\nimport subprocess\nimport sys\n"
          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit("canonical validator import authority drift")
              text = text.replace(old_import, new_import)

          marker = '    print("Memory OS version compatibility validation PASS")\n'
          injected = "\n".join([
              "    foundation = subprocess.run(",
              "        [sys.executable,",
              "         str(ROOT / \"scripts/validate-memory-os-version-compatibility-foundations.py\")],",
              "        cwd=ROOT,",
              "        check=False,",
              "    )",
              "    require(foundation.returncode == 0,",
              "            \"integrated compatibility foundation validation failed\")",
              "",
              "    print(\"Memory OS version compatibility validation PASS\")",
              "",
          ])
          if "integrated compatibility foundation validation failed" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("canonical validator success marker drift")
              text = text.replace(marker, injected)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/validate-memory-os-version-compatibility.py

      - name: Reconcile contract and runbook foundations
        run: python scripts/reconcile-memory-os-version-compatibility-foundations.py

      - name: Validate integrated authority
        run: |
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py

      - name: Commit integrated compatibility authority
        run: |
          git add \
            contracts/operations/version-compatibility-contract.v1.json \
            docs/runbooks/memory-os-version-compatibility.md \
            scripts/validate-memory-os-version-compatibility.py
          if git diff --cached --quiet; then
            echo "Version compatibility foundations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): integrate compatibility foundations"
          git pull --rebase origin so
          git push origin HEAD:so
