name: Production Equivalent Environment Eligibility Negative

on:
  pull_request:
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility-negative.yml"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility-negative.yml"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-equivalent-environment-eligibility-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove strict pair derivation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-environment-generation-eligibility-negative.py
          python scripts/validate-memory-os-environment-generation-eligibility-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
