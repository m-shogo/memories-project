name: Production Equivalent Environment Eligibility Negative

on:
  pull_request:
    branches: [so]
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility-negative.yml"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-workflow-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility-negative.yml"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-workflow-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-equivalent-environment-eligibility-negative-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${PR_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            echo "Unreviewed environment eligibility negative CI event" >&2
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove eligibility CI source admission
        run: python scripts/validate-memory-os-environment-generation-eligibility-workflow-negative.py
      - name: Prove strict pair derivation
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-environment-generation-eligibility-negative.py
          python scripts/validate-memory-os-environment-generation-eligibility-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
