name: Migration Evidence Registry

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/migration-evidence-registry.yml"
      - "contracts/operations/migration-evidence-registry-contract.v1.json"
      - "contracts/operations/migration-evidence-registry.v1.json"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/local-migration-recovery-artifact-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/migrations/recovery/**"
      - "docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json"
      - "scripts/memory_os_migration_recovery_point.py"
      - "scripts/run-memory-os-local-migration-recovery-artifact.sh"
      - "scripts/validate-memory-os-local-migration-recovery-artifact.py"
      - "scripts/register-memory-os-migration-rehearsal-evidence.py"
      - "scripts/validate-memory-os-migration-evidence-registry.py"
      - "scripts/reconcile-memory-os-migration-evidence-registry.py"
      - "scripts/validate-memory-os-migration-lifecycle.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migration-evidence-registry-so
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile and validate migration evidence authority
        id: migration
        run: |
          set +e
          log=/tmp/migration-evidence-registry.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_migration_recovery_point.py \
            scripts/validate-memory-os-local-migration-recovery-artifact.py \
            scripts/register-memory-os-migration-rehearsal-evidence.py \
            scripts/validate-memory-os-migration-evidence-registry.py \
            scripts/reconcile-memory-os-migration-evidence-registry.py \
            scripts/validate-memory-os-migration-lifecycle.py \
            >> "$log" 2>&1 || code=$?
          bash -n scripts/run-memory-os-local-migration-recovery-artifact.sh >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: typed-recovery-self-test" >> "$log"
            PYTHONPATH=scripts python - <<'PY' >> "$log" 2>&1 || code=$?
          import json
          from pathlib import Path
          from memory_os_migration_recovery_point import RecoveryPointFailure, validate_recovery_point

          root = Path('.')
          contract = json.loads((root / 'contracts/operations/migration-evidence-registry-contract.v1.json').read_text())
          lifecycle = json.loads((root / 'contracts/operations/migration-lifecycle-contract.v1.json').read_text())
          canonical = lifecycle['migrationSequence']
          digest = 'a' * 64
          run_id = 'mig_20260807_selftest'
          base = {
              'migrationRunId': run_id,
              'sourceCommitSha': 'b' * 40,
              'recoveryPointReference': 'sha256:' + digest,
              'recoveryPointArtifactDigest': digest,
              'recoveryPointVerified': True,
              'restoreCapabilityEvidenceRef': 'docs/fixtures/memory-os-operability/local-logical-restore-results.sample.v1.json',
              'restoreCapabilityVerified': True,
              'recoveryPointRestoreEvidenceRef': f'docs/evidence/migrations/recovery/{run_id}.json',
          }

          try:
              validate_recovery_point(base, 'LOCAL_POSTGRES_REHEARSAL', canonical, contract)
          except RecoveryPointFailure:
              pass
          else:
              raise SystemExit('digest-only local recovery evidence was accepted without per-run restore result')

          bad_ref = dict(base)
          bad_ref['recoveryPointReference'] = 'README.md'
          try:
              validate_recovery_point(bad_ref, 'LOCAL_POSTGRES_REHEARSAL', canonical, contract)
          except RecoveryPointFailure:
              pass
          else:
              raise SystemExit('arbitrary repository file was accepted as recovery point')

          try:
              validate_recovery_point(base, 'PRODUCTION_EQUIVALENT_REHEARSAL', canonical, contract)
          except RecoveryPointFailure:
              pass
          else:
              raise SystemExit('production-equivalent rehearsal was accepted without restore capability authority')
          print('typed recovery evidence negative self-tests PASS')
          PY
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: local-artifact-static-validation" >> "$log"
            python scripts/validate-memory-os-local-migration-recovery-artifact.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: registry-validation" >> "$log"
            python scripts/validate-memory-os-migration-evidence-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: authority-reconcile" >> "$log"
            python scripts/reconcile-memory-os-migration-evidence-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded migration evidence authority
        if: steps.migration.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/migration-evidence-registry-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/migration-evidence-registry-contract.v1.json \
            contracts/operations/migration-lifecycle-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/migration-evidence-registry-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(migration): register typed recovery evidence authority"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.migration.outputs.exit_code != '0'
        env:
          MIGRATION_EXIT_CODE: ${{ steps.migration.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/migration-evidence-registry.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'migration-evidence-registry',
              'result': 'FAIL',
              'exitCode': int(os.environ['MIGRATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/migration-evidence-registry-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/migration-evidence-registry-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(migration): record evidence registry diagnostic"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Enforce migration evidence validation
        run: test "${{ steps.migration.outputs.exit_code }}" = "0"
