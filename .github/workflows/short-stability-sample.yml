name: Short Stability Sample

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/short-stability-sample.yml"
      - "services/import-api/internal/httpserver/short_stability_sample_test.go"
      - "services/import-api/internal/httpserver/live_load_test.go"
      - "services/import-api/internal/httpserver/server_live_test.go"
      - "infra/postgresql/security/**"
      - "contracts/operations/short-stability-sample-contract.v1.json"
      - "scripts/validate-memory-os-short-stability-sample.py"
      - "scripts/reconcile-memory-os-short-stability-status.py"
  schedule:
    - cron: "53 18 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-stability-sample-so
  cancel-in-progress: true

jobs:
  sample:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'test(load): record short stability result') &&
       !contains(github.event.head_commit.message, 'docs(ops): register short stability evidence') &&
       !contains(github.event.head_commit.message, 'test(load): record short stability diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Start local MinIO harness dependency
        run: |
          set -euo pipefail
          docker run -d --name memory-os-short-stability-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-short-stability-minio
          exit 1

      - name: Execute and validate short stability sample
        env:
          MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
          MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
          MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
          MEMORY_OS_RUN_SHORT_STABILITY_SAMPLE: "1"
          MEMORY_OS_SHORT_STABILITY_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/short-stability-sample-results.sample.v1.json
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set +e
          log=/tmp/memory-os-short-stability.log
          : > "$log"
          code=0
          echo "STAGE: format-and-compile" >> "$log"
          test -z "$(gofmt -l services/import-api/internal/httpserver/short_stability_sample_test.go)" \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: execute-short-sample" >> "$log"
            (
              cd services/import-api
              go test ./internal/httpserver \
                -run '^TestAuthenticatedPreviewShortCIStabilityLocalPostgres$' \
                -count=1 -timeout=12m
            ) >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: validate-result" >> "$log"
            python scripts/validate-memory-os-short-stability-sample.py \
              --expected-commit-sha "$SOURCE_SHA" >> "$log" 2>&1 || code=$?
          fi
          echo "STABILITY_EXIT_CODE=$code" >> "$GITHUB_ENV"
          if [[ "$code" == "0" ]]; then
            mkdir -p /tmp/memory-os-short-stability
            cp docs/fixtures/memory-os-operability/short-stability-sample-results.sample.v1.json \
              /tmp/memory-os-short-stability/result.json
          fi
          exit 0

      - name: Publish exact-source result
        if: env.STABILITY_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              services/import-api/internal/httpserver/short_stability_sample_test.go \
              services/import-api/internal/httpserver/live_load_test.go \
              services/import-api/internal/httpserver/server_live_test.go \
              infra/postgresql/security \
              contracts/operations/short-stability-sample-contract.v1.json \
              scripts/validate-memory-os-short-stability-sample.py; then
              echo "Newer stability-critical source exists; its own run must publish evidence."
              exit 75
            fi
            git reset --hard origin/so
            cp /tmp/memory-os-short-stability/result.json \
              docs/fixtures/memory-os-operability/short-stability-sample-results.sample.v1.json
            git add docs/fixtures/memory-os-operability/short-stability-sample-results.sample.v1.json
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "test(load): record short stability result"
            if git push origin HEAD:so; then
              published=true
              break
            fi
          done
          test "$published" = true

      - name: Reconcile short stability authority
        if: env.STABILITY_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reconciled=false
          for attempt in 1 2 3; do
            git fetch origin so
            if ! git diff --quiet "${SOURCE_SHA}" origin/so -- \
              .github/workflows/short-stability-sample.yml \
              services/import-api/internal/httpserver/short_stability_sample_test.go \
              services/import-api/internal/httpserver/live_load_test.go \
              services/import-api/internal/httpserver/server_live_test.go \
              infra/postgresql/security \
              contracts/operations/short-stability-sample-contract.v1.json \
              scripts/validate-memory-os-short-stability-sample.py \
              scripts/reconcile-memory-os-short-stability-status.py \
              scripts/validate-memory-os-load.py \
              scripts/validate-memory-os-operability.py; then
              echo "Newer stability authority source exists; refusing stale reconcile."
              exit 75
            fi
            git reset --hard origin/so
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/validate-memory-os-short-stability-sample.py
            EXPECTED_COMMIT_SHA="${SOURCE_SHA}" python scripts/reconcile-memory-os-short-stability-status.py
            python scripts/validate-memory-os-short-stability-sample.py --require-reconciled
            python scripts/validate-memory-os-load.py
            python scripts/validate-memory-os-operability.py
            git add \
              contracts/operations/short-stability-sample-contract.v1.json \
              contracts/operations/load-test-scenario-contract.v1.json \
              contracts/operations/production-operability-status.json
            if git diff --cached --quiet; then
              reconciled=true
              break
            fi
            git commit -m "docs(ops): register short stability evidence"
            if git push origin HEAD:so; then
              reconciled=true
              break
            fi
          done
          test "$reconciled" = true

      - name: Record privacy-safe diagnostic
        if: env.STABILITY_EXIT_CODE != '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced; refusing to replay stale short-stability diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          text = Path("/tmp/memory-os-short-stability.log").read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"postgres(?:ql)?://[^\s]+", "<redacted-database-url>", text)
          text = text.replace("minioadmin", "<redacted-local-credential>")
          text = re.sub(r"Bearer\s+\S+", "Bearer <redacted>", text, flags=re.I)
          value = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "short-stability-sample",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "result": "FAIL",
              "exitCode": int(os.environ["STABILITY_EXIT_CODE"]),
              "output": text[-12000:],
              "containsSecrets": False,
              "productionEvidence": False,
              "sustainedSoakEvidence": False,
              "leakProof": False,
          }
          path = Path("docs/fixtures/memory-os-operability/short-stability-diagnostic.last.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          git add docs/fixtures/memory-os-operability/short-stability-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(load): record short stability diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "${SOURCE_SHA}" ]]; then
            echo "Source head advanced after diagnostic creation; refusing stale push."
            exit 75
          fi
          git push origin HEAD:so

      - name: Enforce sample success
        run: test "${STABILITY_EXIT_CODE}" = "0"
