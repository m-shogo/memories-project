name: Backup Restore Promotion Review

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-promotion-review.yml"
      - "contracts/operations/backup-restore-promotion-review-contract.v1.json"
      - "contracts/operations/backup-restore-promotion-review-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/register-memory-os-backup-restore-promotion-review.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-promotion-review.py"
      - "scripts/reconcile-memory-os-backup-restore-promotion-review.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-promotion-review-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact promotion authority source
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile and validate human promotion review
        id: validation
        run: |
          set +e
          log=/tmp/backup-restore-promotion-review.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/register-memory-os-backup-restore-promotion-review.py \
            scripts/validate-memory-os-backup-restore-promotion-review-negative.py \
            scripts/validate-memory-os-backup-restore-promotion-review.py \
            scripts/reconcile-memory-os-backup-restore-promotion-review.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-promotion-review.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-promotion-review.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-promotion-review-negative.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded promotion review authority
        if: steps.validation.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          authority_paths=(
            .github/workflows/backup-restore-promotion-review.yml
            contracts/operations/backup-restore-promotion-review-contract.v1.json
            contracts/operations/backup-restore-promotion-review-registry.v1.json
            contracts/operations/backup-restore-generation-evidence-contract.v1.json
            contracts/operations/backup-restore-generation-evidence-registry.v1.json
            contracts/operations/backup-restore-drill-request-contract.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/production-operability-status.json
            docs/evidence/backup-restore
            docs/evidence/recovery-objectives/approvals
            docs/fixtures/memory-os-operability/backup-restore-generation-evidence
            scripts/request-memory-os-backup-restore-drill.py
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py
            scripts/register-memory-os-backup-restore-generation-evidence.py
            scripts/register-memory-os-backup-restore-promotion-review.py
            scripts/validate-memory-os-backup-restore-promotion-review-negative.py
            scripts/validate-memory-os-backup-restore-promotion-review.py
            scripts/reconcile-memory-os-backup-restore-promotion-review.py
          )
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- "${authority_paths[@]}"; then
            echo "Promotion review authority changed after validation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/backup-restore-promotion-review-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/backup-restore-promotion-review-contract.v1.json \
            contracts/operations/backup-restore-promotion-review-registry.v1.json
          git add -u docs/fixtures/memory-os-operability/backup-restore-promotion-review-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile recovery promotion review authority"
            for attempt in 1 2 3 4; do
              git fetch origin so
              if ! git diff --quiet "$SOURCE_SHA" origin/so -- "${authority_paths[@]}"; then
                echo "Promotion review authority changed after validation; refusing stale derived authority."
                exit 75
              fi
              if [[ "$(git rev-parse origin/so)" != "$(git rev-parse HEAD^)" ]]; then
                git rebase origin/so
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Record privacy-safe promotion review diagnostic
        if: steps.validation.outputs.exit_code != '0'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          authority_paths=(
            .github/workflows/backup-restore-promotion-review.yml
            contracts/operations/backup-restore-promotion-review-contract.v1.json
            contracts/operations/backup-restore-promotion-review-registry.v1.json
            contracts/operations/backup-restore-generation-evidence-contract.v1.json
            contracts/operations/backup-restore-generation-evidence-registry.v1.json
            contracts/operations/backup-restore-drill-request-contract.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/production-operability-status.json
            docs/evidence/backup-restore
            docs/evidence/recovery-objectives/approvals
            docs/fixtures/memory-os-operability/backup-restore-generation-evidence
            scripts/request-memory-os-backup-restore-drill.py
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py
            scripts/register-memory-os-backup-restore-generation-evidence.py
            scripts/register-memory-os-backup-restore-promotion-review.py
            scripts/validate-memory-os-backup-restore-promotion-review-negative.py
            scripts/validate-memory-os-backup-restore-promotion-review.py
            scripts/reconcile-memory-os-backup-restore-promotion-review.py
          )
          git fetch origin so
          if ! git diff --quiet "$SOURCE_SHA" origin/so -- "${authority_paths[@]}"; then
            echo "Promotion review authority changed after failed validation; refusing stale diagnostic."
            exit 75
          fi
          git reset --hard origin/so
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/backup-restore-promotion-review.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-promotion-review',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'reviewCreated': False,
              'trafficChanged': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-promotion-review-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-promotion-review-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record recovery promotion review diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if ! git diff --quiet "$SOURCE_SHA" origin/so -- "${authority_paths[@]}"; then
                echo "Promotion review authority changed after diagnostic capture; refusing stale diagnostic."
                exit 75
              fi
              if [[ "$(git rev-parse origin/so)" != "$(git rev-parse HEAD^)" ]]; then
                git rebase origin/so
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce promotion review authority
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
