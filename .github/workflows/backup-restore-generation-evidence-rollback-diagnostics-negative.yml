name: Backup Restore Generation Evidence Rollback Diagnostics Negative

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-generation-evidence-rollback-diagnostics-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-rollback-diagnostics-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-evidence-rollback-diagnostics-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-rollback-diagnostics-negative.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean rollback diagnostics source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Snapshot canonical authority modes
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/backup-restore-generation-evidence-rollback-diagnostics-authority-modes.txt"
          : > "$snapshot"
          for path in \
            contracts/operations/backup-restore-generation-evidence-contract.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            contracts/operations/production-equivalent-environment-generation-registry.v1.json \
            contracts/operations/recovery-objectives-registry.v1.json \
            contracts/operations/backup-restore-drill-request-registry.v1.json \
            contracts/operations/backup-restore-generation-binding-contract.v1.json \
            contracts/operations/production-operability-status.json
          do
            test -f "$path"
            printf '%s %s\n' "$path" "$(stat -c '%a' "$path")" >> "$snapshot"
          done

      - name: Compile generation evidence rollback diagnostics negative
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-rollback-diagnostics-negative.py

      - name: Prove generation evidence rollback diagnostics remain fail-closed
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-generation-evidence-rollback-diagnostics-negative.py

      - name: Prove canonical authority modes remain unchanged
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/backup-restore-generation-evidence-rollback-diagnostics-authority-modes.txt"
          test -s "$snapshot"
          while read -r path expected_mode; do
            test -f "$path"
            actual_mode="$(stat -c '%a' "$path")"
            test "$actual_mode" = "$expected_mode" || {
              echo "canonical authority mode drift: $path expected=$expected_mode actual=$actual_mode" >&2
              exit 1
            }
          done < "$snapshot"

      - name: Prove negative suite leaves canonical authorities untouched
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
