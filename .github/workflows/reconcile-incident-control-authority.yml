name: Reconcile Incident Control Authority

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-incident-control-authority.yml"
      - "contracts/operations/incident-control-exercise-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/incident-control-exercise-results.sample.v1.json"
      - "scripts/reconcile-memory-os-incident-control-authority.py"
      - "scripts/validate-memory-os-incident-control-authority-reconcile-negative.py"
      - "scripts/validate-memory-os-incident-control-exercise.py"
      - "scripts/validate-memory-os-incident-response.py"
      - "scripts/validate-memory-os-incident-tabletop.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-incident-control-authority.yml"
      - "contracts/operations/incident-control-exercise-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/incident-control-exercise-results.sample.v1.json"
      - "scripts/reconcile-memory-os-incident-control-authority.py"
      - "scripts/validate-memory-os-incident-control-authority-reconcile-negative.py"
      - "scripts/validate-memory-os-incident-control-exercise.py"
      - "scripts/validate-memory-os-incident-response.py"
      - "scripts/validate-memory-os-incident-tabletop.py"
      - "scripts/validate-memory-os-operability.py"
  schedule:
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-incident-control-authority-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact clean PR authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Validate deterministic incident authority
        run: |
          python -m py_compile \
            scripts/reconcile-memory-os-incident-control-authority.py \
            scripts/validate-memory-os-incident-control-authority-reconcile-negative.py \
            scripts/validate-memory-os-incident-control-exercise.py \
            scripts/validate-memory-os-incident-response.py \
            scripts/validate-memory-os-incident-tabletop.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-incident-control-authority-reconcile-negative.py
          python scripts/reconcile-memory-os-incident-control-authority.py
          python scripts/reconcile-memory-os-incident-control-authority.py --check
          python scripts/validate-memory-os-incident-control-exercise.py
          python scripts/validate-memory-os-incident-response.py
          python scripts/validate-memory-os-incident-tabletop.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "schedule" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Normalize exercise contract and status
        run: |
          python -m py_compile \
            scripts/reconcile-memory-os-incident-control-authority.py \
            scripts/validate-memory-os-incident-control-authority-reconcile-negative.py \
            scripts/validate-memory-os-incident-control-exercise.py \
            scripts/validate-memory-os-incident-response.py \
            scripts/validate-memory-os-incident-tabletop.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-incident-control-authority-reconcile-negative.py
          python scripts/reconcile-memory-os-incident-control-authority.py
          python scripts/reconcile-memory-os-incident-control-authority.py --check
          python scripts/validate-memory-os-incident-control-exercise.py
          python scripts/validate-memory-os-incident-response.py
          python scripts/validate-memory-os-incident-tabletop.py
          python scripts/validate-memory-os-operability.py

      - name: Commit normalized incident authority
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add \
            contracts/operations/incident-control-exercise-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Incident control authority is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(incident): normalize automated control exercise"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [ "$remote_sha" != "$source_sha" ]; then
            echo "Incident authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
