name: Backup Restore Permission Boundary Negative

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-admission-chain.yml"
      - ".github/workflows/backup-restore-admission-chain-negative.yml"
      - ".github/workflows/backup-restore-admission-chain-readonly.yml"
      - ".github/workflows/backup-restore-drill-request.yml"
      - ".github/workflows/backup-restore-generation-evidence.yml"
      - ".github/workflows/backup-restore-permission-boundary-negative.yml"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-mode-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-registry-mode-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-admission-chain.yml"
      - ".github/workflows/backup-restore-admission-chain-negative.yml"
      - ".github/workflows/backup-restore-admission-chain-readonly.yml"
      - ".github/workflows/backup-restore-drill-request.yml"
      - ".github/workflows/backup-restore-generation-evidence.yml"
      - ".github/workflows/backup-restore-permission-boundary-negative.yml"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-permission-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-mode-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-registry-mode-negative.py"

permissions:
  contents: read

jobs:
  permission-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Require exact clean source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi

      - name: Compile backup/restore permission negatives
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-admission-chain-permission-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-permission-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-permission-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-mode-negative.py \
            scripts/validate-memory-os-recovery-objectives-registry-mode-negative.py

      - name: Enforce end-to-end admission permission boundary
        run: python scripts/validate-memory-os-backup-restore-admission-chain-permission-negative.py

      - name: Enforce drill-request planning permission boundary
        run: python scripts/validate-memory-os-backup-restore-drill-request-permission-negative.py

      - name: Enforce generation-evidence permission boundary
        run: python scripts/validate-memory-os-backup-restore-generation-evidence-permission-negative.py

      - name: Enforce typed non-resurrection registry mode rollback
        run: python scripts/validate-memory-os-backup-restore-non-resurrection-registry-mode-negative.py

      - name: Enforce human-approved recovery-objective registry mode rollback
        run: python scripts/validate-memory-os-recovery-objectives-registry-mode-negative.py

      - name: Prove read-only permission gate
        run: test -z "$(git status --porcelain)"
