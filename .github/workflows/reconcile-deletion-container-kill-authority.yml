name: Reconcile Deletion Container Kill Authority
# Explicitly re-triggered after the exact-result bot commit; GitHub Actions bot commits do not chain workflows.

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-deletion-container-kill-authority.yml"
      - "scripts/reconcile-memory-os-deletion-worker-container-kill-recovery.py"
      - "scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py"
      - "scripts/reconcile-memory-os-deletion-container-kill-authority.py"
      - "scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-worker-container-kill-recovery.py"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/reconcile-memory-os-load-missing-evidence.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-worker-container-kill-recovery-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-container-kill-recovery-results.sample.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-container-kill-authority.yml"
      - "scripts/reconcile-memory-os-deletion-worker-container-kill-recovery.py"
      - "scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py"
      - "scripts/reconcile-memory-os-deletion-container-kill-authority.py"
      - "scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-worker-container-kill-recovery.py"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/reconcile-memory-os-load-missing-evidence.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-worker-container-kill-recovery-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-container-kill-recovery-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-deletion-container-kill-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact PR source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
      - name: Validate container-kill authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-worker-container-kill-recovery.py \
            scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py \
            scripts/validate-memory-os-deletion-worker-container-kill-recovery.py \
            scripts/reconcile-memory-os-deletion-container-kill-authority.py \
            scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/reconcile-memory-os-load-missing-evidence.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py
          python scripts/reconcile-memory-os-deletion-container-kill-authority.py
          python scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Reconcile actual container-kill evidence
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-worker-container-kill-recovery.py \
            scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py \
            scripts/validate-memory-os-deletion-worker-container-kill-recovery.py \
            scripts/reconcile-memory-os-deletion-container-kill-authority.py \
            scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/reconcile-memory-os-load-missing-evidence.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-worker-container-kill-recovery-reconcile-negative.py
          python scripts/reconcile-memory-os-deletion-container-kill-authority.py
          python scripts/validate-memory-os-deletion-container-kill-authority-reconcile-negative.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
      - name: Commit canonical authority update
        run: |
          set -euo pipefail
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): register container-kill in canonical authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during container-kill authority reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
