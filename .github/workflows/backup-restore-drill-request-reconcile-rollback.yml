name: Backup Restore Drill Request Reconcile Rollback

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-drill-request-reconcile-rollback.yml"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-middle-replace-negative.py"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-drill-request-reconcile-rollback.yml"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-middle-replace-negative.py"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-request-reconcile-rollback-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  rollback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact source and rollback proof
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"

          authorities=(
            contracts/operations/backup-restore-drill-request-contract.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/production-equivalent-environment-generation-contract.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-admission-contract.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          mode_snapshot="${RUNNER_TEMP}/backup-restore-drill-request-authority-modes.txt"
          : > "$mode_snapshot"
          for authority in "${authorities[@]}"; do
            test -f "$authority"
            printf '%s %s\n' "$(stat -c '%a' "$authority")" "$authority" >> "$mode_snapshot"
          done

          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-middle-replace-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py
          python scripts/validate-memory-os-backup-restore-drill-request-middle-replace-negative.py

          current_modes="${RUNNER_TEMP}/backup-restore-drill-request-authority-modes.current.txt"
          : > "$current_modes"
          for authority in "${authorities[@]}"; do
            printf '%s %s\n' "$(stat -c '%a' "$authority")" "$authority" >> "$current_modes"
          done
          cmp --silent "$mode_snapshot" "$current_modes"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
