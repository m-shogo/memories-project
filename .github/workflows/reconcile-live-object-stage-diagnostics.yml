name: Reconcile Live Object Stage Diagnostics

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  pull_request:
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-live-object-stage-diagnostics-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Validate diagnostic source read-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          python -m py_compile scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          python scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          gofmt -w services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/live_object_load_test.go)"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'test(load): classify MinIO lifecycle failures'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Reconcile stage diagnostics
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m py_compile scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          python scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          gofmt -w services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/live_object_load_test.go)"

      - name: Commit diagnostic authority
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/live_object_load_test.go
          if git diff --cached --quiet; then
            echo "Live object stage diagnostics are already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(load): classify MinIO lifecycle failures"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Live object stage diagnostic source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
