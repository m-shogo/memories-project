name: Reconcile Live Object Stage Diagnostics

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-live-object-stage-diagnostics-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Validate diagnostic source read-only
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"
          python -m py_compile scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          python scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          gofmt -w services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/live_object_load_test.go)"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/so' &&
      (github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'test(load): classify MinIO lifecycle failures'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Reconcile stage diagnostics
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m py_compile scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          python scripts/reconcile-memory-os-live-object-stage-diagnostics.py
          gofmt -w services/import-api/internal/httpserver/live_object_load_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/live_object_load_test.go)"

      - name: Commit diagnostic authority
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/live_object_load_test.go
          if git diff --cached --quiet; then
            echo "Live object stage diagnostics are already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(load): classify MinIO lifecycle failures"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Live object stage diagnostic source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
