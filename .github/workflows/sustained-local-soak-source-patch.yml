name: Sustained Local Soak Source Patch

on:
  push:
    branches:
      - so
    paths:
      - "contracts/operations/requests/sustained-local-soak-source-patch.v2.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-local-soak-source-patch-so
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Patch and compile
        run: |
          set -euo pipefail
          python scripts/patch-memory-os-sustained-soak-session-boundary.py
          gofmt -w \
            services/import-api/internal/httpserver/sustained_local_soak_test.go \
            services/import-api/internal/httpserver/sustained_local_soak_session_test.go
          (cd services/import-api && go test ./internal/httpserver -run '^$' -count=1)
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git add \
            services/import-api/internal/httpserver/sustained_local_soak_test.go \
            services/import-api/internal/httpserver/sustained_local_soak_session_test.go
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(soak): reauthenticate after one-hour session expiry"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
