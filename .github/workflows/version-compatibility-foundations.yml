name: Version Compatibility Foundations

on:
  pull_request:
    paths:
      - ".github/workflows/version-compatibility-foundations.yml"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/rollback-rehearsal-gate-contract.v1.json"
      - "contracts/operations/rollback-rehearsal-registry.v1.json"
      - "contracts/operations/parser-artifact-registry-contract.v1.json"
      - "contracts/operations/parser-artifact-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "docs/runbooks/memory-os-version-compatibility-foundations.md"
      - "scripts/reconcile-memory-os-version-compatibility-canonical.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/validate-memory-os-version-compatibility-foundation-status-negative.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/request-memory-os-rollback-rehearsal.py"
      - "scripts/validate-memory-os-rollback-rehearsal-gate.py"
      - "scripts/register-memory-os-parser-artifact.py"
      - "scripts/validate-memory-os-parser-artifact-registry.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/fixtures/memory-os-operability/mixed-version-session-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/postgresql-major-upgrade-results.sample.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/version-compatibility-foundations.yml"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/rollback-rehearsal-gate-contract.v1.json"
      - "contracts/operations/rollback-rehearsal-registry.v1.json"
      - "contracts/operations/parser-artifact-registry-contract.v1.json"
      - "contracts/operations/parser-artifact-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "docs/runbooks/memory-os-version-compatibility-foundations.md"
      - "scripts/reconcile-memory-os-version-compatibility-canonical.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/validate-memory-os-version-compatibility-foundation-status-negative.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/register-memory-os-release-baseline.py"
      - "scripts/validate-memory-os-release-baseline-registry.py"
      - "scripts/request-memory-os-rollback-rehearsal.py"
      - "scripts/validate-memory-os-rollback-rehearsal-gate.py"
      - "scripts/register-memory-os-parser-artifact.py"
      - "scripts/validate-memory-os-parser-artifact-registry.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/fixtures/memory-os-operability/mixed-version-session-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/postgresql-major-upgrade-results.sample.v1.json"
  schedule:
    - cron: "59 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-compatibility-foundations-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(version): register bounded compatibility foundations')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact compatibility authority source
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile compatibility authority tools
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/reconcile-memory-os-version-compatibility-canonical.py \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/validate-memory-os-version-compatibility-foundation-status-negative.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            scripts/register-memory-os-release-baseline.py \
            scripts/validate-memory-os-release-baseline-registry.py \
            scripts/request-memory-os-rollback-rehearsal.py \
            scripts/validate-memory-os-rollback-rehearsal-gate.py \
            scripts/register-memory-os-parser-artifact.py \
            scripts/validate-memory-os-parser-artifact-registry.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-version-compatibility-foundation-status-negative.py
          python scripts/validate-memory-os-release-compatibility-pair-independent-review-negative.py

      - name: Validate upstream admission authorities
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-rollback-rehearsal-gate.py
          python scripts/validate-memory-os-parser-artifact-registry.py

      - name: Restore conservative canonical authority
        run: python scripts/reconcile-memory-os-version-compatibility-canonical.py

      - name: Validate canonical matrix remains conservative
        run: python scripts/validate-memory-os-version-compatibility.py

      - name: Reconcile and validate bounded foundation status
        run: |
          python scripts/reconcile-memory-os-version-compatibility-foundation-status.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            contracts/operations/version-compatibility-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit compatibility authorities
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Compatibility authority source changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git add \
            contracts/operations/version-compatibility-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Compatibility authorities are already current."
          else
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(version): register bounded compatibility foundations"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after validation; refusing to rebase stale compatibility authority."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Re-read committed authority
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so

      - name: Validate canonical, upstream, foundation and aggregate authority
        run: |
          python scripts/validate-memory-os-release-baseline-registry.py
          python scripts/validate-memory-os-rollback-rehearsal-gate.py
          python scripts/validate-memory-os-parser-artifact-registry.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py
