name: One Shot Fix Soak Backlog Types

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/one-shot-fix-soak-backlog-types.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Repair exact int64 mismatch and compile package
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("services/import-api/internal/httpserver/sustained_local_soak_test.go")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'DeletionPending               int                       `json:"deletionPending"`': 'DeletionPending               int64                     `json:"deletionPending"`',
              'DeletionStuck                 int                       `json:"deletionStuck"`': 'DeletionStuck                 int64                     `json:"deletionStuck"`',
              'func sustainedSoakDeletionBacklog(t *testing.T, server *liveServer) (int, int) {': 'func sustainedSoakDeletionBacklog(t *testing.T, server *liveServer) (int64, int64) {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          gofmt -w services/import-api/internal/httpserver/sustained_local_soak_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/sustained_local_soak_test.go)"
          (
            cd services/import-api
            go test ./internal/httpserver -run '^TestDoesNotExist$' -count=1
          )
      - name: Commit repair
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/sustained_local_soak_test.go
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(soak): align deletion backlog telemetry types"
          git pull --rebase origin so
          git push origin HEAD:so
