name: Backup Restore Preflight Generation Eligibility Consistency

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-preflight-generation-eligibility-consistency.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-preflight-generation-eligibility-consistency.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-preflight-generation-eligibility-consistency-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean consistency PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Validate strict generation eligibility boundary read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-production-equivalent-environment-eligibility.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py \
            scripts/request-memory-os-backup-restore-drill.py
          python scripts/validate-memory-os-production-equivalent-environment-eligibility.py
          python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py
          python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py
          test -z "$(git status --porcelain)"

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact consistency authority source
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -n "$expected"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
      - name: Validate strict generation eligibility boundary
        id: validation
        run: |
          set +e
          log=/tmp/backup-restore-preflight-generation-eligibility-consistency.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-production-equivalent-environment-eligibility.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-eligibility.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Remove stale consistency diagnostic
        if: steps.validation.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Consistency authority source HEAD changed after validation; refusing stale diagnostic cleanup."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/backup-restore-preflight-generation-eligibility-consistency-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(restore): clear generation eligibility consistency diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Consistency authority source HEAD changed before cleanup push; refusing stale diagnostic cleanup."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe consistency diagnostic
        if: steps.validation.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Consistency authority source HEAD changed after validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/backup-restore-preflight-generation-eligibility-consistency.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-preflight-generation-eligibility-consistency',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'generationCreated': False,
              'requestCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-preflight-generation-eligibility-consistency-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          temp_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  mode='w',
                  encoding='utf-8',
                  dir=path.parent,
                  prefix=f'.{path.name}.',
                  suffix='.tmp',
                  delete=False,
              ) as handle:
                  temp_path = Path(handle.name)
                  json.dump(value, handle, indent=2)
                  handle.write('\n')
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_path, path)
              temp_path = None
          finally:
              if temp_path is not None and temp_path.exists():
                  temp_path.unlink()
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-preflight-generation-eligibility-consistency-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record generation eligibility consistency diagnostic"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Consistency authority source HEAD changed before diagnostic push; refusing stale diagnostic."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce consistency authority
        run: test "${{ steps.validation.outputs.exit_code }}" = "0"
