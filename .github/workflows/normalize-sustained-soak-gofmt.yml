name: Normalize Sustained Soak gofmt

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/normalize-sustained-soak-gofmt.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-sustained-soak-gofmt-so
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Normalize exact source file
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          gofmt -w services/import-api/internal/httpserver/sustained_local_soak_test.go
          git diff --check
          if git diff --quiet -- services/import-api/internal/httpserver/sustained_local_soak_test.go; then
            echo "Already gofmt-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/import-api/internal/httpserver/sustained_local_soak_test.go
          git commit -m "fix(soak): normalize sustained soak runner gofmt"
          git pull --rebase origin so
          git push origin HEAD:so
