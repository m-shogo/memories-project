name: Backup Restore Non-Resurrection Readonly

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-non-resurrection-readonly.yml"
      - ".github/workflows/backup-restore-non-resurrection-admission.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-*.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-readonly-workflow-negative.py"
  push:
    branches: [so]
    paths:
      - ".github/workflows/backup-restore-non-resurrection-readonly.yml"
      - ".github/workflows/backup-restore-non-resurrection-admission.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-*.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-readonly-workflow-negative.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove canonical authority bytes and modes are immutable
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed typed non-resurrection readonly event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

          authorities=(
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
            contracts/operations/backup-restore-generation-evidence-contract.v1.json
            contracts/operations/backup-restore-generation-evidence-registry.v1.json
            contracts/operations/backup-restore-generation-binding-contract.v1.json
            contracts/operations/backup-restore-drill-request-contract.v1.json
            contracts/operations/backup-restore-drill-request-registry.v1.json
            contracts/operations/production-equivalent-environment-generation-registry.v1.json
            contracts/operations/recovery-objectives-registry.v1.json
            contracts/operations/production-operability-status.json
          )
          before=/tmp/non-resurrection-authorities.before
          after=/tmp/non-resurrection-authorities.after
          : > "$before"
          for path in "${authorities[@]}"; do
            test -f "$path"
            printf '%s %s %s\n' "$(sha256sum "$path" | cut -d' ' -f1)" "$(stat -c '%a' "$path")" "$path" >> "$before"
          done

          python scripts/validate-memory-os-backup-restore-non-resurrection-readonly-workflow-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          python scripts/reconcile-memory-os-backup-non-resurrection-authority.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py

          : > "$after"
          for path in "${authorities[@]}"; do
            printf '%s %s %s\n' "$(sha256sum "$path" | cut -d' ' -f1)" "$(stat -c '%a' "$path")" "$path" >> "$after"
          done
          diff -u "$before" "$after"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
