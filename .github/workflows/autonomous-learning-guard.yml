name: Autonomous Learning Guard

on:
  push:
    branches: [so]
    paths:
      - ".github/workflows/autonomous-learning-guard.yml"
      - ".github/workflows/backup-restore-helper-ancestor-reachability.yml"
      - "scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-reconcile-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-reconcile-negative.py"
      - "contracts/operations/autonomous-learning-system.json"
      - "docs/operations/AUTONOMOUS-OPS-LEARNING.md"
      - "scripts/validate-autonomous-learning-system.py"
      - "scripts/validate-autonomous-learning-system-negative.py"
      - "scripts/validate-memory-os-entry-docs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-learning-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Enforce append-only learning authority against parent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import re

          authority = "docs/operations/AUTONOMOUS-OPS-LEARNING.md"
          event_name = "${{ github.event_name }}"
          before = "${{ github.event.before }}"
          if event_name == "push":
              if not re.fullmatch(r"[0-9a-f]{40}", before) or before == "0" * 40:
                  raise SystemExit(
                      "AUTONOMOUS LEARNING APPEND-ONLY FAILED: invalid push baseline"
                  )
              baseline = before
          elif event_name == "workflow_dispatch":
              baseline = "HEAD^"
          else:
              raise SystemExit(
                  "AUTONOMOUS LEARNING APPEND-ONLY FAILED: unreviewed event"
              )
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", baseline, "HEAD"],
              check=False,
          ).returncode:
              raise SystemExit(
                  "AUTONOMOUS LEARNING APPEND-ONLY FAILED: baseline is not an ancestor"
              )
          previous = subprocess.check_output(
              ["git", "show", f"{baseline}:{authority}"]
          )
          current = Path(authority).read_bytes()
          if not current.startswith(previous):
              raise SystemExit(
                  "AUTONOMOUS LEARNING APPEND-ONLY FAILED: previous authority bytes changed"
              )
          print("Autonomous learning append-only PASS")
          PY
      - name: Validate learning contract and executable negatives
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B scripts/validate-autonomous-learning-system.py
          python -B scripts/validate-autonomous-learning-system-negative.py
          python -B scripts/validate-memory-os-entry-docs.py
      - name: Independently enforce helper ancestor runtime workflow reachability
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -B scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py
          python -B scripts/validate-memory-os-backup-restore-helper-ancestor-reachability.py --negative
      - name: Confirm read-only execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
