name: Sustained Soak Independent Review Authority

on:
  pull_request:
    paths:
      - ".github/workflows/sustained-soak-independent-review-authority.yml"
      - "contracts/operations/sustained-soak-independent-review-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-registry.v1.json"
      - "contracts/operations/sustained-local-soak-contract.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-runs/**"
      - "docs/evidence/sustained-soak/**"
      - "scripts/register-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review-registry-negative.py"
      - "scripts/validate-memory-os-sustained-local-soak-result.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/sustained-soak-independent-review-authority.yml"
      - "contracts/operations/sustained-soak-independent-review-contract.v1.json"
      - "contracts/operations/sustained-soak-independent-review-registry.v1.json"
      - "contracts/operations/sustained-local-soak-contract.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-trend-review.v1.json"
      - "docs/fixtures/memory-os-operability/sustained-local-soak-runs/**"
      - "docs/evidence/sustained-soak/**"
      - "scripts/register-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review.py"
      - "scripts/validate-memory-os-sustained-soak-independent-review-registry-negative.py"
      - "scripts/validate-memory-os-sustained-local-soak-result.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sustained-soak-independent-review-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile authority validators
        run: |
          python -m py_compile \
            scripts/register-memory-os-sustained-soak-independent-review.py \
            scripts/validate-memory-os-sustained-soak-independent-review.py \
            scripts/validate-memory-os-sustained-soak-independent-review-registry-negative.py \
            scripts/validate-memory-os-sustained-local-soak-result.py

      - name: Validate sustained-soak independent review authority
        run: python scripts/validate-memory-os-sustained-soak-independent-review.py

      - name: Validate append-only registry corruption negatives
        run: python scripts/validate-memory-os-sustained-soak-independent-review-registry-negative.py

      - name: Enforce no authority mutation
        run: git diff --exit-code
