name: Rate Limit Emergency Decision Drill

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-emergency-drill.yml"
      - "contracts/operations/rate-limit-emergency-drill-contract.v1.json"
      - "contracts/operations/rate-limit-operation-evidence-contract.v1.json"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "scripts/run-memory-os-rate-limit-emergency-drill.py"
      - "scripts/validate-memory-os-rate-limit-emergency-drill.py"
      - "scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-emergency-drill.py"
      - "scripts/evaluate-memory-os-rate-limit-emergency-state.py"
      - "scripts/create-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-emergency-drill.yml"
      - "contracts/operations/rate-limit-emergency-drill-contract.v1.json"
      - "contracts/operations/rate-limit-operation-evidence-contract.v1.json"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/run-memory-os-rate-limit-emergency-drill.py"
      - "scripts/validate-memory-os-rate-limit-emergency-drill.py"
      - "scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-emergency-drill.py"
      - "scripts/evaluate-memory-os-rate-limit-emergency-state.py"
      - "scripts/create-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-limit-emergency-decision-drill-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate emergency authority read-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/run-memory-os-rate-limit-emergency-drill.py \
            scripts/validate-memory-os-rate-limit-emergency-drill.py \
            scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py \
            scripts/reconcile-memory-os-rate-limit-emergency-drill.py \
            scripts/evaluate-memory-os-rate-limit-emergency-state.py \
            scripts/create-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operation-evidence.py \
            scripts/reconcile-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-emergency-drill.py
          python scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
          test -z "$(git status --porcelain)"

  drill:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' ||
       (!contains(github.event.head_commit.message, 'test(rate-limit): record emergency decision drill result') &&
        !contains(github.event.head_commit.message, 'docs(rate-limit): register emergency decision drill')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile canonical evidence ledger before source capture
        run: |
          set -euo pipefail
          initial_sha="$(git rev-parse HEAD)"
          test "$initial_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin so
          test "$initial_sha" = "$(git rev-parse origin/so)"
          python -m py_compile \
            scripts/create-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-operation-evidence.py \
            scripts/reconcile-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py \
            scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py
          python scripts/reconcile-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operations.py
          git add \
            contracts/operations/rate-limit-operations-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(rate-limit): register operation evidence ledger"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$initial_sha" ]]; then
              echo "Operation evidence foundation source is stale: validated $initial_sha but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Execute exact-source local decision drill
        id: execute
        run: |
          set +e
          log=/tmp/memory-os-rate-limit-emergency-drill.log
          result=/tmp/memory-os-rate-limit-emergency-drill-result.json
          : > "$log"
          rm -f "$result"
          code=0
          stage=compile
          echo "STAGE: compile" >> "$log"
          python -m py_compile \
            scripts/run-memory-os-rate-limit-emergency-drill.py \
            scripts/validate-memory-os-rate-limit-emergency-drill.py \
            scripts/validate-memory-os-rate-limit-emergency-drill-reconcile-negative.py \
            scripts/reconcile-memory-os-rate-limit-emergency-drill.py \
            scripts/evaluate-memory-os-rate-limit-emergency-state.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            stage=static-validation
            echo "STAGE: static-validation" >> "$log"
            python scripts/validate-memory-os-rate-limit-emergency-drill.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=decision-drill
            echo "STAGE: decision-drill" >> "$log"
            python scripts/run-memory-os-rate-limit-emergency-drill.py \
              --source-sha "$SOURCE_SHA" \
              --output "$result" >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            stage=result-validation
            echo "STAGE: result-validation" >> "$log"
            cp "$result" docs/fixtures/memory-os-operability/rate-limit-emergency-drill-results.sample.v1.json
            python scripts/validate-memory-os-rate-limit-emergency-drill.py \
              --expected-commit-sha "$SOURCE_SHA" --require-result >> "$log" 2>&1 || code=$?
            git checkout -- docs/fixtures/memory-os-operability/rate-limit-emergency-drill-results.sample.v1.json 2>/dev/null || \
              rm -f docs/fixtures/memory-os-operability/rate-limit-emergency-drill-results.sample.v1.json
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "failure_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "result_path=$result" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Publish exact-source drill result
        if: steps.execute.outputs.exit_code == '0'
        env:
          RESULT_PATH: ${{ steps.execute.outputs.result_path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Rate-limit drill source is stale: executed $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          result_file=docs/fixtures/memory-os-operability/rate-limit-emergency-drill-results.sample.v1.json
          diagnostic_file=docs/fixtures/memory-os-operability/rate-limit-emergency-drill-diagnostic.last.json
          cp "$RESULT_PATH" "$result_file"
          python scripts/validate-memory-os-rate-limit-emergency-drill.py \
            --expected-commit-sha "$SOURCE_SHA" --require-result
          rm -f "$diagnostic_file"
          git add -- "$result_file"
          if git ls-files --error-unmatch -- "$diagnostic_file" >/dev/null 2>&1; then
            git add -u -- "$diagnostic_file"
          fi
          git diff --cached --check
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Rate-limit drill result source became stale before publication: $remote_sha" >&2
            exit 75
          fi
          if git diff --cached --quiet; then
            echo "Exact-source rate-limit drill result is already current."
            echo "RESULT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(rate-limit): record emergency decision drill result"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Rate-limit drill result source became stale before push: $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
          echo "RESULT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reconcile drill authority without runtime promotion
        if: steps.execute.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          test -n "${RESULT_COMMIT_SHA:-}"
          test "$(git rev-parse HEAD)" = "$RESULT_COMMIT_SHA"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$RESULT_COMMIT_SHA" ]]; then
            echo "Rate-limit drill result authority is stale: result $RESULT_COMMIT_SHA but so is $remote_sha" >&2
            exit 75
          fi
          python scripts/validate-memory-os-rate-limit-emergency-drill.py \
            --expected-commit-sha "$SOURCE_SHA" --require-result
          python scripts/reconcile-memory-os-rate-limit-operation-evidence.py
          python scripts/reconcile-memory-os-rate-limit-emergency-drill.py
          python scripts/validate-memory-os-rate-limit-emergency-drill.py \
            --expected-commit-sha "$SOURCE_SHA" --require-result --require-reconciled
          python scripts/validate-memory-os-rate-limit-operation-evidence.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
          git add \
            contracts/operations/rate-limit-emergency-drill-contract.v1.json \
            contracts/operations/rate-limit-operations-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Rate-limit decision drill authority already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(rate-limit): register emergency decision drill"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$RESULT_COMMIT_SHA" ]]; then
            echo "Rate-limit drill authority source became stale before push: $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Record privacy-safe diagnostic
        if: steps.execute.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
          FAILURE_STAGE: ${{ steps.execute.outputs.failure_stage }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin so
          remote_sha="$(git rev-parse origin/so)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Rate-limit diagnostic source is stale: failed $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('/tmp/memory-os-rate-limit-emergency-drill.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-url>', text)
          text = re.sub(r'Bearer\s+\S+', 'Bearer <redacted>', text, flags=re.I)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'rate-limit-emergency-decision-drill',
              'sourceCommitSha': os.environ.get('SOURCE_SHA', ''),
              'failureStage': os.environ.get('FAILURE_STAGE', 'unknown'),
              'result': 'FAIL',
              'exitCode': int(os.environ['EXIT_CODE']),
              'output': text[-8000:],
              'containsSecrets': False,
              'runtimeTrafficChanged': False,
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
              'productionControlPlaneExercised': False,
          }
          path = Path('docs/fixtures/memory-os-operability/rate-limit-emergency-drill-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/rate-limit-emergency-drill-diagnostic.last.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(rate-limit): record emergency decision drill diagnostic"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Rate-limit diagnostic source became stale before push: $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Enforce drill success
        run: test "${{ steps.execute.outputs.exit_code }}" = "0"
