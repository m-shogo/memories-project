name: Reconcile Compatibility Authority V2

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-compatibility-authority-v2.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/reconcile-memory-os-version-compatibility-canonical.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-compatibility-authority-v2.yml"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "contracts/operations/version-compatibility-foundations.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/reconcile-memory-os-version-compatibility-canonical.py"
      - "scripts/reconcile-memory-os-version-compatibility-foundation-status.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-version-compatibility-foundations.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-compatibility-authority-v2-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(version): reconcile canonical and bounded authorities v2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi

      - name: Compile authority tools
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-version-compatibility-canonical.py \
            scripts/reconcile-memory-os-version-compatibility-foundation-status.py \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-version-compatibility-foundations.py \
            scripts/validate-memory-os-operability.py

      - name: Reconcile canonical and bounded status
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-version-compatibility-canonical.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/reconcile-memory-os-version-compatibility-foundation-status.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            contracts/operations/version-compatibility-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit reconciled authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add \
            contracts/operations/version-compatibility-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Compatibility authority is already reconciled."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): reconcile canonical and bounded authorities v2"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Compatibility authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Re-read and validate committed authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-version-compatibility-foundations.py
          python scripts/validate-memory-os-operability.py
