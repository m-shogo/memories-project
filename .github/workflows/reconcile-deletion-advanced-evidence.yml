name: Reconcile Advanced Deletion Evidence

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-advanced-evidence.yml"
      - "scripts/reconcile-memory-os-deletion-advanced-evidence.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "contracts/operations/deletion-prefence-linearization-contract.v1.json"
      - "contracts/operations/deletion-worker-saturation-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-linearization-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-saturation-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-deletion-advanced-evidence-so
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact committed proof authorities
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-advanced-evidence.py \
            scripts/validate-memory-os-deletion-prefence-linearization.py \
            scripts/validate-memory-os-deletion-worker-saturation.py \
            scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-deletion-prefence-linearization.py --require-result
          python scripts/validate-memory-os-deletion-worker-saturation.py --require-result
      - name: Reconcile without production promotion
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-deletion-advanced-evidence.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): register advanced load evidence"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
