name: Reconcile Advanced Deletion Evidence

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-advanced-evidence.yml"
      - "scripts/reconcile-memory-os-deletion-prefence-linearization.py"
      - "scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py"
      - "scripts/reconcile-memory-os-deletion-advanced-evidence.py"
      - "scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-linearization.py"
      - "scripts/validate-memory-os-deletion-worker-saturation.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-linearization-contract.v1.json"
      - "contracts/operations/deletion-worker-saturation-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-linearization-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-saturation-results.sample.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-advanced-evidence.yml"
      - "scripts/reconcile-memory-os-deletion-prefence-linearization.py"
      - "scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py"
      - "scripts/reconcile-memory-os-deletion-advanced-evidence.py"
      - "scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-linearization.py"
      - "scripts/validate-memory-os-deletion-worker-saturation.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-linearization-contract.v1.json"
      - "contracts/operations/deletion-worker-saturation-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-linearization-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-saturation-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-deletion-advanced-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact pull request source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "${PR_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate and reconcile advanced deletion authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-prefence-linearization.py \
            scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py \
            scripts/reconcile-memory-os-deletion-advanced-evidence.py \
            scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py \
            scripts/validate-memory-os-deletion-prefence-linearization.py \
            scripts/validate-memory-os-deletion-worker-saturation.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py
          python scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py
          python scripts/validate-memory-os-deletion-prefence-linearization.py --require-result
          python scripts/validate-memory-os-deletion-worker-saturation.py --require-result
          python scripts/reconcile-memory-os-deletion-advanced-evidence.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate exact committed proof authorities
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-prefence-linearization.py \
            scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py \
            scripts/reconcile-memory-os-deletion-advanced-evidence.py \
            scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py \
            scripts/validate-memory-os-deletion-prefence-linearization.py \
            scripts/validate-memory-os-deletion-worker-saturation.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-prefence-linearization-reconcile-negative.py
          python scripts/validate-memory-os-deletion-advanced-evidence-reconcile-negative.py
          python scripts/validate-memory-os-deletion-prefence-linearization.py --require-result
          python scripts/validate-memory-os-deletion-worker-saturation.py --require-result
      - name: Reconcile without production promotion
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-deletion-advanced-evidence.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): register advanced load evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during advanced deletion reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
