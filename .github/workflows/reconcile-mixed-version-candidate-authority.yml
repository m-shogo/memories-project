name: Reconcile Mixed-Version Candidate Authority

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-mixed-version-candidate-authority.yml"
      - "contracts/operations/mixed-version-candidate-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-rejections.v1.json"
      - "scripts/validate-memory-os-mixed-version-candidate.py"
      - "scripts/reconcile-memory-os-mixed-version-candidate.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-mixed-version-candidate-authority.yml"
      - "contracts/operations/mixed-version-candidate-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/mixed-version-candidate-rejections.v1.json"
      - "scripts/validate-memory-os-mixed-version-candidate.py"
      - "scripts/reconcile-memory-os-mixed-version-candidate.py"
      - "scripts/validate-memory-os-version-compatibility.py"
      - "scripts/validate-memory-os-operability.py"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-mixed-version-candidate-authority-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(version): reconcile candidate baseline evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi
          python -m py_compile \
            scripts/validate-memory-os-mixed-version-candidate.py \
            scripts/reconcile-memory-os-mixed-version-candidate.py \
            scripts/validate-memory-os-version-compatibility.py \
            scripts/validate-memory-os-operability.py

      - name: Reconcile and validate candidate-specific authority
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            contracts/operations/mixed-version-candidate-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit candidate contract and status together
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "${{ github.sha }}"
          git add \
            contracts/operations/mixed-version-candidate-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Mixed-version candidate authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(version): reconcile candidate baseline evidence"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Mixed-version candidate authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so

      - name: Re-read committed authority and run aggregate checks
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-mixed-version-candidate.py
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py
