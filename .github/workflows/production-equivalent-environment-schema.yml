name: Production Equivalent Environment Schema

on:
  pull_request:
    paths:
      - ".github/workflows/production-equivalent-environment-schema.yml"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-schema.py"
      - "scripts/validate-memory-os-production-equivalent-environment-fixtures.py"
      - "docs/fixtures/memory-os-operability/production-equivalent-environment-record.*.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-schema.yml"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-schema.py"
      - "scripts/validate-memory-os-production-equivalent-environment-fixtures.py"
      - "docs/fixtures/memory-os-operability/production-equivalent-environment-record.*.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean schema source
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Validate fail-closed environment admission
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-schema.py \
            scripts/validate-memory-os-production-equivalent-environment-fixtures.py
          python scripts/validate-memory-os-production-equivalent-environment-schema.py
          python scripts/validate-memory-os-production-equivalent-environment-fixtures.py

  publish-checkpoint:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Capture exact clean validated source
        run: |
          set -euo pipefail
          test -n "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record validation checkpoint
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Environment schema source advanced before checkpoint publication; refusing stale validation checkpoint."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = {
              'schemaVersion': 'memory-os-production-equivalent-environment-schema-validation.v1',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'schemaDraft': '2020-12',
              'safePlannedFixtureAccepted': True,
              'unsafeEquivalencePromotionRejected': True,
              'unreviewedAcceptedMaterialDeltaRejected': True,
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-equivalent-environment-schema-validation.v1.json')
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/production-equivalent-environment-schema-validation.v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "test(load): record environment admission validation"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Environment schema source advanced after checkpoint capture; refusing stale validation checkpoint."
              exit 75
            fi
            git push origin HEAD:so
          fi
