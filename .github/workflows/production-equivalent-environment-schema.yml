name: Production Equivalent Environment Schema

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-schema.yml"
      - "scripts/validate-memory-os-production-equivalent-environment-schema-workflow-negative.py"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-schema.py"
      - "scripts/validate-memory-os-production-equivalent-environment-fixtures.py"
      - "docs/fixtures/memory-os-operability/production-equivalent-environment-record.*.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-schema.yml"
      - "scripts/validate-memory-os-production-equivalent-environment-schema-workflow-negative.py"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-schema.py"
      - "scripts/validate-memory-os-production-equivalent-environment-fixtures.py"
      - "docs/fixtures/memory-os-operability/production-equivalent-environment-record.*.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact clean schema source
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            EXPECTED_SHA="${GITHUB_SHA:-}"
          else
            echo "Unreviewed environment schema event" >&2
            exit 1
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-production-equivalent-environment-schema-workflow-negative.py
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Validate fail-closed environment admission
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-schema.py \
            scripts/validate-memory-os-production-equivalent-environment-fixtures.py
          python scripts/validate-memory-os-production-equivalent-environment-schema.py
          python scripts/validate-memory-os-production-equivalent-environment-fixtures.py

  publish-checkpoint:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Capture exact clean validated source
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record validation checkpoint
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Environment schema source advanced before checkpoint publication; refusing stale validation checkpoint."
            exit 75
          fi
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          value = {
              'schemaVersion': 'memory-os-production-equivalent-environment-schema-validation.v1',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'schemaDraft': '2020-12',
              'safePlannedFixtureAccepted': True,
              'unsafeEquivalencePromotionRejected': True,
              'unreviewedAcceptedMaterialDeltaRejected': True,
              'productionTraffic': False,
              'productionCredentials': False,
              'productionEvidence': False,
              'productionEquivalentDependencies': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-equivalent-environment-schema-validation.v1.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          temp_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  mode='w',
                  encoding='utf-8',
                  dir=path.parent,
                  prefix=f'.{path.name}.',
                  suffix='.tmp',
                  delete=False,
              ) as handle:
                  temp_path = Path(handle.name)
                  json.dump(value, handle, indent=2)
                  handle.write('\n')
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_path, path)
              temp_path = None
          finally:
              if temp_path is not None and temp_path.exists():
                  temp_path.unlink()
          PY
          git add docs/fixtures/memory-os-operability/production-equivalent-environment-schema-validation.v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "test(load): record environment admission validation"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Environment schema source advanced after checkpoint capture; refusing stale validation checkpoint."
              exit 75
            fi
            git push origin HEAD:so
          fi
