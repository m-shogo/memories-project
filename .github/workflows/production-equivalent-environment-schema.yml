name: Production Equivalent Environment Schema

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-schema.yml"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-schema.py"
      - "scripts/validate-memory-os-production-equivalent-environment-fixtures.py"
      - "docs/fixtures/memory-os-operability/production-equivalent-environment-record.*.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Validate fail-closed environment admission
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-schema.py \
            scripts/validate-memory-os-production-equivalent-environment-fixtures.py
          python scripts/validate-memory-os-production-equivalent-environment-schema.py
          python scripts/validate-memory-os-production-equivalent-environment-fixtures.py
