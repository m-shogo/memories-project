name: Production Equivalent Environment Eligibility

on:
  pull_request:
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility.yml"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility-reconcile-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility.py"
      - "scripts/reconcile-memory-os-production-equivalent-environment-eligibility.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-environment-eligibility.yml"
      - "contracts/operations/production-equivalent-environment-eligibility-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/validate-memory-os-environment-generation-eligibility-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility-reconcile-negative.py"
      - "scripts/validate-memory-os-production-equivalent-environment-eligibility.py"
      - "scripts/reconcile-memory-os-production-equivalent-environment-eligibility.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-equivalent-environment-eligibility-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact semantic eligibility source
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch origin so
            test "$(git branch --show-current)" = "so"
            test -z "$(git status --porcelain)"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Derive and validate restore-preflight generation eligibility
        id: eligibility
        run: |
          set +e
          log=/tmp/production-equivalent-environment-eligibility.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/validate-memory-os-environment-generation-eligibility-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-eligibility-reconcile-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-eligibility.py \
            scripts/reconcile-memory-os-production-equivalent-environment-eligibility.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-environment-generation-eligibility-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-eligibility-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-production-equivalent-environment-eligibility.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-eligibility.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Reject stale semantic eligibility authority on pull requests
        if: steps.eligibility.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/operations/production-equivalent-environment-eligibility-contract.v1.json
      - name: Commit bounded generation eligibility authority
        if: steps.eligibility.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/production-equivalent-environment-eligibility.log

          revalidate_latest_eligibility() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-environment-generation-eligibility-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-production-equivalent-environment-eligibility-reconcile-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-production-equivalent-environment-eligibility.py >> "$log" 2>&1
            python scripts/validate-memory-os-production-equivalent-environment-eligibility.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Semantic eligibility source HEAD changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Semantic eligibility source advanced; regenerating and revalidating once from latest so."
              revalidate_latest_eligibility
            fi

            git rm -f docs/fixtures/memory-os-operability/production-equivalent-environment-eligibility-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/production-equivalent-environment-eligibility-contract.v1.json
            git add -u docs/fixtures/memory-os-operability/production-equivalent-environment-eligibility-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): reconcile environment generation eligibility"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Semantic eligibility source HEAD changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Semantic eligibility source advanced after validation; discarding stale eligibility commit and retrying from latest so."
              revalidate_latest_eligibility
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Semantic eligibility push raced with another writer; retrying once from latest so."
            revalidate_latest_eligibility
          done
          exit 75
      - name: Record privacy-safe eligibility diagnostic
        if: steps.eligibility.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          ELIGIBILITY_EXIT_CODE: ${{ steps.eligibility.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced after failed semantic eligibility validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/production-equivalent-environment-eligibility.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'production-equivalent-environment-eligibility',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['ELIGIBILITY_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'generationCreated': False,
              'eligibilityFabricated': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/production-equivalent-environment-eligibility-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/production-equivalent-environment-eligibility-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record environment generation eligibility diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "so advanced after semantic eligibility diagnostic capture; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce generation eligibility authority
        run: test "${{ steps.eligibility.outputs.exit_code }}" = "0"
