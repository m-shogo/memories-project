name: Rate Limit Local Multi Process Shared Store

on:
  pull_request:
    paths:
      - ".github/workflows/rate-limit-local-multiprocess-shared-store.yml"
      - "contracts/operations/rate-limit-local-multiprocess-shared-store-contract.v1.json"
      - "services/import-api/internal/ratelimit/limiter.go"
      - "services/import-api/internal/ratelimit/enforce.go"
      - "services/import-api/internal/ratelimit/shared_store_multiprocess_test.go"
      - "scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py"
      - "scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-local-multiprocess-shared-store.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/rate-limit-local-multiprocess-shared-store.yml"
      - "contracts/operations/rate-limit-local-multiprocess-shared-store-contract.v1.json"
      - "services/import-api/internal/ratelimit/limiter.go"
      - "services/import-api/internal/ratelimit/enforce.go"
      - "services/import-api/internal/ratelimit/shared_store_multiprocess_test.go"
      - "scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py"
      - "scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-local-multiprocess-shared-store.py"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-limit-local-multiprocess-shared-store-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/import-api/go.mod
          cache-dependency-path: services/import-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean PR source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Compile and validate shared-store authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py \
            scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py \
            scripts/reconcile-memory-os-rate-limit-local-multiprocess-shared-store.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py
          python scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
      - name: Execute cross-process shared-store code regression
        working-directory: services/import-api
        run: |
          set -euo pipefail
          go test ./internal/ratelimit -run '^TestLocalSharedStoreCrossProcessBudgetRestartAndOutage$' -count=1
      - name: Require read-only whole-worktree authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  rehearse:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact rehearsal source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/import-api/go.mod
          cache-dependency-path: services/import-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source commit
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced before local shared-store rehearsal; refusing stale source."
            exit 75
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Compile and validate evidence authority
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py \
            scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py \
            scripts/reconcile-memory-os-rate-limit-local-multiprocess-shared-store.py \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store-reconcile-negative.py
      - name: Execute cross-process shared-store rehearsal
        working-directory: services/import-api
        run: |
          set -euo pipefail
          go test ./internal/ratelimit -run '^TestLocalSharedStoreCrossProcessBudgetRestartAndOutage$' -count=1
      - name: Write privacy-safe exact-source result atomically
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced before local shared-store result publication; refusing stale evidence."
            exit 75
          fi
          SOURCE_SHA="$SOURCE_SHA" python - <<'PY'
          import datetime as dt
          import json
          import os
          import stat
          import tempfile
          from pathlib import Path

          value = {
              "schemaVersion": "memory-os-rate-limit-local-multiprocess-shared-store-results.v1",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "generatedAt": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "classification": "LOCAL_MULTI_PROCESS_SHARED_STORE_REHEARSAL",
              "dependencyMode": "TEST_ONLY_LOOPBACK_HTTP_BROKER_MEMORY_STORE",
              "test": "TestLocalSharedStoreCrossProcessBudgetRestartAndOutage",
              "assertions": {
                  "independentOsClientProcesses": True,
                  "sharedBudgetAtomicAcrossProcesses": True,
                  "freshClientProcessDoesNotResetBudget": True,
                  "storeOutageFailsClosed": True,
                  "productionStoreImplementationExercised": False,
                  "productionEquivalentRuntimeExercised": False,
                  "productionTlsExercised": False,
                  "deploymentTrustedProxyConfigurationExercised": False,
                  "productionCredentialsUsed": False,
                  "productionTrafficUsed": False,
              },
              "result": "PASS",
              "productionEvidence": False,
              "productionEquivalentRuntimeEvidence": False,
              "productionReady": False,
              "limitations": [
                  "shared broker is a loopback HTTP test server backed by MemoryStore",
                  "client processes are independent OS test processes but the broker is not Redis or another deployment shared store",
                  "fresh client-process continuity is not a runtime host/container restart drill",
                  "store outage is local loopback connection failure, not production failover",
                  "no TLS, trusted-proxy deployment, production traffic or production credentials are exercised"
              ],
          }
          path = Path("docs/fixtures/memory-os-operability/rate-limit-local-multiprocess-shared-store-results.v1.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          mode = stat.S_IMODE(path.stat().st_mode) if path.exists() else 0o644
          payload = json.dumps(value, indent=2) + "\n"
          fd, temp_name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=path.parent)
          temp = Path(temp_name)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.chmod(temp, mode)
              os.replace(temp, path)
          finally:
              temp.unlink(missing_ok=True)
          PY
      - name: Reconcile bounded local evidence
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-rate-limit-local-multiprocess-shared-store.py
          python scripts/validate-memory-os-rate-limit-local-multiprocess-shared-store.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-operability.py
      - name: Commit exact-source rehearsal authority
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced after local shared-store rehearsal; refusing stale evidence."
            exit 75
          fi
          git add \
            docs/fixtures/memory-os-operability/rate-limit-local-multiprocess-shared-store-results.v1.json \
            contracts/operations/rate-limit-local-multiprocess-shared-store-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Local shared-store authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(rate-limit): record local multi-process shared-store rehearsal"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced before local shared-store publication; refusing stale evidence."
            exit 75
          fi
          git push origin HEAD:so
