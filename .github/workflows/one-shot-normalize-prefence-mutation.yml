name: One Shot Normalize Pre-Fence Mutation

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/one-shot-normalize-prefence-mutation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Normalize and compile
        run: |
          set -euo pipefail
          gofmt -w services/import-api/internal/httpserver/deletion_prefence_mutation_linearization_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_prefence_mutation_linearization_test.go)"
          (
            cd services/import-api
            go test ./internal/httpserver -run '^TestDoesNotExist$' -count=1
          )
      - name: Commit normalized source
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/deletion_prefence_mutation_linearization_test.go
          if git diff --cached --quiet; then
            echo "Already normalized."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deletion): normalize pre-fence mutation proof"
          git pull --rebase origin so
          git push origin HEAD:so
