name: Backup Restore Generation Binding Readonly

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-generation-binding-readonly.yml"
      - "scripts/validate-memory-os-backup-restore-generation-binding-workflow-readonly.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-status.py"
      - "contracts/operations/**"
  push:
    branches: [so]
    paths:
      - ".github/workflows/backup-restore-generation-binding-readonly.yml"
      - "scripts/validate-memory-os-backup-restore-generation-binding-workflow-readonly.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/validate-memory-os-backup-restore.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-status-authority-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-status.py"
      - "contracts/operations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-generation-binding-readonly-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove generation binding authorities remain read-only
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed generation-binding readonly event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-backup-restore-generation-binding-workflow-readonly.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
