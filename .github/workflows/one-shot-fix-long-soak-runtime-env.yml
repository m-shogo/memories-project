name: One Shot Fix Long Soak Runtime Env

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/one-shot-fix-long-soak-runtime-env.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - name: Bind dynamic long-run values at shell runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/sustained-local-soak.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          targets = {
              'MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH:',
              'MEMORY_OS_COMMIT_SHA:',
              'MEMORY_OS_SOAK_RUN_ID:',
          }
          result = []
          in_long_run_step = False
          inserted = False
          removed = set()

          for line in lines:
              stripped = line.strip()
              if stripped == '- name: Execute one 60-minute LOCAL_LONG_SOAK run':
                  in_long_run_step = True
              if in_long_run_step and any(stripped.startswith(prefix) for prefix in targets):
                  removed.add(stripped.split(':', 1)[0])
                  continue
              result.append(line)
              if in_long_run_step and stripped == 'set +e' and not inserted:
                  indent = line[:len(line) - len(line.lstrip())]
                  result.extend([
                      indent + 'export MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH="$SOAK_RESULT_PATH"',
                      indent + 'export MEMORY_OS_COMMIT_SHA="$SOURCE_SHA"',
                      indent + 'export MEMORY_OS_SOAK_RUN_ID="$SOAK_RUN_ID"',
                  ])
                  inserted = True
              if in_long_run_step and stripped.startswith('- name: Publish append-only exact-source run result'):
                  in_long_run_step = False

          expected = {
              'MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH',
              'MEMORY_OS_COMMIT_SHA',
              'MEMORY_OS_SOAK_RUN_ID',
          }
          if removed != expected:
              raise SystemExit(f'unexpected removed dynamic env keys: {sorted(removed)}')
          if not inserted:
              raise SystemExit('runtime export insertion point not found')

          path.write_text('\n'.join(result) + '\n', encoding='utf-8')
          PY
          grep -F 'export MEMORY_OS_COMMIT_SHA="$SOURCE_SHA"' .github/workflows/sustained-local-soak.yml
          grep -F 'export MEMORY_OS_SOAK_RUN_ID="$SOAK_RUN_ID"' .github/workflows/sustained-local-soak.yml
          grep -F 'export MEMORY_OS_SUSTAINED_LOCAL_SOAK_RESULTS_PATH="$SOAK_RESULT_PATH"' .github/workflows/sustained-local-soak.yml
          count=$(grep -c '^ *export MEMORY_OS_COMMIT_SHA=' .github/workflows/sustained-local-soak.yml)
          test "$count" -eq 1
      - name: Commit repair
        run: |
          set -euo pipefail
          git add .github/workflows/sustained-local-soak.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(soak): bind long-run evidence env at runtime"
          git pull --rebase origin so
          git push origin HEAD:so
