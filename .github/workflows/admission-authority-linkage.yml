name: Admission Authority Linkage

on:
  pull_request:
    paths:
      - ".github/workflows/admission-authority-linkage.yml"
      - "contracts/operations/requests/admission-authority-linkage.v1.json"
      - "contracts/operations/*admission-contract.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/incident-human-tabletop-evidence-contract.v1.json"
      - "contracts/operations/deletion-worker-host-failure-contract.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/observability-stack-deployment-contract.v1.json"
      - "contracts/operations/production-shaped-failure-drill-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "scripts/validate-memory-os-admission-authority-linkage.py"
      - "scripts/validate-memory-os-admission-authority-linkage-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/admission-authority-linkage.yml"
      - "contracts/operations/requests/admission-authority-linkage.v1.json"
      - "contracts/operations/*admission-contract.v1.json"
      - "contracts/operations/release-baseline-registry-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/incident-human-tabletop-evidence-contract.v1.json"
      - "contracts/operations/deletion-worker-host-failure-contract.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/observability-stack-deployment-contract.v1.json"
      - "contracts/operations/production-shaped-failure-drill-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "scripts/validate-memory-os-admission-authority-linkage.py"
      - "scripts/validate-memory-os-admission-authority-linkage-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-authority-linkage-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate admission authority links read-only
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/validate-memory-os-admission-authority-linkage.py \
            scripts/validate-memory-os-admission-authority-linkage-negative.py
          python scripts/validate-memory-os-admission-authority-linkage.py
          python scripts/validate-memory-os-admission-authority-linkage-negative.py
          git diff --check
          git diff --exit-code -- docs/fixtures/memory-os-operability/admission-authority-linkage-diagnostic.last.json
          test -z "$(git status --porcelain)"

  validate:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate admission authority links
        id: linkage
        run: |
          set +e
          log=/tmp/admission-authority-linkage.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/validate-memory-os-admission-authority-linkage.py \
            scripts/validate-memory-os-admission-authority-linkage-negative.py >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-admission-authority-linkage.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-admission-authority-linkage-negative.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Clear stale diagnostic
        if: steps.linkage.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git rm -f docs/fixtures/memory-os-operability/admission-authority-linkage-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(ops): clear admission linkage diagnostic"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$source_sha" ]]; then
              echo "Admission-linkage cleanup source is stale: validated $source_sha but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe linkage diagnostic
        if: steps.linkage.outputs.exit_code != '0'
        env:
          LINKAGE_EXIT_CODE: ${{ steps.linkage.outputs.exit_code }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          text = Path('/tmp/admission-authority-linkage.log').read_text(encoding='utf-8', errors='replace')
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'admission-authority-linkage',
              'result': 'FAIL',
              'sourceCommitSha': source_sha,
              'exitCode': int(os.environ['LINKAGE_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/admission-authority-linkage-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/admission-authority-linkage-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(ops): record admission linkage diagnostic"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$source_sha" ]]; then
              echo "Admission-linkage diagnostic source is stale: validated $source_sha but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce linkage validation
        run: test "${{ steps.linkage.outputs.exit_code }}" = "0"
