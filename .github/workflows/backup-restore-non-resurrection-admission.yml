      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
      - "scripts/validate-memory-os-operability.py"
      - ".github/workflows/backup-restore-non-resurrection-admission-source-negative.yml"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission-workflow-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-admission.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/local-apple-replay-restore-contract.v1.json"
      - "contracts/operations/local-coherent-recovery-set-contract.v1.json"
      - "contracts/operations/backup-local-foundation-evidence.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/fixtures/memory-os-operability/local-apple-replay-restore-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/local-coherent-recovery-set-results.sample.v1.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
      - "scripts/validate-memory-os-operability.py"
      - ".github/workflows/backup-restore-non-resurrection-admission-source-negative.yml"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission-workflow-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-non-resurrection-admission-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate typed non-resurrection authority read-only
        run: |
          set -euo pipefail
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="${{ github.event.pull_request.head.sha }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission-workflow-negative.py
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/validate-memory-os-local-apple-replay-restore.py \
            scripts/validate-memory-os-local-coherent-recovery-set.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-production-equivalent-environment-generation.py
          python scripts/validate-memory-os-recovery-objectives.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          python scripts/reconcile-memory-os-backup-non-resurrection-authority.py
          python scripts/reconcile-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py
          python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
          python scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  validate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact typed recovery authority source
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          EXPECTED_SOURCE_SHA="${GITHUB_SHA:-}"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python scripts/validate-memory-os-backup-restore-non-resurrection-admission-workflow-negative.py
          echo "SOURCE_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Validate typed non-resurrection admission
        id: admission
        run: |
          set +e
          log=/tmp/backup-restore-non-resurrection-admission.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/validate-memory-os-local-apple-replay-restore.py \
            scripts/validate-memory-os-local-coherent-recovery-set.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-non-resurrection-authority.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf "Typed non-resurrection validation exit code: %s (raw validator log suppressed)\n" "$code"
          exit 0
      - name: Commit bounded non-resurrection authority
        if: steps.admission.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-non-resurrection-admission.log

          revalidate_latest_typed_authority() {
            git fetch origin so
            git reset --hard origin/so
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission-workflow-negative.py
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-source-binding-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-load-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-transport-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-non-resurrection-authority.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Typed recovery authority HEAD changed again during bounded retry; refusing stale derived authority."
                exit 75
              fi
              echo "Typed recovery authority HEAD advanced; regenerating and revalidating once from latest so."
              revalidate_latest_typed_authority
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json 2>/dev/null || true
            git add \
              contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json \
              contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json \
              contracts/operations/backup-restore-generation-evidence-contract.v1.json \
              contracts/operations/backup-restore-generation-evidence-registry.v1.json \
              contracts/operations/backup-restore-generation-binding-contract.v1.json \
              contracts/operations/production-operability-status.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile typed non-resurrection authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Typed recovery authority HEAD changed again after bounded retry validation; refusing stale derived authority."
                exit 75
              fi
              echo "Typed recovery authority HEAD advanced after validation; discarding stale commit and retrying from latest so."
              revalidate_latest_typed_authority
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Typed recovery authority push raced with another writer; retrying once from latest so."
            revalidate_latest_typed_authority
          done
          exit 75
      - name: Record privacy-safe typed admission diagnostic
        if: steps.admission.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Typed recovery authority HEAD changed after validation; refusing stale typed admission diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          # Never publish untrusted typed-admission validator stdout.
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-non-resurrection-admission',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'FAIL',
              'exitCode': int(os.environ['ADMISSION_EXIT_CODE']),
              'output': 'REDACTED: typed non-resurrection validation failed; consult CI job logs',
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          if path.is_symlink():
              raise SystemExit('typed non-resurrection diagnostic target must not be a symlink')
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          previous_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  if previous_mode is not None:
                      os.fchmod(handle.fileno(), previous_mode)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record typed admission diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Typed recovery authority HEAD changed before diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce typed admission validation
        run: test "${{ steps.admission.outputs.exit_code }}" = "0"
