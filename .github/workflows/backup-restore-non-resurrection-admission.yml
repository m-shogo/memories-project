name: Backup Restore Non-Resurrection Admission

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-non-resurrection-admission.yml"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/local-apple-replay-restore-contract.v1.json"
      - "contracts/operations/local-coherent-recovery-set-contract.v1.json"
      - "contracts/operations/backup-local-foundation-evidence.v1.json"
      - "docs/fixtures/memory-os-operability/local-apple-replay-restore-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/local-coherent-recovery-set-results.sample.v1.json"
      - "docs/evidence/backup-restore/non-resurrection/**"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-local-apple-replay-restore.py"
      - "scripts/validate-memory-os-local-coherent-recovery-set.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-non-resurrection-admission-so
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate typed non-resurrection admission
        id: admission
        run: |
          set +e
          log=/tmp/backup-restore-non-resurrection-admission.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-local-apple-replay-restore.py \
            scripts/validate-memory-os-local-coherent-recovery-set.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-backup-non-resurrection-authority.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/reconcile-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded non-resurrection authority
        if: steps.admission.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json \
            contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json \
            contracts/operations/backup-restore-generation-evidence-contract.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            contracts/operations/backup-restore-generation-binding-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile typed non-resurrection authority"
            for attempt in 1 2 3 4; do
              git pull --rebase origin so
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Record privacy-safe typed admission diagnostic
        if: steps.admission.outputs.exit_code != '0'
        env:
          ADMISSION_EXIT_CODE: ${{ steps.admission.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/backup-restore-non-resurrection-admission.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-non-resurrection-admission',
              'result': 'FAIL',
              'exitCode': int(os.environ['ADMISSION_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-non-resurrection-admission-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record typed admission diagnostic"
            for attempt in 1 2 3; do
              git pull --rebase origin so
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi
      - name: Enforce typed admission validation
        run: test "${{ steps.admission.outputs.exit_code }}" = "0"
