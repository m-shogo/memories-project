name: One Shot Normalize Pre-Fence Upload Completion

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/one-shot-normalize-prefence-upload-completion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Normalize and compile
        id: compile
        run: |
          set +e
          gofmt -w services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go
          log=/tmp/prefence-upload-completion-compile.log
          (
            cd services/import-api
            go test ./internal/httpserver -run '^TestDoesNotExist$' -count=1
          ) >"$log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit normalized source
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deletion): normalize upload completion proof"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Record privacy-safe compile diagnostic
        if: steps.compile.outputs.exit_code != '0'
        env:
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          git reset --hard origin/so
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          text = Path('/tmp/prefence-upload-completion-compile.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>', text)
          text = re.sub(r'https?://[^\s]+', '<redacted-endpoint>', text)
          text = text.replace('minioadmin', '<redacted-local-credential>')
          text = re.sub(r'acct_[A-Za-z0-9_-]+', '<redacted-synthetic-account>', text)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'one-shot-normalize-prefence-upload-completion',
              'result': 'FAIL',
              'exitCode': int(os.environ['COMPILE_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'productionEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-compile-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/deletion-prefence-upload-completion-compile-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(deletion): record upload completion compile diagnostic"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
      - name: Enforce compile
        run: test "${{ steps.compile.outputs.exit_code }}" = "0"
