name: Incident Human Tabletop Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/incident-human-tabletop-evidence.yml"
      - "contracts/operations/requests/incident-human-tabletop-evidence-foundation.v1.json"
      - "contracts/operations/incident-human-tabletop-evidence-contract.v1.json"
      - "docs/evidence/incident-tabletops/*.json"
      - "scripts/register-memory-os-incident-human-tabletop.py"
      - "scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py"
      - "scripts/validate-memory-os-incident-human-tabletops.py"
      - "scripts/reconcile-memory-os-incident-human-tabletops.py"
      - "scripts/validate-memory-os-incident-human-tabletop-source-negative.py"
      - "scripts/validate-memory-os-incident-tabletop.py"
      - "scripts/validate-memory-os-incident-response.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/incident-human-tabletop-evidence.yml"
      - "contracts/operations/requests/incident-human-tabletop-evidence-foundation.v1.json"
      - "contracts/operations/incident-human-tabletop-evidence-contract.v1.json"
      - "docs/evidence/incident-tabletops/*.json"
      - "scripts/register-memory-os-incident-human-tabletop.py"
      - "scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py"
      - "scripts/validate-memory-os-incident-human-tabletops.py"
      - "scripts/reconcile-memory-os-incident-human-tabletops.py"
      - "scripts/validate-memory-os-incident-human-tabletop-source-negative.py"
      - "scripts/validate-memory-os-incident-tabletop.py"
      - "scripts/validate-memory-os-incident-response.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-human-tabletop-evidence-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean pull request authority source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Reconcile and validate human tabletop admission read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-incident-human-tabletop.py \
            scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py \
            scripts/validate-memory-os-incident-human-tabletops.py \
            scripts/reconcile-memory-os-incident-human-tabletops.py \
            scripts/validate-memory-os-incident-human-tabletop-source-negative.py \
            scripts/validate-memory-os-incident-tabletop.py \
            scripts/validate-memory-os-incident-response.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py
          python scripts/validate-memory-os-incident-human-tabletop-source-negative.py
          python scripts/reconcile-memory-os-incident-human-tabletops.py
          python scripts/validate-memory-os-incident-tabletop.py
          python scripts/validate-memory-os-incident-response.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- \
            contracts/operations/incident-human-tabletop-evidence-contract.v1.json \
            contracts/operations/production-operability-status.json \
            docs/fixtures/memory-os-operability/incident-human-tabletop-diagnostic.last.json

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate human tabletop admission
        id: tabletop
        run: |
          set +e
          log=/tmp/incident-human-tabletop.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-incident-human-tabletop.py \
            scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py \
            scripts/validate-memory-os-incident-human-tabletops.py \
            scripts/reconcile-memory-os-incident-human-tabletops.py \
            scripts/validate-memory-os-incident-human-tabletop-source-negative.py \
            scripts/validate-memory-os-incident-tabletop.py \
            scripts/validate-memory-os-incident-response.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-incident-human-tabletop-writer-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-incident-human-tabletop-source-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-incident-human-tabletops.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-incident-tabletop.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-incident-response.py >> "$log" 2>&1 || code=$?
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded human-tabletop authority
        if: steps.tabletop.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git rm -f docs/fixtures/memory-os-operability/incident-human-tabletop-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/incident-human-tabletop-evidence-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/incident-human-tabletop-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(incident): register human tabletop admission"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
              echo "Human-tabletop authority source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.tabletop.outputs.exit_code != '0'
        env:
          TABLETOP_EXIT_CODE: ${{ steps.tabletop.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
            echo "Human-tabletop diagnostic source is stale: validated $SOURCE_SHA but so is $(git rev-parse origin/so)" >&2
            exit 75
          }
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/incident-human-tabletop.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'incident-human-tabletop-evidence',
              'result': 'FAIL',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'exitCode': int(os.environ['TABLETOP_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'acceptedCompletedScenarioCount': 0,
              'productionRecoveryDrillCompleted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/incident-human-tabletop-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          existing_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              if existing_mode is not None:
                  os.fchmod(fd, existing_mode)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/incident-human-tabletop-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(incident): record human tabletop diagnostic"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
              echo "Human-tabletop diagnostic source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Enforce validation
        run: test "${{ steps.tabletop.outputs.exit_code }}" = "0"
