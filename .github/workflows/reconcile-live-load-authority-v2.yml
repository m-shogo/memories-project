name: Reconcile Live Load Authority V2

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-load-authority-v2.yml"
      - ".github/workflows/reconcile-live-load-authority-v2-pr.yml"
      - "contracts/operations/live-postgres-load-scenario-contract.v1.json"
      - "contracts/operations/live-object-load-scenario-contract.v1.json"
      - "docs/fixtures/memory-os-operability/live-postgres-load-results.sample.v1.json"
      - "docs/fixtures/memory-os-operability/live-object-load-results.sample.v1.json"
      - "scripts/validate-memory-os-live-load.py"
      - "scripts/validate-memory-os-live-object-load.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-live-load-status.py"
      - "scripts/validate-memory-os-live-load-reconcile-rollback-negative.py"
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-live-load-authority-v2-so
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(load): reconcile live dependency evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact live authority source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile authority tools
        run: |
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/validate-memory-os-live-load.py \
            scripts/validate-memory-os-live-object-load.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-live-load-status.py \
            scripts/validate-memory-os-live-load-reconcile-rollback-negative.py

      - name: Validate reconcile rollback
        run: python scripts/validate-memory-os-live-load-reconcile-rollback-negative.py

      - name: Validate committed live evidence
        id: validation
        run: |
          set +e
          {
            echo 'STAGE: validate-live-postgresql-load'
            python scripts/validate-memory-os-live-load.py
            echo 'STAGE: validate-live-object-load'
            python scripts/validate-memory-os-live-object-load.py
          } > /tmp/live-load-authority.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          VALIDATION_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          import re
          import tempfile
          from pathlib import Path

          output = Path('/tmp/live-load-authority.log').read_text(
              encoding='utf-8', errors='replace'
          )[-10000:]
          for pattern, replacement in (
              (r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>'),
              (r'Bearer\s+[^\s]+', 'Bearer <redacted>'),
              (r'password=[^\s]+', 'password=<redacted>'),
              (r'minioadmin', '<redacted-local-credential>'),
              (r'(?:acct|job|prv|spl|upl)_[A-Za-z0-9._:-]+', '<redacted-synthetic-id>'),
          ):
              output = re.sub(pattern, replacement, output, flags=re.IGNORECASE)
          diagnostic = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'reconcile-live-load-authority-v2',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'PASS' if os.environ['VALIDATION_EXIT_CODE'] == '0' else 'FAIL',
              'exitCode': int(os.environ['VALIDATION_EXIT_CODE']),
              'output': output,
              'containsSecrets': False,
              'productionEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/live-load-authority-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = json.dumps(diagnostic, indent=2) + '\n'
          temp_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  mode='w', encoding='utf-8', dir=path.parent,
                  prefix=f'.{path.name}.', suffix='.tmp', delete=False,
              ) as handle:
                  temp_path = Path(handle.name)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_path, path)
              temp_path = None
          finally:
              if temp_path is not None:
                  temp_path.unlink(missing_ok=True)
          PY

      - name: Commit bounded diagnostic
        run: |
          set -euo pipefail
          git fetch origin so
          if [ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]; then
            echo "Live load authority source changed after validation; refusing stale diagnostic." >&2
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/live-load-authority-diagnostic.last.json
          if git diff --cached --quiet; then
            echo "Live load diagnostic is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ steps.validation.outputs.exit_code }}" = "0" ]; then
              git commit -m "test(load): record live authority validation"
            else
              git commit -m "test(load): record live authority diagnostic"
            fi
            git fetch origin so
            if [ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]; then
              echo "Branch advanced before live load diagnostic push; refusing stale diagnostic." >&2
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Reconcile validated evidence into status
        if: steps.validation.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          # A diagnostic commit may now be the branch HEAD. Revalidate that exact
          # authority before deriving status; never carry validation across HEADs.
          git fetch origin so
          test "$source_head" = "$(git rev-parse origin/so)"
          python scripts/validate-memory-os-live-load.py
          python scripts/validate-memory-os-live-object-load.py
          evidence_sha="$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          paths = (
              Path('docs/fixtures/memory-os-operability/live-postgres-load-results.sample.v1.json'),
              Path('docs/fixtures/memory-os-operability/live-object-load-results.sample.v1.json'),
          )
          shas = []
          for path in paths:
              document = json.loads(path.read_text(encoding='utf-8'))
              sha = document.get('commitSha')
              if not isinstance(sha, str) or re.fullmatch(r'[0-9a-f]{40}', sha) is None:
                  raise SystemExit(f'{path}: commitSha must be a full lowercase SHA')
              shas.append(sha)
          if len(set(shas)) != 1:
              raise SystemExit('live PostgreSQL and object-load evidence must bind to one source commit')
          print(shas[0])
          PY
          )"
          git cat-file -e "${evidence_sha}^{commit}"
          EXPECTED_COMMIT_SHA="$evidence_sha" python scripts/reconcile-memory-os-live-load-status.py
          python scripts/validate-memory-os-live-load.py
          python scripts/validate-memory-os-live-object-load.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git fetch origin so
          if [ "$(git rev-parse origin/so)" != "$source_head" ]; then
            echo "so advanced after validation; refusing stale derived authority write" >&2
            exit 75
          fi
          git add contracts/operations/production-operability-status.json contracts/operations/load-test-scenario-contract.v1.json
          if git diff --cached --quiet; then
            echo "Live dependency load authority is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(load): reconcile live dependency evidence"
            git push origin HEAD:so
          fi

      - name: Fail after preserving diagnostic
        if: steps.validation.outputs.exit_code != '0'
        run: exit 1
