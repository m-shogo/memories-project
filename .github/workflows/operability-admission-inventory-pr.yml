name: Operability Admission Inventory PR

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/operability-admission-inventory-pr.yml"
      - ".github/workflows/operability-admission-inventory-pr-source-negative.yml"
      - "scripts/validate-memory-os-operability-admission-inventory-pr-source-negative.py"
      - ".github/workflows/operability-admission-inventory.yml"
      - "contracts/operations/**"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/evidence/sustained-soak/**"
      - "docs/fixtures/memory-os-operability/**"
      - "docs/runbooks/memory-os-production-equivalent-backup-restore-drill.md"
      - "scripts/generate-memory-os-operability-admission-inventory.py"
      - "scripts/validate-memory-os-operability-admission-inventory*.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-backup-restore-*.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/reconcile-memory-os-backup-restore-*.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-*.py"
      - "scripts/validate-memory-os-recovery-objectives*.py"
      - "scripts/validate-memory-os-sustained-*.py"

permissions:
  contents: read

concurrency:
  group: operability-admission-inventory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm exact clean PR authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="${PR_HEAD_SHA:-}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate operability admission inventory authority
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-operability-admission-inventory-pr-source-negative.py
          python -m py_compile \
            scripts/generate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory.py \
            scripts/validate-memory-os-operability-admission-inventory-source-authorities.py \
            scripts/validate-memory-os-operability-admission-inventory-generator-authority-negative.py \
            scripts/validate-memory-os-operability-admission-inventory-registry-negative.py \
            scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-operability-status-hygiene.py
          python scripts/validate-memory-os-operability-admission-inventory-source-authorities.py
          python scripts/validate-memory-os-operability-admission-inventory-generator-authority-negative.py
          python scripts/generate-memory-os-operability-admission-inventory.py
          python scripts/validate-memory-os-operability-admission-inventory.py
          python scripts/validate-memory-os-operability-admission-inventory-registry-negative.py
          python scripts/validate-memory-os-operability-admission-inventory-promotion-negative.py
          python scripts/validate-memory-os-operability-status-hygiene.py
      - name: Require read-only deterministic authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
