      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/operability-admission-inventory.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-negative.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-admission-chain.yml"
      - "contracts/operations/backup-restore-drill-preflight-contract.v1.json"
      - "contracts/operations/backup-restore-admission-chain-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-contract.v1.json"
      - "contracts/operations/backup-restore-drill-request-registry.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "contracts/operations/backup-restore-generation-binding-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json"
      - "contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/operability-admission-inventory.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-generation-negative.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight.py"
      - "scripts/validate-memory-os-backup-restore-drill-preflight-negative.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py"
      - "scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-preflight.py"
      - "scripts/request-memory-os-backup-restore-drill.py"
      - "scripts/validate-memory-os-backup-restore-drill-request.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-negative.py"
      - "scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-drill-request.py"
      - "scripts/register-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-semantic-generation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-generation-evidence.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding.py"
      - "scripts/validate-memory-os-backup-restore-generation-binding-negative.py"
      - "scripts/register-memory-os-backup-restore-non-resurrection-evidence.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-admission.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py"
      - "scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py"
      - "scripts/reconcile-memory-os-backup-non-resurrection-authority.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-backup-restore-admission-chain-negative.py"
      - "scripts/reconcile-memory-os-backup-restore-admission-chain.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-restore-admission-chain-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact chain authority source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git branch --show-current)" = "so"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write chain authority manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          cat > "$RUNNER_TEMP/backup-restore-chain-authority-paths" <<'EOF'
          .github/workflows/backup-restore-admission-chain.yml
          contracts/operations/backup-restore-drill-preflight-contract.v1.json
          contracts/operations/backup-restore-admission-chain-contract.v1.json
          contracts/operations/backup-restore-drill-request-contract.v1.json
          contracts/operations/backup-restore-drill-request-registry.v1.json
          contracts/operations/backup-restore-generation-evidence-contract.v1.json
          contracts/operations/backup-restore-generation-evidence-registry.v1.json
          contracts/operations/backup-restore-generation-binding-contract.v1.json
          contracts/operations/backup-restore-non-resurrection-admission-contract.v1.json
          contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json
          contracts/operations/production-equivalent-environment-generation-contract.v1.json
          contracts/operations/production-equivalent-environment-generation-registry.v1.json
          contracts/operations/production-equivalent-environment-record.v1.schema.json
          contracts/operations/production-equivalent-environment-generation-record.v1.schema.json
          contracts/operations/recovery-objectives-admission-contract.v1.json
          contracts/operations/recovery-objectives-registry.v1.json
          contracts/operations/operability-admission-inventory.v1.json
          contracts/operations/production-operability-status.json
          docs/evidence/backup-restore
          docs/evidence/recovery-objectives/approvals
          docs/fixtures/memory-os-operability/backup-restore-generation-evidence
          docs/fixtures/memory-os-operability/recovery-objectives-approval
          scripts/memory_os_backup_restore_blockers.py
          scripts/memory_os_environment_generation_eligibility.py
          scripts/register-memory-os-production-equivalent-environment-generation.py
          scripts/validate-memory-os-production-equivalent-environment-record.py
          scripts/validate-memory-os-production-equivalent-environment-generation.py
          scripts/validate-memory-os-production-equivalent-environment-generation-negative.py
          scripts/register-memory-os-recovery-objectives.py
          scripts/validate-memory-os-recovery-objectives.py
          scripts/validate-memory-os-recovery-objectives-negative.py
          scripts/validate-memory-os-backup-restore-drill-preflight.py
          scripts/validate-memory-os-backup-restore-drill-preflight-negative.py
          scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py
          scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py
          scripts/reconcile-memory-os-backup-restore-drill-preflight.py
          scripts/request-memory-os-backup-restore-drill.py
          scripts/validate-memory-os-backup-restore-drill-request.py
          scripts/validate-memory-os-backup-restore-drill-request-negative.py
          scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py
          scripts/reconcile-memory-os-backup-restore-drill-request.py
          scripts/register-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-evidence-negative.py
          scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py
          scripts/validate-memory-os-backup-restore-semantic-generation-negative.py
          scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py
          scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py
          scripts/reconcile-memory-os-backup-restore-generation-evidence.py
          scripts/validate-memory-os-backup-restore-generation-binding.py
          scripts/validate-memory-os-backup-restore-generation-binding-negative.py
          scripts/register-memory-os-backup-restore-non-resurrection-evidence.py
          scripts/validate-memory-os-backup-restore-non-resurrection-admission.py
          scripts/validate-memory-os-backup-restore-non-resurrection-negative.py
          scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py
          scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py
          scripts/reconcile-memory-os-backup-non-resurrection-authority.py
          scripts/validate-memory-os-backup-restore-admission-chain.py
          scripts/validate-memory-os-backup-restore-admission-chain-negative.py
          scripts/reconcile-memory-os-backup-restore-admission-chain.py
          scripts/validate-memory-os-operability.py
          EOF

      - name: Validate end-to-end recovery admission chain
        id: chain
        run: |
          set +e
          log=/tmp/backup-restore-admission-chain.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/memory_os_environment_generation_eligibility.py \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/validate-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-generation-negative.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/validate-memory-os-backup-restore-drill-preflight.py \
            scripts/validate-memory-os-backup-restore-drill-preflight-negative.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py \
            scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-preflight.py \
            scripts/request-memory-os-backup-restore-drill.py \
            scripts/validate-memory-os-backup-restore-drill-request.py \
            scripts/validate-memory-os-backup-restore-drill-request-negative.py \
            scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py \
            scripts/reconcile-memory-os-backup-restore-drill-request.py \
            scripts/register-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-negative.py \
            scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py \
            scripts/validate-memory-os-backup-restore-semantic-generation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py \
            scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py \
            scripts/reconcile-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-binding-negative.py \
            scripts/register-memory-os-backup-restore-non-resurrection-evidence.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-admission.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py \
            scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py \
            scripts/reconcile-memory-os-backup-non-resurrection-authority.py \
            scripts/validate-memory-os-backup-restore-admission-chain.py \
            scripts/validate-memory-os-backup-restore-admission-chain-negative.py \
            scripts/reconcile-memory-os-backup-restore-admission-chain.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-admission-chain-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Reject stale admission chain authority on pull requests
        if: steps.chain.outputs.exit_code == '0' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/operations/backup-restore-admission-chain-contract.v1.json

      - name: Commit bounded chain authority
        if: steps.chain.outputs.exit_code == '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-admission-chain.log

          revalidate_latest_chain() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-production-equivalent-environment-generation.py >> "$log" 2>&1
            python scripts/validate-memory-os-recovery-objectives.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-preflight-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-preflight-generation-eligibility-consistency-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request-reconcile-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence-contract-path-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-contract-path-negative.py >> "$log" 2>&1
            python scripts/reconcile-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-admission-chain.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-admission-chain-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-drill-request.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-evidence.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-candidate-registry-row-mutation-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-generation-binding-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-registry-aggregate-negative.py >> "$log" 2>&1
            python scripts/validate-memory-os-backup-restore-non-resurrection-admission.py >> "$log" 2>&1
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again during bounded admission-chain retry; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced; regenerating and revalidating admission chain once from latest so."
              revalidate_latest_chain
            fi

            git rm -f docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/backup-restore-admission-chain-contract.v1.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile end-to-end admission chain"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again after bounded admission-chain validation; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced after validation; discarding stale chain commit and retrying from latest so."
              revalidate_latest_chain
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Admission-chain push raced with another writer; retrying once from latest so."
            revalidate_latest_chain
          done
          exit 75

      - name: Record privacy-safe chain diagnostic
        if: steps.chain.outputs.exit_code != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        env:
          CHAIN_EXIT_CODE: ${{ steps.chain.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Repository HEAD changed after recovery admission chain validation; refusing stale failure diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          text = Path('/tmp/backup-restore-admission-chain.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-admission-chain',
              'result': 'FAIL',
              'exitCode': int(os.environ['CHAIN_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'preflightCreatedPrerequisite': False,
              'drillRequestCreated': False,
              'generationEvidenceCreated': False,
              'typedEvidenceCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record end-to-end admission chain diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Repository HEAD changed before recovery admission chain diagnostic push; refusing stale failure diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi

      - name: Enforce recovery admission chain
        run: test "${{ steps.chain.outputs.exit_code }}" = "0"