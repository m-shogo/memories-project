name: Backup Restore Admission Chain

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-admission-chain.yml"
      - "contracts/operations/backup-restore-*.json"
      - "contracts/operations/production-equivalent-environment-*.json"
      - "contracts/operations/recovery-objectives-*.json"
      - "contracts/operations/operability-admission-inventory.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/*backup*.py"
      - "scripts/*recovery*objective*.py"
      - "scripts/*production*equivalent*environment*.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-admission-chain.yml"
      - "contracts/operations/backup-restore-*.json"
      - "contracts/operations/production-equivalent-environment-*.json"
      - "contracts/operations/recovery-objectives-*.json"
      - "contracts/operations/operability-admission-inventory.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/evidence/backup-restore/**"
      - "docs/evidence/recovery-objectives/approvals/**"
      - "docs/fixtures/memory-os-operability/backup-restore-generation-evidence/**"
      - "docs/fixtures/memory-os-operability/recovery-objectives-approval/**"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/memory_os_environment_generation_eligibility.py"
      - "scripts/*backup*.py"
      - "scripts/*recovery*objective*.py"
      - "scripts/*production*equivalent*environment*.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-admission-chain-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact clean PR authority source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Validate end-to-end recovery admission chain read-only
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate-memory-os-backup-restore-admission-chain-full.py
          python scripts/validate-memory-os-backup-restore-admission-chain-full.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture exact chain authority source
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Reconcile and validate end-to-end recovery admission chain
        id: chain
        run: |
          set +e
          log=/tmp/backup-restore-admission-chain.log
          : > "$log"
          code=0
          python -m py_compile scripts/validate-memory-os-backup-restore-admission-chain-full.py >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            python scripts/validate-memory-os-backup-restore-admission-chain-full.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0

      - name: Commit bounded chain authority
        if: steps.chain.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          log=/tmp/backup-restore-admission-chain.log

          revalidate_latest_chain() {
            git fetch origin so
            git reset --hard origin/so
            SOURCE_SHA="$(git rev-parse HEAD)"
            export SOURCE_SHA
            : > "$log"
            python scripts/validate-memory-os-backup-restore-admission-chain-full.py >> "$log" 2>&1
          }

          assert_only_derived_chain_changes() {
            while IFS= read -r changed; do
              [[ -z "$changed" ]] && continue
              case "$changed" in
                contracts/operations/backup-restore-admission-chain-contract.v1.json|docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json)
                  ;;
                *)
                  echo "Unexpected admission-chain workspace mutation: $changed"
                  exit 1
                  ;;
              esac
            done < <(git status --porcelain | sed -E 's/^.. //')
          }

          for reconcile_attempt in 1 2; do
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again during bounded admission-chain retry; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced; regenerating and revalidating admission chain once from latest so."
              revalidate_latest_chain
            fi

            assert_only_derived_chain_changes
            git rm -f docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json 2>/dev/null || true
            git add contracts/operations/backup-restore-admission-chain-contract.v1.json
            git add -u docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi

            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(restore): reconcile end-to-end admission chain"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              if [[ "$reconcile_attempt" == "2" ]]; then
                echo "Repository HEAD changed again after bounded admission-chain validation; refusing stale derived authority."
                exit 75
              fi
              echo "Repository HEAD advanced after validation; discarding stale chain commit and retrying from latest so."
              revalidate_latest_chain
              continue
            fi
            if git push origin HEAD:so; then
              exit 0
            fi
            if [[ "$reconcile_attempt" == "2" ]]; then
              exit 1
            fi
            echo "Admission-chain push raced with another writer; retrying once from latest so."
            revalidate_latest_chain
          done
          exit 75

      - name: Record privacy-safe chain diagnostic
        if: steps.chain.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          CHAIN_EXIT_CODE: ${{ steps.chain.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Repository HEAD changed after recovery admission chain validation; refusing stale failure diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/backup-restore-admission-chain.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'backup-restore-admission-chain',
              'result': 'FAIL',
              'exitCode': int(os.environ['CHAIN_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'preflightCreatedPrerequisite': False,
              'drillRequestCreated': False,
              'generationEvidenceCreated': False,
              'typedEvidenceCreated': False,
              'restoreExecuted': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          previous_mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  if previous_mode is not None:
                      os.fchmod(handle.fileno(), previous_mode)
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/backup-restore-admission-chain-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(restore): record end-to-end admission chain diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Repository HEAD changed before recovery admission chain diagnostic push; refusing stale failure diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
          fi

      - name: Enforce recovery admission chain
        run: test "${{ steps.chain.outputs.exit_code }}" = "0"
