name: Observability Stack Deployment Admission

on:
  pull_request:
    paths:
      - ".github/workflows/observability-stack-deployment.yml"
      - "contracts/operations/requests/observability-stack-deployment-foundation.v1.json"
      - "contracts/operations/observability-stack-deployment-contract.v1.json"
      - "contracts/operations/observability-stack-deployment-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "docs/evidence/observability-stack/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-observability-stack-deployment.py"
      - "scripts/validate-memory-os-observability-stack-writer-authority-negative.py"
      - "scripts/validate-memory-os-observability-stack-deployment.py"
      - "scripts/reconcile-memory-os-observability-stack-deployment.py"
      - "scripts/validate-memory-os-observability-stack-reconcile-negative.py"
      - "scripts/validate-memory-os-observability-stack-generation-authority-negative.py"
      - "scripts/validate-memory-os-observability.py"
      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/validate-memory-os-metrics.py"
      - "scripts/validate-memory-os-metrics-operations.py"
      - "scripts/validate-memory-os-metrics-alerting.py"
      - "scripts/validate-memory-os-operability.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/observability-stack-deployment.yml"
      - "contracts/operations/requests/observability-stack-deployment-foundation.v1.json"
      - "contracts/operations/observability-stack-deployment-contract.v1.json"
      - "contracts/operations/observability-stack-deployment-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-contract.v1.json"
      - "contracts/operations/production-equivalent-environment-generation-registry.v1.json"
      - "contracts/operations/production-equivalent-environment-record.v1.schema.json"
      - "contracts/operations/production-equivalent-environment-generation-record.v1.schema.json"
      - "docs/evidence/observability-stack/independent-reviews/**"
      - "scripts/register-memory-os-production-equivalent-environment-generation.py"
      - "scripts/validate-memory-os-production-equivalent-environment-record.py"
      - "scripts/register-memory-os-observability-stack-deployment.py"
      - "scripts/validate-memory-os-observability-stack-writer-authority-negative.py"
      - "scripts/validate-memory-os-observability-stack-deployment.py"
      - "scripts/reconcile-memory-os-observability-stack-deployment.py"
      - "scripts/validate-memory-os-observability-stack-reconcile-negative.py"
      - "scripts/validate-memory-os-observability-stack-generation-authority-negative.py"
      - "scripts/validate-memory-os-observability.py"
      - "scripts/validate-memory-os-observability-access.py"
      - "scripts/validate-memory-os-metrics.py"
      - "scripts/validate-memory-os-metrics-operations.py"
      - "scripts/validate-memory-os-metrics-alerting.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-stack-deployment-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean pull request authority source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate integrated admission read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-observability-stack-deployment.py \
            scripts/validate-memory-os-observability-stack-writer-authority-negative.py \
            scripts/validate-memory-os-observability-stack-deployment.py \
            scripts/reconcile-memory-os-observability-stack-deployment.py \
            scripts/validate-memory-os-observability-stack-reconcile-negative.py \
            scripts/validate-memory-os-observability-stack-generation-authority-negative.py \
            scripts/validate-memory-os-observability.py \
            scripts/validate-memory-os-observability-access.py \
            scripts/validate-memory-os-metrics.py \
            scripts/validate-memory-os-metrics-operations.py \
            scripts/validate-memory-os-metrics-alerting.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-observability-stack-writer-authority-negative.py
          python scripts/validate-memory-os-observability-stack-generation-authority-negative.py
          python scripts/validate-memory-os-observability-stack-reconcile-negative.py
          python scripts/reconcile-memory-os-observability-stack-deployment.py
          python scripts/validate-memory-os-observability.py
          python scripts/validate-memory-os-observability-access.py
          python scripts/validate-memory-os-metrics.py
          python scripts/validate-memory-os-metrics-operations.py
          python scripts/validate-memory-os-metrics-alerting.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- \
            contracts/operations/observability-stack-deployment-contract.v1.json \
            contracts/operations/production-operability-status.json \
            docs/fixtures/memory-os-operability/observability-stack-deployment-diagnostic.last.json

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate integrated admission
        id: stack
        run: |
          set +e
          log=/tmp/observability-stack-deployment.log
          : > "$log"
          code=0
          python -m py_compile \
            scripts/register-memory-os-production-equivalent-environment-generation.py \
            scripts/validate-memory-os-production-equivalent-environment-record.py \
            scripts/register-memory-os-observability-stack-deployment.py \
            scripts/validate-memory-os-observability-stack-writer-authority-negative.py \
            scripts/validate-memory-os-observability-stack-deployment.py \
            scripts/reconcile-memory-os-observability-stack-deployment.py \
            scripts/validate-memory-os-observability-stack-reconcile-negative.py \
            scripts/validate-memory-os-observability-stack-generation-authority-negative.py \
            scripts/validate-memory-os-observability.py \
            scripts/validate-memory-os-observability-access.py \
            scripts/validate-memory-os-metrics.py \
            scripts/validate-memory-os-metrics-operations.py \
            scripts/validate-memory-os-metrics-alerting.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-observability-stack-writer-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-observability-stack-generation-authority-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-observability-stack-reconcile-negative.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/reconcile-memory-os-observability-stack-deployment.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-observability.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-observability-access.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-metrics.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-metrics-operations.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-metrics-alerting.py >> "$log" 2>&1 || code=$?; fi
          if [[ "$code" == "0" ]]; then python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded stack admission authority
        if: steps.stack.outputs.exit_code == '0' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          git rm -f docs/fixtures/memory-os-operability/observability-stack-deployment-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/observability-stack-deployment-contract.v1.json \
            contracts/operations/production-operability-status.json
          git add -u docs/fixtures/memory-os-operability/observability-stack-deployment-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(observability): register stack deployment admission"
            remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
            if [[ "$remote_sha" != "$source_sha" ]]; then
              echo "Observability stack authority source is stale: validated $source_sha but so is $remote_sha" >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: steps.stack.outputs.exit_code != '0' && github.ref == 'refs/heads/so'
        env:
          STACK_EXIT_CODE: ${{ steps.stack.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
            echo "Observability diagnostic source is stale: validated $SOURCE_SHA but so is $(git rev-parse origin/so)" >&2
            exit 75
          }
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          text = Path('/tmp/observability-stack-deployment.log').read_text(encoding='utf-8', errors='replace')
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'observability-stack-deployment',
              'result': 'FAIL',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'exitCode': int(os.environ['STACK_EXIT_CODE']),
              'output': text[-12000:],
              'containsSecrets': False,
              'admittedStackCount': 0,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/observability-stack-deployment-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, tmp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp_name, path)
          finally:
              try:
                  os.unlink(tmp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/observability-stack-deployment-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(observability): record stack admission diagnostic"
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$SOURCE_SHA" || {
              echo "Observability diagnostic source advanced before publication; refusing stale diagnostic." >&2
              exit 75
            }
            git push origin HEAD:so
          fi
      - name: Enforce stack admission validation
        run: test "${{ steps.stack.outputs.exit_code }}" = "0"
