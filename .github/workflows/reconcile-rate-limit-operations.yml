name: Reconcile Rate-Limit Operations Policy

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-rate-limit-operations.yml"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-rate-limit-operations.md"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-rate-limit-authority-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-operations.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-rate-limit-operations.yml"
      - "contracts/operations/rate-limit-operations-contract.v1.json"
      - "contracts/operations/rate-limit-policy-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "docs/runbooks/memory-os-rate-limit-operations.md"
      - "scripts/validate-memory-os-rate-limit-operations.py"
      - "scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py"
      - "scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-rate-limit-authority-negative.py"
      - "scripts/reconcile-memory-os-rate-limit-operations.py"
      - "scripts/reconcile-memory-os-rate-limit-operation-evidence.py"
      - "scripts/validate-memory-os-rate-limit.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/validate-memory-os-entry-docs.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-rate-limit-operations-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean PR authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Compile operations authority
        run: |
          python -m py_compile \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py \
            scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-rate-limit-authority-negative.py \
            scripts/reconcile-memory-os-rate-limit-operations.py \
            scripts/reconcile-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-entry-docs.py

      - name: Validate operations contract
        run: python scripts/validate-memory-os-rate-limit-operations.py

      - name: Validate operations reconcile negative
        run: python scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py

      - name: Validate operation evidence reconcile negative
        run: python scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py

      - name: Validate aggregate rate-limit authority negative
        run: python scripts/validate-memory-os-rate-limit-authority-negative.py

      - name: Reconcile primary policy and status read-only
        run: |
          python scripts/reconcile-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py

      - name: Require whole-worktree deterministic authority
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean authority source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compile operations authority
        run: |
          python -m py_compile \
            scripts/validate-memory-os-rate-limit-operations.py \
            scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py \
            scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-rate-limit-authority-negative.py \
            scripts/reconcile-memory-os-rate-limit-operations.py \
            scripts/reconcile-memory-os-rate-limit-operation-evidence.py \
            scripts/validate-memory-os-rate-limit.py \
            scripts/validate-memory-os-operability.py \
            scripts/validate-memory-os-entry-docs.py

      - name: Validate operations contract
        run: python scripts/validate-memory-os-rate-limit-operations.py

      - name: Validate operations reconcile negative
        run: python scripts/validate-memory-os-rate-limit-operations-reconcile-negative.py

      - name: Validate operation evidence reconcile negative
        run: python scripts/validate-memory-os-rate-limit-operation-evidence-reconcile-negative.py

      - name: Validate aggregate rate-limit authority negative
        run: python scripts/validate-memory-os-rate-limit-authority-negative.py

      - name: Reconcile primary policy and status
        run: |
          python scripts/reconcile-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-rate-limit.py
          python scripts/validate-memory-os-rate-limit-operations.py
          python scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-entry-docs.py

      - name: Commit reconciled authority files
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$source_sha"
          git add \
            contracts/operations/rate-limit-policy-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Rate-limit operations authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(rate-limit): reconcile operations authority"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Rate-limit operations authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
