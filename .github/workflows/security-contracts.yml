name: Security Contracts

on:
  pull_request:
    paths:
      - "contracts/openapi/**"
      - "docs/schemas/memory-os-security/**"
      - "docs/fixtures/memory-os-security/**"
      - "infra/postgresql/security/**"
      - "scripts/validate-memory-os-security.py"
      - "scripts/validate-memory-os-authorization.py"
      - "scripts/validate-memory-os-postgresql-rls.py"
      - "scripts/validate-memory-os-apple-auth.py"
      - "scripts/validate-memory-os-signed-upload-openapi.py"
      - "scripts/validate-memory-os-parser-security.py"
      - "scripts/validate-memory-os-preview-spool.py"
      - "scripts/validate-memory-os-canonical-records.py"
      - "scripts/render-memory-os-status-block.py"
      - "requirements-security-validation.txt"
      - ".github/workflows/security-contracts.yml"
  push:
    branches:
      - so
    paths:
      - "contracts/openapi/**"
      - "docs/schemas/memory-os-security/**"
      - "docs/fixtures/memory-os-security/**"
      - "infra/postgresql/security/**"
      - "scripts/validate-memory-os-security.py"
      - "scripts/validate-memory-os-authorization.py"
      - "scripts/validate-memory-os-postgresql-rls.py"
      - "scripts/validate-memory-os-apple-auth.py"
      - "scripts/validate-memory-os-signed-upload-openapi.py"
      - "scripts/validate-memory-os-parser-security.py"
      - "scripts/validate-memory-os-preview-spool.py"
      - "scripts/validate-memory-os-canonical-records.py"
      - "scripts/render-memory-os-status-block.py"
      - "requirements-security-validation.txt"
      - ".github/workflows/security-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-security-validation.txt

      - name: Compile validators
        run: |
          python -m py_compile scripts/validate-memory-os-security.py
          python -m py_compile scripts/validate-memory-os-authorization.py
          python -m py_compile scripts/validate-memory-os-postgresql-rls.py
          python -m py_compile scripts/validate-memory-os-apple-auth.py
          python -m py_compile scripts/validate-memory-os-signed-upload-openapi.py
          python -m py_compile scripts/validate-memory-os-parser-security.py
          python -m py_compile scripts/validate-memory-os-preview-spool.py
          python -m py_compile scripts/render-memory-os-status-block.py
          python -m py_compile scripts/validate-memory-os-canonical-records.py

      - name: Validate security schemas and fixtures
        run: python scripts/validate-memory-os-security.py

      - name: Check generated status blocks are up to date
        run: python scripts/render-memory-os-status-block.py --check

      - name: Validate object authorization cases
        run: python scripts/validate-memory-os-authorization.py

      - name: Validate PostgreSQL RLS contract
        run: python scripts/validate-memory-os-postgresql-rls.py

      - name: Validate Sign in with Apple contract
        run: python scripts/validate-memory-os-apple-auth.py

      - name: Validate signed quarantine upload OpenAPI
        run: python scripts/validate-memory-os-signed-upload-openapi.py

      - name: Validate parser sandbox and archive safety
        run: python scripts/validate-memory-os-parser-security.py

      - name: Validate Preview spool semantic invariants
        run: python scripts/validate-memory-os-preview-spool.py

      - name: Validate canonical adapter record contract
        run: python scripts/validate-memory-os-canonical-records.py

  validate-live-postgresql-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: memory_os_security
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply tenant RLS migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/001_memory_os_import_rls.sql

      - name: Apply account control migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/002_memory_os_account_control.sql

      - name: Apply upload authorization migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/002_memory_os_upload_authorization.sql

      - name: Apply Preview domain migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/003_memory_os_preview_domain.sql

      - name: Apply account session migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/004_memory_os_account_session.sql

      - name: Apply apply/memory migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/005_memory_os_apply_memory.sql

      - name: Apply deletion fencing migration
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/006_memory_os_deletion_fencing.sql

      - name: Execute tenant RLS integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_import_rls.sql

      - name: Execute account control integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_account_control.sql

      - name: Execute upload authorization integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_upload_authorization.sql

      - name: Execute Preview domain integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_preview_domain.sql

      - name: Execute account session integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_account_session.sql

      - name: Execute apply/memory integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_apply_memory.sql

      - name: Execute deletion fencing integration tests
        run: psql --set=ON_ERROR_STOP=1 --file infra/postgresql/security/test_memory_os_deletion_fencing.sql
