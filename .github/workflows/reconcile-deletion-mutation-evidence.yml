name: Reconcile Deletion Mutation Evidence

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-mutation-evidence.yml"
      - "scripts/reconcile-memory-os-deletion-mutation-evidence.py"
      - "scripts/validate-memory-os-deletion-mutation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-mutation-linearization.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-mutation-linearization-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-mutation-linearization-results.sample.v1.json"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-mutation-evidence.yml"
      - "scripts/reconcile-memory-os-deletion-mutation-evidence.py"
      - "scripts/validate-memory-os-deletion-mutation-evidence-reconcile-negative.py"
      - "scripts/validate-memory-os-deletion-prefence-mutation-linearization.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-prefence-mutation-linearization-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-prefence-mutation-linearization-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-deletion-mutation-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git fetch origin so
            test "$(git rev-parse origin/so)" = "$(git rev-parse HEAD)"
          fi
      - name: Validate mutation proof and reconcile
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-deletion-mutation-evidence.py \
            scripts/validate-memory-os-deletion-mutation-evidence-reconcile-negative.py \
            scripts/validate-memory-os-deletion-prefence-mutation-linearization.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-mutation-evidence-reconcile-negative.py
          python scripts/validate-memory-os-deletion-prefence-mutation-linearization.py --require-result
          python scripts/reconcile-memory-os-deletion-mutation-evidence.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --exit-code -- \
              contracts/operations/load-test-scenario-contract.v1.json \
              contracts/operations/production-operability-status.json
          fi
      - name: Commit canonical authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Mutation proof authority already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(deletion): register mutation fence evidence"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced during mutation evidence reconcile; refusing stale derived authority."
            exit 75
          fi
          git push origin HEAD:so
