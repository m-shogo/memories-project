name: Reconcile Incident Exercise Authority

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-incident-exercise-authority.yml"
      - "contracts/operations/incident-control-exercise-contract.v1.json"
      - "docs/fixtures/memory-os-operability/incident-control-exercise-results.sample.v1.json"
      - "scripts/reconcile-memory-os-incident-control-exercise.py"
      - "scripts/validate-memory-os-incident-control-exercise.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-incident-exercise-authority.yml"
      - "contracts/operations/incident-control-exercise-contract.v1.json"
      - "docs/fixtures/memory-os-operability/incident-control-exercise-results.sample.v1.json"
      - "scripts/reconcile-memory-os-incident-control-exercise.py"
      - "scripts/validate-memory-os-incident-control-exercise.py"
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-incident-exercise-authority-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(incident): register automated control exercise')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-security-validation.txt

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          fi
          python -m py_compile \
            scripts/reconcile-memory-os-incident-control-exercise.py \
            scripts/validate-memory-os-incident-control-exercise.py

      - name: Reconcile then validate incident authority
        run: |
          python scripts/reconcile-memory-os-incident-control-exercise.py
          python scripts/validate-memory-os-incident-control-exercise.py
          python scripts/validate-memory-os-incident-response.py
          python scripts/validate-memory-os-incident-tabletop.py
          python scripts/validate-memory-os-operability.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git diff --check
          git diff --exit-code -- \
            contracts/operations/incident-control-exercise-contract.v1.json \
            contracts/operations/production-operability-status.json

      - name: Commit incident contract and status together
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add \
            contracts/operations/incident-control-exercise-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Incident exercise authority is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(incident): register automated control exercise"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Incident exercise authority source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
