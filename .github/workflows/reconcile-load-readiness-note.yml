name: Reconcile Load Readiness Note

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-load-readiness-note.yml"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile note from machine-readable flags
        run: |
          set -euo pipefail
          python -m py_compile scripts/reconcile-memory-os-load-readiness-note.py
          python scripts/reconcile-memory-os-load-readiness-note.py
          python scripts/validate-memory-os-load.py
      - name: Commit normalized note
        run: |
          set -euo pipefail
          git add contracts/operations/load-test-scenario-contract.v1.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(load): normalize readiness summary"
            git pull --rebase origin so
            git push origin HEAD:so
          fi
