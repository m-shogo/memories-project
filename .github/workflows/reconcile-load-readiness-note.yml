name: Reconcile Load Readiness Note

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-load-readiness-note.yml"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/validate-memory-os-load-readiness-note-reconcile-negative.py"
      - "scripts/validate-memory-os-load.py"
      - "contracts/operations/load-test-scenario-contract.v1.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-load-readiness-note.yml"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/validate-memory-os-load-readiness-note-reconcile-negative.py"
      - "scripts/validate-memory-os-load.py"
      - "contracts/operations/load-test-scenario-contract.v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-load-readiness-note-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          fi

      - name: Reconcile and validate note from machine-readable flags
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/validate-memory-os-load-readiness-note-reconcile-negative.py \
            scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-load-readiness-note-reconcile-negative.py
          python scripts/reconcile-memory-os-load-readiness-note.py
          python scripts/validate-memory-os-load.py

      - name: Require deterministic authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- contracts/operations/load-test-scenario-contract.v1.json

      - name: Commit normalized note
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git add contracts/operations/load-test-scenario-contract.v1.json
          if git diff --cached --quiet; then
            echo "Load readiness note is already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(load): normalize readiness summary"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Load readiness-note source is stale: validated $source_sha but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
