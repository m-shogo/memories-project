name: Database Commit Outage Recovery

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/database-commit-outage.yml"
      - "contracts/operations/database-commit-outage-contract.v1.json"
      - "services/import-api/internal/importflow/database_outage_drill_linux_test.go"
      - "services/import-api/internal/importflow/resume.go"
      - "services/import-api/internal/importflow/flow.go"
      - "services/import-api/internal/previewcommit/committer.go"
      - "scripts/validate-memory-os-database-commit-outage.py"
      - "scripts/validate-memory-os-database-commit-outage-reconcile-negative.py"
      - "scripts/reconcile-memory-os-database-commit-outage.py"
  schedule:
    - cron: "7 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-commit-outage-so
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security
      MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
      MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Start MinIO
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio server /data

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm exact clean source
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Compile validator and check formatting
        run: |
          python -m py_compile \
            scripts/validate-memory-os-database-commit-outage.py \
            scripts/validate-memory-os-database-commit-outage-reconcile-negative.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-database-commit-outage.py
          python scripts/validate-memory-os-database-commit-outage-reconcile-negative.py
          test -z "$(gofmt -l \
            services/import-api/internal/importflow/database_outage_drill_linux_test.go \
            services/import-api/internal/importflow/resume.go)"
          python scripts/validate-memory-os-database-commit-outage.py

      - name: Execute exact-source database outage drill
        id: drill
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          root = Path.cwd()
          workdir = root / "services/import-api"
          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=root, text=True
          ).strip()
          command = [
              "go", "test", "./internal/importflow",
              "-run", "^TestFlowRecoversAfterDatabaseCommitOutage$", "-count=1",
          ]
          started = time.monotonic()
          completed = subprocess.run(
              command,
              cwd=workdir,
              env=os.environ.copy(),
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          duration = round(time.monotonic() - started, 6)
          success = completed.returncode == 0
          generated_at = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")

          diagnostic = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "database-commit-outage-recovery",
              "sourceCommitSha": source_sha,
              "result": "PASS" if success else "FAIL",
              "exitCode": completed.returncode,
              "durationSeconds": duration,
              "output": completed.stdout[-4000:],
              "containsSecrets": False,
              "productionEvidence": False,
          }
          diagnostic_path = root / "docs/fixtures/memory-os-operability/database-commit-outage-diagnostic.last.json"
          diagnostic_path.parent.mkdir(parents=True, exist_ok=True)
          diagnostic_path.write_text(
              json.dumps(diagnostic, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          if success:
              result = {
                  "schemaVersion": "memory-os-database-commit-outage-results.v1",
                  "commitSha": source_sha,
                  "generatedAt": generated_at,
                  "environment": {
                      "mode": "GITHUB_ACTIONS_UBUNTU_POSTGRES16_MINIO_UNREACHABLE_COMMIT_POOL",
                      "productionEvidence": False,
                      "containsSecrets": False,
                      "syntheticDataOnly": True,
                  },
                  "result": "PASS",
                  "integrityResult": "PASS",
                  "exitCode": 0,
                  "durationSeconds": duration,
                  "assertions": {
                      "previewRowsDuringOutage": 0,
                      "jobStateDuringOutage": "preview_building",
                      "sealedSpoolEntriesAfterFailure": 1,
                      "previewRowsAfterRecovery": 1,
                      "candidateRowsAfterRecovery": 2,
                      "rejectionRowsAfterRecovery": 1,
                      "sameSourceAndPreviewIdReused": True,
                      "sameSpoolIdReused": True,
                      "resumeWithoutObjectStore": True,
                      "resumeWithoutParser": True,
                      "recoveryMarkedAsReplay": False,
                  },
                  "limitations": [
                      "not PostgreSQL process loss",
                      "not replication failover",
                      "recovery commits from the same sealed spool",
                      "ephemeral PostgreSQL 16 and MinIO only",
                      "host restart not executed between seal and resume",
                      "not production chaos evidence",
                  ],
              }
              result_path = root / "docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json"
              result_path.write_text(
                  json.dumps(result, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_sha={source_sha}\n")
              output.write(f"success={'true' if success else 'false'}\n")
          PY

      - name: Validate generated exact-source evidence
        if: steps.drill.outputs.success == 'true'
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.drill.outputs.source_sha }}
        run: python scripts/validate-memory-os-database-commit-outage.py

      - name: Commit result or bounded diagnostic
        run: |
          set -euo pipefail
          git add docs/fixtures/memory-os-operability/database-commit-outage-diagnostic.last.json
          if [ "${{ steps.drill.outputs.success }}" = "true" ]; then
            git add docs/fixtures/memory-os-operability/database-commit-outage-results.sample.v1.json
          fi
          if git diff --cached --quiet; then
            echo "Database outage evidence is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ steps.drill.outputs.success }}" = "true" ]; then
              git commit -m "test(chaos): record exact-source database commit outage"
            else
              git commit -m "test(chaos): record database commit outage diagnostic"
            fi
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "${{ steps.drill.outputs.source_sha }}" ]]; then
              echo "Source head advanced; refusing to replay stale database outage evidence."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Reconcile database outage authority
        if: steps.drill.outputs.success == 'true'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$(git rev-parse HEAD)" ]]; then
            echo "Database outage evidence head advanced before reconcile; refusing stale authority."
            exit 75
          fi
          python scripts/reconcile-memory-os-database-commit-outage.py
          python scripts/validate-memory-os-database-commit-outage.py
          python scripts/validate-memory-os-operability.py
          git add contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Database outage authority is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(chaos): reconcile database commit outage evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$(git rev-parse HEAD^)" ]]; then
              echo "Database outage evidence head advanced during reconcile; refusing stale authority push."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Fail when the database outage drill failed
        if: steps.drill.outputs.success != 'true'
        run: exit 1
