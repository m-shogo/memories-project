name: Reconcile Latest Evidence Concurrency

on:
  pull_request:
    paths:
      - ".github/workflows/reconcile-latest-evidence-concurrency.yml"
      - ".github/workflows/regenerate-live-postgres-load-results.yml"
      - ".github/workflows/capacity-ramp.yml"
      - ".github/workflows/short-stability-sample.yml"
      - ".github/workflows/reconcile-load-foundation-authorities.yml"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-latest-evidence-concurrency.yml"
      - ".github/workflows/regenerate-live-postgres-load-results.yml"
      - ".github/workflows/capacity-ramp.yml"
      - ".github/workflows/short-stability-sample.yml"
      - ".github/workflows/reconcile-load-foundation-authorities.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-latest-evidence-concurrency-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'ci: cancel stale exact-source evidence runs')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact concurrency authority source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'so' }}
          fetch-depth: 0

      - name: Confirm exact clean authority source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          else
            test "$(git branch --show-current)" = "so"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/so)"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require latest-run concurrency
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/regenerate-live-postgres-load-results.yml'),
              Path('.github/workflows/capacity-ramp.yml'),
              Path('.github/workflows/short-stability-sample.yml'),
              Path('.github/workflows/reconcile-load-foundation-authorities.yml'),
          ]
          for path in paths:
              if not path.is_file():
                  raise SystemExit(f'{path}: latest-evidence workflow authority missing')
              text = path.read_text(encoding='utf-8')
              group_marker = 'concurrency:\n'
              if text.count(group_marker) != 1:
                  raise SystemExit(f'{path}: concurrency authority drift')
              section_start = text.index(group_marker)
              section_end = text.find('\n\njobs:', section_start)
              if section_end < 0:
                  raise SystemExit(f'{path}: concurrency section boundary drift')
              section = text[section_start:section_end]
              if 'cancel-in-progress: true' in section:
                  continue
              if section.count('cancel-in-progress: false') != 1:
                  raise SystemExit(f'{path}: cancel-in-progress authority drift')
              section = section.replace('cancel-in-progress: false', 'cancel-in-progress: true')
              text = text[:section_start] + section + text[section_end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Require deterministic concurrency authority on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            .github/workflows/regenerate-live-postgres-load-results.yml \
            .github/workflows/capacity-ramp.yml \
            .github/workflows/short-stability-sample.yml \
            .github/workflows/reconcile-load-foundation-authorities.yml

      - name: Commit concurrency authority
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add \
            .github/workflows/regenerate-live-postgres-load-results.yml \
            .github/workflows/capacity-ramp.yml \
            .github/workflows/short-stability-sample.yml \
            .github/workflows/reconcile-load-foundation-authorities.yml
          if git diff --cached --quiet; then
            echo "Evidence workflows already prefer the latest source."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: cancel stale exact-source evidence runs"
          remote_sha="$(git ls-remote origin refs/heads/so | awk '{print $1}')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Concurrency authority source is stale: validated $SOURCE_SHA but so is $remote_sha" >&2
            exit 75
          fi
          git push origin HEAD:so
