name: Reviewed Client Baseline Registry

on:
  pull_request:
    paths:
      - ".github/workflows/client-baseline-registry.yml"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/client-server-support-window-contract.v1.json"
      - "contracts/operations/client-server-skew-registry.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "contracts/operations/compatibility-admission-gaps.v1.json"
      - "scripts/register-memory-os-client-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-baseline-writer-authority-negative.py"
      - "scripts/validate-memory-os-client-baseline-lineage-negative.py"
      - "scripts/validate-memory-os-client-baseline-evidence-binding-negative.py"
      - "scripts/reconcile-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-server-support-window.py"
      - "scripts/update-memory-os-compatibility-admission-gaps.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/evidence/clients/README.md"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/client-baseline-registry.yml"
      - "contracts/operations/client-baseline-registry-contract.v1.json"
      - "contracts/operations/client-baseline-registry.v1.json"
      - "contracts/operations/client-server-support-window-contract.v1.json"
      - "contracts/operations/client-server-skew-registry.v1.json"
      - "contracts/operations/release-baseline-registry.v1.json"
      - "contracts/operations/release-compatibility-pair-contract.v1.json"
      - "contracts/operations/release-compatibility-pair-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "contracts/operations/compatibility-admission-gaps.v1.json"
      - "scripts/register-memory-os-client-baseline.py"
      - "scripts/register-memory-os-release-compatibility-pair.py"
      - "scripts/validate-memory-os-release-compatibility-pair-independent-review.py"
      - "scripts/validate-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-baseline-writer-authority-negative.py"
      - "scripts/validate-memory-os-client-baseline-lineage-negative.py"
      - "scripts/validate-memory-os-client-baseline-evidence-binding-negative.py"
      - "scripts/reconcile-memory-os-client-baseline-registry.py"
      - "scripts/validate-memory-os-client-server-support-window.py"
      - "scripts/update-memory-os-compatibility-admission-gaps.py"
      - "scripts/validate-memory-os-operability.py"
      - "docs/evidence/clients/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-client-baseline-registry-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean PR source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Reconcile and validate client baseline authority read-only
        id: authority
        run: |
          set +e
          log=/tmp/client-baseline-authority.log
          : > "$log"
          code=0
          echo "STAGE: py_compile" >> "$log"
          python -m py_compile \
            scripts/register-memory-os-client-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/validate-memory-os-client-baseline-registry.py \
            scripts/validate-memory-os-client-baseline-writer-authority-negative.py \
            scripts/validate-memory-os-client-baseline-lineage-negative.py \
            scripts/validate-memory-os-client-baseline-evidence-binding-negative.py \
            scripts/reconcile-memory-os-client-baseline-registry.py \
            scripts/validate-memory-os-client-server-support-window.py \
            scripts/update-memory-os-compatibility-admission-gaps.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: writer-authority-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-writer-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: source-lineage-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-lineage-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: source-bound-evidence-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-evidence-binding-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: authority-reconcile" >> "$log"
            python scripts/reconcile-memory-os-client-baseline-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: client-registry-validator" >> "$log"
            python scripts/validate-memory-os-client-baseline-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: support-window-validator" >> "$log"
            python scripts/validate-memory-os-client-server-support-window.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: compatibility-gaps" >> "$log"
            python scripts/update-memory-os-compatibility-admission-gaps.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: operability-validator" >> "$log"
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Require successful client authority validation
        run: test "${{ steps.authority.outputs.exit_code }}" = "0"
      - name: Require deterministic client authority
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --exit-code; then
            echo "Client baseline derived authority is stale on the pull-request head; commit the deterministic reconcile output."
            exit 1
          fi

  validate-and-publish:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact client baseline authority source
        run: |
          set -euo pipefail
          git fetch origin so
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Reconcile and validate client baseline authority
        id: authority
        run: |
          set +e
          log=/tmp/client-baseline-authority.log
          : > "$log"
          code=0
          echo "STAGE: py_compile" >> "$log"
          python -m py_compile \
            scripts/register-memory-os-client-baseline.py \
            scripts/register-memory-os-release-compatibility-pair.py \
            scripts/validate-memory-os-release-compatibility-pair-independent-review.py \
            scripts/validate-memory-os-client-baseline-registry.py \
            scripts/validate-memory-os-client-baseline-writer-authority-negative.py \
            scripts/validate-memory-os-client-baseline-lineage-negative.py \
            scripts/validate-memory-os-client-baseline-evidence-binding-negative.py \
            scripts/reconcile-memory-os-client-baseline-registry.py \
            scripts/validate-memory-os-client-server-support-window.py \
            scripts/update-memory-os-compatibility-admission-gaps.py \
            scripts/validate-memory-os-operability.py \
            >> "$log" 2>&1 || code=$?
          if [[ "$code" == "0" ]]; then
            echo "STAGE: writer-authority-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-writer-authority-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: source-lineage-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-lineage-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: source-bound-evidence-negative" >> "$log"
            python scripts/validate-memory-os-client-baseline-evidence-binding-negative.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: authority-reconcile" >> "$log"
            python scripts/reconcile-memory-os-client-baseline-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: client-registry-validator" >> "$log"
            python scripts/validate-memory-os-client-baseline-registry.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: support-window-validator" >> "$log"
            python scripts/validate-memory-os-client-server-support-window.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: compatibility-gaps" >> "$log"
            python scripts/update-memory-os-compatibility-admission-gaps.py >> "$log" 2>&1 || code=$?
          fi
          if [[ "$code" == "0" ]]; then
            echo "STAGE: operability-validator" >> "$log"
            python scripts/validate-memory-os-operability.py >> "$log" 2>&1 || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Commit bounded client authority
        if: github.ref == 'refs/heads/so' && steps.authority.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Client baseline authority source changed during reconciliation; refusing stale derived authority."
            exit 75
          fi
          git rm -f docs/fixtures/memory-os-operability/client-baseline-registry-diagnostic.last.json 2>/dev/null || true
          git add \
            contracts/operations/client-baseline-registry-contract.v1.json \
            contracts/operations/client-server-support-window-contract.v1.json \
            contracts/operations/production-operability-status.json \
            contracts/operations/compatibility-admission-gaps.v1.json
          git add -u docs/fixtures/memory-os-operability/client-baseline-registry-diagnostic.last.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): register reviewed client baseline authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced after client baseline validation; refusing to rebase stale authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
      - name: Record privacy-safe diagnostic
        if: github.ref == 'refs/heads/so' && steps.authority.outputs.exit_code != '0'
        env:
          AUTHORITY_EXIT_CODE: ${{ steps.authority.outputs.exit_code }}
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Client baseline authority source changed after validation; refusing stale diagnostic."
            exit 75
          fi
          python - <<'PY'
          import json, os, re, tempfile
          from pathlib import Path
          text = Path('/tmp/client-baseline-authority.log').read_text(encoding='utf-8', errors='replace')
          for pattern, replacement in (
              (r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>'),
              (r'https?://[^\s]+', '<redacted-endpoint>'),
              (r'Bearer\s+\S+', 'Bearer <redacted>'),
          ):
              text = re.sub(pattern, replacement, text, flags=re.I)
          value = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'client-baseline-registry',
              'result': 'FAIL',
              'exitCode': int(os.environ['AUTHORITY_EXIT_CODE']),
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'output': text[-12000:],
              'containsSecrets': False,
              'approvedClientBaselineCount': 0,
              'clientServerSkewEvidence': False,
              'productionEvidence': False,
              'productionReady': False,
          }
          path = Path('docs/fixtures/memory-os-operability/client-baseline-registry-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = (json.dumps(value, indent=2) + '\n').encode('utf-8')
          fd, temp_name = tempfile.mkstemp(prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent)
          try:
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temp_name, path)
          finally:
              try:
                  os.unlink(temp_name)
              except FileNotFoundError:
                  pass
          PY
          git add docs/fixtures/memory-os-operability/client-baseline-registry-diagnostic.last.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "test(compat): record client baseline authority diagnostic"
            for attempt in 1 2 3; do
              git fetch origin so
              if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
                echo "Branch advanced before client baseline diagnostic push; refusing stale diagnostic."
                exit 75
              fi
              if git push origin HEAD:so; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce authority result
        run: test "${{ steps.authority.outputs.exit_code }}" = "0"
