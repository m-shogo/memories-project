name: Backup Restore Review Source Order Readonly

on:
  push:
    branches: [so]
    paths:
      - '.github/workflows/backup-restore-review-source-order-readonly.yml'
      - '.github/workflows/backup-restore-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'scripts/validate-memory-os-backup-restore-generation-independent-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'contracts/operations/backup-restore-generation-binding-contract.v1.json'
      - 'contracts/operations/production-equivalent-environment-generation-registry.v1.json'
      - 'contracts/operations/recovery-objectives-registry.v1.json'
      - 'contracts/operations/backup-restore-drill-request-registry.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json'
      - 'contracts/operations/operability-admission-inventory.v1.json'
      - 'contracts/operations/production-operability-status.json'
      - 'docs/evidence/backup-restore/**'
  pull_request:
    paths:
      - '.github/workflows/backup-restore-review-source-order-readonly.yml'
      - '.github/workflows/backup-restore-review-source-order.yml'
      - 'scripts/validate-memory-os-backup-restore-review-source-order.py'
      - 'scripts/validate-memory-os-backup-restore-generation-evidence.py'
      - 'scripts/validate-memory-os-backup-restore-generation-binding.py'
      - 'scripts/validate-memory-os-backup-restore-generation-independent-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py'
      - 'scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py'
      - 'contracts/operations/backup-restore-generation-evidence-contract.v1.json'
      - 'contracts/operations/backup-restore-generation-evidence-registry.v1.json'
      - 'contracts/operations/backup-restore-generation-binding-contract.v1.json'
      - 'contracts/operations/production-equivalent-environment-generation-registry.v1.json'
      - 'contracts/operations/recovery-objectives-registry.v1.json'
      - 'contracts/operations/backup-restore-drill-request-registry.v1.json'
      - 'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json'
      - 'contracts/operations/operability-admission-inventory.v1.json'
      - 'contracts/operations/production-operability-status.json'
      - 'docs/evidence/backup-restore/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact clean review source
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Snapshot canonical review authorities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [
              'contracts/operations/backup-restore-generation-evidence-contract.v1.json',
              'contracts/operations/backup-restore-generation-evidence-registry.v1.json',
              'contracts/operations/backup-restore-generation-binding-contract.v1.json',
              'contracts/operations/production-equivalent-environment-generation-registry.v1.json',
              'contracts/operations/recovery-objectives-registry.v1.json',
              'contracts/operations/backup-restore-drill-request-registry.v1.json',
              'contracts/operations/backup-restore-non-resurrection-admission-registry.v1.json',
              'contracts/operations/operability-admission-inventory.v1.json',
              'contracts/operations/production-operability-status.json',
          ]
          snapshot = {}
          for raw in paths:
              path = Path(raw)
              snapshot[raw] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'mode': path.stat().st_mode & 0o777,
              }
          Path('/tmp/backup-restore-review-source-order-authorities.json').write_text(
              json.dumps(snapshot, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Exercise review source-order chain read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-evidence.py \
            scripts/validate-memory-os-backup-restore-generation-binding.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-review-source-order.py --self-test
          python scripts/validate-memory-os-backup-restore-review-source-order.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review.py
          python scripts/validate-memory-os-backup-restore-generation-evidence.py
          python scripts/validate-memory-os-backup-restore-generation-binding.py
      - name: Prove canonical bytes and permission modes are immutable
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path('/tmp/backup-restore-review-source-order-authorities.json').read_text(encoding='utf-8'))
          failures = []
          for raw, expected in before.items():
              path = Path(raw)
              if not path.is_file():
                  failures.append(f'{raw}: missing after validation')
                  continue
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              actual_mode = path.stat().st_mode & 0o777
              if actual_hash != expected['sha256']:
                  failures.append(f'{raw}: bytes changed')
              if actual_mode != expected['mode']:
                  failures.append(f'{raw}: mode changed {expected["mode"]:04o}->{actual_mode:04o}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
