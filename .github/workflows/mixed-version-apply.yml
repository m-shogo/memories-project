name: Mixed-Version Apply Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/mixed-version-apply.yml"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/mixed-version-apply-contract.v1.json"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "infra/postgresql/security/**"
      - "services/import-api/cmd/import-api-server/**"
      - "services/import-api/cmd/memory-os-mixed-version-fixture/**"
      - "services/import-api/internal/apply/**"
      - "services/import-api/internal/authstore/**"
      - "services/import-api/internal/httpserver/**"
      - "services/import-api/internal/pgrepo/**"
      - "services/import-api/internal/previewcommit/**"
      - "services/import-api/internal/previewspool/**"
      - "scripts/run-memory-os-mixed-version-apply-drill.sh"
      - "scripts/validate-memory-os-mixed-version-apply.py"
      - "scripts/reconcile-memory-os-mixed-version-apply.py"
      - "scripts/validate-memory-os-mixed-version-apply-reconcile-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/mixed-version-apply.yml"
      - "contracts/operations/migration-lifecycle-contract.v1.json"
      - "contracts/operations/mixed-version-apply-contract.v1.json"
      - "contracts/operations/version-compatibility-contract.v1.json"
      - "infra/postgresql/security/**"
      - "services/import-api/cmd/import-api-server/**"
      - "services/import-api/cmd/memory-os-mixed-version-fixture/**"
      - "services/import-api/internal/apply/**"
      - "services/import-api/internal/authstore/**"
      - "services/import-api/internal/httpserver/**"
      - "services/import-api/internal/pgrepo/**"
      - "services/import-api/internal/previewcommit/**"
      - "services/import-api/internal/previewspool/**"
      - "scripts/run-memory-os-mixed-version-apply-drill.sh"
      - "scripts/validate-memory-os-mixed-version-apply.py"
      - "scripts/reconcile-memory-os-mixed-version-apply.py"
      - "scripts/validate-memory-os-mixed-version-apply-reconcile-negative.py"
  schedule:
    - cron: "13 19 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixed-version-apply-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  drill:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'docs(compat): register mixed-version Apply evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_os_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_os_security"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      MEMORY_OS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memory_os_security?sslmode=disable
      MEMORY_OS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MEMORY_OS_TEST_S3_ACCESS_KEY: minioadmin
      MEMORY_OS_TEST_S3_SECRET_KEY: minioadmin
      MEMORY_OS_MIXED_VERSION_OLD_SHA: 2af6e8e10755cc707c6bdd958a049a0f4afb3d70

    steps:
      - name: Checkout exact source with candidate history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture clean exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -n "$EXPECTED_SHA"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          bash -n scripts/run-memory-os-mixed-version-apply-drill.sh
          python -m py_compile \
            scripts/validate-memory-os-mixed-version-apply.py \
            scripts/reconcile-memory-os-mixed-version-apply.py \
            scripts/validate-memory-os-mixed-version-apply-reconcile-negative.py
          test -z "$(gofmt -l services/import-api/cmd/memory-os-mixed-version-fixture/main.go)"

      - name: Start local MinIO
        run: |
          docker run -d --name memory-os-mixed-version-apply-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-mixed-version-apply-minio
          exit 1

      - name: Validate static compatibility contract
        run: |
          python scripts/validate-memory-os-mixed-version-apply.py
          python scripts/validate-memory-os-mixed-version-apply-reconcile-negative.py
          python scripts/validate-memory-os-version-compatibility.py

      - name: Execute bidirectional persisted Apply drill
        id: execute
        env:
          MEMORY_OS_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          MEMORY_OS_MIXED_VERSION_APPLY_RESULTS_PATH: ${{ github.workspace }}/docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json
        run: |
          set +e
          bash scripts/run-memory-os-mixed-version-apply-drill.sh > /tmp/mixed-version-apply.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          EXECUTE_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          output = Path('/tmp/mixed-version-apply.log').read_text(
              encoding='utf-8', errors='replace'
          )[-8000:]
          patterns = (
              (r'postgres(?:ql)?://[^\s]+', '<redacted-database-url>'),
              (r'Bearer\s+[^\s]+', 'Bearer <redacted>'),
              (r'memoryos_sess_[A-Za-z0-9._:-]+', '<redacted-session>'),
              (r'(?:acct|job|prv|spl|upl)_[A-Za-z0-9._:-]+', '<redacted-synthetic-id>'),
              (r'idem-mixed-[A-Za-z0-9._:-]+', '<redacted-idempotency-key>'),
              (r'minioadmin', '<redacted-local-credential>'),
          )
          for pattern, replacement in patterns:
              output = re.sub(pattern, replacement, output, flags=re.IGNORECASE)
          diagnostic = {
              'schemaVersion': 'memory-os-validator-diagnostic.v1',
              'workflow': 'mixed-version-apply',
              'sourceCommitSha': os.environ['SOURCE_SHA'],
              'result': 'PASS' if os.environ['EXECUTE_EXIT_CODE'] == '0' else 'FAIL',
              'exitCode': int(os.environ['EXECUTE_EXIT_CODE']),
              'validationResult': 'NOT_RUN',
              'validationExitCode': None,
              'output': output,
              'containsSecrets': False,
              'productionEvidence': False,
              'releaseCompatibilityEvidence': False,
          }
          path = Path('docs/fixtures/memory-os-operability/mixed-version-apply-diagnostic.last.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(diagnostic, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate exact-source result
        id: validation
        if: steps.execute.outputs.exit_code == '0'
        run: |
          set +e
          python scripts/validate-memory-os-mixed-version-apply.py \
            --expected-commit-sha "$SOURCE_SHA" > /tmp/mixed-version-apply-validation.log 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          VALIDATION_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('docs/fixtures/memory-os-operability/mixed-version-apply-diagnostic.last.json')
          diagnostic = json.loads(path.read_text(encoding='utf-8'))
          output = Path('/tmp/mixed-version-apply-validation.log').read_text(
              encoding='utf-8', errors='replace'
          )[-3000:]
          diagnostic['validationResult'] = (
              'PASS' if os.environ['VALIDATION_EXIT_CODE'] == '0' else 'FAIL'
          )
          diagnostic['validationExitCode'] = int(os.environ['VALIDATION_EXIT_CODE'])
          diagnostic['output'] = (
              str(diagnostic.get('output', '')) + '\n--- validator ---\n' + output
          )[-8000:]
          path.write_text(json.dumps(diagnostic, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit result or bounded diagnostic
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/so'
        run: |
          set -euo pipefail
          git fetch origin so
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]] || [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "so advanced while mixed-version Apply ran; refusing stale evidence or diagnostic."
            exit 75
          fi
          git add docs/fixtures/memory-os-operability/mixed-version-apply-diagnostic.last.json
          if [ "${{ steps.execute.outputs.exit_code }}" = "0" ] && \
             [ "${{ steps.validation.outputs.exit_code }}" = "0" ]; then
            git add docs/fixtures/memory-os-operability/mixed-version-apply-results.sample.v1.json
          fi
          if git diff --cached --quiet; then
            echo "Mixed-version Apply evidence is already current."
            echo "EVIDENCE_COMMIT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ steps.execute.outputs.exit_code }}" = "0" ] && \
               [ "${{ steps.validation.outputs.exit_code }}" = "0" ]; then
              git commit -m "test(compat): record mixed-version Apply evidence"
            else
              git commit -m "test(compat): record mixed-version Apply diagnostic"
            fi
            EVIDENCE_COMMIT_SHA="$(git rev-parse HEAD)"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "so advanced before mixed-version Apply evidence push; refusing stale evidence."
              exit 75
            fi
            git push origin HEAD:so
            echo "EVIDENCE_COMMIT_SHA=$EVIDENCE_COMMIT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Reconcile candidate-only compatibility authority
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/so' &&
          steps.execute.outputs.exit_code == '0' && steps.validation.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git fetch origin so
          test "$(git rev-parse HEAD)" = "$EVIDENCE_COMMIT_SHA"
          if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
            echo "so advanced before mixed-version Apply authority reconciliation; refusing stale authority."
            exit 75
          fi
          python scripts/reconcile-memory-os-mixed-version-apply.py
          python scripts/validate-memory-os-mixed-version-apply.py \
            --expected-commit-sha "$SOURCE_SHA" --require-reconciled
          git add \
            contracts/operations/mixed-version-apply-contract.v1.json \
            contracts/operations/production-operability-status.json
          if git diff --cached --quiet; then
            echo "Mixed-version Apply authority is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(compat): register mixed-version Apply evidence"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$EVIDENCE_COMMIT_SHA" ]]; then
              echo "so advanced before mixed-version Apply authority push; refusing stale authority."
              exit 75
            fi
            git push origin HEAD:so
          fi

      - name: Re-read authority and run aggregate checks
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/so' &&
          steps.execute.outputs.exit_code == '0' && steps.validation.outputs.exit_code == '0'
        run: |
          git fetch origin so
          git reset --hard origin/so
          python scripts/validate-memory-os-mixed-version-apply.py --require-reconciled
          python scripts/validate-memory-os-version-compatibility.py
          python scripts/validate-memory-os-operability.py

      - name: Fail after preserving diagnostic
        if: steps.execute.outputs.exit_code != '0' || steps.validation.outputs.exit_code != '0'
        run: exit 1
