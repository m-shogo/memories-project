name: Reconcile Deletion SIGKILL Authority

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-sigkill-authority.yml"
      - "scripts/reconcile-memory-os-deletion-sigkill-authority.py"
      - "scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/reconcile-memory-os-load-missing-evidence.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-worker-sigkill-recovery-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-sigkill-recovery-results.sample.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-deletion-sigkill-authority.yml"
      - "scripts/reconcile-memory-os-deletion-sigkill-authority.py"
      - "scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py"
      - "scripts/reconcile-memory-os-load-readiness-note.py"
      - "scripts/reconcile-memory-os-load-missing-evidence.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
      - "contracts/operations/deletion-worker-sigkill-recovery-contract.v1.json"
      - "docs/fixtures/memory-os-operability/deletion-worker-sigkill-recovery-results.sample.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-deletion-sigkill-authority-${{ github.event_name }}-${{ github.event.pull_request.number || 'so' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'so'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate exact PR-head SIGKILL authority
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            scripts/validate-memory-os-deletion-worker-sigkill-recovery.py \
            scripts/reconcile-memory-os-deletion-sigkill-authority.py \
            scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/reconcile-memory-os-load-missing-evidence.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-deletion-worker-sigkill-recovery.py --require-result
          python scripts/validate-memory-os-load.py
          python scripts/reconcile-memory-os-deletion-sigkill-authority.py
          python scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

  reconcile:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Compile SIGKILL authority chain
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-deletion-worker-sigkill-recovery.py \
            scripts/reconcile-memory-os-deletion-sigkill-authority.py \
            scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py \
            scripts/reconcile-memory-os-load-readiness-note.py \
            scripts/reconcile-memory-os-load-missing-evidence.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
      - name: Validate exact-source SIGKILL proof
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-deletion-worker-sigkill-recovery.py --require-result
      - name: Validate pre-reconcile load authority
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-load.py
      - name: Reconcile actual process-kill evidence
        id: reconcile
        continue-on-error: true
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          code=0
          python scripts/reconcile-memory-os-deletion-sigkill-authority.py >"$log" 2>&1 || code=$?
          echo "SIGKILL reconcile completed; raw validator output withheld."
          exit "$code"
      - name: Publish exact-source SIGKILL reconcile failure diagnostic
        if: steps.reconcile.outcome == 'failure'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path("docs/fixtures/memory-os-operability/deletion-sigkill-authority-diagnostic.last.json")
          payload = {
              "schemaVersion": "memory-os-validator-diagnostic.v1",
              "workflow": "reconcile-deletion-sigkill-authority",
              "result": "FAIL",
              "sourceCommitSha": os.environ["SOURCE_SHA"],
              "output": "SIGKILL reconcile failed; raw validator output withheld.",
              "containsSecrets": False,
              "productionEvidence": False,
              "productionReady": False,
              "productionDecision": "NO_GO",
          }
          data = (json.dumps(payload, indent=2) + "\n").encode("utf-8")
          repo = Path.cwd().resolve(strict=True)
          path = repo / path
          if not path.parent.is_dir():
              raise RuntimeError("SIGKILL diagnostic parent missing")
          candidate = repo
          for component in path.relative_to(repo).parts:
              candidate = candidate / component
              if candidate.is_symlink():
                  raise RuntimeError("SIGKILL diagnostic path must not be a symlink")
          try:
              path.parent.resolve(strict=True).relative_to(repo)
          except ValueError as exc:
              raise RuntimeError("SIGKILL diagnostic parent escaped repository") from exc
          if path.exists() and not path.is_file():
              raise RuntimeError("SIGKILL diagnostic target must be regular")
          mode = path.stat().st_mode & 0o7777 if path.exists() else None
          fd, name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=path.parent)
          tmp = Path(name)
          try:
              if mode is not None:
                  os.fchmod(fd, mode)
              with os.fdopen(fd, "wb") as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(tmp, path)
          finally:
              if tmp.exists():
                  tmp.unlink()
          PY
          git add docs/fixtures/memory-os-operability/deletion-sigkill-authority-diagnostic.last.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(deletion): record SIGKILL authority diagnostic"
          git fetch origin so
          if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced during SIGKILL failure diagnostic; refusing stale diagnostic."
            exit 75
          fi
          git push origin HEAD:so
          exit 1
      - name: Validate SIGKILL reconcile negative suite
        if: steps.reconcile.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-deletion-sigkill-authority-reconcile-negative.py
      - name: Validate canonical load authority
        if: steps.reconcile.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-load.py
      - name: Validate aggregate operability authority
        if: steps.reconcile.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-operability.py
      - name: Commit canonical authority update and clear stale diagnostic
        if: steps.reconcile.outcome == 'success'
        run: |
          set -euo pipefail
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if [[ -f docs/fixtures/memory-os-operability/deletion-sigkill-authority-diagnostic.last.json ]]; then
            git rm docs/fixtures/memory-os-operability/deletion-sigkill-authority-diagnostic.last.json
          fi
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(deletion): reconcile SIGKILL canonical authority"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Branch advanced during SIGKILL authority reconcile; refusing stale derived authority."
              exit 75
            fi
            git push origin HEAD:so
          fi
