name: Live Object Stage Source Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - ".github/workflows/live-object-stage-source-negative.yml"
      - "scripts/validate-memory-os-live-object-stage-source-negative.py"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "scripts/validate-memory-os-live-object-load.py"
      - "contracts/operations/live-object-load-scenario-contract.v1.json"
      - "services/import-api/internal/httpserver/live_object_load_test.go"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/reconcile-live-object-stage-diagnostics.yml"
      - ".github/workflows/live-object-stage-source-negative.yml"
      - "scripts/validate-memory-os-live-object-stage-source-negative.py"
      - "scripts/reconcile-memory-os-live-object-stage-diagnostics.py"
      - "scripts/validate-memory-os-live-object-load.py"
      - "contracts/operations/live-object-load-scenario-contract.v1.json"
      - "services/import-api/internal/httpserver/live_object_load_test.go"

permissions:
  contents: read

jobs:
  source-negative:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/so')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Require exact clean live object stage source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="$PR_HEAD_SHA"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
          else
            echo "Unreviewed live object stage source event" >&2
            exit 1
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Prove live object stage source and event shells
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-live-object-stage-source-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Prove closed live object stage vocabulary
        run: |
          set -euo pipefail
          (cd services/import-api && go test ./internal/httpserver -run '^TestLiveObjectStageLabelClosedVocabulary$' -count=1)
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
