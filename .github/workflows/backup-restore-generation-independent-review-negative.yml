name: Backup Restore Generation Independent Review Negative

on:
  pull_request:
    paths:
      - ".github/workflows/backup-restore-generation-independent-review-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-independent-review-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-generation-independent-review-negative-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact clean independent-review authority source
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test -n "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate final-candidate independent-review authority read-only
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-review-source-order.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review.py
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          validator_path = root / "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
          spec = importlib.util.spec_from_file_location("candidate_count_boundary_negative", validator_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load independent-review validator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          canonical = module.REGISTRY.read_bytes()
          try:
              registry = json.loads(canonical)
              registry["records"] = [{}]
              registry["productionEquivalentRecoveryCandidateCount"] = 1
              module.REGISTRY.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")
              try:
                  module.main()
              except module.Fail as exc:
                  expected = "productionEquivalentRecoveryCandidateCount cannot exceed independently reviewed records"
                  if expected not in str(exc):
                      raise SystemExit(f"candidate-count boundary rejected at wrong authority: {exc}")
              else:
                  raise SystemExit("unreviewed generation evidence was allowed to contribute a production-equivalent recovery candidate")
          finally:
              module.REGISTRY.write_bytes(canonical)

          if module.REGISTRY.read_bytes() != canonical:
              raise SystemExit("canonical generation evidence registry was not restored after candidate-count negative")
          print("PASS: unreviewed generation evidence cannot contribute a production-equivalent recovery candidate")
          PY
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
