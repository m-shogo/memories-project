name: Backup Restore Generation Independent Review Negative

on:
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-independent-review-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-workflow-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/ops_independent_review_fixture_loader.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/backup-restore-generation-independent-review-negative.yml"
      - "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
      - "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
      - "docs/evidence/backup-restore/**"
      - "scripts/validate-memory-os-backup-restore-review-source-order.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-workflow-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py"
      - "scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py"
      - "scripts/ops_independent_review_fixture_loader.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-generation-independent-review-negative-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact clean independent-review authority source
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${GITHUB_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed generation independent review negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Validate final-candidate independent-review authority read-only
        run: |
          set -euo pipefail
          python scripts/validate-memory-os-backup-restore-generation-independent-review-workflow-negative.py
          mode_snapshot="$(mktemp)"
          stat -c '%a %n' \
            contracts/operations/backup-restore-generation-evidence-contract.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            > "$mode_snapshot"
          python -m py_compile \
            scripts/validate-memory-os-backup-restore-review-source-order.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py \
            scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py \
            scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
            scripts/ops_independent_review_fixture_loader.py
          python scripts/ops_independent_review_fixture_loader.py
          python scripts/validate-memory-os-backup-restore-review-source-order.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-execution-negative.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review.py
          python scripts/validate-memory-os-backup-restore-generation-material-delta-review-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review-transport-negative.py
          python scripts/validate-memory-os-backup-restore-generation-independent-review-execution-negative.py
          fixture_parent="$(mktemp -d)"
          trap 'rm -rf "$fixture_parent"' EXIT
          cp -a . "$fixture_parent/repo"
          FIXTURE_ROOT="$fixture_parent/repo" python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["FIXTURE_ROOT"])
          validator_path = root / "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
          contract_path = root / "contracts/operations/backup-restore-generation-evidence-contract.v1.json"
          registry_path = root / "contracts/operations/backup-restore-generation-evidence-registry.v1.json"
          original_contract = contract_path.read_bytes()
          original_registry = registry_path.read_bytes()

          registry = json.loads(original_registry)
          registry["records"] = []
          registry["productionEquivalentRecoveryCandidateCount"] = 0
          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")

          contract = json.loads(original_contract)
          contract["materialDeltaReviewEvidenceSchemaVersion"] = "memory-os-backup-restore-material-delta-review.v0"
          contract_path.write_text(json.dumps(contract, indent=2) + "\n", encoding="utf-8")

          import sys
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from ops_independent_review_fixture_loader import load_pinned_module
          module = load_pinned_module(root, validator_path, "empty_review_material_delta_authority_negative")
          try:
              module.main()
          except module.Fail as exc:
              expected = "material-delta review evidence schema authority drift"
              if expected not in str(exc):
                  raise SystemExit(f"empty-review material-delta drift rejected at wrong authority: {exc}")
          else:
              raise SystemExit("empty-review material-delta semantic authority drift was accepted")
          finally:
              contract_path.write_bytes(original_contract)
              registry_path.write_bytes(original_registry)
          print("PASS: empty-review independent-review main rejects material-delta semantic authority drift without requiring candidate evidence")
          PY
          (
            cd "$fixture_parent/repo"
            python scripts/validate-memory-os-backup-restore-generation-independent-review-negative.py
          )
          python scripts/validate-memory-os-backup-restore-generation-independent-review.py
          FIXTURE_ROOT="$fixture_parent/repo" python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["FIXTURE_ROOT"])
          validator_path = root / "scripts/validate-memory-os-backup-restore-generation-independent-review.py"
          import sys
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from ops_independent_review_fixture_loader import load_pinned_module
          module = load_pinned_module(root, validator_path, "candidate_count_boundary_negative")

          registry = json.loads(module.REGISTRY.read_text(encoding="utf-8"))
          registry["records"] = [{}]
          registry["productionEquivalentRecoveryCandidateCount"] = 1
          module.REGISTRY.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")
          try:
              module.main()
          except module.Fail as exc:
              expected = "productionEquivalentRecoveryCandidateCount cannot exceed independently reviewed records"
              if expected not in str(exc):
                  raise SystemExit(f"candidate-count boundary rejected at wrong authority: {exc}")
          else:
              raise SystemExit("unreviewed generation evidence was allowed to contribute a production-equivalent recovery candidate")
          print("PASS: unreviewed generation evidence cannot contribute a production-equivalent recovery candidate in isolated repository fixture")
          PY
          rm -rf "$fixture_parent"
          trap - EXIT
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          current_modes="$(mktemp)"
          stat -c '%a %n' \
            contracts/operations/backup-restore-generation-evidence-contract.v1.json \
            contracts/operations/backup-restore-generation-evidence-registry.v1.json \
            > "$current_modes"
          diff -u "$mode_snapshot" "$current_modes"
          rm -f "$mode_snapshot" "$current_modes"
