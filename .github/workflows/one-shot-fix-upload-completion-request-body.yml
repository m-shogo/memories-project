name: One Shot Fix Upload Completion Request Body

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/one-shot-fix-upload-completion-request-body.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: so
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum
      - name: Remove double JSON encoding and compile
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go')
          text = path.read_text(encoding='utf-8')
          old = '''\tbody, err := json.Marshal(map[string]any{\n\t\t"contentLength":   len(payload),\n\t\t"checksumSha256":  hex.EncodeToString(digest[:]),\n\t\t"contentType":     "text/csv",\n\t\t"sourceSurface":   "ios_files",\n\t\t"displayFilename": fmt.Sprintf("prefence-complete-%02d.csv", index),\n\t})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresponse, responseBody := server.request(t, http.MethodPost, "/v1/import-jobs/"+jobID+"/upload-authorizations", ownerToken, body)\n'''
          new = '''\tbody := map[string]any{\n\t\t"contentLength":   len(payload),\n\t\t"checksumSha256":  hex.EncodeToString(digest[:]),\n\t\t"contentType":     "text/csv",\n\t\t"sourceSurface":   "ios_files",\n\t\t"displayFilename": fmt.Sprintf("prefence-complete-%02d.csv", index),\n\t}\n\tresponse, responseBody := server.request(t, http.MethodPost, "/v1/import-jobs/"+jobID+"/upload-authorizations", ownerToken, body)\n'''
          if old not in text:
              raise SystemExit('expected double-encoding fragment missing; refusing blind rewrite')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          gofmt -w services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go
          test -z "$(gofmt -l services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go)"
          (
            cd services/import-api
            go test ./internal/httpserver -run '^TestDoesNotExist$' -count=1
          )
      - name: Commit fixture repair
        run: |
          set -euo pipefail
          git add services/import-api/internal/httpserver/deletion_prefence_upload_completion_test.go
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deletion): encode upload completion request once"
          git pull --rebase origin so
          git push origin HEAD:so
