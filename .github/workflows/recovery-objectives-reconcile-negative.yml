name: Recovery Objectives Reconcile Negative

on:
  pull_request:
    branches: [so]
    paths:
      - ".github/workflows/recovery-objectives-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-recovery-objectives.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-workflow-negative.py"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/recovery-objectives-reconcile-negative.yml"
      - "scripts/reconcile-memory-os-recovery-objectives.py"
      - "scripts/memory_os_backup_restore_blockers.py"
      - "scripts/register-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives.py"
      - "scripts/validate-memory-os-recovery-objectives-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-negative.py"
      - "scripts/validate-memory-os-recovery-objectives-reconcile-workflow-negative.py"
      - "contracts/operations/recovery-objectives-admission-contract.v1.json"
      - "contracts/operations/recovery-objectives-registry.v1.json"
      - "contracts/operations/production-operability-status.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove transactional recovery-objective reconciliation
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            test "${PR_BASE_REF:-}" = "so"
            expected="${{ github.event.pull_request.head.sha }}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF:-}" = "refs/heads/so"
            expected="${GITHUB_SHA:-}"
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          else
            echo "Unreviewed recovery objective reconcile negative event" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          python scripts/validate-memory-os-recovery-objectives-reconcile-workflow-negative.py
          python -m py_compile \
            scripts/reconcile-memory-os-recovery-objectives.py \
            scripts/memory_os_backup_restore_blockers.py \
            scripts/register-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives.py \
            scripts/validate-memory-os-recovery-objectives-negative.py \
            scripts/validate-memory-os-recovery-objectives-reconcile-negative.py
          python scripts/validate-memory-os-recovery-objectives-reconcile-negative.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
