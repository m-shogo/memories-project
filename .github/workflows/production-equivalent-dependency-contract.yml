name: Production Equivalent Dependency Contract

on:
  push:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-dependency-contract.yml"
      - ".github/workflows/production-equivalent-dependency-source-negative.yml"
      - "scripts/validate-memory-os-production-equivalent-dependency-workflow-source-negative.py"
      - "contracts/operations/production-equivalent-dependency-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-production-equivalent-dependencies.py"
      - "scripts/reconcile-memory-os-production-equivalent-foundation.py"
      - "scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
  pull_request:
    branches:
      - so
    paths:
      - ".github/workflows/production-equivalent-dependency-contract.yml"
      - ".github/workflows/production-equivalent-dependency-source-negative.yml"
      - "scripts/validate-memory-os-production-equivalent-dependency-workflow-source-negative.py"
      - "contracts/operations/production-equivalent-dependency-contract.v1.json"
      - "contracts/operations/load-test-scenario-contract.v1.json"
      - "contracts/operations/production-operability-status.json"
      - "scripts/validate-memory-os-production-equivalent-dependencies.py"
      - "scripts/reconcile-memory-os-production-equivalent-foundation.py"
      - "scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py"
      - "scripts/validate-memory-os-load-evidence-index.py"
      - "scripts/validate-memory-os-load.py"
      - "scripts/validate-memory-os-operability.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate production-equivalent dependency authority read-only
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME:-}" = "pull_request"
          test "${GITHUB_BASE_REF:-}" = "so"
          expected="${{ github.event.pull_request.head.sha }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          python scripts/validate-memory-os-production-equivalent-dependency-workflow-source-negative.py
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-dependencies.py \
            scripts/reconcile-memory-os-production-equivalent-foundation.py \
            scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py
          python scripts/validate-memory-os-production-equivalent-dependencies.py
          python scripts/reconcile-memory-os-production-equivalent-foundation.py
          python scripts/validate-memory-os-production-equivalent-dependencies.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git diff --check
          git diff --exit-code -- \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json

  validate-and-publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/so'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture exact authority source
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME:-}" == "push" || "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]
          test "${GITHUB_REF:-}" = "refs/heads/so"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          expected="${{ github.sha }}"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "SOURCE_SHA=$expected" >> "$GITHUB_ENV"
          python scripts/validate-memory-os-production-equivalent-dependency-workflow-source-negative.py
      - name: Validate fail-closed admission contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-memory-os-production-equivalent-dependencies.py \
            scripts/reconcile-memory-os-production-equivalent-foundation.py \
            scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py \
            scripts/validate-memory-os-load-evidence-index.py \
            scripts/validate-memory-os-load.py \
            scripts/validate-memory-os-operability.py
          python scripts/validate-memory-os-production-equivalent-foundation-reconcile-negative.py
          python scripts/validate-memory-os-production-equivalent-dependencies.py
      - name: Reconcile foundation into canonical load authority
        run: |
          set -euo pipefail
          python scripts/reconcile-memory-os-production-equivalent-foundation.py
          python scripts/validate-memory-os-production-equivalent-dependencies.py
          python scripts/validate-memory-os-load-evidence-index.py
          python scripts/validate-memory-os-load.py
          python scripts/validate-memory-os-operability.py
          git add \
            contracts/operations/load-test-scenario-contract.v1.json \
            contracts/operations/production-operability-status.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(load): register production-equivalent admission foundation"
            git fetch origin so
            if [[ "$(git rev-parse origin/so)" != "$SOURCE_SHA" ]]; then
              echo "Production-equivalent foundation source is stale; refusing derived authority write." >&2
              exit 75
            fi
            git push origin HEAD:so
          fi
