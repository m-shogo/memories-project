name: Chaos Failure-Drill Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/chaos-failure-drill-contracts.yml"
      - ".github/workflows/chaos-failure-drills.yml"
      - ".github/workflows/chaos-failure-drills-v2.yml"
      - "contracts/operations/chaos-failure-drill-contract.v1.json"
      - "contracts/operations/chaos-failure-drill-contract.v2.json"
      - "contracts/operations/production-operability-status.json"
      - "services/import-api/internal/httpserver/interruption_drill_test.go"
      - "services/import-api/internal/parsersup/restart_drill_linux_test.go"
      - "services/import-api/internal/importflow/object_outage_drill_linux_test.go"
      - "scripts/validate-memory-os-chaos-failure-drills.py"
      - "scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills-v2.py"
  push:
    branches:
      - so
    paths:
      - ".github/workflows/chaos-failure-drill-contracts.yml"
      - ".github/workflows/chaos-failure-drills.yml"
      - ".github/workflows/chaos-failure-drills-v2.yml"
      - "contracts/operations/chaos-failure-drill-contract.v1.json"
      - "contracts/operations/chaos-failure-drill-contract.v2.json"
      - "contracts/operations/production-operability-status.json"
      - "services/import-api/internal/httpserver/interruption_drill_test.go"
      - "services/import-api/internal/parsersup/restart_drill_linux_test.go"
      - "services/import-api/internal/importflow/object_outage_drill_linux_test.go"
      - "scripts/validate-memory-os-chaos-failure-drills.py"
      - "scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2.py"
      - "scripts/validate-memory-os-chaos-failure-drills-v2-reconcile-negative.py"
      - "scripts/validate-memory-os-operability.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills.py"
      - "scripts/reconcile-memory-os-chaos-failure-drills-v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-failure-drill-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source with ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/import-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate static contracts and formatting
        run: |
          python -m py_compile \
            scripts/validate-memory-os-chaos-failure-drills.py \
            scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py \
            scripts/validate-memory-os-chaos-failure-drills-v2.py \
            scripts/validate-memory-os-chaos-failure-drills-v2-reconcile-negative.py \
            scripts/validate-memory-os-operability.py \
            scripts/reconcile-memory-os-chaos-failure-drills.py \
            scripts/reconcile-memory-os-chaos-failure-drills-v2.py
          python scripts/validate-memory-os-chaos-failure-drills-reconcile-negative.py
          python scripts/validate-memory-os-chaos-failure-drills-v2-reconcile-negative.py
          test -z "$(gofmt -l \
            services/import-api/internal/httpserver/interruption_drill_test.go \
            services/import-api/internal/parsersup/restart_drill_linux_test.go \
            services/import-api/internal/importflow/object_outage_drill_linux_test.go)"
          python scripts/validate-memory-os-chaos-failure-drills.py
          python scripts/validate-memory-os-chaos-failure-drills-v2.py
          python scripts/reconcile-memory-os-chaos-failure-drills.py
          python scripts/reconcile-memory-os-chaos-failure-drills-v2.py
          python scripts/validate-memory-os-chaos-failure-drills.py
          python scripts/validate-memory-os-chaos-failure-drills-v2.py
          python scripts/validate-memory-os-operability.py
          git diff --exit-code -- contracts/operations/production-operability-status.json
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Execute targeted CI boundary drills
        working-directory: services/import-api
        run: |
          go test ./internal/httpserver \
            -run '^TestHTTPServerGracefulInterruptionDrainsInFlightRequest$' -count=1
          go test ./internal/parsersup \
            -run '^TestSupervisorRestartsSameSpoolAfterFailedAttempt$' -count=1
